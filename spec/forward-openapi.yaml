      summary: Get full vulnerability analysis
      description: >-
        Get the CVEs that may impact devices in the network.


        Each OsVulnerability corresponds to a distinct CVE-OS combination that
        could possibly impact devices in the

        network. An OsVulnerability includes basic CVE information, an affected
        OS, the affected versions of that OS,

        and a vulnerability detection result for each possibly impacted device.


        This operation’s response can get quite large for large networks. Paging
        is supported via the `limit` and

        `offset` parameters.
      operationId: getOsVulnerabilities
      parameters:
        - name: networkId
          in: path
