  /diffs/{beforeSnapshotId}/{afterSnapshotId}/acl?count:
    get:
      operationId: getAclDiffCount
      summary: How many devices have ACL changes
      x-forward-stability: unpublished
      tags: [Snapshot Diffs]
      parameters:
        - { name: beforeSnapshotId, in: path, required: true, schema: { type: string } }
