        timeZone:
          $ref: '#/components/schemas/TimeZone'
          description: >-
            The time zone used to identify day boundaries and to interpret
            `times`, `startAt`, and `endAt`. Defaults to

            the organization’s preferred time zone.
          examples:
            - America/Los_Angeles
        daysOfTheWeek:
          type: array
          items:
            type: integer
            format: int32
          description: >-
            The days of the week, Sun (0), Mon (1), …, Sat (6), on which the
            collection schedule is active.

            Never empty.
          examples:
            - - 0
              - 2
              - 4
              - 6
        times:
          type: array
          items:
            type: string
          description: >-
            Times of the day (in "HH:mm" format) at which network collections
            should start. Either `times` or

            `periodInSeconds` must be specified—not both. Never empty if
            present.
          examples:
            - - '01:00'
              - '06:00'
              - '11:00'
              - '16:00'
              - '21:00'
        periodInSeconds:
          type: integer
          format: int32
          description: >-
            How many seconds after the start of the most recent collection that
            the next one should begin. Either

            `times` or `periodInSeconds` must be specified—not both. Must be
            positive.


            **Note**: A Collector can only perform one network collection at a
            time. A scheduled collection will be

            delayed if it cannot start on time due to an earlier collection
            running long.
          examples:
            - 1800
        startAt:
          type: string
          description: >-
            The time of day (in "HH:mm" format) at which a rate-based collection
            schedule begins. Must be absent if

            `times` is specified. Defaults to the start of the day (00:00).
          examples:
            - '05:30'
        endAt:
          type: string
          description: >-
            The time of day (in "HH:mm" format) at which a rate-based collection
            schedule ends. Must be absent if

            `times` is specified. Defaults to the end of the day.
          examples:
            - '20:00'
