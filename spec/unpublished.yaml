        "200":
          description: The collector's username and its new password.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SysCollectorCredentials'
              example:
                # from source: CollectorCredentials.java; password and username redacted
                collectorName: "<collector-name>"
                username: "<collector-username>"
                password: "<redacted>"
  /networks/{networkId}/proxies:
    get:
      operationId: listNetworkProxies
