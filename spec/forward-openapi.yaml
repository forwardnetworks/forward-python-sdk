    Device:
      type: object
      properties:
        name:
          type: string
          description: >-
            The name that uniquely identifies the device in the network. For
            most devices, this is the user-assigned

            [classic device](https://docs.fwd.app/latest/api/classic-devices/)
            name. For a virtual context, this is the

            classic device name plus context name. For a cloud device, this is a
            globally unique identifier assigned by the

            cloud provider.
          examples:
            - nyc-dc01-fw02
        displayName:
          type: string
          description: >-
            The device’s common name, if different from `"name"`. Absent for
            most network devices. For a cloud device,

            this is the name shown in the cloud provider’s console.
          examples:
            - nyc-dc01-fw02
        sourceName:
          type: string
          description: >-
            Name of this device’s collection source (such as a

            [classic device](https://docs.fwd.app/latest/api/classic-devices/)),
            if different from `"name"`. Absent for most

            network devices. For a cloud device, this is the cloud setup ID.
          examples:
            - nyc-dc01-fw02
        type:
          $ref: '#/components/schemas/DeviceType'
          examples:
            - FIREWALL
        vendor:
          $ref: '#/components/schemas/Vendor'
          examples:
            - F5
        model:
          type: string
          description: Absent if the device model name is unknown.
          examples:
            - BIG-IP Virtual Edition
        platform:
          $ref: '#/components/schemas/VendorOs'
          examples:
            - f5
        osVersion:
