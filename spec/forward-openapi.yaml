              $ref: '#/components/schemas/WanCircuit'
        required: true
      responses:
        '204':
          description: No Content
          content: {}
      security:
        - api_token: []
    patch:
      tags:
        - WAN Circuits
      summary: Update a WAN circuit
      description: >-
        All JSON properties in the request body are optional. Include only the
        properties you wish to

        change.
      operationId: patchWanCircuit
      parameters:
        - name: networkId
          in: path
          required: true
          schema:
            type: string
        - name: wanCircuitName
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WanCircuitPatch'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WanCircuit'
      security:
        - api_token: []
    delete:
      tags:
        - WAN Circuits
      summary: Remove a WAN circuit
      operationId: deleteWanCircuit
      parameters:
        - name: networkId
          in: path
          required: true
          schema:
            type: string
        - name: wanCircuitName
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: No Content
          content: {}
      security:
        - api_token: []
components:
  securitySchemes:
    api_token:
      type: http
      scheme: basic
  schemas:
    Alias:
      type: object
      required:
        - createdAt
        - creatorId
        - name
        - type
      properties:
        createdAt:
          type: string
          examples:
            - '2022-04-06T20:34:45.118Z'
        creatorId:
          type: string
        name:
          type: string
        type:
          $ref: '#/components/schemas/AliasType'
    AliasAndValue:
      allOf:
        - $ref: '#/components/schemas/Alias'
    AliasBuilder:
      type: object
      required:
        - type
      properties:
        type:
          type: string
          enum:
            - HOSTS
            - DEVICES
            - INTERFACES
            - HEADERS
            - LOGICAL_NETWORK
      oneOf:
        - $ref: '#/components/schemas/HostsAliasBuilder'
        - $ref: '#/components/schemas/DevicesAliasBuilder'
        - $ref: '#/components/schemas/InterfacesAliasBuilder'
        - $ref: '#/components/schemas/TrafficAliasBuilder'
        - $ref: '#/components/schemas/LogicalNetworkAliasBuilder'
      discriminator:
        propertyName: type
        mapping:
          HOSTS: '#/components/schemas/HostsAliasBuilder'
          HostFilter: '#/components/schemas/HostsAliasBuilder'
          DEVICES: '#/components/schemas/DevicesAliasBuilder'
          DeviceFilter: '#/components/schemas/DevicesAliasBuilder'
          INTERFACES: '#/components/schemas/InterfacesAliasBuilder'
          InterfaceFilter: '#/components/schemas/InterfacesAliasBuilder'
          HEADERS: '#/components/schemas/TrafficAliasBuilder'
          PacketFilter: '#/components/schemas/TrafficAliasBuilder'
          LOGICAL_NETWORK: '#/components/schemas/LogicalNetworkAliasBuilder'
    Aliases:
      type: object
      required:
        - aliases
      properties:
        aliases:
          type: array
          items:
            $ref: '#/components/schemas/Alias'
    ErrorInfo:
      type: object
      required:
        - httpMethod
        - apiUrl
        - message
      properties:
        httpMethod:
          type: string
          examples:
            - GET
          enum:
            - GET
            - HEAD
            - POST
            - PUT
            - PATCH
            - DELETE
        apiUrl:
          type: string
          examples:
            - /api/version
        message:
          type: string
          description: A description of the error
        reason:
          type: string
    AliasType:
      type: string
      enum:
        - HOSTS
        - DEVICES
        - INTERFACES
        - HEADERS
        - LOGICAL_NETWORK
    HostsAliasBuilder:
      type: object
      required:
        - name
        - type
      properties:
        locations:
          type: array
          items:
            type: string
        name:
          type: string
        type:
          $ref: '#/components/schemas/AliasType'
        values:
          type: array
          items:
            type: string
    DevicesAliasBuilder:
      type: object
      required:
        - name
        - type
      properties:
        name:
          type: string
        type:
          $ref: '#/components/schemas/AliasType'
        values:
          type: array
          items:
            type: string
    InterfacesAliasBuilder:
      type: object
      required:
        - name
        - type
      properties:
        isExposurePoint:
          type: boolean
        name:
          type: string
        type:
          $ref: '#/components/schemas/AliasType'
        values:
          type: array
          items:
            type: string
        vlanIds:
          type: array
          items:
            type: string
        vlanIntfTypes:
          type: array
          items:
            type: string
            enum:
              - ACCESS
              - TRUNK
    TrafficAliasBuilder:
      type: object
      required:
        - name
        - type
      properties:
        name:
          type: string
        type:
          $ref: '#/components/schemas/AliasType'
        values:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
    LogicalNetworkAliasBuilder:
      type: object
      required:
        - name
        - type
      properties:
        devices:
          type: array
          items:
            type: string
        edgeNodes:
          type: array
          items:
            type: string
        name:
          type: string
        type:
          $ref: '#/components/schemas/AliasType'
    AvailablePredefinedCheck:
      type: object
      properties:
        description:
          type: string
        name:
          type: string
        predefinedCheckType:
          $ref: '#/components/schemas/PredefinedCheckType'
    CheckPriority:
      type: string
      enum:
        - NOT_SET
        - LOW
        - MEDIUM
        - HIGH
    CheckStatus:
      type: string
      enum:
        - NONE
        - PASS
        - FAIL
        - ERROR
        - TIMEOUT
        - PROCESSING
        - REQUIRES_ADDITIONAL_SNAPSHOT_PROCESSING
    CheckType:
      type: string
      enum:
        - Isolation
        - Reachability
        - Existential
        - QueryStringBased
        - Predefined
        - NQE
    NetworkCheckResult:
      type: object
      properties:
        createdAt:
          type: string
          examples:
            - '2022-04-06T20:34:45.118Z'
        creator:
          type: string
          description: >-
            The username of the user who created the check, or null if unknown
            or if the account was

            deleted
          examples:
            - mary
        creatorId:
          type: string
        definition:
          $ref: '#/components/schemas/CheckDefinition'
        definedAt:
          type: string
          examples:
            - '2022-04-06T20:34:45.118Z'
        description:
          type: string
        editedAt:
          type: string
          examples:
            - '2022-04-06T20:34:45.118Z'
        editor:
          type: string
          description: >-
            The username of the user who last edited the check, or null if
            unknown, if the account was deleted, or if

            the check hasn't been edited
          examples:
            - steven
        editorId:
          type: string
        enabled:
          type: boolean
        executedAt:
          type: string
          examples:
            - '2022-04-06T20:34:45.118Z'
        executionDurationMillis:
          type: integer
          format: int64
        id:
          type: string
        name:
          type: string
        note:
          type: string
        numViolations:
          type: integer
          format: int64
        perfMonitoringEnabled:
          type: boolean
          description: >-
            Whether performance monitoring is enabled for this check. Only
            supported for Existential intent checks.

            Performance monitoring must be independently enabled for each device
            along the check’s path(s).
        priority:
          $ref: '#/components/schemas/CheckPriority'
        status:
          $ref: '#/components/schemas/CheckStatus'
          description: >-
            Status of this check. `REQUIRES_ADDITIONAL_SNAPSHOT_PROCESSING`
            indicates that this check requires additional

            Snapshot processing, such as advanced reachability computation,
            which can be triggered using [Trigger advanced

            reachability
            computation](https://docs.fwd.app/latest/api/network-snapshots/compute-advanced-reachability/).
        tags:
          type: array
          items:
            type: string
    NetworkCheckResultWithDiagnosis:
      allOf:
        - $ref: '#/components/schemas/NetworkCheckResult'
        - type: object
          properties:
            diagnosis:
              $ref: '#/components/schemas/CheckDiagnosis'
    NewNetworkCheck:
      type: object
      required:
        - definition
      properties:
        definition:
          $ref: '#/components/schemas/CheckDefinition'
        enabled:
          type: boolean
        name:
          type: string
        note:
          type: string
        perfMonitoringEnabled:
          type: boolean
          description: >-
            Whether performance monitoring is enabled for this check. Only
            supported for Existential intent checks.

            Performance monitoring must be independently enabled for each device
            along the check’s path(s).
        priority:
          $ref: '#/components/schemas/CheckPriority'
        tags:
          type: array
          items:
            type: string
    PredefinedCheckType:
      type: string
      enum:
        - BGP_NEIGHBOR_ADJACENCY
        - BGP_ROUTER_ID
        - BGP_ROUTE_CONSISTENCY
        - BGP_VPC_PARAMETER_CONSISTENCY
        - EBGP_SELECTION_OVER_IBGP
        - BGP_COMMUNITY_LIST
        - NEXT_HOP_REACHABILITY
        - NO_LOOP
        - SHORTEST_PATH
        - IP_UNIQUENESS
        - HOSTNAME_CONSISTENCY
        - HOSTNAME_UNIQUENESS
        - VLAN_CONSISTENCY
        - MTU_CONSISTENCY
        - PORT_CHANNEL_CONSISTENCY
        - DUPLEX_CONSISTENCY
        - LINK_SPEED_CONSISTENCY
        - SOFTWARE_VERSION_CONSISTENCY
        - TRUNK_INTERFACE_WHITELIST
        - VLAN_EXISTENCE
        - LEARNED_MAC_CONSISTENCY
        - FHRP_PEERING
        - VPC_PARAMETER_CONSISTENCY
        - VPC_INTERFACE_PARAMETER_CONSISTENCY
        - VPC_DEDICATED_KEEPALIVE_LINK
        - VPC_ROLE_PRIORITY
        - SSH_RSA_KEY_LENGTH
        - VPC_STP_PRIORITY
        - VPC_MST_REGION_CONSISTENCY
    DeviceFilter:
      type: object
      required:
        - type
        - value
      properties:
        type:
          type: string
          const: DeviceFilter
        value:
          type: string
          examples:
            - nyc-dc01-fw01
      description: >-
        A filter that matches one device by name or all devices (using value
        "*")
    DeviceAliasFilter:
      type: object
      required:
        - type
        - value
      properties:
        type:
          type: string
          const: DeviceAliasFilter
        value:
          type: string
          description: A Device Group name
      description: A filter that matches any device in a Device Group
    BypassFilter:
      type: object
      required:
        - type
      properties:
        type:
          type: string
          enum:
            - DeviceFilter
            - DeviceAliasFilter
      oneOf:
        - $ref: '#/components/schemas/DeviceFilter'
        - $ref: '#/components/schemas/DeviceAliasFilter'
      discriminator:
        propertyName: type
        mapping:
          DeviceFilter: '#/components/schemas/DeviceFilter'
          DeviceAliasFilter: '#/components/schemas/DeviceAliasFilter'
    PacketFilter:
      type: object
      required:
        - type
        - values
      properties:
        type:
          type: string
          const: PacketFilter
        values:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
          examples:
            - ipv4_dst:
                - 10.10.10.0/24
      description: A filter that matches a specific packet header value or range of values
    PacketAliasFilter:
      type: object
      required:
        - type
        - value
      properties:
        direction:
          type: string
          enum:
            - src
            - dst
        type:
          type: string
          const: PacketAliasFilter
        value:
          type: string
          description: A Packet Header Set name
      description: >-
        A filter that matches any combination of packet header values that
        satisfy the criteria in a

        Header Set
    NotFilter:
      type: object
      required:
        - type
      properties:
        clause:
          type: object
          description: >-
            A filter that would be permitted in the place of this NotFilter.
            Cannot be another NotFilter.
        type:
          type: string
          const: NotFilter
      description: A filter that inverts the filter in its `clause`
    PacketHeaderFilter:
      type: object
      required:
        - type
      properties:
        type:
          type: string
          enum:
            - PacketFilter
            - PacketAliasFilter
            - NotFilter
      oneOf:
        - $ref: '#/components/schemas/PacketFilter'
        - $ref: '#/components/schemas/PacketAliasFilter'
        - $ref: '#/components/schemas/NotFilter'
      discriminator:
        propertyName: type
        mapping:
          PacketFilter: '#/components/schemas/PacketFilter'
          PacketAliasFilter: '#/components/schemas/PacketAliasFilter'
          NotFilter: '#/components/schemas/NotFilter'
    InterfaceFilter:
      type: object
      required:
        - type
        - value
      properties:
        type:
          type: string
          const: InterfaceFilter
        value:
          type: string
          examples:
            - nyc-dc01-fw01 eth1
      description: A filter that matches one device interface by name
    TunnelInterfaceFilter:
      type: object
      required:
        - type
        - value
      properties:
        type:
          type: string
          const: TunnelInterfaceFilter
        value:
          type: string
          examples:
            - nyc-dc01-rtr-01 ge3
      description: >-
        A filter that matches one tunnel interface by name and has underlay
        semantics in the `from` or `to` property

        of a `PathQuery`
    SecurityZoneFilter:
      type: object
      required:
        - device
        - type
        - value
      properties:
        device:
          type: string
          examples:
            - nyc-dc01-rtr-01
        type:
          type: string
          const: SecurityZoneFilter
        value:
          type: string
          examples:
            - corp-trusted
      description: >-
        A filter that matches one security zone on a firewall by name and can be
        used in the `from` or `to` property

        of a `PathQuery`
    DeviceVrfFilter:
      type: object
      required:
        - type
        - device
        - vrf
      properties:
        type:
          type: string
          const: DeviceVrfFilter
        device:
          type: string
          examples:
            - nyc-dc01-rtr-01
        vrf:
          type: string
          examples:
            - MY VRF
      description: A filter that matches a device’s interfaces by VRF name
    InterfaceAliasFilter:
      type: object
      required:
        - type
        - value
      properties:
        type:
          type: string
          const: InterfaceAliasFilter
        value:
          type: string
          description: An Interface Group name
      description: A filter that matches any device interface in an Interface Group
    VrfFilter:
      type: object
      required:
        - type
        - value
      properties:
        type:
          type: string
          const: VrfFilter
        value:
          type: string
          description: A VRF name. Use `DeviceVrfFilter` instead for a (device, VRF) pair.
          examples:
            - MY VRF
      description: A filter that matches device interfaces by VRF name
    HopLocationFilter:
      type: object
      required:
        - type
      properties:
        type:
          type: string
          enum:
            - DeviceFilter
            - InterfaceFilter
            - TunnelInterfaceFilter
            - SecurityZoneFilter
            - DeviceVrfFilter
            - DeviceAliasFilter
            - InterfaceAliasFilter
            - VrfFilter
            - NotFilter
      oneOf:
        - $ref: '#/components/schemas/DeviceFilter'
        - $ref: '#/components/schemas/InterfaceFilter'
        - $ref: '#/components/schemas/TunnelInterfaceFilter'
        - $ref: '#/components/schemas/SecurityZoneFilter'
        - $ref: '#/components/schemas/DeviceVrfFilter'
        - $ref: '#/components/schemas/DeviceAliasFilter'
        - $ref: '#/components/schemas/InterfaceAliasFilter'
        - $ref: '#/components/schemas/VrfFilter'
        - $ref: '#/components/schemas/NotFilter'
      discriminator:
        propertyName: type
        mapping:
          DeviceFilter: '#/components/schemas/DeviceFilter'
          InterfaceFilter: '#/components/schemas/InterfaceFilter'
          TunnelInterfaceFilter: '#/components/schemas/TunnelInterfaceFilter'
          SecurityZoneFilter: '#/components/schemas/SecurityZoneFilter'
          DeviceVrfFilter: '#/components/schemas/DeviceVrfFilter'
          DeviceAliasFilter: '#/components/schemas/DeviceAliasFilter'
          InterfaceAliasFilter: '#/components/schemas/InterfaceAliasFilter'
          VrfFilter: '#/components/schemas/VrfFilter'
          NotFilter: '#/components/schemas/NotFilter'
    HopFilter:
      type: object
      required:
        - location
        - transitType
      properties:
        headers:
          type: array
          items:
            $ref: '#/components/schemas/PacketHeaderFilter'
        location:
          $ref: '#/components/schemas/HopLocationFilter'
        transitType:
          type: string
          enum:
            - through
            - ingress
            - egress
    HostFilter:
      type: object
      required:
        - type
        - value
      properties:
        type:
          type: string
          const: HostFilter
        value:
          type: string
          examples:
            - 10.10.10.10
      description: >-
        A filter that matches hosts by hostname, IP subnet address, or MAC
        address
    HostAliasFilter:
      type: object
      required:
        - type
        - value
      properties:
        type:
          type: string
          const: HostAliasFilter
        value:
          type: string
          description: A Host Group name
      description: A filter that matches any host in a Host Group
    SubnetLocationFilter:
      type: object
      required:
        - type
        - value
      properties:
        type:
          type: string
          const: SubnetLocationFilter
        value:
          type: string
          examples:
            - 10.10.10.64/30
        host:
          type: string
          description: >-
            The hostname that resolves to the IP in `value` (metadata only; not
            used directly)
          examples:
            - testing.example.com
        device:
          type: string
          description: The device at which the subnet is located
          examples:
            - nyc-dc01-rtr01
      description: >-
        A filter that matches a specific IP address or IP subnet address at a
        specific location in the network. If

        the IP address is a multicast group address, this filter matches on the
        locations of the corresponding

        multicast Rendezvous Points (RPs) in the network.
    LocationFilter:
      type: object
      required:
        - type
      properties:
        type:
          type: string
          enum:
            - HostFilter
            - DeviceFilter
            - InterfaceFilter
            - TunnelInterfaceFilter
            - SecurityZoneFilter
            - DeviceVrfFilter
            - HostAliasFilter
            - DeviceAliasFilter
            - InterfaceAliasFilter
            - SubnetLocationFilter
            - VrfFilter
            - NotFilter
      oneOf:
        - $ref: '#/components/schemas/HostFilter'
        - $ref: '#/components/schemas/DeviceFilter'
        - $ref: '#/components/schemas/InterfaceFilter'
        - $ref: '#/components/schemas/TunnelInterfaceFilter'
        - $ref: '#/components/schemas/SecurityZoneFilter'
        - $ref: '#/components/schemas/DeviceVrfFilter'
        - $ref: '#/components/schemas/HostAliasFilter'
        - $ref: '#/components/schemas/DeviceAliasFilter'
        - $ref: '#/components/schemas/InterfaceAliasFilter'
        - $ref: '#/components/schemas/SubnetLocationFilter'
        - $ref: '#/components/schemas/VrfFilter'
        - $ref: '#/components/schemas/NotFilter'
      discriminator:
        propertyName: type
        mapping:
          HostFilter: '#/components/schemas/HostFilter'
          DeviceFilter: '#/components/schemas/DeviceFilter'
          InterfaceFilter: '#/components/schemas/InterfaceFilter'
          TunnelInterfaceFilter: '#/components/schemas/TunnelInterfaceFilter'
          SecurityZoneFilter: '#/components/schemas/SecurityZoneFilter'
          DeviceVrfFilter: '#/components/schemas/DeviceVrfFilter'
          HostAliasFilter: '#/components/schemas/HostAliasFilter'
          DeviceAliasFilter: '#/components/schemas/DeviceAliasFilter'
          InterfaceAliasFilter: '#/components/schemas/InterfaceAliasFilter'
          SubnetLocationFilter: '#/components/schemas/SubnetLocationFilter'
          VrfFilter: '#/components/schemas/VrfFilter'
          NotFilter: '#/components/schemas/NotFilter'
    EndpointFilter:
      type: object
      required:
        - location
      properties:
        headers:
          type: array
          items:
            $ref: '#/components/schemas/PacketHeaderFilter'
        location:
          $ref: '#/components/schemas/LocationFilter'
        logicalNetwork:
          type: string
    PathQuery:
      type: object
      properties:
        bypass:
          type: array
          items:
            $ref: '#/components/schemas/BypassFilter'
        chain:
          type: array
          items:
            $ref: '#/components/schemas/HopFilter'
        flowTypes:
          type: array
          items:
            type: string
            enum:
              - VALID
              - LOOP
              - POTENTIAL_LOOP
              - BLACKHOLE
              - DROPPED
              - INADMISSIBLE
              - UNREACHABLE
              - IGNORED
              - UNDELIVERED
        forwardingTypes:
          type: array
          items:
            type: string
            enum:
              - L2
              - L3
              - DIRECT_L2
              - FABRIC_PATH
              - VXLAN
              - MCAST_IP
              - DIRECT_IP
              - MPLS
              - L2_PBR
              - L3_PBR
        from:
          $ref: '#/components/schemas/EndpointFilter'
        mode:
          type: string
          const: PERMIT_ALL
        to:
          $ref: '#/components/schemas/EndpointFilter'
    NoiseType:
      type: string
      enum:
        - WRONG_GATEWAY
        - INADMISSIBLE
        - NETWORK_OR_BROADCAST_ADDRESS
        - TO_L2_INTERFACE_MAC
        - GLEAN
    ExistsCheck:
      type: object
      required:
        - checkType
        - filters
      properties:
        checkType:
          type: string
          const: Existential
        filters:
          $ref: '#/components/schemas/PathQuery'
        headerFieldsWithDefaults:
          type: array
          items:
            type: string
            enum:
              - ip_tos
              - tp_src
              - app_id
              - url
              - user_id
          description: >-
            The header fields for which a default value is assumed if no valid
            is specified in the `from` clause.

            Defaults to `["url"]`.
        noiseTypes:
          type: array
          items:
            $ref: '#/components/schemas/NoiseType'
          description: >-
            The noise types that should be included in the search results.
            Defaults to `[]`.
        returnPath:
          type: string
          enum:
            - ANY
            - SYMMETRIC
    IsolationCheck:
      type: object
      required:
        - checkType
        - filters
      properties:
        checkType:
          type: string
          const: Isolation
        filters:
          $ref: '#/components/schemas/PathQuery'
        headerFieldsWithDefaults:
          type: array
          items:
            type: string
            enum:
              - ip_tos
              - tp_src
              - app_id
              - url
              - user_id
          description: >-
            The header fields for which a default value is assumed if no valid
            is specified in the `from` clause.

            Defaults to `["url"]`.
        noiseTypes:
          type: array
          items:
            $ref: '#/components/schemas/NoiseType'
          description: >-
            The noise types that should be included in the search results.
            Defaults to `[]`.
    ReachabilityCheck:
      type: object
      required:
        - checkType
        - filters
      properties:
        checkType:
          type: string
          const: Reachability
        filters:
          $ref: '#/components/schemas/PathQuery'
        headerFieldsWithDefaults:
          type: array
          items:
            type: string
            enum:
              - ip_tos
              - tp_src
              - app_id
              - url
              - user_id
          description: >-
            The header fields for which a default value is assumed if no valid
            is specified in the `from` clause.

            Defaults to `["url"]`.
        noiseTypes:
          type: array
          items:
            $ref: '#/components/schemas/NoiseType'
          description: >-
            The noise types that should be included in the search results.
            Defaults to `[]`.
    QueryStringCheck:
      type: object
      required:
        - checkType
      properties:
        checkType:
          type: string
          const: QueryStringBased
        forRequest:
          type: string
        value:
          type: string
    PredefinedCheck:
      type: object
      required:
        - checkType
      properties:
        checkType:
          type: string
          const: Predefined
        params:
          type: object
        predefinedCheckType:
          $ref: '#/components/schemas/PredefinedCheckType'
    NqeCheck:
      type: object
      required:
        - checkType
        - queryId
      properties:
        checkType:
          type: string
          const: NQE
        queryId:
          type: string
          examples:
            - FQ_6ac3682c92a74b778d98584aea8afa5fe40f2150
        params:
          type: object
          description: >-
            Values for each parameter declared in the query. The parameter
            values are specified as a JSON object, with

            one property per parameter, where the property name matches the
            parameter name. The property value is the

            JSON representation of the parameter value. The JSON representation
            of a parameter value depends on the type

            of the value. For values of type `String`, `IpAddress`, `IpSubnet`,
            and `MacAddress`, the JSON

            representation is a JSON string. For values of type `Number`, the
            value is an integral JSON number. For

            values of type `Boolean`, the JSON representation is true or false.
            For values of type `List<T>`, the JSON

            representation is an array of JSON values, each of which is a JSON
            representation for type `T`. For record

            values, the JSON representation is a JSON object with corresponding
            properties whose values are JSON

            representations corresponding to the properties' types. For
            enumerations, the JSON representation is a JSON

            string with the enum constant name. For `oneOf` values that contain
            data, the JSON representation is a JSON

            object with two properties, `alternative` and `value`, where the
            `alternative` property contains the

            alternative's name (a string) and the `value` property is a JSON
            representation of the data associated with

            this alternative.
          examples:
            - mtuThreshold: 123
              ntpServers:
                - 10.22.2.3
                - 192.33.4.1
    CheckDefinition:
      type: object
      required:
        - checkType
      properties:
        checkType:
          type: string
          enum:
            - Existential
            - Isolation
            - Reachability
            - QueryStringBased
            - Predefined
            - NQE
      oneOf:
        - $ref: '#/components/schemas/ExistsCheck'
        - $ref: '#/components/schemas/IsolationCheck'
        - $ref: '#/components/schemas/ReachabilityCheck'
        - $ref: '#/components/schemas/QueryStringCheck'
        - $ref: '#/components/schemas/PredefinedCheck'
        - $ref: '#/components/schemas/NqeCheck'
      discriminator:
        propertyName: checkType
        mapping:
          Existential: '#/components/schemas/ExistsCheck'
          Isolation: '#/components/schemas/IsolationCheck'
          Reachability: '#/components/schemas/ReachabilityCheck'
          QueryStringBased: '#/components/schemas/QueryStringCheck'
          Predefined: '#/components/schemas/PredefinedCheck'
          NQE: '#/components/schemas/NqeCheck'
    LineRange:
      type: object
      properties:
        start:
          type: integer
          format: int32
          description: The 0-based index of the first line in the range.
          examples:
            - 23
        end:
          type: integer
          format: int32
          description: The 0-based index of the last line in the range (inclusive).
          examples:
            - 27
    DiagnosisReference:
      type: object
      properties:
        key:
          type: string
          description: >-
            A name or identifier associated with the reference, like a device or
            interface name.
          examples:
            - rtr-01 eth0
        value:
          type: string
          description: >-
            The value associated with `key` that’s relevant to this violation,
            such as a link speed, MTU size, VLAN

            range, or IP address.
          examples:
            - 10.110.4.14
        files:
          type: object
          additionalProperties:
            type: array
            items:
              $ref: '#/components/schemas/LineRange'
          description: Relevant line ranges in files collected from the device.
          examples:
            - rtr-01,configuration,16.txt:
                - start: 6
                  end: 6
                - start: 22
                  end: 29
    DiagnosisDetail:
      type: object
      properties:
        query:
          type: string
        references:
          type: array
          items:
            $ref: '#/components/schemas/DiagnosisReference'
    CheckDiagnosis:
      type: object
      properties:
        details:
          type: array
          items:
            $ref: '#/components/schemas/DiagnosisDetail'
        detailsIncomplete:
          type: boolean
        summary:
          type: string
    ClassicDevice:
      allOf:
        - type: object
          required:
            - name
            - host
          properties:
            name:
              type: string
              description: >-
                A name that’s unique (ignoring case) among all of the network’s
                collection source names. May consist of

                letters, digits, dots, hyphens, and underscores.
              examples:
                - my-router
            type:
              $ref: '#/components/schemas/ClassicDeviceType'
              description: Auto-detected during connectivity testing if unspecified.
              examples:
                - checkpoint_ssh
            host:
              type: string
              description: IP address or hostname used to connect to the device.
              examples:
                - 10.121.7.13
            port:
              type: integer
              format: int32
              minimum: 1
              maximum: 65535
              description: >-
                Port used to connect to the device. The default value depends on
                the collection protocol: 22 for SSH, 443

                for HTTPS, etc.
              examples:
                - 22
            cliCredentialId:
              type: string
              description: >-
                The `id` of a CliCredential of type `LOGIN`. Relevant for
                devices collected via SSH or Telnet. Credential

                auto-association will be attempted using credentials configured
                to allow it if this property is unspecified

                and collecting from this device requires this kind of
                credential.
              examples:
                - L-3
            cliCredential2Id:
              type: string
              description: >-
                The `id` of a CliCredential of type `PRIVILEGED_MODE` (for
                Cisco-like or Checkpoint devices) or `SHELL` (for

                Avi controllers). On Checkpoint, this credential is used for
                TACACS privilege escalation. Credential

                auto-association will be attempted using credentials configured
                to allow it if this property is unspecified

                and collecting from this device requires this kind of
                credential.
              examples:
                - PM-2
            cliCredential3Id:
              type: string
              description: >-
                The `id` of a CliCredential of type `EXPERT_MODE` (for
                Checkpoint devices). Can be set with or without a

                `PRIVILEGED_MODE` credential for `cliCredential2Id`. Credential
                auto-association will be attempted using

                credentials configured to allow it if this property is
                unspecified and collecting from this device requires

                this kind of credential.
              examples:
                - EM-6
            httpCredentialId:
              type: string
              description: >-
                The `id` of an HttpCredential of type `LOGIN` or `API_KEY`.
                Relevant for devices collected via HTTPS or

                HTTP. Credential auto-association will be attempted using
                credentials configured to allow it if this

                property is unspecified and collecting from this device requires
                this kind of credential.
              examples:
                - H-5
            snmpCredentialId:
              type: string
              description: >-
                The `id` of an SnmpCredential. Used to collect performance data
                (counters) if `enableSnmpCollection` is

                true. Credential auto-association will be attempted using
                credentials configured to allow it if this

                property is unspecified and collecting from this device requires
                this kind of credential.
              examples:
                - S-4
            jumpServerId:
              type: string
              description: >-
                The `id` of the JumpServer that should be used to collect from
                this device.
              examples:
                - J-0
            disableIpv6Collection:
              type: boolean
              description: >-
                Disables collection of any IPv6 forwarding state on the device.
                Defaults to false.
              examples:
                - false
            fullCollectionLog:
              type: boolean
              description: >-
                Enables more detailed logging during collection. Defaults to
                false.
              examples:
                - false
            paginationMode:
              $ref: '#/components/schemas/PaginationMode'
              description: >-
                The pagination mode to use during collection. Relevant for
                devices collected via SSH or Telnet. Defaults to

                `DISABLE_PAGINATION`. Per-command pagination (such as appending
                `| more`) may be used if set to

                `ENABLE_PAGINATION` for a device that doesn’t have a per-session
                pagination mode setting.
              examples:
                - KEEP_UNCHANGED
            terminalWidth:
              type: integer
              format: int32
              minimum: 80
              maximum: 500
              description: >-
                Width of pseudo-terminal in characters. A high value can prevent
                long lines from wrapping. Defaults to 500.

                Relevant for devices collected via SSH or Telnet.
              examples:
                - 500
            largeRtt:
              type: boolean
              description: >-
                Whether the device has a large round-trip time (requires a
                longer response timeout).
              examples:
                - false
            minBytesReadPerSec:
              type: integer
              format: int64
              description: >-
                The minimum read rate in bytes/sec required to prevent
                collection from failing with a

                `SLOW_READ_RATE_DETECTED` error. Defaults to 500.
              examples:
                - 1000
            maxConnectionsPerMin:
              type: integer
              format: int32
              description: >-
                The maximum number of connections to this device that should be
                attempted per minute. Setting this property

                can prevent spurious connectivity test failures if the device’s
                SSH server is configured with a connection

                rate limit.
              examples:
                - 10
            useFileTransferForLargeOutput:
              type: boolean
              description: >-
                Whether to use file transfer instead of printing large command
                output directly to the shell. This is

                currently only supported for Juniper devices when executing
                routing table commands. The primary purpose is

                to avoid printing large outputs directly to the shell, which on
                Juniper devices can interfere with packet

                forwarding performance. Instead, the command output is written
                to a temporary file on the device and then

                transferred over a separate connection. After the transfer is
                complete, the temporary file is deleted to

                prevent unnecessary disk usage on the device.
              examples:
                - false
            bmpStationHost:
              type: string
              description: >-
                IP address or hostname of the BMP station from which BMP
                collection should be peformed for this device. If

                set, a jump server won’t be used for BMP collection.
              examples:
                - 10.121.7.33
            bgpAndBmpFailureHandling:
              type: string
              description: >-
                How to handle BGP or BMP collection failure. Defaults to
                `FAIL_DEVICE`.
              examples:
                - SWITCH_TO_CLI
              enum:
                - FAIL_DEVICE
                - SWITCH_TO_CLI
                - ALWAYS_USE_CLI
                - ALWAYS_USE_BMP
                - CONTINUE_WITHOUT_BGP_DATA
            collectBgpAdvertisements:
              type: boolean
              description: >-
                Whether BGP advertisements should be collected. Defaults to
                `false` unless advertisement collection is

                required to model a [synthetic
                device](https://docs.fwd.app/latest/api/synthetic-devices/)
                connected to this

                device.
              examples:
                - false
            bgpTableType:
              type: string
              description: >-
                The BGP route types to collect. Honored only if
                `collectedBgpAdvertisements` is true. Defaults

                to `BOTH`.
              examples:
                - BOTH
              enum:
                - BOTH
                - ADJ_RIB_IN
                - ADJ_RIB_OUT
            bgpPeerType:
              type: string
              description: >-
                The BGP peer types from which to collect routes. Honored only if
                `collectedBgpAdvertisements` is true.

                Defaults to `BOTH`.
              examples:
                - BOTH
              enum:
                - BOTH
                - EBGP
                - IBGP
            bgpSubnetsToCollect:
              type: array
              items:
                type: string
              description: >-
                Restricts collection of BGP advertisements to specific subnets
                if the device supports it. Honored only if

                `collectBgpAdvertisements` is `true`.
              examples:
                - - 123.223.47.0/24
            prompt:
              type: string
              description: >-
                A case-insensitive glob pattern used to identify an interactive
                prompt. When this pattern matches the end of

                the prompt, ignoring any trailing whitespace, the Collector will
                enter the configured `promptResponse`.

                Relevant for devices collected via SSH or Telnet.
              examples:
                - y/n
            promptResponse:
              type: string
              description: >-
                What the Collector should enter in response to a device prompt
                matching `prompt` in order to proceed.

                Relevant for devices collected via SSH or Telnet. Required if
                `prompt` is set.
              examples:
                - 'y'
            collect:
              type: boolean
              description: Whether to collect from the device. Defaults to true.
              examples:
                - false
            note:
              type: string
              description: An optional description or note about the device.
            enableSnmpCollection:
              type: boolean
              description: >-
                Whether to collect performance data (counters) via SNMP.
                Defaults to false.
              examples:
                - false
            highCpuUsage:
              type: number
              format: float
              minimum: 0.75
              maximum: 1
              description: >-
                Threshold at or above which CPU usage is considered high.
                Defaults to 0.8 (80.0%).
              examples:
                - 0.85
            highMemoryUsage:
              type: number
              format: float
              minimum: 0.75
              maximum: 1
              description: >-
                Threshold at or above which memory usage is considered high.
                Defaults to 0.9 (90.0%).
              examples:
                - 0.92
            highInputUtilization:
              type: number
              format: float
              minimum: 0.75
              maximum: 1
              description: >-
                Threshold at or above which input interface utilization is
                considered high. Defaults to 0.9

                (90.0%).
              examples:
                - 0.8
            highOutputUtilization:
              type: number
              format: float
              minimum: 0.75
              maximum: 1
              description: >-
                Threshold at or above which output interface utilization is
                considered high. Defaults to 0.9

                (90.0%).
              examples:
                - 0.88
            mediumCpuUsage:
              type: number
              format: float
              minimum: 0.5
              maximum: 1
              description: >-
                Threshold at or above which CPU usage is considered medium high.
                Has no default value.
              examples:
                - 0.7
            mediumMemoryUsage:
              type: number
              format: float
              minimum: 0.5
              maximum: 1
              description: >-
                Threshold at or above which memory usage is considered medium
                high. Has no default value.
              examples:
                - 0.71
            mediumInputUtilization:
              type: number
              format: float
              minimum: 0.5
              maximum: 1
              description: >-
                Threshold at or above which input interface utilization is
                considered medium high. Has no

                default value.
              examples:
                - 0.72
            mediumOutputUtilization:
              type: number
              format: float
              minimum: 0.5
              maximum: 1
              description: >-
                Threshold at or above which output interface utilization is
                considered medium high. Has no

                default value.
              examples:
                - 0.73
            cloudLocationId:
              type: string
              description: >-
                ID of the cloud location at which this device was discovered.
                Present for cloud-based virtualized devices

                only.
              examples:
                - AWS.us-east-1
            cloudSetupId:
              type: string
              description: >-
                Name of the cloud setup associated with this device’s discovery.
                Present for cloud-based virtualized devices

                only.
              examples:
                - my-aws-setup
            cloudDiscoverySource:
              type: string
              description: >-
                Account name (AWS), Project ID (GCP), or Subscription ID (Azure)
                associated with this device’s discovery.

                Present for cloud-based virtualized devices only.
              examples:
                - main
            tags:
              type: array
              items:
                type: string
              description: >-
                Tags assigned to the device. Present only if specifically
                requested.
            locationId:
              type: string
              description: >-
                The `id` of the device’s assigned Location (see

                [Network
                Locations](https://docs.fwd.app/latest/api/network-locations/)).
                Present only if specifically

                requested. Defaults to "default" (the Unassigned location).
              examples:
                - atl
            testResult:
              $ref: '#/components/schemas/SourceConnectivityResult'
              description: >-
                The device’s most recent connectivity test result. Present only
                if specifically requested. Absent if the

                device’s connectivity hasn’t been tested since the last
                substantial edit to the device.
        - $ref: '#/components/schemas/Attribution'
