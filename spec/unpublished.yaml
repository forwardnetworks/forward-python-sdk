                      jvmMemMaxMb: 38336
                      jvmMemFreeMb: 115
                      procRssMb: 557
                    gcMetrics:
                      gcTimeSeconds: 0
                      gcLoad: 0.0
                    fileMetrics:
                      fileDescriptorsMax: 262144
                      fileDescriptorsOpen: 26
                    diskMetrics:
                      collector:
                        sizeMb: 262031
                        availableMb: 253515
                      os:
                        sizeMb: 262031
                        availableMb: 253515
                      tmp:
                        sizeMb: 262031
                        availableMb: 253515
                    taskMetrics:
                      concurrency: 1024
                      queueSize: 0
                      tasksStarted: 0
                      tasksFinished: 0
  /orgs/current/collectors/resetPassword:
    post:
      operationId: resetCollectorPassword
      summary: Issue a new password for a collector
      description: >-
        Any signed-in user (@RequiresUser); the service then requires the caller to be allowed to modify that collector.
        The old password stops working at once, so a running collector stops authenticating until it is given the new
        token. The response carries the new password once; do not log it.
      x-forward-stability: unpublished
      tags: [Collector Binding]
      requestBody:
