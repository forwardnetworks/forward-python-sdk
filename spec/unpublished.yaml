                commands: ["^show\\s+[^|>;]*$", "^display\\s+[^|>;]*$"]
  /approved-cli-commands?action=assess:
    post:
      operationId: assessCliCommands
      summary: Say which CLI commands the approved list allows
      description: >-
        Requires the MANAGE_ENDPOINT_PROFILES organization permission, although nothing is written. Each command is
        matched with find(), not a full match. Source-only.
