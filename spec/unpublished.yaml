      tags: [Network Collection]
      parameters:
        - name: networkId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The proxies, with their attribution.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SysStoredProxyServer'
              example:
                # from live GET on the hosted ADP account (one of 2); host replaced
                - id: "P-0"
                  name: hostproxy
                  host: "<proxy-host>"
                  port: 8080
                  protocol: http
                  createdById: "10789"
                  createdAt: "2025-03-24T13:17:39.213446403Z"
                  updatedById: "10789"
                  updatedAt: "2025-03-24T13:17:39.213446403Z"
    post:
      operationId: createNetworkProxy
      summary: Add an internet proxy to a network
      description: >-
        Requires the EDIT_INTERNET_PROXIES network permission (@Requires(network = EDIT_INTERNET_PROXIES)). The password,
        when given, is stored as a secret and is never returned. Source-only.
      x-forward-stability: unpublished
      tags: [Network Collection]
      parameters:
        - name: networkId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SysNewProxyServer'
      responses:
        "200":
          description: The stored proxy, with its new id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SysProxyServerConfig'
              # # from source: client-structs/src/main/java/com/forwardnetworks/client/model/ProxyServerConfig.java (password is a secret id, omitted here)
              example:
                id: P-1
                name: example-proxy
                host: proxy.example.com
                port: 8080
                username: example-user
                protocol: https
                disableCertChecking: false
  /networks/{networkId}/proxies/{proxyId}:
    patch:
      operationId: updateNetworkProxy
      summary: Change an internet proxy of a network
      description: >-
        Requires the EDIT_INTERNET_PROXIES network permission. Presence semantics: an omitted key is left alone; a key
        sent as null clears username, password or disableCertChecking. host, port and protocol cannot be cleared, so
        a null for them is refused by validation. Source-only.
      x-forward-stability: unpublished
      tags: [Network Collection]
      parameters:
        - name: networkId
          in: path
          required: true
          schema: { type: string }
        - name: proxyId
          in: path
          required: true
