  # -------------------------------------------------------- security matrix filters ---
  # Saved resource-pool selections a user can re-run against the security matrix
  # without resending the pools each time.
  /networks/{networkId}/securityMatrixFilters:
    get:
      operationId: getSecurityMatrixFilters
      summary: The network's saved security matrix filters
      x-forward-stability: unpublished
      tags: [Security Matrix Filters]
      parameters:
        - { name: networkId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The filters.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SecurityMatrixFiltersList" }
              example:
                filters:
                  - { id: "0", name: "Sample Matrix", resourcePools: [{ type: DEVICE_ZONE, device: dc-fw, zone: api, name: "dc-fw api" }], createdAt: 1789225615855, lastEditedAt: 1789225615855, timeoutMins: 5, createdBy: forward }
    post:
      operationId: addSecurityMatrixFilter
      summary: Save a security matrix filter
      description: Names are unique, case-insensitively, within the network.
      x-forward-stability: unpublished
      tags: [Security Matrix Filters]
      parameters:
        - { name: networkId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NewSecurityMatrixFilter" }
            example: { name: sdk-test, resourcePools: [{ type: DEVICE_ZONE, device: ash-dc-fw01, zone: api }] }
      responses:
        "200":
          description: The saved filter.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SecurityMatrixFilter" }
              example: { id: "1", name: sdk-test, resourcePools: [{ type: DEVICE_ZONE, device: ash-dc-fw01, zone: api, name: "ash-dc-fw01 api" }], createdAt: 1789225615855, createdByUserId: "100", lastEditedAt: 1789225615855, lastEditedByUserId: "100", timeoutMins: 5 }

  /networks/{networkId}/securityMatrixFilters/{filterId}:
    patch:
      operationId: updateSecurityMatrixFilter
