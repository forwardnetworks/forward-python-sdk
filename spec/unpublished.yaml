      operationId: getCollectorCollectionSettings
      summary: The collection settings of one collector
      description: >-
        Requires the VIEW_COLLECTORS organization permission (@Requires(org = VIEW_COLLECTORS)). Only settings that have
        been set appear.
      x-forward-stability: unpublished
      tags: [Collection Settings]
      parameters:
        - name: collectorId
          in: path
          required: true
          description: The collector id, in Forward's "C3" form.
          schema: { type: string }
      responses:
        "200":
          description: The stored settings for the collector.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SysCollectorCollectionSettings'
              example:
                # from live GET on the hosted ADP account
                concurrency: 1024
    patch:
      operationId: patchCollectorCollectionSettings
      summary: Change the collection settings of one collector
      description: >-
        Requires the MANAGE_COLLECTORS organization permission (@Requires(org = MANAGE_COLLECTORS)). An omitted key is
        left alone; a key sent as null resets it to Forward's default.
      x-forward-stability: unpublished
      tags: [Collection Settings]
      parameters:
        - name: collectorId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SysCollectorCollectionSettingsPatch'
      responses:
        "200":
          description: The settings after the change.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SysCollectorCollectionSettings'
              # # from source: client-structs/src/main/java/com/forwardnetworks/client/config/CollectorCollectionSettings.java
              example:
                concurrency: 256
                snmpCollectionConcurrency: 32
                vcenterConcurrency: 2
  /networks/{networkId}/performance/settings:
    patch:
      operationId: patchPerformanceSettings
      summary: Turn performance collection on or off for a network
      description: >-
        Requires the EDIT_PERFORMANCE_SETTINGS network permission (@Requires(network = EDIT_PERFORMANCE_SETTINGS)). A
        null enabled is stored as false. Source-only: the response is not in the Go SDK's test fixtures.
      x-forward-stability: unpublished
      tags: [Collection Settings]
      parameters:
        - name: networkId
          in: path
          required: true
