        extraHeaders:
          type: object
          additionalProperties:
            type: string
          description: >-
            HTTP headers to send with every request to this service. These
            headers should not contain sensitive data; use

            `credentialId` to authenticate.
          examples:
            - accept: application/json
        endpoints:
          type: array
          items:
            $ref: '#/components/schemas/HttpEndpoint'
          description: >-
            The HTTP GET requests to issue on every collection, each one
            relative to `baseUrl`. Never empty. Each endpoint’s

            response is stored under its own name in the Snapshot. Give an
            endpoint a `paginationModel` if its dataset arrives

            in pages.
          examples:
            - - name: subnets
                path: /api/v2/subnets
              - name: addresses
                path: /api/v2/addresses
        collect:
          type: boolean
          description: Whether to collect from this data connector. Defaults to true.
          examples:
            - true
          default: 'true'
        collectorId:
          type: string
          description: >-
            The `id` of the Collector that should collect from this data
            connector. Absent if Forward should pick an online

            Collector that supports it.
          examples:
            - C3
    OffsetIncrementExpression:
      type: object
      required:
        - operator
      properties:
        operator:
          type: string
          description: >-
            "IDENTITY" means to add the number at `path` in the previous
            request’s response to the previous request’s

            offset value. "LENGTH" means to add the length of the array at
            `path` in the previous request’s response to

            the previous request’s offset value. "PLUS_ONE" means to simply add
            one to the previous request’s offset

            value.
          examples:
            - LENGTH
          enum:
            - IDENTITY
            - LENGTH
            - PLUS_ONE
        path:
          type: array
          items:
            type: string
          description: >-
            JSON property name(s) that must be accessed, starting from the top
            level of the HTTP response, to reach the

            value or array needed to calculate the next offset value. Required
            if `operator` is "IDENTITY" or "LENGTH";

            absent otherwise.
          examples:
            - - items
    OffsetBasedPagination:
      type: object
      required:
        - type
        - itemsArrayField
        - parameterName
        - offsetIncrementExpression
      properties:
        type:
          type: string
          const: OFFSET
        itemsArrayField:
          type: array
          items:
            type: string
          description: >-
            JSON property name(s) that must be accessed, starting from the top
            level of the HTTP response, to reach the

            paginated data array.
          examples:
            - - items
        parameterName:
          type: string
          description: >-
            The name of the URL query parameter to populate with the offset
            value that increases with each

            request.
          examples:
            - skip
        offsetIncrementExpression:
          $ref: '#/components/schemas/OffsetIncrementExpression'
          description: >-
            What to add to the previous request’s offset value to get the next
            request’s offset value. The first

            request’s offset value is always zero.
          examples:
            - operator: LENGTH
              path:
                - items
        maxPages:
          type: integer
          format: int32
          description: Maximum number of pages to collect. Defaults to 1000.
          examples:
            - 100
    UrlCursorBasedPagination:
      type: object
      required:
        - type
        - itemsArrayField
        - urlField
      properties:
        type:
          type: string
          const: URL_CURSOR
        itemsArrayField:
          type: array
          items:
            type: string
          description: >-
            JSON property name(s) that must be accessed, starting from the top
            level of the HTTP response, to reach the

            paginated data array.
          examples:
            - - items
        urlField:
          type: array
          items:
            type: string
          description: >-
            JSON property name(s) that must be accessed, starting from the top
            level of the HTTP response, to reach the

            next page’s URL.
          examples:
            - - pagingInfo
              - nextPageUrl
        maxPages:
          type: integer
          format: int32
          description: Maximum number of pages to collect. Defaults to 1000.
          examples:
            - 100
    ParameterCursorBasedPagination:
      type: object
      required:
        - type
        - itemsArrayField
        - parameterName
        - parameterField
      properties:
        type:
          type: string
          const: PARAMETER_CURSOR
        itemsArrayField:
          type: array
          items:
            type: string
          description: >-
            JSON property name(s) that must be accessed, starting from the top
            level of the HTTP response, to reach the

            paginated data array.
          examples:
            - - items
        parameterName:
          type: string
          description: >-
            The name of the URL query parameter to populate with the cursor
            value from the previous

            response.
          examples:
            - pagingCursor
        parameterField:
          type: array
          items:
            type: string
          description: >-
            JSON property name(s) that must be accessed, starting from the top
            level of the HTTP response, to reach the

            next page’s cursor value.
          examples:
            - - pagingInfo
              - nextPageCursor
        maxPages:
          type: integer
          format: int32
          description: Maximum number of pages to collect. Defaults to 1000.
          examples:
            - 100
    PaginationModel:
      type: object
      required:
        - type
        - itemsArrayField
      properties:
        type:
          type: string
          enum:
            - OFFSET
            - URL_CURSOR
            - PARAMETER_CURSOR
        itemsArrayField:
          type: array
          items:
            type: string
          description: >-
            JSON property name(s) that must be accessed, starting from the top
            level of the HTTP response, to reach the

            paginated data array.
          examples:
            - - items
        maxPages:
          type: integer
          format: int32
          description: Maximum number of pages to collect. Defaults to 1000.
          examples:
            - 100
      oneOf:
        - $ref: '#/components/schemas/OffsetBasedPagination'
        - $ref: '#/components/schemas/UrlCursorBasedPagination'
        - $ref: '#/components/schemas/ParameterCursorBasedPagination'
      discriminator:
        propertyName: type
        mapping:
          OFFSET: '#/components/schemas/OffsetBasedPagination'
          URL_CURSOR: '#/components/schemas/UrlCursorBasedPagination'
          PARAMETER_CURSOR: '#/components/schemas/ParameterCursorBasedPagination'
    HttpEndpoint:
      type: object
      required:
        - name
        - path
      properties:
        name:
          type: string
          description: >-
            A concise name for this HTTP endpoint. Used in the name of the
            file(s) the Collector creates to store the

            response(s) it receives. Can contain only letters, digits,
            underscores, hyphens, and dots.
          examples:
            - compute_managers
        path:
          type: string
          description: >-
            The URL path for this HTTP endpoint. Must start with "/". May
            include a query string.
          examples:
            - /api/v1/fabric/compute-managers
        paginationModel:
          $ref: '#/components/schemas/PaginationModel'
          description: >-
            Instructions for fetching this HTTP endpoint’s dataset in parts
            (pages) using a sequence of requests. Can

            only be used if this endpoint’s response format is JSON. Absent if
            this endpoint doesn’t require pagination.
          examples:
            - type: OFFSET
              itemsArrayField:
                - managers
              parameterName: page
              offsetIncrementExpression:
                operator: PLUS_ONE
