          application/json:
            schema:
              type: array
              items: { type: string }
      responses:
        "200":
          description: The commands, split into approved and unapproved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SysCliCommandAssessment'
              # # from source: app/src/main/java/com/forwardnetworks/cv/client/clicommands/CliCommandsService.java (assessCliCommands returns Map.of(approved, unapproved))
              example:
                approved:
                - ^show\s+version$
                unapproved:
                - ^configure\s+terminal$
  /approved-cli-commands?action=update:
    post:
      operationId: updateApprovedCliCommands
      summary: Replace the approved CLI commands with a Forward-signed file
      description: >-
        Requires the MANAGE_ENDPOINT_PROFILES organization permission. The file must be signed by Forward and carry
        this organization's identifier; otherwise 400 ("Signature mismatch" or "Identifier mismatch"). This changes
        which endpoint profiles are collected. Source-only.
      x-forward-stability: unpublished
      tags: [Endpoint Profiles]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: The signed commands file, as Forward issued it.
      responses:
        "200":
          description: The approved commands after the update.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SysApprovedCliCommands'
              # # from source: app/src/main/java/com/forwardnetworks/cv/sources/endpoint/ApprovedCliProfileCommands.java
              example:
                commands:
                - ^show\s+[^|>;]*$
                signedAt: '2026-10-17T12:00:00Z'
                uploadedAt: '2026-10-17T12:05:00Z'
                uploadedById: '4001'
  /collection-settings:
    get:
      operationId: getOrganizationCollectionSettings
      summary: The organization-wide collection settings
      description: >-
        Requires the VIEW_ORG_COLLECTION_SETTINGS organization permission (@Requires(org = VIEW_ORG_COLLECTION_SETTINGS)).
        Only settings that have been set appear; an absent key means Forward's default applies.
      x-forward-stability: unpublished
      tags: [Collection Settings]
      responses:
        "200":
          description: The stored settings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SysOrgCollectionSettings'
              example:
                # from live GET on the hosted ADP account; route subnet list trimmed from 24 to 1
                maxCommandAuthZPerSecond: 650
                maxDeviceAuthNPerSecond: 650
                perDeviceConcurrencyBoost: 1
                deviceCollectionTimeoutMinutes: 480
                snapshotCollectionTimeoutMinutes: 480
                collectionRetries: 2
                ribRouteLimit: 1
                ribRouteSubnets: ["10.0.0.0/8"]
                networkRedactionAlgorithmOverrides:
                  "<network-id>": NONE
    patch:
      operationId: patchOrganizationCollectionSettings
      summary: Change the organization-wide collection settings
      description: >-
        Requires the EDIT_ORG_COLLECTION_SETTINGS organization permission (@Requires(org = EDIT_ORG_COLLECTION_SETTINGS)).
        Presence semantics: a key that is omitted is left alone; a key sent as null is cleared, which resets it to
        Forward's default. The collectionRetries, collectionRetryDelayMillis and collectionMaxRetryDelayMillis keys
        are one stored retry config, merged key by key. disabledCommands, when sent, replaces the whole stored map;
        an empty map clears it. There is no concurrency guard, so two editors can overwrite each other.
      x-forward-stability: unpublished
      tags: [Collection Settings]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SysOrgCollectionSettingsPatch'
      responses:
        "200":
          description: The settings after the change.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SysOrgCollectionSettings'
              # # from source: client-structs/src/main/java/com/forwardnetworks/client/config/OrgCollectionSettings.java (returned by PATCH; field names as in the GET)
              example:
                maxDeviceAuthNPerSecond: 500
                perDeviceSnmpConcurrency: 8
                collectionRetries: 3
                collectionRetryDelayMillis: 5000
                collectionMaxRetryDelayMillis: 60000
                disabledCommands:
                  example_ssh:
                  - command: ^show\s+example$
                    version:
                      start: '1.0'
                      end: '99.0'
  /collectors/{collectorId}/collection-settings:
