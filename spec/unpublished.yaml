# Endpoints the SDK supports that are NOT in Forward's published API description.
#
# These are stable and safe to depend on -- the Forward NetBox and Nautobot
# plugins both use them -- but they are absent from the description Forward
# generates from its server, so their shapes are written out here instead. That
# lets the coverage test hold them to the same standard as published operations,
# and means a change to one is caught by this SDK's tests rather than by a spec
# diff, which would not see it.
#
# Everything here is reached through client.nqe.repo or client.snapshots.unstable.
#
# Each response carries a real schema and an example of what Forward actually
# sends, recorded from live traffic by the integrations that use these
# endpoints. Both earn their place:
#
#   * The schemas are merged into the generated description, so models are
#     generated for these responses exactly as they are for published ones.
#     That replaces hand-written key-reading, which is what produced the bug
#     below, with validation against a declared shape.
#   * The examples are run through the SDK's own parsers by
#     tests/spec/test_unpublished_shapes.py, so a parser and a hand-written
#     fixture cannot quietly agree with each other while both disagree with
#     Forward.
#
# That is how a commit id nested under lastCommit came to be read from a flat
# key Forward never sends, losing the pin on every query resolved by path.
openapi: 3.2.0
info:
  title: "Forward: Unpublished endpoints used by this SDK"
  version: unpublished
servers:
  - url: /api
tags:
  - name: NQE Repository
    description: Reading and writing the NQE query library.
  - name: Snapshot Reachability
    description: Advanced reachability computation as a pollable job.
  - name: Data Files
    description: Files collected alongside a snapshot.
  - name: Forward AI
    description: >-
      A snapshot-grounded assistant that answers questions about a network by
      calling Forward's own tools. Requires the AI_ALLOWED organization
      property, so an organization without it answers 403 to every operation
      here.
paths:
  /nqe/repos/{repository}/commits/{commitId}/queries:
    get:
      operationId: getRepositoryQueries
      summary: List queries in a repository at a commit
      x-forward-stability: unpublished
      tags: [NQE Repository]
      parameters:
        - name: repository
          in: path
          required: true
          schema: { type: string, enum: [org, fwd] }
        - name: commitId
          in: path
          required: true
          description: A full commit hash, or "head" for the latest.
          schema: { type: string }
        - name: path
          in: query
          description: Restrict to one query path.
          schema: { type: string }
        - name: with
          in: query
          description: Set to "sourceCode" to include each query's source.
          schema: { type: string }
      responses:
        "200":
          description: The queries.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RepositoryQueryPage" }
              example:
                queries:
                  - queryId: FQ_ac651cb2901b067fe7dbfb511613ab44776d8029
                    path: /NetBox/Devices
                    intent: List devices
                    # Forward nests the commit. There is no flat lastCommitId.
                    lastCommit:
                      id: 84f84b0c0a0a1805ddff0ca5451c2c55c58605e5

  /nqe/repos/org/commits/head:
    get:
      operationId: getOrgHeadCommit
      summary: Get the organization repository's current commit
      x-forward-stability: unpublished
      tags: [NQE Repository]
      responses:
        "200":
          description: The head commit.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RepositoryCommit" }
              example:
                id: 84f84b0c0a0a1805ddff0ca5451c2c55c58605e5

  /nqe/queries/{queryId}/history:
    get:
      operationId: getQueryHistory
      summary: List the commits that touched a query
      x-forward-stability: unpublished
      tags: [NQE Repository]
      parameters:
        - name: queryId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The commit history.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RepositoryCommitHistory" }
              example:
                commits:
                  - id: 84f84b0c0a0a1805ddff0ca5451c2c55c58605e5
                    message: Update device query

  /users/current/nqe/changes:
    get:
      operationId: getDraftChanges
      summary: List the current user's uncommitted query changes
      x-forward-stability: unpublished
      tags: [NQE Repository]
      responses:
        "200":
          description: The pending changes.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DraftChangePage" }
              example:
                changes:
                  - path: /NetBox/Devices
                    action: editQuery
    post:
      operationId: addDraftChange
      summary: Stage a query addition, edit, or new directory
      x-forward-stability: unpublished
      tags: [NQE Repository]
      parameters:
        - name: action
          in: query
          required: true
          schema: { type: string, enum: [addQuery, editQuery, addDir] }
        - name: path
          in: query
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                sourceCode: { type: string }
                basis:
                  type: object
                  description: The query and commit an edit is based on.
                  properties:
                    queryId: { type: string }
                    commitId: { type: string }
      responses:
        "200": { description: The change was staged. }
    delete:
      operationId: discardDraftChange
      summary: Discard one staged change
      x-forward-stability: unpublished
      tags: [NQE Repository]
      parameters:
        - name: path
          in: query
          required: true
          schema: { type: string }
      responses:
        "200": { description: The change was discarded. }

  /nqe/repos/org/commits:
    post:
      operationId: commitDraftChanges
      summary: Commit staged query changes
      x-forward-stability: unpublished
      tags: [NQE Repository]
      parameters:
        - name: dryRun
          in: query
          description: Validate without committing.
          schema: { type: boolean }
        - name: snapshotId
          in: query
          description: Snapshot to validate the queries against during a dry run.
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                paths:
                  type: array
                  items: { type: string }
                accessSettings:
                  type: array
                  items: { type: object }
                message:
                  type: object
                  properties:
                    title: { type: string }
                    body: { type: string }
      responses:
        "200":
          description: The commit result, or the dry-run report.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommitResult" }
              example:
                newErrors: []
                uses: []
                unauthorizedQueryChanges: []
                unauthorizedAccessSettingChanges: []

  /users/current:
    get:
      operationId: getCurrentUser
      summary: Get the authenticated user
      description: >-
        Returns the calling user, including the roles it holds. `roles.org`
        applies across the organization; `roles.network` maps a network id to
        the role held on that network. Integrations use these to decide whether
        a login may write to the shared NQE query library before attempting it.
      x-forward-stability: unpublished
      tags: [User Accounts]
      responses:
        "200":
          description: The authenticated user.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CurrentUser" }
              example:
                id: "1234"
                username: mary
                roles:
                  # Applies across the organization.
                  org: [ADMIN]
                  # Keyed by network id, for roles held on one network.
                  network:
                    "101": OPERATOR

  /networks/{networkId}/data-files:
    get:
      operationId: getDataFiles
      summary: List the data files collected for a network
      x-forward-stability: unpublished
      tags: [Data Files]
      parameters:
        - name: networkId
          in: path
          required: true
          schema: { type: string }
        - name: view
          in: query
          description: Set to "snapshot" to list the files of one snapshot.
          schema: { type: string }
        - name: snapshotId
          in: query
          schema: { type: string }
      responses:
        "200":
          description: >-
            The data files. Observed both as a bare list and wrapped under
            dataFiles, items or results, with names and hashes under several
            key spellings, so consumers normalize this themselves.
          content:
            application/json:
              example:
                dataFiles:
                  - dataFileName: netbox_device_type_aliases.json
                    contentMd5Hex: 9f86d081884c7d659a2feaa0c55ad015

  /ai-chats:
    get:
      operationId: getAiChats
      summary: List the calling user's chats
      x-forward-stability: unpublished
      tags: [Forward AI]
      responses:
        "200":
          description: The chats.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AiChatPage" }
              example:
                chats:
                  - id: "42"
                    networkId: "101"
                    snapshotId: "12345"
                    name: Why can nyc-fw01 not reach the database subnet?
                    status: DONE
                    createdAt: "2026-09-07T09:00:00.000Z"
                    updatedAt: "2026-09-07T09:00:31.000Z"
    post:
      operationId: startAiChat
      summary: Start a chat
      description: >-
        Creates a chat and asks its first question. The answer is produced
        asynchronously: the chat comes back with status PROCESSING and the
        message appears once it is DONE.
      x-forward-stability: unpublished
      tags: [Forward AI]
      parameters:
        - name: networkId
          in: query
          required: true
          schema: { type: string }
        - name: snapshotId
          in: query
          description: Defaults to the network's latest processed snapshot.
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NewAiMessage" }
      responses:
        "201":
          description: The new chat. The Location header names it too.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AiChat" }
              example:
                id: "42"
                networkId: "101"
                snapshotId: "12345"
                status: PROCESSING
                createdAt: "2026-09-07T09:00:00.000Z"
                updatedAt: "2026-09-07T09:00:00.000Z"

  /ai-chats/{chatId}:
    get:
      operationId: getAiChat
      summary: Get one chat
      x-forward-stability: unpublished
      tags: [Forward AI]
      parameters:
        - name: chatId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The chat.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AiChat" }
              example:
                id: "42"
                networkId: "101"
                snapshotId: "12345"
                name: Why can nyc-fw01 not reach the database subnet?
                status: DONE
                createdAt: "2026-09-07T09:00:00.000Z"
                updatedAt: "2026-09-07T09:00:31.000Z"
    patch:
      operationId: updateAiChat
      summary: Rename a chat
      x-forward-stability: unpublished
      tags: [Forward AI]
      parameters:
        - name: chatId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
      responses:
        "200":
          description: The updated chat.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AiChat" }
              example:
                id: "42"
                networkId: "101"
                snapshotId: "12345"
                name: Renamed
                status: DONE
                createdAt: "2026-09-07T09:00:00.000Z"
                updatedAt: "2026-09-07T09:05:00.000Z"
    delete:
      operationId: deleteAiChat
      summary: Delete a chat
      x-forward-stability: unpublished
      tags: [Forward AI]
      parameters:
        - name: chatId
          in: path
          required: true
          schema: { type: string }
      responses:
        "204": { description: Deleted. }

  /ai-chats/{chatId}/messages:
    get:
      operationId: getAiChatMessages
      summary: List a chat's messages
      x-forward-stability: unpublished
      tags: [Forward AI]
      parameters:
        - name: chatId
          in: path
          required: true
          schema: { type: string }
        - name: since
          in: query
          description: Only messages updated after this instant.
          schema: { type: string }
      responses:
        "200":
          description: The messages.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AiMessagePage" }
              example:
                messages:
                  - id: "7"
                    prompt: Why can nyc-fw01 not reach the database subnet?
                    toolCalls:
                      - type: GET_PATHS
                    answer:
                      summary: >-
                        Traffic is dropped by ACL inbound-filter on nyc-fw01.
                      keyInsights:
                        - The ACL denies 10.2.0.0/16 on ingress.
                    createdAt: "2026-09-07T09:00:00.000Z"
                    updatedAt: "2026-09-07T09:00:31.000Z"
    post:
      operationId: addAiChatMessage
      summary: Ask a follow-up question in an existing chat
      description: >-
        Accepted immediately and answered asynchronously; poll the chat's status
        or its messages for the answer.
      x-forward-stability: unpublished
      tags: [Forward AI]
      parameters:
        - name: chatId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NewAiMessage" }
      responses:
        "202": { description: The question was accepted. }

  /ai-chats/{chatId}/transcript:
    get:
      operationId: getAiChatTranscript
      summary: Export a chat as a transcript
      x-forward-stability: unpublished
      tags: [Forward AI]
      parameters:
        - name: chatId
          in: path
          required: true
          schema: { type: string }
        - name: format
          in: query
          schema:
            type: string
            enum: [MARKDOWN, HTML, JSON]
            default: MARKDOWN
      responses:
        "200":
          description: The rendered transcript.
          content:
            text/markdown:
              schema: { type: string }

  /networks/{networkId}/snapshots/{snapshotId}/reachability:
    post:
      operationId: startReachabilityJob
      summary: Start computing advanced reachability
      x-forward-stability: unpublished
      tags: [Snapshot Reachability]
      parameters:
        - name: networkId
          in: path
          required: true
          schema: { type: string }
        - name: snapshotId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The job identifier and its initial status.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReachabilityJob" }
              example:
                jobKey: job-8f2c
                status: RUNNING

  /networks/{networkId}/snapshots/{snapshotId}/reachability/{jobKey}:
    get:
      operationId: getReachabilityJob
      summary: Poll a reachability computation
      x-forward-stability: unpublished
      tags: [Snapshot Reachability]
      parameters:
        - name: networkId
          in: path
          required: true
          schema: { type: string }
        - name: snapshotId
          in: path
          required: true
          schema: { type: string }
        - name: jobKey
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The job's status.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReachabilityJob" }
              example:
                status: COMPLETED

components:
  schemas:
    RepositoryCommit:
      type: object
      description: A commit in the NQE query library.
      properties:
        id:
          type: string
          description: The full 40-character hash.
        message:
          type: string
        author:
          type: string
        createdAt:
          type: string

    RepositoryCommitHistory:
      type: object
      properties:
        commits:
          type: array
          items: { $ref: "#/components/schemas/RepositoryCommit" }

    RepositoryQuery:
      type: object
      description: >-
        A query in the library. Note that the commit is nested under
        `lastCommit`; Forward does not send a flat `lastCommitId`. Reading the
        flat key loses the pin on every query resolved by path, which runs the
        query against whatever is at head without anything failing.
      properties:
        queryId:
          type: string
          examples: ["FQ_ac651cb2901b067fe7dbfb511613ab44776d8029"]
        path:
          type: string
          examples: ["/NetBox/Devices"]
        intent:
          type: string
        repository:
          type: string
          enum: [org, fwd, ORG, FWD]
        lastCommit:
          $ref: "#/components/schemas/RepositoryCommit"
        sourceCode:
          type: string
          description: Present only when the query was fetched with `with=sourceCode`.

    RepositoryQueryPage:
      type: object
      properties:
        queries:
          type: array
          items: { $ref: "#/components/schemas/RepositoryQuery" }

    DraftChange:
      type: object
      description: One staged, uncommitted change to the library.
      properties:
        path:
          type: string
        action:
          type: string
          enum: [addQuery, editQuery, addDir]

    DraftChangePage:
      type: object
      properties:
        changes:
          type: array
          items: { $ref: "#/components/schemas/DraftChange" }

    CommitResult:
      type: object
      description: The outcome of a commit, or the report from a dry run.
      properties:
        newErrors:
          type: array
          description: Errors the change would introduce. Non-empty means do not commit.
          items: { type: object, additionalProperties: true }
        uses:
          type: array
          description: Existing queries that depend on the ones being changed.
          items: { type: object, additionalProperties: true }
        unauthorizedQueryChanges:
          type: array
          items: { type: object, additionalProperties: true }
        unauthorizedAccessSettingChanges:
          type: array
          items: { type: object, additionalProperties: true }

    ReachabilityJob:
      type: object
      description: >-
        A reachability computation. The identifier has been observed under
        three names, so all three are declared.
      properties:
        jobKey:
          type: string
        executionKey:
          type: string
        id:
          type: string
        status:
          type: string
          examples: ["COMPLETED"]

    CurrentUserRoles:
      type: object
      description: >-
        The roles the calling user holds. `org` applies across the
        organization; `network` maps a network id to the role held on it.
        Integrations read both to decide whether a login may write to the
        shared query library.
      properties:
        org:
          description: >-
            Usually a list, but observed as a bare string, so consumers coerce.
          oneOf:
            - type: array
              items: { type: string }
            - type: string
        network:
          type: object
          additionalProperties: { type: string }

    NewAiMessage:
      type: object
      required: [prompt]
      properties:
        prompt:
          type: string
          description: The question to ask.

    AiChat:
      type: object
      description: One conversation, grounded in a single snapshot.
      properties:
        id: { type: string }
        networkId: { type: string }
        snapshotId: { type: string }
        name:
          type: string
          description: Absent until Forward has titled the chat.
        status:
          type: string
          enum: [PROCESSING, DONE]
        createdAt: { type: string }
        updatedAt: { type: string }

    AiChatPage:
      type: object
      properties:
        chats:
          type: array
          items: { $ref: "#/components/schemas/AiChat" }

    AiToolCall:
      type: object
      description: A tool Forward used while answering, such as an NQE query.
      properties:
        type: { type: string }

    AiMessageAnswer:
      type: object
      description: >-
        The answer to one question. Absent while the chat is PROCESSING.
        Deployments before 26.6 sent `finalAnswer` and `outOfScopeReason`
        instead, so consumers should read both.
      properties:
        summary: { type: string }
        outOfScope:
          type: boolean
          description: The question was outside what Forward AI can answer.
        keyInsights:
          type: array
          items: { type: string }

    AiMessage:
      type: object
      properties:
        id: { type: string }
        prompt: { type: string }
        toolCalls:
          type: array
          items: { $ref: "#/components/schemas/AiToolCall" }
        tasks:
          type: array
          items: { type: object, additionalProperties: true }
        answer: { $ref: "#/components/schemas/AiMessageAnswer" }
        finalAnswer:
          type: string
          description: Pre-26.6 form of the answer summary.
        outOfScopeReason:
          type: string
          description: Pre-26.6 form of an out-of-scope answer.
        createdAt: { type: string }
        updatedAt: { type: string }

    AiMessagePage:
      type: object
      properties:
        messages:
          type: array
          items: { $ref: "#/components/schemas/AiMessage" }

    CurrentUser:
      type: object
      properties:
        id:
          type: string
        username:
          type: string
        email:
          type: string
        roles:
          $ref: "#/components/schemas/CurrentUserRoles"
