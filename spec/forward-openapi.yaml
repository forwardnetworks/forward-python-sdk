    CliNetworkEndpoint:
      allOf:
        - type: object
          required:
            - type
            - name
            - host
          properties:
            type:
              type: string
              const: CLI
            name:
              type: string
              description: >-
                A name that’s unique (ignoring case) among all of the network’s
                collection source names. May consist of

                letters, digits, dots, hyphens, and underscores.
              examples:
                - my-endpoint
            host:
              type: string
              description: IP address or hostname used to connect to the device.
              examples:
                - 10.121.7.13
            port:
              type: integer
              format: int32
              minimum: 1
              maximum: 65535
              description: >-
                Port used to connect to the device. The default value depends on
                the collection protocol: 22 for SSH, 443

                for HTTPS, etc.
              examples:
                - 22
            protocol:
              type: string
              description: The collection protocol to use. Defaults to SSH.
              examples:
                - SSH
              enum:
                - SSH
                - TELNET
            profileId:
              type: string
              description: >-
                ID of the endpoint profile to use. Auto-detected during
                connectivity testing if unspecified.
              examples:
                - CLI-7
            credentialId:
              type: string
              description: >-
                The `id` of a CliCredential of type `LOGIN`. Credential
                auto-association will be attempted using credentials

                configured to allow it if this property is unspecified and
                collecting from this endpoint requires this kind

                of credential.
              examples:
                - L-3
            jumpServerId:
              type: string
              description: >-
                The `id` of the JumpServer that should be used to collect from
                this device.
              examples:
                - J-0
            fullCollectionLog:
              type: boolean
              description: >-
                Enables more detailed logging during collection. Defaults to
                false.
              examples:
                - false
            largeRtt:
              type: boolean
              description: >-
                Whether the device has a large round-trip time (requires a
                longer response timeout).
              examples:
                - false
            collect:
              type: boolean
              description: Whether to collect from this network endpoint. Defaults to true.
              examples:
                - true
            note:
              type: string
              description: An optional description or note about this network endpoint.
              examples:
                - Yada yada yada
        - $ref: '#/components/schemas/Attribution'
