        id:
          type: string
        name:
          type: string
        description:
          type: string
        score:
          type: number
          nullable: true
          description: Overall score between 0 and 1; null unless status is PROCESSED.
        status:
          type: string
          enum: [UNLICENSED, REQUIRES_ADDITIONAL_SNAPSHOT_PROCESSING, PROCESSING, PROCESSED]
        systemManaged:
          type: boolean
        categories:
          type: array
          items:
            $ref: '#/components/schemas/ScorecardKpiCategoryScore'
      description: A scorecard scored on one snapshot (SnapshotScorecard.java).
    ScorecardDefinition:
      type: object
      required: [id, name, categoryWeights, systemManaged]
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        categoryWeights:
          type: object
          additionalProperties:
            type: integer
          description: KPI category id to weight.
        systemManaged:
          type: boolean
      description: A scorecard definition (Scorecard.java).
    ScorecardTrendPoint:
      type: object
      required: [snapshotId, instant]
      properties:
        snapshotId:
          type: string
        instant:
          type: integer
          format: int64
          description: The snapshot's time, epoch milliseconds.
        score:
          type: number
          nullable: true
          description: Null when Forward could not compute a score for that snapshot.
      description: One point in a scorecard's trend (ScorecardPoint.java).
    ScorecardKpiCheck:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        note:
          type: string
        type:
          type: string
          description: The check type, such as NQE.
        enabled:
          type: boolean
        weight:
          type: integer
        goal:
          type: number
      description: A check inside a KPI category.
    ScorecardKpiCategory:
      type: object
      required: [id, name, checks, systemManaged]
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        systemManaged:
          type: boolean
        checks:
          type: array
          items:
            $ref: '#/components/schemas/ScorecardKpiCheck'
      description: A KPI category (KpiCategory.java).
    ScorecardKpiCheckDefinition:
      type: object
      properties:
        id:
          type: string
        weight:
          type: integer
        goal:
          type: number
      description: A check definition inside a KPI category definition.
    ScorecardKpiCategoryDefinition:
      type: object
      required: [id, name, checks, systemManaged]
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        systemManaged:
          type: boolean
        checks:
          type: array
          items:
            $ref: '#/components/schemas/ScorecardKpiCheckDefinition'
      description: A KPI category definition (KpiCategoryDef.java).
    VulnDeviceCounts:
      allOf:
      - $ref: '#/components/schemas/InventoryDeviceInfo'
      - type: object
        properties:
          locationId:
            type: string
          resultToCveCount:
            type: object
            additionalProperties:
              type: integer
            description: CVE count per detection result. A result with no CVEs is absent.
          severityToCveCount:
            type: object
            additionalProperties:
              type: integer
            description: CVE count per severity; keys NONE, LOW, MEDIUM, HIGH, CRITICAL.
          ageToCveCount:
            type: object
            additionalProperties:
              type: integer
            description: 'CVE count per age bucket: MONTH, YEAR, OLDER.'
          hasExploitToCveCount:
            type: object
            additionalProperties:
              type: integer
            description: Keys "true" and "false".
          internetAddressable:
            type: boolean
            nullable: true
            description: Omitted when Forward has not computed internet exposure for the snapshot, which is not the same as false.
          customLabelCounts:
            type: array
            items:
              $ref: '#/components/schemas/VulnCustomLabelCount'
          customStatusCounts:
            type: array
            items:
              $ref: '#/components/schemas/VulnCustomStatusCount'
          summary:
            type: string
            enum: [VULNERABLE, POTENTIALLY_VULNERABLE, NOT_VULNERABLE]
        required: [resultToCveCount, summary]
      description: A device with its CVE counts (DeviceWithCveCounts.java). It is InventoryDeviceInfo plus the fields listed. The custom lists are present only when the org has custom CVE analysis.
    VulnCustomLabelCount:
      type: object
      required: [label, deviceCount]
      properties:
        label:
          type: string
        deviceCount:
          type: integer
          description: 'Named deviceCount in Forward, but the count is of CVEs on this route (source: CveOsInfoWithDeviceCounts.CustomLabelDeviceCount).'
    VulnCustomStatusCount:
      type: object
      required: [status, deviceCount]
      properties:
        status:
          $ref: '#/components/schemas/CustomCveStatus'
        deviceCount:
          type: integer
          description: Named deviceCount in Forward, but the count is of CVEs on this route.
    VulnDeviceList:
      type: object
      required: [devices, totalDevices]
      properties:
        devices:
          type: array
          items:
            $ref: '#/components/schemas/VulnDeviceCounts'
        totalDevices:
          type: integer
          description: All devices analysed for CVEs, across every CVE; filters do not change it.
        indexCreatedAt:
          type: string
          format: date-time
          description: When the CVE index behind this result was built.
      description: DeviceVulnerabilities.java.
    CloudObjectPage:
      type: object
      required: [cloudObjects, totalCloudObjects]
      properties:
        cloudObjects:
          type: array
          items:
            $ref: '#/components/schemas/CloudObjectMetadata'
        totalCloudObjects:
          type: integer
          description: All objects in the snapshot, not only this page.
      description: A page of cloud objects (CloudObjects.java).
    CloudObjectInfo:
      type: object
      required: [id]
      properties:
        cloudType:
          type: string
          description: The provider, such as AWS.
        type:
          type: string
        id:
          type: string
        name:
          type: string
          description: The object's name, omitted when Forward has none (CloudObjectInfo.java).
        vendor:
          type: string
          description: Observed on the live server; not a field of CloudObjectInfo.java at the checked-out source.
        coveredTopo:
          type: object
          properties:
            nodes:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: string
            links:
              type: array
              items:
                type: object
            hosts:
              type: array
              items:
                type: object
        deviceInfo:
          type: object
          description: Present for an object Forward models as a device. Provider-specific; not modelled.
      description: One cloud object with the topology it covers (CloudObjectInfo.java). Fields not listed are not modelled.
    CloudObjectFile:
      type: object
      required: [id, fileName]
      properties:
        id:
          type: string
        fileName:
          type: string
        creationDateMillis:
          type: integer
          format: int64
          description: 0 for the dummy entry.
        size:
          type: integer
          format: int64
          description: Bytes; 0 for the dummy entry.
      description: A stored file behind a cloud object (StoredFile.java).
    SnapshotRetentionPolicy:
      type: object
      required: [enabled, lastWeek, lastMonth, lastQuarter, lastYear, older]
      properties:
        enabled:
          type: boolean
          description: false keeps every snapshot.
        lastWeek:
          type: string
          enum: [ALL]
          description: 0 to 7 days old.
        lastMonth:
          type: string
          enum: [ALL, ONE_PER_DAY, ONE_PER_TWO_DAYS, ONE_PER_WEEK]
          description: 7 to 30 days old.
        lastQuarter:
          type: string
          enum: [ALL, ONE_PER_DAY, ONE_PER_WEEK, ONE_PER_TWO_WEEKS, NONE]
          description: 30 to 90 days old.
        lastYear:
          type: string
          enum: [ONE_PER_DAY, ONE_PER_WEEK, ONE_PER_MONTH, NONE]
          description: 90 to 365 days old.
        older:
          type: string
          enum: [ONE_PER_DAY, ONE_PER_WEEK, ONE_PER_MONTH, ONE_PER_QUARTER, NONE]
          description: Over a year old.
      description: A network's snapshot thinning policy (SnapshotRetentionPolicy.java). The bands' allowed values are the Java constants listed there.
    SnapshotRetentionPreview:
      type: object
      required: [count, deletedSnapshots]
      properties:
        count:
          type: integer
          description: Equals the length of deletedSnapshots.
        deletedSnapshots:
          type: array
          items:
            $ref: '#/components/schemas/SnapshotRetentionSnapshot'
      description: DeletedSnapshots.java.
    SnapshotRetentionSnapshot:
      type: object
      properties:
        id:
          type: string
        networkId:
          type: string
        note:
          type: string
        createdAt:
          type: string
          format: date-time
        processedAt:
          type: string
          format: date-time
        restoredAt:
          type: string
          format: date-time
        oldestCollectionMillis:
          type: integer
          format: int64
        latestCollectionMillis:
          type: integer
          format: int64
        isDraft:
          type: boolean
        collectionTaskId:
          type: string
      description: 'The fields of SnapshotMeta.java this fragment names. Not the whole object: others are omitted, not modelled.'
    SyntheticDeviceQuery:
      type: object
      required: [queryId, path]
      properties:
        queryId:
          type: string
          description: A global NQE query id.
        path:
          type: string
          description: The query's path in the query library.
      description: A saved query usable by a synthetic node (SyntheticDevicesQuery.java).
    SyntheticDeviceQueryCollection:
      type: object
      required: [queries]
      properties:
        queries:
          type: array
          items:
            $ref: '#/components/schemas/SyntheticDeviceQuery'
      description: SyntheticDevicesQueryCollection.java. Empty when the network has no processed snapshot.

    AnalysisSnapshotProgress:
      type: object
      description: How far a snapshot's processing has got, stage by stage (ProcessingStageInfo list).
      properties:
        networkId: { type: string }
        snapshotId: { type: string }
        stages:
          type: array
          items: { $ref: "#/components/schemas/AnalysisSnapshotProgressStage" }
        done:
          type: boolean
          description: True when every stage except ADVANCED_REACHABILITY has finished.

    AnalysisSnapshotProgressStage:
      type: object
      properties:
        stage:
          type: string
          description: Processing stage. Documented values are CREATION, TEXT_SEARCH_INDEX, REACHABILITY and ADVANCED_REACHABILITY; others may appear.
        operationState:
          type: string
          description: "Operation state: NOT_TRIGGERED, QUEUED, COMPUTING, SUCCEEDED, FAILED, CANCELED or TIMED_OUT (source)."
        startedAt:
          type: integer
          format: int64
          description: When the stage started, in epoch milliseconds per the Go SDK. Omitted when not started or when the events were deleted.
        updatedAt:
          type: integer
          format: int64
          description: When the stage last reported, in epoch milliseconds per the Go SDK. Omitted with startedAt.
        numObjects:
          type: integer
          format: int64
          description: Running count of objects the stage has processed. Omitted unless updatedAt is set.

    AnalysisProcessEstimate:
      type: object
      properties:
        stageToDuration:
          type: object
          description: Estimated duration in milliseconds, keyed by ProgressStage name. Only stages with history appear.
          additionalProperties: { type: integer, format: int64 }

    AnalysisSnapshotProcessingQueue:
      type: object
      properties:
        entries:
          type: array
          items: { $ref: "#/components/schemas/AnalysisSnapshotProcessingQueueEntry" }

    AnalysisSnapshotProcessingQueueEntry:
      type: object
      description: One snapshot waiting in the processing queue. No live entry was seen, so the createdAt format is unverified.
      properties:
        snapshotId: { type: string }
        createdAt:
          type: integer
          format: int64
          description: When the request was queued. Wire format is set by the server mapper; the Go SDK reads it as epoch milliseconds. Unverified live.
        isReprocessing: { type: boolean }

    AnalysisCollectionMetrics:
      type: object
      description: Per-device collection metrics for one snapshot. Times are epoch milliseconds (live).
      properties:
        snapshotId: { type: string }
        snapshotTime: { type: integer, format: int64 }
        collectionStartTime: { type: integer, format: int64 }
        collectionEndTime: { type: integer, format: int64 }
        metrics:
          type: array
          items: { $ref: "#/components/schemas/AnalysisDeviceCollectionMetric" }

    AnalysisDeviceCollectionMetric:
      type: object
      description: One device's collection. Fields the source leaves null are omitted.
      properties:
        deviceName: { type: string }
        deviceType:
          type: string
          description: Device type enum name, such as SWITCH, ROUTER, FIREWALL or UNKNOWN (live).
        sourceType:
          type: string
          description: Collection source type, such as CLASSIC or CLOUD. Omitted when unknown.
        connTypeDisplayName: { type: string }
        collectionStartTime:
          type: integer
          format: int64
          description: Epoch milliseconds. Omitted when the device's collection did not start.
        collectionDuration:
          type: integer
          format: int64
          description: Milliseconds. Omitted when collection did not finish properly.
        slowestCommand: { type: string }
        slowestCommandDuration:
          type: integer
          format: int64
          description: Milliseconds.
        jumpServer:
          type: string
          description: Id of the jump server used. Omitted when none.
        error:
          type: string
          description: "Collection or processing error enum name, or NONE. Live: NONE is sent for a device with no error. The Go SDK's empty-when-none reading is not what the server sends."

    AnalysisCollectionExceptions:
      type: object
      properties:
        actualNumDedupedExceptions:
          type: integer
          format: int32
          description: Total distinct exceptions, which may exceed the page returned.
        collectorIdToName:
          type: object
          additionalProperties: { type: string }
        dedupedExceptions:
          type: array
          items: { $ref: "#/components/schemas/AnalysisDedupedCollectionException" }

    AnalysisDedupedCollectionException:
      type: object
      properties:
        stackTrace: { type: string }
        collectorVersion: { type: string }
        actualNumOccurrences:
          type: integer
          format: int32
          description: Total occurrences of this exception, which may exceed the page of occurrences returned.
        occurrences:
          type: array
          items: { $ref: "#/components/schemas/AnalysisCollectionExceptionOccurrence" }

    AnalysisCollectionExceptionOccurrence:
      type: object
      properties:
        collectorId: { type: string }
        deviceName:
          type: string
          description: Omitted when the exception was not tied to a device.
        collectorTaskId: { type: string }
        timestamp:
          type: string
          format: date-time
          description: ISO-8601 instant, as sent live.

    AnalysisSnapshotUpdate:
      type: object
      required: [note]
      properties:
        note:
          type: string
          description: The new note. Required; an empty string clears the note.

    AnalysisNqeRunMetric:
      type: object
      description: One NQE query run. queryId and commitId appear only for runs of a committed query.
      properties:
        taskId: { type: string }
        networkId: { type: string }
        networkName: { type: string }
        snapshotId: { type: string }
        snapshotCreationInstant:
          type: integer
          format: int64
          description: Epoch milliseconds when the snapshot was created (live).
        executedAt:
          type: integer
          format: int64
          description: Epoch milliseconds when the run executed (live).
        runDuration:
          type: integer
          format: int64
          description: Run time in milliseconds (live; the value matches the minExecutionSeconds scale).
        sourceSetId: { type: string }
        queryId: { type: string }
        commitId: { type: string }
        trackingId: { type: string }

    AnalysisNqeInlinedType:
      type: object
      description: >-
        One node of the NQE data model with member types written out inline. The
        kind is in type: Record, Bag, List, OneOf or Reference, or a primitive name
        such as String, Integer, Bool, IpAddress, Timestamp or Date (live). Records
        carry fields, collections carry itemType and keyFields, OneOf carries
        alternatives. Recursive.
      properties:
        type: { type: string }
        name: { type: string }
        keyFields:
          type: array
          items: { type: string }
        itemType: { $ref: "#/components/schemas/AnalysisNqeInlinedType" }
        fields:
          type: array
          items: { $ref: "#/components/schemas/AnalysisNqeInlinedField" }
        alternatives:
          type: array
          items: { $ref: "#/components/schemas/AnalysisNqeInlinedAlternative" }
        docString: { type: string }
        deprecated:
          type: string
          description: Present when the type is deprecated.
        restricted:
          type: boolean
          description: True when the caller's licence does not include this part of the model.

    AnalysisNqeInlinedField:
      type: object
      properties:
        name: { type: string }
        index: { type: integer, format: int32 }
        path:
          type: string
          description: Schema path of the field, such as /network/devices/name (live).
        type: { $ref: "#/components/schemas/AnalysisNqeInlinedType" }
        isNullable: { type: boolean }
        docString: { type: string }
        deprecated: { type: string }
        preview:
          type: boolean
          description: True for preview fields. Omitted when false.

    AnalysisNqeInlinedAlternative:
      type: object
      properties:
        name: { type: string }
        path: { type: string }
        type: { $ref: "#/components/schemas/AnalysisNqeInlinedType" }
        docString: { type: string }

    AnalysisNqeQuerySource:
      type: object
      required: [sourceCode]
      properties:
        sourceCode: { type: string }
        sourceCodeSha:
          type: string
          description: SHA-1 of sourceCode, 40 hex characters (live). The Go SDK does not map this field.
        intent:
          type: string
          description: From the doc comment. Omitted when there is none.
        description:
          type: string
          description: From the doc comment. Omitted when there is none.

    AnalysisNqeQueryAssistRequest:
      type: object
      required: [prompt]
      properties:
        prompt: { type: string }

    AnalysisNqeQueryAssist:
      type: object
      properties:
        id:
          type: string
          description: Decimal id of the generated query assist.
        query: { type: string }
        validQuery: { type: boolean }

    AnalysisNqeSummaryAssistRequest:
      type: object
      required: [query]
      properties:
        query: { type: string }

    AnalysisNqeSummaryAssist:
      type: object
      properties:
        id:
          type: string
          description: Decimal id of the summary.
        summary: { type: string }

    AnalysisNqeChatMessage:
      type: object
      required: [role, content]
      properties:
        role:
          type: string
          enum: [user, assistant]
        content: { type: string }

    AnalysisNqeDocAssistRequest:
      type: object
      required: [question]
      properties:
        question:
          type: string
          description: Must not be blank.
        previousMessages:
          type: array
          description: Prior turns, oldest first. Omitted when empty.
          items: { $ref: "#/components/schemas/AnalysisNqeChatMessage" }

    AnalysisNqeDocReference:
      type: object
      properties:
        name: { type: string }
        path: { type: string }

    AnalysisNqeDocAssist:
      type: object
      properties:
        id:
          type: string
          description: Decimal id of the answer. Used by the followup operation.
        answer: { type: string }
        references:
          type: array
          items: { $ref: "#/components/schemas/AnalysisNqeDocReference" }

    AnalysisNqeDocAssistFollowupRequest:
      type: object
      required: [answer]
      properties:
        answer:
          type: string
          description: The answer to suggest follow-up questions for.

    AnalysisNqeDocAssistFollowup:
      type: object
      properties:
        followupQuestions:
          type: array
          items: { type: string }

    SysAppBackup:
      type: object
      description: One stored backup. Source-only (not live-verified). Size is in bytes.
      required: [id, storageType, triggerType, appVersion, snapshotsIncluded, size]
      properties:
        id: { type: integer, format: int64 }
        backupTimeMillis: { type: integer, format: int64, description: "When the backup was taken, as epoch milliseconds." }
        storageType: { type: string, enum: [INTERNAL, S3] }
        triggerType: { type: string, enum: [MANUAL, SCHEDULED] }
        appVersion: { type: string, description: The Forward version that wrote the backup. }
        snapshotsIncluded: { type: boolean }
        size: { type: integer, format: int64 }
        note: { type: string, description: A note given when the backup was taken. Absent when none. }
    SysClusterOperation:
      type: object
      description: >-
        A cluster backup or restore that is running or has just finished. Source-only. Java enum BACKUP/RESTORE; the wire
        value is the constant name unless Forward's mapper is configured otherwise (not checked). The Go SDK comment
        says lower-case, which disagrees with the Java enum.
      properties:
        id:
          type: string
          description: The operation id, a timestamp in seconds.
        type:
          type: string
          enum: [BACKUP, RESTORE]
        appStatus:
          $ref: '#/components/schemas/SysCbrOperationStatus'
        snapshotToStatus:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/SysCbrOperationStatus'
          description: The state of each snapshot involved, keyed by snapshot id.
    SysClusterOperationResult:
      type: object
      description: The outcome of a completed cluster operation. Source-only.
      properties:
        id:
          type: string
        appStatus:
          $ref: '#/components/schemas/SysCbrOperationStatus'
        snapshotToStatus:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/SysCbrOperationStatus'
    SysCbrOperationStatus:
      type: string
      description: The state of an application or snapshot part of a cluster operation.
      enum: [NOT_STARTED, IN_PROGRESS, ERROR, DONE, CANCELLED, NETWORK_MISSING]
    SysCommonBackupSettings:
      type: object
      description: The backup schedule and retention for one storage type. Source-only.
      required: [enabled, backupTime, numDaysToRetain, includeSnapshots]
      properties:
        enabled: { type: boolean, description: Whether the scheduled backup runs. }
        backupTime: { type: string, description: 'Time of day, HH:mm.' }
        numDaysToRetain: { type: integer, minimum: 1, description: Days to keep backups. Defaults to 30. }
        includeSnapshots: { type: boolean }
    SysCommonBackupSettingsPatch:
      type: object
      description: >-
        A change to the backup settings. Omitted fields keep their stored value; null also keeps it. Source-only.
      properties:
        enabled: { type: boolean }
        backupTime: { type: string, description: 'Time of day, HH:mm.' }
        numDaysToRetain: { type: integer, minimum: 1 }
        includeSnapshots: { type: boolean }
    SysS3StorageSettings:
      type: object
      description: >-
        S3 settings for backups. The secret key is write-only and is never returned, so it is not listed here. A request
        that sets these settings (the bucket ownership change) must still send secretKey. Source-only.
      required: [accessKey, bucketName, serviceEndpoint]
      properties:
        accessKey: { type: string }
        secretKey: { type: string, writeOnly: true, description: Sent in requests only; never returned by Forward. }
        bucketName: { type: string }
        serviceEndpoint: { type: string }
        disableSslValidation: { type: boolean, description: Mutually exclusive with certificate. }
        certificate: { type: string, description: A PEM certificate to trust for serviceEndpoint. Absent when none. }
        writeOnly: { type: boolean, description: "Reads and writes allowed, deletes not." }
        disableChecksumValidation: { type: boolean }
    SysS3StorageSettingsPatch:
      type: object
      description: >-
        A change to the S3 settings. Omitted fields keep their stored value. For certificate, an explicit null clears
        it; for the other fields, null keeps the stored value. Source-only.
      properties:
        accessKey: { type: string }
        secretKey: { type: string, writeOnly: true }
        bucketName: { type: string }
        serviceEndpoint: { type: string }
        disableSslValidation: { type: boolean }
        certificate: { type: [string, "null"], description: 'Send null to clear the stored certificate.' }
        writeOnly: { type: boolean }
        disableChecksumValidation: { type: boolean }
    SysCustomBanner:
      type: object
      description: A banner shown in the UI for each of some set of networks.
      required: [id, enabled, message, backgroundColor, networkIds]
      properties:
        id: { type: string }
        enabled: { type: boolean }
        message: { type: string, description: Must not be blank. }
        backgroundColor:
          type: string
          description: A banner colour. The observed value is GREEN; the full set is in Forward's Color enum (not listed here).
        networkIds:
          type: array
          minItems: 1
          items: { type: string }
    SysNewCustomBanner:
      type: object
      description: A new banner. The id is assigned by Forward.
      required: [enabled, message, backgroundColor, networkIds]
      properties:
        enabled: { type: boolean }
        message: { type: string }
        backgroundColor: { type: string }
        networkIds:
          type: array
          minItems: 1
          items: { type: string }
    SysCustomBannerList:
      type: object
      required: [banners]
      properties:
        banners:
          type: array
          items:
            $ref: '#/components/schemas/SysCustomBanner'
    SysCriticalStates:
      type: object
      description: >-
        The critical-state flags. Only keys that apply to this deployment are present. License-status states
        (LICENSE_EXPIRED and the like) are not in this map; the UI derives them from the license status.
      properties:
        MAINTENANCE_WINDOW:
          description: The scheduled upgrade window, or null when none is scheduled.
          type: [object, "null"]
          properties:
            start: { type: integer, format: int64, description: Epoch milliseconds. }
            end: { type: integer, format: int64, description: Epoch milliseconds. }
        LOW_STORAGE: { type: boolean }
        NO_STORAGE: { type: boolean }
        NO_BACKUP_STORAGE: { type: boolean }
        LICENSE_CCH_EXHAUSTED: { type: boolean }
        LICENSE_CCH_GRACE_PERIOD_ENDED: { type: boolean }
        COLLECTOR_OUTDATED: { type: boolean }
      additionalProperties: true
    SysSystemAnnouncementResponse:
      type: object
      description: The system announcement, or an empty object when there is none.
      properties:
        announcement:
          $ref: '#/components/schemas/SysSystemAnnouncement'
    SysSystemAnnouncement:
      type: object
      required: [message, createdAt]
      properties:
        message: { type: string }
        linkUrl: { type: string, description: A link to show with the message. Absent when none. }
        createdAt: { type: string, format: date-time }
    SysActiveJobInfo:
      type: object
      description: >-
        One row, or a group of identical rows, of running or queued work. Field names are from the Java record
        ActiveJobInfo; the endpoint itself is ADMINISTER_SYSTEM, so it was not live-verified.
      required: [jobType, orgName, networkId, creationTime, cancelLink, totalCount]
      properties:
        jobType: { type: string }
        orgName: { type: string }
        networkId: { type: integer, format: int64 }
        snapshotId: { type: integer, format: int64, description: Absent for network-level jobs. }
        creationTime:
          description: When the job was created, or the earliest creation time in a group. Serialization is set by Forward's mapper and was not checked.
          type: string
        waitingForOtherJobs: { type: integer, description: "1 when blocked by a stage-dependency job, 0 otherwise. For a group, the count." }
        queued: { type: integer, description: "1 when waiting in the queue. For a group, the count." }
        running: { type: integer, description: "1 when executing. For a group, the count." }
        longestQueuedTimeInSeconds: { type: integer }
        longestRunningTimeInSeconds: { type: integer }
        durationInSeconds: { type: integer }
        totalCount: { type: integer, description: "1, or the number of jobs in the group." }
        cancelLink:
          type: string
          description: Opaque. Pass it to cancelJob unchanged.
    SysCompletedJobInfo:
      type: object
      description: One row, or a group, of finished work. Field names from the Java record CompletedJobInfo; not live-verified.
      properties:
        jobType: { type: string }
        orgName: { type: string }
        networkId: { type: integer, format: int64 }
        snapshotId: { type: integer, format: int64 }
        creationTime: { type: string }
        state: { type: string, enum: [SUCCEEDED, FAILED, CANCELED, TIMED_OUT] }
        earliestStartTime: { type: string }
        latestEndTime: { type: string }
        longestQueueTimeInSeconds: { type: integer }
        longestRunningTimeInSeconds: { type: integer }
        durationInSeconds: { type: integer }
        count: { type: integer }
    SysLicense:
      type: object
      description: A license, as Forward records it. Observed live.
      properties:
        id: { type: string }
        createdAt: { type: string, format: date-time }
        startsAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        licensedTo: { type: string }
        purchaseOrder: { type: string }
        tier:
          type: string
          enum: [B, N, NP, S, NS, NSP]
          description: The license tier. The observed value is NS.
        replaces: { type: boolean }
        standardDeviceCap: { type: integer }
        liteDeviceCap: { type: integer }
        cloudCreditHours: { type: integer, format: int64 }
        edgeAssetCap: { type: integer }
        type: { type: string, description: The observed value is TIER. }
    SysLicenseDetails:
      type: object
      description: >-
        A license and the signed key generated from it, once activated. invalidated is omitted when false. Observed
        live; the Java field list is in LicenseDetails.java.
      properties:
        license:
          $ref: '#/components/schemas/SysLicense'
        invalidated: { type: boolean, description: Present only when true. }
        signedLicenseKey: { type: string, description: "The ASCII signed key, when one exists. Secret-like; do not log." }
        usedAt: { type: string, format: date-time, description: When the license was added to this deployment or activated. }
        fingerprint: { type: string, description: The fingerprint of the instance the key is bound to. }
    SysLicenseDetailsWithStatus:
      allOf:
        - $ref: '#/components/schemas/SysLicenseDetails'
        - type: object
          properties:
            status:
              type: string
              enum: [NOT_ACTIVE_YET, ACTIVE, EXPIRED, REPLACED]
    SysLicenseTierAndStatus:
      type: object
      description: The tier and status. Both are absent for an unlicensed organization.
      properties:
        licenseTier:
          type: string
          enum: [B, N, NP, S, NS, NSP]
        licenseStatus:
          type: string
          enum: [SOFTWARE_CENTRAL, EXEMPT, ACTIVE, NOT_ACTIVE_YET, EXPIRED_RECENTLY, EXPIRED]
    SysAsciiCodedSignedLicenseKey:
      type: object
      required: [signedLicenseKey]
      properties:
        signedLicenseKey:
          type: string
          description: The ASCII-encoded signed license key. Secret-like.
    SysDecodedLicenseKey:
      type: object
      description: A preview of a license key. license and started are absent when the key is invalid.
      required: [status]
      properties:
        status:
          type: string
          enum: [VALID, INVALID_LICENSE, INVALID_SIGNATURE, INVALID_FINGERPRINT, EXPIRED, UNSUPPORTED_TYPE, WRONG_TIER, REPLACEMENT_PENDING, BAD_TRIAL_TIER, BAD_TIER_TRIAL_TIMING, CCH_DEBT_UNPAID, ALREADY_USED]
        license:
          $ref: '#/components/schemas/SysLicense'
        started:
          type: boolean
          description: Whether the license has started by now.
    SysInstanceFingerprint:
      type: object
      required: [instanceId]
      properties:
        instanceId:
          type: string
          description: The fingerprint, encoded.
    SysOrgCollectionSettings:
      type: object
      description: >-
        The organization-wide collection settings. Only settings that have been set are present. Fields not modelled
        here (the rib route and redaction settings) are also returned. Timeouts are in minutes.
      properties:
        maxCommandAuthZPerSecond: { type: integer, minimum: 1, maximum: 1000 }
        maxDeviceAuthNPerSecond: { type: integer, minimum: 1, maximum: 1000 }
        maxScanConnectionsPerSecond: { type: integer, minimum: 1 }
        perDeviceConcurrencyBoost: { type: integer, minimum: 0, description: Extra SSH connections per device for parallel data. }
        perDeviceSnmpConcurrency:
          type: integer
          minimum: 1
          maximum: 100
          description: Concurrent SNMP transactions per device. Forward's default is 4.
        deviceCollectionTimeoutMinutes: { type: integer, minimum: 1 }
        deviceDiscoveryTimeoutMinutes: { type: integer, minimum: 1 }
        generalJobTimeoutMinutes: { type: integer, minimum: 1 }
        snapshotCollectionTimeoutMinutes: { type: integer, minimum: 1 }
        commandDelayMs: { type: integer, minimum: 0, description: Time to wait after each command is sent to a device. }
        collectionRetries: { type: integer, minimum: 0, description: Retries after the first attempt. 0 turns retries off. }
        collectionRetryDelayMillis: { type: integer, minimum: 0, description: The first retry delay. Doubles up to the maximum. }
        collectionMaxRetryDelayMillis: { type: integer, minimum: 0 }
        enableBetaCommands: { type: boolean }
        disableCommandOutputLogging: { type: boolean }
        enableSnmpCredDiscovery: { type: boolean }
        passwordPrompts:
          type: array
          items: { type: string }
          description: Custom password prompts, matched case-insensitively. No empty value and no colon.
        collectFullConfigDeviceTypes:
          type: array
          items: { type: string }
          description: Device types for which the full running configuration is collected.
        disabledCommands:
          type: object
          additionalProperties:
            type: array
            items:
              $ref: '#/components/schemas/SysDisabledCommand'
          description: Built-in collection commands switched off, keyed by device type name.
        ribRouteLimit: { type: integer }
        ribRouteSubnets: { type: array, items: { type: string } }
        ribRouteVrfs: { type: array, items: { type: string } }
        defaultRedactionAlgorithm: { type: string }
        networkRedactionAlgorithmOverrides:
          type: object
          additionalProperties: { type: string }
          description: Redaction algorithm per network id.
      additionalProperties: true
    SysOrgCollectionSettingsPatch:
      type: object
      description: >-
        A partial change to the organization collection settings. Presence semantics: an omitted key is left alone; a
        key sent as null is cleared, which resets it to Forward's default. The three collectionRetries and
        collectionRetryDelayMillis and collectionMaxRetryDelayMillis keys merge into one stored retry config.
        disabledCommands, when sent, replaces the whole stored map; an empty object clears every disabled command.
        Source: OrgCollectionSettingsPatch.java.
      properties:
        maxCommandAuthZPerSecond: { type: [integer, "null"] }
        maxDeviceAuthNPerSecond: { type: [integer, "null"] }
        maxScanConnectionsPerSecond: { type: [integer, "null"] }
        perDeviceConcurrencyBoost: { type: [integer, "null"] }
        perDeviceSnmpConcurrency:
          type: [integer, "null"]
          minimum: 1
          maximum: 100
          description: 1 to 100. Anything else is a 400.
        deviceCollectionTimeoutMinutes: { type: [integer, "null"] }
        deviceDiscoveryTimeoutMinutes: { type: [integer, "null"] }
        generalJobTimeoutMinutes: { type: [integer, "null"] }
        snapshotCollectionTimeoutMinutes: { type: [integer, "null"] }
        commandDelayMs: { type: [integer, "null"] }
        collectionRetries:
          type: [integer, "null"]
          minimum: 0
          description: Retries after the first attempt. 0 turns retries off. Negative is a 400.
        collectionRetryDelayMillis: { type: [integer, "null"], minimum: 0 }
        collectionMaxRetryDelayMillis: { type: [integer, "null"], minimum: 0 }
        enableBetaCommands: { type: [boolean, "null"] }
        disableCommandOutputLogging: { type: [boolean, "null"] }
        enableSnmpCredDiscovery: { type: [boolean, "null"] }
        passwordPrompts: { type: [array, "null"], items: { type: string } }
        collectFullConfigDeviceTypes: { type: [array, "null"], items: { type: string } }
        disabledCommands:
          type: [object, "null"]
          additionalProperties:
            type: array
            items:
              $ref: '#/components/schemas/SysDisabledCommand'
          description: Replaces the whole stored map. Each entry needs a command and both version bounds.
    SysDisabledCommand:
      type: object
      description: One built-in collection command switched off for a range of software versions.
      required: [command, version]
      properties:
        command:
          type: string
          description: A case-insensitive Java regular expression, matched against the command Forward would run.
        version:
          $ref: '#/components/schemas/SysDisabledCommandVersion'
    SysDisabledCommandVersion:
      type: object
      description: The inclusive range of software versions, as release version strings.
      required: [start, end]
      properties:
        start: { type: string }
        end: { type: string }
    SysCollectorCollectionSettings:
      type: object
      description: The collection settings stored for one collector. Zero values are omitted.
      properties:
        concurrency: { type: integer, description: Devices collected at once. }
        snmpCollectionConcurrency: { type: integer }
        vcenterConcurrency: { type: integer }
    SysCollectorCollectionSettingsPatch:
      type: object
      description: A partial change to a collector's settings. An explicit null resets the field to Forward's default.
      properties:
        concurrency: { type: [integer, "null"] }
        snmpCollectionConcurrency: { type: [integer, "null"] }
        vcenterConcurrency: { type: [integer, "null"] }
    SysPerformanceSettings:
      type: object
      description: Whether performance collection runs for a network, and how often. Source-only.
      required: [enabled]
      properties:
        enabled: { type: boolean }
        intervalMinutes: { type: integer, description: Absent when Forward's default applies. }
    SysPerformanceSettingsPatch:
      type: object
      description: >-
        A partial change. An omitted key is left alone. A null enabled is stored as false. Source: PerformanceSettingsPatch.java.
      properties:
        enabled: { type: [boolean, "null"] }
        intervalMinutes: { type: [integer, "null"] }
    SysCollectorMetricsResponse:
      type: object
      required: [metrics]
      properties:
        metrics:
          type: array
          description: The samples, oldest first.
          items:
            $ref: '#/components/schemas/SysCollectorMetricSample'
    SysCollectorMetricSample:
      type: object
      description: >-
        One sample uploaded by a collector. The series are CPU, memory, garbage collection, file descriptors, disk and
        task executor. No network throughput is recorded.
      properties:
        timestamp: { type: string, format: date-time }
        cpuMetrics:
          type: object
          properties:
            cpuLoad: { type: number, description: "The host's recent load as a fraction 0 to 1. Below 0 means not measured yet." }
            cpuCores: { type: integer }
        memoryMetrics:
          type: object
          description: Megabytes.
          properties:
            vmMemTotalMb: { type: integer }
            vmMemFreeMb: { type: integer }
            jvmMemMaxMb: { type: integer }
            jvmMemFreeMb: { type: integer, description: Free space within the heap the JVM has committed so far. }
            procRssMb: { type: integer }
        gcMetrics:
          type: object
          properties:
            gcTimeSeconds: { type: integer, description: A cumulative counter since the collector JVM started. }
            gcLoad: { type: number, description: The fraction of the interval since the previous sample spent in GC. }
        fileMetrics:
          type: object
          properties:
            fileDescriptorsMax: { type: integer }
            fileDescriptorsOpen: { type: integer }
        diskMetrics:
          type: object
          description: Megabytes, for the collector data volume, the OS volume and the temp volume.
          properties:
            collector: { $ref: '#/components/schemas/SysCollectorDiskUsage' }
            os: { $ref: '#/components/schemas/SysCollectorDiskUsage' }
            tmp: { $ref: '#/components/schemas/SysCollectorDiskUsage' }
        taskMetrics:
          type: object
          properties:
            concurrency: { type: integer, description: The executor's configured size. }
            queueSize: { type: integer }
            tasksStarted: { type: integer, description: A running total since the collector process started. }
            tasksFinished: { type: integer }
    SysCollectorDiskUsage:
      type: object
      properties:
        sizeMb: { type: integer }
        availableMb: { type: integer }
    SysCollectorCredentials:
      type: object
      description: >-
        A collector's name and, in a response, its username and new password. The password is shown once and is never
        returned again.
      required: [collectorName]
      properties:
        collectorName: { type: string }
        username: { type: string, description: Returned in the response. Unchanged by a reset. }
        password: { type: string, writeOnly: true, description: Returned in the response only. Secret. }
    SysStoredProxyServer:
      allOf:
        - $ref: '#/components/schemas/SysProxyServerConfig'
        - $ref: '#/components/schemas/Attribution'
    SysProxyServerConfig:
      type: object
      description: An internet proxy used for collection. The password is a secret reference, never the value. Source-only except the fields shown in the example.
      required: [name, host, port, protocol]
      properties:
        id: { type: string }
        name: { type: string }
        host: { type: string }
        port: { type: integer, minimum: 1, maximum: 65535 }
        username: { type: string, description: Absent when none is set. }
        password: { type: string, description: A secret reference when a password is set. Absent otherwise. }
        protocol: { type: string, enum: [http, https] }
        disableCertChecking: { type: boolean }
    SysNewProxyServer:
      type: object
      description: The fields for a new proxy. name, host and port are required by the service, not by the schema.
      properties:
        name: { type: string }
        host: { type: string }
        port: { type: integer, minimum: 1, maximum: 65535 }
        username: { type: string }
        password: { type: string, writeOnly: true }
        protocol: { type: string, enum: [http, https] }
        disableCertChecking: { type: boolean }
    SysProxyServerConfigPatch:
      type: object
      description: >-
        A partial change to a proxy. An omitted key is left alone. An explicit null clears username, password or
        disableCertChecking. host, port and protocol cannot be cleared.
      properties:
        name: { type: string, description: A null or omitted name keeps the stored name. }
        host: { type: string }
        port: { type: integer, minimum: 1, maximum: 65535 }
        username: { type: [string, "null"] }
        password: { type: [string, "null"], writeOnly: true }
        protocol: { type: string, enum: [http, https] }
        disableCertChecking: { type: [boolean, "null"] }
    SysApprovedCliCommands:
      type: object
      description: >-
        The CLI commands endpoint profiles may run. signedAt and the uploaded fields are absent for the system defaults.
      required: [commands]
      properties:
        commands:
          type: array
          items: { type: string, description: A regular expression. }
        signedAt: { type: string, format: date-time }
        uploadedAt: { type: string, format: date-time }
        uploadedById: { type: string, description: The id of the user who uploaded the file. }
    SysCliCommandAssessment:
      type: object
      required: [approved, unapproved]
      properties:
        approved:
          type: array
          items: { type: string }
        unapproved:
          type: array
          items: { type: string }
    SysDeploymentArtifact:
      type: object
      description: >-
        One installer or upgrade artifact, with every version Forward still serves. Source-only (Software Central is
        off on the hosted account).
      required: [id, name, deploymentTypes, workflow, versions]
      properties:
        id: { type: string }
        name: { type: string }
        deploymentTypes:
          type: array
          items:
            type: string
            enum: [VMWARE_HYPERVISOR, AWS_EC2, AWS_GOVCLOUD_EC2, AZURE_VM, AZURE_GOV_VM, GCP_VM, KVM_HYPERVISOR]
        workflow: { type: string, enum: [INSTALLATION, APP_UPGRADE], description: INSTALLATION stands up a new instance. APP_UPGRADE moves an existing one forward. }
        versions:
          type: array
          items:
            $ref: '#/components/schemas/SysDeploymentArtifactVersion'
    SysDeploymentArtifactVersion:
      type: object
      description: One downloadable file. Source-only.
      required: [id, version, fileType, sizeInBytes, uploadedAt]
      properties:
        id: { type: string }
        baseVersion: { type: string }
        minBaseVersion: { type: string }
        maxBaseVersion: { type: string }
        version: { type: string }
        fileType: { type: string, enum: [OVA, TAR_GZ, AIRGAP, PACKAGE] }
        sizeInBytes: { type: integer, format: int64 }
        sha256: { type: string, description: The SHA-256 digest of the file. }
        uploadedBy: { type: string, description: The id of the user who uploaded it. }
        uploadedAt: { type: integer, format: int64, description: Epoch milliseconds. }
    SysRestoreStatus:
      type: object
      description: 'How a snapshot restore is going. Source-only: the fields are the Java RestoreStatus record.'
      required: [status, startMillis]
      properties:
        status:
          $ref: '#/components/schemas/SysCbrOperationStatus'
        startMillis: { type: integer, format: int64, description: "When the restore began, as epoch milliseconds." }
        stage:
          type: string
          enum: [DOWNLOADING, UNPACKING]
          description: Present while the restore runs. Absent before it starts and after it finishes or fails.
        maxProgress: { type: integer, format: int64, description: Present while the restore runs. }
        currentProgress: { type: integer, format: int64, description: Present while the restore runs. }
        errorMessage: { type: string, description: Present only when the restore has failed. }
