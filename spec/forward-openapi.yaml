        obfuscateNames:
          type: boolean
          description: >-
            default: `false`. If specified, `"obfuscationKey"` must also be
            specified.
          examples:
            - false
    SnapshotInfo:
      type: object
      properties:
        createdAt:
          type: string
          examples:
            - '2019-09-20T17:40:34.567Z'
        id:
          type: string
        isDraft:
          type: boolean
          examples:
            - false
        note:
          type: string
        parentSnapshotId:
          type: string
        processedAt:
          type: string
          examples:
            - '2019-09-20T18:17:36.789Z'
        processingTrigger:
          type: string
          enum:
            - UNKNOWN
            - COLLECTION
            - IMPORT
            - REPROCESS
            - FORK
        restoredAt:
          type: string
          examples:
            - '2019-09-20T17:40:34.567Z'
        state:
          $ref: '#/components/schemas/SnapshotState'
        advancedReachabilityState:
          $ref: '#/components/schemas/AdvancedReachabilityState'
          description: State of advanced reachability computation for this Snapshot.
        favoritedBy:
          type: string
          description: >-
            The username of the user who most recently marked this Snapshot as a
            favorite if it's currently a favorite

            and the user account hasn’t been deleted.
          examples:
            - mary
        favoritedByUserId:
          type: string
          description: >-
            The id of the user who most recently marked this Snapshot as a
            favorite if it’s currently a

            favorite.
          examples:
            - '1234'
        favoritedAt:
          type: string
          description: >-
            When this Snapshot was most recently marked as a favorite if it’s
            currently a favorite. A favorite Snapshot

            will never be automatically deleted, regardless of its network’s
            Snapshot retention policy.
          examples:
            - '2019-09-30T19:48:59.481Z'
    SnapshotMetrics:
      type: object
      properties:
        collectionConcurrency:
          type: integer
          format: int32
          examples:
            - 16
        collectionDuration:
          type: integer
          format: int64
          examples:
            - 1234
        createdAt:
          type: string
          examples:
            - '2022-04-06T20:34:45.118Z'
        deviceCollectionFailures:
          type: object
          additionalProperties:
            type: integer
            format: int32
          description: >-
            Possible device error types during collection

            *UNKNOWN*: Unknown error

            *CONNECTION_TIMEOUT*: Connection to device timed out

            *CONNECTION_REFUSED*: Connection to device refused

            *AUTHENTICATION_FAILED*: Authentication failed

            *KEY_EXCHANGE_FAILED*: Key exchange failed

            *AUTHORIZATION_FAILED*: Authorization failed

            *AVI_SHELL_AUTH_FAILED*: Avi authentication failed

            *AVI_CONTROLLER_WITHOUT_HEALTHY_SERVICE_ENGINES*: No Avi Service
            Engines found

            *NETWORK_UNREACHABLE*: Network not reachable

            *IO_ERROR*: I/O error

            *SESSION_CLOSED*: Session closed unexpectedly

            *STATE_COLLECTION_FAILED*: State collection failed

            *JUMP_SERVER_CONNECTION_TIMEOUT*: Jump server timed out

            *JUMP_SERVER_PASSWORD_AUTH_FAILED*: Jump server auth failed

            *JUMP_SERVER_CONNECTION_FAILED*: Jump server connection refused

            *JUMP_SERVER_KEY_EXCHANGE_FAILED*: Jump server key exchange failed

            *PROXY_SERVER_PING_FAILED*: Proxy ping failed

            *PROXY_SERVER_PORT_REACHABILITY_FAILED*: Proxy port not reachable

            *PROXY_SERVER_CONNECTION_FAILED*: Proxy connection refused

            *PROXY_SERVER_AUTHENTICATION_FAILED*: Proxy authentication failed

            *PRIV_PASSWORD_ERROR*: Privileged password failed

            *UNSUPPORTED_VERSION*: Unsupported version

            *DEVICE_TYPE_UNDETECTED*: Undetected device type

            *WARN_TYPE_MISMATCH*: Device type mismatch

            *DEVICE_IS_CHILD_CONTEXT*: Parent context required

            *MANAGER_COLLECTOR_NOT_FOUND*: Collector manager error

            *INCOMPLETE_SETUP*: Incomplete setup

            *COLLECTION_NOT_FOUND*: Collection not found

            *INFINITE_LOOP_IN_COMMAND_OUTPUT*: Collection stuck in loop

            *MISSING_FILE*: File is missing

            *UNSUPPORTED_VENDOR*: Vendor not supported

            *COMMAND_DISABLED*: Required command is disabled

            *APIC_CONFIG_COLLECTION_FAILED*: APIC config collection failed

            *UNEXPECTED_KEY_EXCHANGE_MESSAGE*: Unexpected Key-Exchange message

            *UNDISCOVERED_ACI_FABRIC*: ACI fabric node was not discovered by
            APIC

            *SLOW_READ_RATE_DETECTED*: Read rate from the remote peer is too low

            *COLLECTION_TIMED_OUT*: Collection timed out

            *COLLECTION_CANCELED*: Collection canceled by user

            *OPERATION_TIMED_OUT*: Operation timed out

            *CERTIFICATE_CHECK_FAILED*: Certificate cannot be verified
        deviceProcessingFailures:
          type: object
          additionalProperties:
            type: integer
            format: int32
          description: |-
            Possible error types during processing
            *LICENSE_EXHAUSTED*: License limit exceeded
            *MISSING_SIGNATURE*: Missing signature
            *DUPLICATE*: Duplicate device
            *PARSER_EXCEPTION*: Couldn't be parsed
            *UNSUPPORTED_VENDOR*: Vendor not supported
        endpointCollectionFailures:
          type: object
          additionalProperties:
            type: integer
            format: int32
          description: >-
            Possible device error types during collection

            *UNKNOWN*: Unknown error

            *CONNECTION_TIMEOUT*: Connection to device timed out

            *CONNECTION_REFUSED*: Connection to device refused

            *AUTHENTICATION_FAILED*: Authentication failed

            *KEY_EXCHANGE_FAILED*: Key exchange failed

            *AUTHORIZATION_FAILED*: Authorization failed

            *AVI_SHELL_AUTH_FAILED*: Avi authentication failed

            *AVI_CONTROLLER_WITHOUT_HEALTHY_SERVICE_ENGINES*: No Avi Service
            Engines found

            *NETWORK_UNREACHABLE*: Network not reachable

            *IO_ERROR*: I/O error

            *SESSION_CLOSED*: Session closed unexpectedly

            *STATE_COLLECTION_FAILED*: State collection failed

            *JUMP_SERVER_CONNECTION_TIMEOUT*: Jump server timed out

            *JUMP_SERVER_PASSWORD_AUTH_FAILED*: Jump server auth failed

            *JUMP_SERVER_CONNECTION_FAILED*: Jump server connection refused

            *JUMP_SERVER_KEY_EXCHANGE_FAILED*: Jump server key exchange failed

            *PROXY_SERVER_PING_FAILED*: Proxy ping failed

            *PROXY_SERVER_PORT_REACHABILITY_FAILED*: Proxy port not reachable

            *PROXY_SERVER_CONNECTION_FAILED*: Proxy connection refused

            *PROXY_SERVER_AUTHENTICATION_FAILED*: Proxy authentication failed

            *PRIV_PASSWORD_ERROR*: Privileged password failed

            *UNSUPPORTED_VERSION*: Unsupported version

            *DEVICE_TYPE_UNDETECTED*: Undetected device type

            *WARN_TYPE_MISMATCH*: Device type mismatch

            *DEVICE_IS_CHILD_CONTEXT*: Parent context required

            *MANAGER_COLLECTOR_NOT_FOUND*: Collector manager error

            *INCOMPLETE_SETUP*: Incomplete setup

            *COLLECTION_NOT_FOUND*: Collection not found

            *INFINITE_LOOP_IN_COMMAND_OUTPUT*: Collection stuck in loop

            *MISSING_FILE*: File is missing

            *UNSUPPORTED_VENDOR*: Vendor not supported

            *COMMAND_DISABLED*: Required command is disabled

            *APIC_CONFIG_COLLECTION_FAILED*: APIC config collection failed

            *UNEXPECTED_KEY_EXCHANGE_MESSAGE*: Unexpected Key-Exchange message

            *UNDISCOVERED_ACI_FABRIC*: ACI fabric node was not discovered by
            APIC

            *SLOW_READ_RATE_DETECTED*: Read rate from the remote peer is too low

            *COLLECTION_TIMED_OUT*: Collection timed out

            *COLLECTION_CANCELED*: Collection canceled by user

            *OPERATION_TIMED_OUT*: Operation timed out

            *CERTIFICATE_CHECK_FAILED*: Certificate cannot be verified
        endpointProcessingFailures:
          type: object
          additionalProperties:
            type: integer
            format: int32
          description: |-
            Possible error types during processing
            *LICENSE_EXHAUSTED*: License limit exceeded
            *MISSING_SIGNATURE*: Missing signature
            *DUPLICATE*: Duplicate device
            *PARSER_EXCEPTION*: Couldn't be parsed
            *UNSUPPORTED_VENDOR*: Vendor not supported
        hostComputationStatus:
          $ref: '#/components/schemas/ComputationStatus'
          description: Host computation status
          examples:
            - SUCCESS
        ipLocationIndexingStatus:
          $ref: '#/components/schemas/ComputationStatus'
          description: IP location indexing status
          examples:
            - SUCCESS
        jumpServerCollectionConcurrency:
          type: integer
          format: int32
        l2IndexingStatus:
          $ref: '#/components/schemas/ComputationStatus'
          description: L2 elements (vlans, LAN segments etc.) indexing status
          examples:
            - SUCCESS
        numCollectionFailureDevices:
          type: integer
          format: int32
        numCollectionFailureEndpoints:
          type: integer
          format: int32
        numProcessingFailureDevices:
          type: integer
          format: int32
        numProcessingFailureEndpoints:
          type: integer
          format: int32
        numSuccessfulDevices:
          type: integer
          format: int32
          examples:
            - 401
        numSuccessfulEndpoints:
          type: integer
          format: int32
          examples:
            - 234
        pathSearchIndexingStatus:
          $ref: '#/components/schemas/ComputationStatus'
          description: End-to-end path indexing status
          examples:
            - SUCCESS
        processingDuration:
          type: integer
          format: int64
          examples:
            - 5678
        searchIndexingStatus:
          $ref: '#/components/schemas/ComputationStatus'
          description: Object search indexing status
          examples:
            - SUCCESS
        snapshotId:
          type: string
        snapshotState:
          $ref: '#/components/schemas/SnapshotState'
          description: Current state of the Snapshot
          examples:
            - PROCESSING
    SnapshotState:
      type: string
      enum:
        - UNPACKING
        - UNPROCESSED
        - PROCESSING
        - PROCESSED
        - FAILED
        - CANCELED
        - TIMED_OUT
        - ARCHIVED
        - RESTORING
        - RESTORE_FAILED
    ComputationStatus:
      type: string
      enum:
        - UNKNOWN
        - FAILURE
        - SUCCESS
        - CANCELED
    LinkOverrides:
      type: object
      properties:
        present:
          type: array
          items:
            $ref: '#/components/schemas/Link'
          description: >-
            Links forced to be present, even if they were not discovered or
            inferred.
        absent:
          type: array
          items:
            $ref: '#/components/schemas/Link'
          description: Links forced to be absent, even if they were discovered or inferred.
      description: >-
        A set of user-defined link overrides. An override forces a link to be
        either present or absent in the network model,

        taking precedence over discovered and inferred links.
    LinkOverridesEdit:
      type: object
      properties:
        presentAdditions:
          type: array
          items:
            $ref: '#/components/schemas/Link'
          description: >-
            Links to add as `present` overrides and (if necessary) remove as
            `absent` overrides.
        presentRemovals:
          type: array
          items:
            $ref: '#/components/schemas/Link'
          description: Links to remove as `present` overrides.
        absentAdditions:
          type: array
          items:
            $ref: '#/components/schemas/Link'
          description: >-
            Links to add as `absent` overrides and (if necessary) remove as
            `present` overrides.
        absentRemovals:
          type: array
          items:
            $ref: '#/components/schemas/Link'
          description: Links to remove as `absent` overrides.
      description: >-
        A set of additions to and removals from the network’s `present` and
        `absent` link overrides. Removing a link override

        lets Forward decide whether the link exists.
    TopologyLink:
      type: object
      properties:
        sourcePort:
          type: string
        targetPort:
          type: string
    Link:
      type: object
      properties:
        port1:
          type: string
          description: One endpoint of the link, as `<device> <interface>`.
          examples:
            - atl-core-01 Ethernet2/3
        port2:
          type: string
          description: The other endpoint of the link, as `<device> <interface>`.
          examples:
            - atl-edge-01 Ethernet1/1
      description: >-
        An undirected link between two device ports. Each port is a device name
        and interface name joined by a space.


        Note: Swapping `port1` and `port2` has no effect. In responses, a Link
        is always normalized so that `port1` ≤ `port2`.
    NqeDiffRequest:
      type: object
      required:
        - queryId
      properties:
        queryId:
          type: string
          description: >-
            The query identifier of the query to run, referenced by its NQE
            Library Query ID.
          examples:
            - FQ_ac651cb2901b067fe7dbfb511613ab44776d8029
        commitId:
          type: string
          description: >-
            Version of the query identified by `queryId` to run. Omit to run the
            latest version. Required if the query

            identified by `queryId` has been deleted.
          examples:
            - 84f84b0c0a0a1805ddff0ca5451c2c55c58605e5
        options:
          $ref: '#/components/schemas/NqeQueryOptions'
    NqeDiffResult:
      type: object
      properties:
        rows:
          type: array
          items:
            $ref: '#/components/schemas/NqeDiffEntry'
          description: >-
            The NQE query diff's rows, as a list of objects. Each object
            represents either an added row, a deleted row,

            or a modified row. In the case of a modified row, the before and
            after rows are matched up by their values

            on the key columns for the before and after tables. In particular,
            the key columns are the smallest set of

            left-most columns that uniquely identify rows within the before
            table and the after table.
        totalNumRows:
          type: integer
          format: int32
          description: >-
            The number of diff rows that would be present if there were no
            limit. If there are column filters, then it is the

            number of rows that satisfy the column filters (if there were no
            limit).
    NqeErrorInfo:
      type: object
      required:
        - httpMethod
        - apiUrl
        - message
      properties:
        completionType:
          type: string
          enum:
            - FINISHED
            - CANCELED
            - TIMED_OUT
        errors:
          type: array
          items:
            $ref: '#/components/schemas/NqeQueryError'
        snapshotId:
          type: string
          description: The ID of the Snapshot the query was run against.
          examples:
            - '101'
        httpMethod:
          type: string
          examples:
            - GET
          enum:
            - GET
            - HEAD
            - POST
            - PUT
            - PATCH
            - DELETE
        apiUrl:
          type: string
          examples:
            - /api/version
        message:
          type: string
          description: A description of the error
        reason:
          type: string
    NqeExecutionRequest:
      type: object
      properties:
        query:
          type: string
          description: >-
            The source code of the query to run. Used to directly run a query.
            Exactly one of `queryId` or `query` must be

            provided.
          examples:
            - 'foreach d in network.devices select { Name: d.name }'
        queryId:
          type: string
          description: >-
            The Query ID of a committed query in NQE Library. Used to run a
            query identified by its Query ID. Exactly one of

            `queryId` or `query` must be provided. This identifier can be found
            in the information callout in the Queries pane

            or the Versions view dropdown.
          examples:
            - FQ_ac651cb2901b067fe7dbfb511613ab44776d8029
        commitId:
          type: string
          description: >-
            A Commit ID of the query identified by the `queryId` property. Used
            to run a specific version of a committed

            query. Omit to run the latest version. Required if the query
            identified by `queryId` has been deleted. This

            identifier can be found in the information callout in the Queries
            pane or the Versions view dropdown.
          examples:
            - 84f84b0c0a0a1805ddff0ca5451c2c55c58605e5
        parameters:
          type: object
          description: >-
            Values for each parameter declared in the query. Can be omitted if
            the query has no declared parameters. The

            parameter values are specified as a JSON object, with one property
            per parameter, where the property name matches

            the parameter name. The property value is the JSON representation of
            the parameter value. The JSON representation

            of a parameter value depends on the type of the value. For values of
            type `String`, `IpAddress`, `IpSubnet`, and

            `MacAddress`, the JSON representation is a JSON string. For values
            of type `Number`, the value is an integral JSON

            number. For values of type `Boolean`, the JSON representation is
            true or false. For values of type `List<T>`, the

            JSON representation is an array of JSON values, each of which is a
            JSON representation for type `T`. For record

            values, the JSON representation is a JSON object with corresponding
            properties whose values are JSON

            representations corresponding to the properties' types. For
            enumerations, the JSON representation is a JSON string

            with the enum constant name. For `oneOf` values that contain data,
            the JSON representation is a JSON object with

            two properties, `alternative` and `value`, where the `alternative`
            property contains the alternative's name (a

            string) and the `value` property is a JSON representation of the
            data associated with this alternative.
          examples:
            - mtuThreshold: 123
              ntpServers:
                - 10.22.2.3
                - 192.33.4.1
        columnFilters:
          type: array
          items:
            $ref: '#/components/schemas/ColumnFilter'
          description: >-
            A collection of conditions on column values for filtering the
            results. A row matches the array of `columnFilters`

            if the row matches all of the `columnFilters`, in which case it is
            kept in the results.
        sortKeys:
          type: array
          items:
            $ref: '#/components/schemas/SortOrder'
          description: Specifies how results should be sorted.
        useLatestDataFiles:
          type: boolean
          description: >-
            Whether to evaluate the query against the latest uploaded data files
            rather than the versions captured in the

            snapshot. Defaults to `false` if omitted, in which case the
            snapshot's data files are used.
    NqeExecutionResponse:
      allOf:
        - type: object
          required:
            - executionKey
          properties:
            executionKey:
              type: string
              description: >-
                An opaque identifier for this query execution. Use this key in
                subsequent requests to [Get NQE execution

                status](https://docs.fwd.app/latest/api/nqe/get-nqe-execution-status/)
                and eventually to

                [Get NQE query execution
                result](https://docs.fwd.app/latest/api/nqe/get-nqe-execution-result/).
        - $ref: '#/components/schemas/NqeExecutionStatus'
    NqeExecutionStatus:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          description: >-
            The current state of the query execution:

            - `SUBMITTED`: the query has been accepted and is queued, but
            execution has not yet begun.

            - `EXECUTING`: the query is actively running.

            - `COMPLETED`: the query is no longer running. Check `outcome` to
            determine how it completed.
          enum:
            - SUBMITTED
            - EXECUTING
            - COMPLETED
        outcome:
          type: string
          description: >-
            The outcome of the query execution. Present only when `status` is
            `COMPLETED`.

            - `OK`: the execution finished successfully and produced a result.
            The result can be retrieved using
              [Get NQE query execution result](https://docs.fwd.app/latest/api/nqe/get-nqe-execution-result/).
            - `USER_ERROR`: the execution terminated due to an error in the
            query itself (for example, a runtime error
              in the NQE code). See `error` for diagnostic information.
            - `TIMED_OUT`: the execution was automatically terminated because it
            exceeded `timeoutMinutes`.

            - `SYSTEM_ERROR`: the execution terminated due to an unexpected
            internal error.
          enum:
            - OK
            - SYSTEM_ERROR
            - TIMED_OUT
            - USER_ERROR
        millisExecuting:
          type: integer
          format: int64
          description: >-
            The total time, in milliseconds, that the query has spent executing.
            This timer starts when

            `status` transitions to `EXECUTING` and does not include any time
            spent queued beforehand. Absent when

            `status` is `SUBMITTED`.
        rowsProduced:
          type: integer
          format: int64
          description: >-
            The number of rows produced by the query so far. This count may
            increase as execution progresses. Absent when

            `status` is `SUBMITTED`.
        timeoutMinutes:
          type: integer
          format: int64
          description: >-
            The maximum duration, in minutes, that the query is allowed to run
            before it is automatically

            terminated. If execution exceeds this limit, the query completes
            with `outcome` `TIMED_OUT`.
        error:
          $ref: '#/components/schemas/NqeQueryError'
          description: >-
            Diagnostic output describing why the query failed. Present only when
            `outcome` is `USER_ERROR`.
    NqeQuery:
      type: object
      properties:
        queryId:
          type: string
          description: The ID of the query
          examples:
            - FQ_ac651cb2901b067fe7dbfb511613ab44776d8029
        repository:
          type: string
          examples:
            - ORG
          enum:
            - FWD
            - ORG
        path:
          type: string
          description: >-
            The unique path of the query, including its name, in the latest
            commit
          examples:
            - /L2/MtuConsistency
        intent:
          type: string
          description: The intent of the query in the latest commit
    NqeQueryRunRequest:
      type: object
      properties:
        query:
          type: string
          description: >-
            The source code of the query to run. Used to directly run a query.
            Exactly one of `queryId` or `query` must be

            provided.
          examples:
            - 'foreach d in network.devices select { Name: d.name }'
        queryId:
          type: string
          description: >-
            The Query ID of a committed query in NQE Library. Used to run a
            query identified by its Query ID. Exactly one of

            `queryId` or `query` must be provided. This identifier can be found
            in the information callout in the Queries pane

            or the Versions view dropdown.
          examples:
            - FQ_ac651cb2901b067fe7dbfb511613ab44776d8029
        commitId:
          type: string
          description: >-
            A Commit ID of the query identified by the `queryId` property. Used
            to run a specific version of a committed

            query. Omit to run the latest version. Required if the query
            identified by `queryId` has been deleted. This

            identifier can be found in the information callout in the Queries
            pane or the Versions view dropdown.
          examples:
            - 84f84b0c0a0a1805ddff0ca5451c2c55c58605e5
        queryOptions:
          $ref: '#/components/schemas/NqeQueryOptions'
          description: (optional) Options to refine and display the results.
        parameters:
          type: object
          description: >-
            Values for each parameter declared in the query. Can be omitted if
            the query has no declared parameters. The

            parameter values are specified as a JSON object, with one property
            per parameter, where the property name matches

            the parameter name. The property value is the JSON representation of
            the parameter value. The JSON representation

            of a parameter value depends on the type of the value. For values of
            type `String`, `IpAddress`, `IpSubnet`, and

            `MacAddress`, the JSON representation is a JSON string. For values
            of type `Number`, the value is an integral JSON

            number. For values of type `Boolean`, the JSON representation is
            true or false. For values of type `List<T>`, the

            JSON representation is an array of JSON values, each of which is a
            JSON representation for type `T`. For record

            values, the JSON representation is a JSON object with corresponding
            properties whose values are JSON

            representations corresponding to the properties' types. For
            enumerations, the JSON representation is a JSON string

            with the enum constant name. For `oneOf` values that contain data,
            the JSON representation is a JSON object with

            two properties, `alternative` and `value`, where the `alternative`
            property contains the alternative's name (a

            string) and the `value` property is a JSON representation of the
            data associated with this alternative.
          examples:
            - mtuThreshold: 123
              ntpServers:
                - 10.22.2.3
                - 192.33.4.1
        useLatestDataFiles:
          type: boolean
          description: >-
            Whether to evaluate the query against the latest uploaded data files
            rather than the versions captured in the

            snapshot. Defaults to `false` if omitted, in which case the
            snapshot's data files are used.
    NqeRecord:
      type: object
      description: >-
        A row returned by the query. Each property value is either a basic value
        or an array of basic values. A basic value is

        a number, a boolean, a string, or null.
      examples:
        - boolField: true
          numField: 1
          nullField: null
          stringField: string
          listField:
            - 1
            - 2
            - 3
    NqeRunResult:
      type: object
      properties:
        snapshotId:
          type: string
          description: The ID of the Snapshot that the query was run against.
          examples:
            - '101'
        items:
          type: array
          items:
            $ref: '#/components/schemas/NqeRecord'
          description: >-
            The query's results, as a list of objects. Each object corresponds
            to a row returned by the query, and is an

            object with properties of simple values, where a simple value is
            either a basic value or a list of basic values. A

            basic value is either a number, boolean, string, or null.
          examples:
            - - boolField: true
                numField: 1
                nullField: null
                stringField: string
                listField:
                  - 1
                  - 2
                  - 3
        totalNumItems:
          type: integer
          format: int64
          description: >-
            The total number of items in the query's results. This number could
            be different than the length of `items` if a

            filter is used.
    DefaultColumnFilter:
      type: object
      required:
        - columnName
      properties:
        columnName:
          type: string
          description: The name of a column to filter on.
          examples:
            - Name
        operator:
          type: string
          const: DEFAULT
        value:
          type: string
          description: A value (in its string representation) to match on.
          examples:
            - ATL
    BetweenColumnFilter:
      type: object
      required:
        - columnName
        - operator
      properties:
        columnName:
          type: string
          description: The name of a column to filter on.
          examples:
            - Name
        lowerBound:
          type: string
          description: >-
            A value (in its string representation) to limit on inclusively from
            below. Required if 'upperBound' is

            omitted.
          examples:
            - '2023-07-30T08:27:16Z'
        operator:
          type: string
          const: IS_BETWEEN
        upperBound:
          type: string
          description: >-
            A value (in its string representation) to limit on inclusively from
            above. Required if 'lowerBound' is

            omitted.
          examples:
            - '2025-07-30T08:27:16Z'
    ColumnFilter:
      type: object
      required:
        - operator
      properties:
        operator:
          type: string
          enum:
            - DEFAULT
            - IS_BETWEEN
      oneOf:
        - $ref: '#/components/schemas/DefaultColumnFilter'
        - $ref: '#/components/schemas/BetweenColumnFilter'
      discriminator:
        propertyName: operator
        mapping:
          DEFAULT: '#/components/schemas/DefaultColumnFilter'
          IS_BETWEEN: '#/components/schemas/BetweenColumnFilter'
    SortOrder:
      type: object
      required:
        - columnName
      properties:
        columnName:
          type: string
          description: The name of a column to sort on.
          examples:
            - Name
        order:
          type: string
          description: >-
            (optional) Either `ASC` or `DESC` to sort ascending or descending,
            respectively. Defaults to `ASC`.
          examples:
            - ASC
          enum:
            - ASC
            - DESC
    TextPosition:
      type: object
      properties:
        character:
          type: integer
          format: int32
          description: Position on the line (by number of characters, starting at 0)
        line:
          type: integer
          format: int32
          description: Line number (starting at 0)
    TextRegion:
      type: object
      properties:
        start:
          $ref: '#/components/schemas/TextPosition'
          description: The region's starting position (starting at (0, 0)).
        end:
          $ref: '#/components/schemas/TextPosition'
          description: The region's ending position.
    NqeQueryError:
      type: object
      properties:
        location:
          $ref: '#/components/schemas/TextRegion'
          description: The region in the original query that caused the error.
        message:
          type: string
          description: The error's message.
    NqeQueryOptions:
      type: object
      properties:
        offset:
          type: integer
          format: int32
          description: >-
            (optional) The number of initial rows to skip. Defaults to 0. Cannot
            be negative.
          examples:
            - 20
        limit:
          type: integer
          format: int32
          description: >-
            (optional) The maximum number of rows to return. Defaults to 1,000.
            Must be positive.

            Cannot exceed 10,000.
          examples:
            - 100
        sortBy:
          $ref: '#/components/schemas/SortOrder'
          description: (optional) Specifies how results should be sorted.
        columnFilters:
          type: array
          items:
            $ref: '#/components/schemas/ColumnFilter'
          description: >-
            (optional) A collection of conditions on column values for filtering
            the results. A row matches the array of

            `columnFilters` if the row matches all of the `columnFilters`, in
            which case it is kept in the results.
          examples:
            - - columnName: Name
                operator: DEFAULT
                value: MyDeviceName
        itemFormat:
          type: string
          description: >-
            (optional) Specifies how each row in the results should be rendered.


            If set to `JSON`, then complex values are rendered as JSON arrays
            and records.

            If set to `LEGACY`, then complex values in the row are rendered as
            strings.


            A complex value is one that is not a scalar (such as a number,
            string, enum value, date, etc.) and is not a list

            of scalar values.


            **Note:** The `LEGACY` format is deprecated and will be removed in
            release 26.9.
          examples:
            - JSON
          default: JSON
          enum:
            - JSON
            - LEGACY
    NqeDiffEntry:
      type: object
      properties:
        after:
          $ref: '#/components/schemas/NqeRecord'
          description: >-
            The row returned by the query against the 'after' snapshot. Not
            present if `type` is `DELETED`.
        before:
          $ref: '#/components/schemas/NqeRecord'
          description: >-
            The row returned by the query against the 'before' snapshot. Not
            present if `type` is `ADDED`.
        type:
          type: string
          description: >-
            Describes the type of difference between `before` and `after`:

            * If `MODIFIED`, then both `before` and `after` will be present, but
            will differ in at least one property;

            * If `ADDED`, then only `after` will be present;

            * If `DELETED`, then only `before` will be present.
          enum:
            - ADDED
            - DELETED
            - MODIFIED
      description: >-
        Represents a diff entry between two records returned by the same NQE
        query.
    L7Application:
      type: object
      properties:
        id:
          type: string
    PathSearchBulkRequest:
      type: object
      required:
        - queries
      properties:
        queries:
          type: array
          items:
            $ref: '#/components/schemas/PathSearchQuery'
          description: >-
            The path search queries to evaluate. Up to 20,000 queries are
            permitted, but ~1,000 per request is recommended

            to maximize throughput.
        intent:
          $ref: '#/components/schemas/SearchIntent'
          description: >-
            Specifies the intent for the search. Default PREFER_DELIVERED.

            *PREFER_VIOLATIONS*: Prefer paths that result in the traffic not
            getting delivered, e.g. drops, blackholes,

            loops. An example usage is while trying to evaluate if the specified
            traffic always gets delivered to the

            destination along all path choices.

            *PREFER_DELIVERED*: Prefer paths that result in the traffic getting
            delivered. An example usage is while

            trying to evaluate if traffic gets delivered to the destination
            along any path choice.

            *VIOLATIONS_ONLY*: Search for paths where traffic is not delivered
            to the destination.
          examples:
            - PREFER_DELIVERED
          default: PREFER_DELIVERED
        maxCandidates:
          type: integer
          format: int32
          description: >-
            the limit on the number of search results computed, before applying
            any ranking criteria. Permitted range =

            1 to 10,000. Default 5,000.
          examples:
            - 5000
        maxResults:
          type: integer
          format: int32
          description: >-
            the limit on the number of search results returned by the API.
            First, the platform computes up to

            maxCandidates results that match the search criteria. Then they are
            sorted by various ranking criteria. A

            key ranking factor is path length, preferring longer paths (greatest
            reach) in the network over shorter

            ones. Finally, the API limits the number of returned search results
            to maxResults. Permitted range = 1 to

            maxCandidates. Default 1.
          examples:
            - 1
        maxReturnPathResults:
          type: integer
          format: int32
          description: >-
            the limit on the number of return path search results. Permitted
            range = 0 to 10,000. Default 0. Multicast

            (*, G) and (S, G) queries will always return 0 return path results
            regardless of this value.
          examples:
            - 0
        maxSeconds:
          type: integer
          format: int32
          description: >-
            the timeout duration per search query. Permitted range = 1 to 300.
            Default 30.
          examples:
            - 30
        maxOverallSeconds:
          type: integer
          format: int32
          description: >-
            the overall timeout duration. Permitted range = 1 to 7,200. Default
            equal to the timeout duration for a

            single query.
          examples:
            - 300
        includeTags:
          type: boolean
          description: If true, the response will include device tags for each hop.
          examples:
            - false
        includeNetworkFunctions:
          type: boolean
          description: >-
            If true, the response includes detailed forwarding info for each
            hop.

            Note: Setting this to true increases the API response time.
          examples:
            - false
    PathSearchResponse:
      type: object
      properties:
        srcIpLocationType:
          type: string
          description: >-
            Specifies the location discovery method for source IP.

            The enum values are ordered from most precise to least precise
            discovery method.

            *INTERFACE*: The IP is a configured IP address of one or more device
            interfaces.

            *HOST*: The IP corresponds to discovered host(s).

            *SNAT* : The IP is used as the post-translated IP of a Source NAT
            function in the network and is assumed to

            be located on the gateway device(s) performing this translation.

            *CO_LOCATED*: The IP is configured on a gateway device as a /32 or
            /128 route whose next hop is a known

            host.

            *INTERFACE_ATTACHED_SUBNET*: The IP falls within the attached subnet
            of L3 interface(s).

            *INTERNET*: The IP is in the public internet and was located at the
            network's Internet Node. This discovery

            method is only applicable when an Internet Node is configured in the
            network.

            *ROUTE*: The IP was located based on injected routes in the network.

            *MULTICAST*: The IP is a multicast group address. This discovery
            method is used to locate the rendezvous

            points of the multicast group and use their IP addresses as IP
            source.
          enum:
            - INTERFACE
            - HOST
            - SNAT
            - CO_LOCATED
            - INTERFACE_ATTACHED_SUBNET
            - INTERNET
            - ROUTE
            - MULTICAST
        dstIpLocationType:
          type: string
          description: >-
            Specifies the location discovery method for destination IP.

            The enum values are ordered from most precise to least precise
            discovery method.

            *INTERFACE*: The IP is a configured IP address of one or more device
            interfaces.

            *HOST*: The IP corresponds to discovered host(s).

            *DNAT*: The IP gets DNAT'd in the network. The IP may either
            correspond directly to a VIP on a load balancer

            or a DNAT'd IP on other devices such as routers. This discovery
            method is only used to locate destination IP

            addresses. DNAT’d IP addresses are recursively resolved to determine
            where traffic to a given destination IP

            must be delivered in the network.

            *CO_LOCATED*: The IP is configured on a gateway device as a /32 or
            /128 route whose next hop is a known

            host.

            *INTERFACE_ATTACHED_SUBNET*: The IP falls within the attached subnet
            of L3 interface(s).

            *INTERNET*: The IP is in the public internet and was located at the
            network's Internet Node. This discovery

            method is only applicable when an Internet Node is configured in the
            network.

            *ROUTE*: The IP was located based on injected routes in the network.

            *MULTICAST*: The IP is a multicast group address.
          enum:
            - INTERFACE
            - HOST
            - DNAT
            - CO_LOCATED
            - INTERFACE_ATTACHED_SUBNET
            - INTERNET
            - ROUTE
            - MULTICAST
        info:
          $ref: '#/components/schemas/PathInfo'
        returnPathInfo:
          $ref: '#/components/schemas/PathInfo'
        timedOut:
          type: boolean
        queryUrl:
          type: string
          description: >-
            A Forward application URL at which this path search can be explored
            or refined interactively
        unrecognizedValues:
          $ref: '#/components/schemas/UnrecognizedValues'
          description: L7 values from the request that were unrecognized by the system
    SearchIntent:
      type: string
      enum:
        - PREFER_VIOLATIONS
        - PREFER_DELIVERED
        - VIOLATIONS_ONLY
    AclFunction:
      type: object
      properties:
        name:
          type: string
          description: the name of the ACL that is applied to traffic
        context:
          type: string
          description: the context in which the ACL function is applied
          enum:
            - INPUT
            - OUTPUT
        action:
          type: string
          description: the action taken by the ACL function
          enum:
            - PERMIT
            - DENY
    InterfaceFunctionL2Info:
      type: object
      properties:
        interfaceName:
          type: string
    InterfaceFunctionL3Info:
      type: object
      properties:
        interfaceName:
          type: string
        vrf:
          type: string
          description: Null if the interface does not belong to any VRF
    InterfaceFunction:
      type: object
      properties:
        l2:
          $ref: '#/components/schemas/InterfaceFunctionL2Info'
        l3:
          $ref: '#/components/schemas/InterfaceFunctionL3Info'
        securityZone:
          type: string
    NetworkFunctions:
      type: object
      properties:
        acl:
          type: array
          items:
            $ref: '#/components/schemas/AclFunction'
        egress:
          $ref: '#/components/schemas/InterfaceFunction'
        ingress:
          $ref: '#/components/schemas/InterfaceFunction'
      description: Detailed forwarding info
    PathHop:
      type: object
      properties:
        deviceName:
          type: string
        displayName:
          type: string
          description: >-
            Alternate device name that might be more recognizable but isn’t
            necessarily unique in the network. For cloud

            devices, this is the name configured in the cloud provider’s
            console.
        deviceType:
          $ref: '#/components/schemas/DeviceType'
        tags:
          type: array
          items:
            type: string
          description: present only if device tags are specifically requested
        parseError:
          type: boolean
          description: >-
            `true` indicates that this device’s behavior model might not be
            reliable
        ingressInterface:
          type: string
          description: the physical interface name, where traffic entered the device
        egressInterface:
          type: string
          description: |-
            the physical interface name, where traffic exited the device.
            Absent if this is the last hop and traffic did not exit the device.
        behaviors:
          type: array
          items:
            type: string
            enum:
              - L2
              - L3
              - NAT
              - PBR
              - ACL_PERMIT
              - ACL_DENY
          description: >-
            Specifies the forwarding behaviors experienced by traffic at the
            device.

            *L2*: Forwarded at layer 2.

            *L3*: Routed at layer 3.

            *NAT*: NAT transformations applied.

            *PBR*: Forwarded using Policy-Based Routing.

            *ACL_PERMIT*: ACLs were applied to traffic at the device and the
            traffic was permitted.

            *ACL_DENY*: ACLs were applied to traffic at the device and the
            traffic was dropped.
        networkFunctions:
          $ref: '#/components/schemas/NetworkFunctions'
        backfilledFrom:
          type: string
          description: the collection instant from which the device was backfilled
    Path:
      type: object
      properties:
        forwardingOutcome:
          type: string
          description: >-
            Specifies the traffic forwarding outcome along a path.

            *DELIVERED*: Traffic was delivered to destination IP’s discovered
            location(s).

            *DELIVERED_TO_INCORRECT_LOCATION*: Traffic was delivered out of some
            edge ports. However, traffic did not

            reach the expected delivery locations based on destination IP’s
            discovered locations. One scenario where

            this occurs is when a device in the middle of the actual path from
            source IP to destination IP is not

            configured for collection in the Forward platform. For example,
            suppose the actual device path is A -> B ->

            C, and only devices A and C are part of the snapshot in the Forward
            platform. In this case, the path would

            show traffic exiting device A at some edge port, but since
            destination IP is discovered to reside at device

            C, traffic is delivered to an incorrect location.

            *BLACKHOLE*: Traffic was implicitly dropped at the last hop, since
            the device had no matching rule. For

            example, if a router does not have a default route, traffic to any
            IP that is not in the routing table gets

            blackholed.

            *DROPPED*: Traffic was explicitly dropped at the last hop, e.g. by a
            null route.

            *INADMISSIBLE*: Traffic was not admitted into the network. The first
            hop interface does not accept the

            traffic, e.g. incoming traffic had a vlan tag 10 while the ingress
            interface is an access interface that

            only permits traffic with vlan tag 20.

            *UNREACHABLE*: ARP/NDP resolution failed along the path resulting in
            traffic not getting delivered to the

            intended destination.

            *LOOP*: Traffic entered a forwarding loop.
          enum:
            - DELIVERED
            - DELIVERED_TO_INCORRECT_LOCATION
            - DROPPED
            - LOOP
            - INADMISSIBLE
            - BLACKHOLE
            - UNREACHABLE
        securityOutcome:
          type: string
          description: >-
            Specifies whether traffic is denied by ACL rules at any hop along
            the path.

            *PERMITTED*: All ACLs along the path permitted traffic to flow
            through.

            *DENIED*: Traffic was dropped by ACLs at some hop along the path.
            Note that the ACL drop may not always

            occur at the last hop since search results are computed in permit
            all mode.
          enum:
            - PERMITTED
            - DENIED
        hops:
          type: array
          items:
            $ref: '#/components/schemas/PathHop'
    TotalHits:
      type: object
      properties:
        type:
          type: string
          description: >-
            Specifies the type of total hits.

            *LOWER_BOUND*: There may be additional hits that were not included
            in the results either because the

            requested number of hits were found, or the request timed out.

            *EXACT*: There are exactly this many hits.
          enum:
            - LOWER_BOUND
            - EXACT
        value:
          type: integer
          format: int64
      description: >-
        Number of ways in which traffic matching the search criteria is
        forwarded in the network. Multiple ECMP path

        choices for traffic lead to separate results. In addition, depending on
        the scope of query terms, there

        might be multiple results along a single path. For example a search
        without IP protocol or destination port

        restrictions can result in multiple results along a single device path
        if there are different ACLs that

        permit or deny traffic to different destination ports.
    PathInfo:
      type: object
      properties:
        paths:
          type: array
          items:
            $ref: '#/components/schemas/Path'
        totalHits:
          $ref: '#/components/schemas/TotalHits'
    UnrecognizedValues:
      type: object
      properties:
        appId:
          type: array
          items:
            type: string
        userGroupId:
          type: array
          items:
            type: string
        userId:
          type: array
          items:
            type: string
    PathSearchQuery:
      type: object
      required:
        - dstIp
      properties:
        from:
          type: string
          description: >-
            the device from which the traffic originates. If this is specified,
            then the srcIp will be considered as a

            packet header only, else, the srcIp will be resolved to specific
            location(s) and used as the source in the

            path search. Either the source device or srcIp must be specified.
        srcIp:
          type: string
          description: >-
            the source IP address or subnet of packets entering the network. For
            multicast (*, G) paths, set srcIp = G

            (multicast group address).
          examples:
            - 10.10.10.10
        dstIp:
          type: string
          description: >-
            the destination IP address or subnet of packets entering the
            network. For multicast (*, G) paths, set dstIp

            = G (multicast group address).
          examples:
            - 10.10.10.64/28
        ipProto:
          type: integer
          format: int32
          minimum: 0
          maximum: 255
          description: the IP protocol
          examples:
            - 6
        srcPort:
          type: string
          description: the L4 source port, like "80" or a range "8080-8088"
          examples:
            - '80'
        dstPort:
          type: string
          description: the L4 destination port, like "80" or a range "8080-8088"
          examples:
            - 8080-8088
        icmpType:
          type: integer
          format: int32
          minimum: 0
          maximum: 255
          description: the ICMP type. Implies ipProto = 1.
        fin:
          type: integer
          format: int32
          minimum: 0
          maximum: 1
          description: the FIN (finish) bit (0 or 1). Implies ipProto = 6.
          examples:
            - 1
        syn:
          type: integer
          format: int32
          minimum: 0
          maximum: 1
          description: the SYN (synchronize) bit (0 or 1). Implies ipProto = 6.
          examples:
            - 1
        rst:
          type: integer
          format: int32
          minimum: 0
          maximum: 1
          description: the RST (reset) bit (0 or 1). Implies ipProto = 6.
          examples:
            - 1
        psh:
          type: integer
          format: int32
          minimum: 0
          maximum: 1
          description: the PSH (push) bit (0 or 1). Implies ipProto = 6.
          examples:
            - 1
        ack:
          type: integer
          format: int32
          minimum: 0
          maximum: 1
          description: the ACK (acknowledgment) bit (0 or 1). Implies ipProto = 6.
          examples:
            - 1
        urg:
          type: integer
          format: int32
          minimum: 0
          maximum: 1
          description: the URG (urgent) bit (0 or 1). Implies ipProto = 6.
          examples:
            - 1
        appId:
          type: string
          description: >-
            the L7 app-id or "unidentified" to exclude paths that traverse
            firewall policies with app-id matches. If the

            system doesn't recognize the provided value, it handles the value
            the same as "unidentified" and includes

            the value in the `unrecognizedValues` response field. The
            applications that are recognized by the model can

            be obtained using GET /api/l7-applications.
          examples:
            - ssh
        userId:
          type: string
          description: >-
            the L7 user-id or "unidentified" to exclude paths that traverse
            firewall policies with user-id matches. If

            the system doesn't recognize the provided value, it handles the
            value the same as "unidentified" and

            includes the value in the `unrecognizedValues` response field. See
            [Path Analysis with Layer 7

            User-Group](https://docs.fwd.app/latest/application/search/path-analysis/layer7-ugroup/)
            for more info.
          examples:
            - user1
        userGroupId:
          type: string
          description: >-
            the L7 user-group-id. If the system doesn't recognize the provided
            value, the search returns 0 results as

            there are no paths that traverse firewall policies with that
            user-group-id match, and the value is included

            in the `unrecognizedValues` response field. See [Path Analysis with
            Layer 7

            User-Group](https://docs.fwd.app/latest/application/search/path-analysis/layer7-ugroup/)
            for more info.
          examples:
            - group1
        url:
          type: string
          description: >-
            the L7 URL that traffic of interest is trying to access. Prefix
            wildcards are supported for subdomains.

            Suffix wildcards are supported for top-level domains and URL paths.
            See [Path Analysis with Layer 7

            URL](https://docs.fwd.app/latest/application/search/path-analysis/layer7-url/)
            for more policy patterns supported

            in the model.
          examples:
            - '*.example.com'
        domain:
          type: string
          description: >-
            the DNS domain name that traffic of interest is trying to reach,
            without HTTP path components. Unlike `url`,

            which implies HTTP/HTTPS over TCP/UDP, this field matches on domain
            regardless of application protocol (e.g.,

            ICMP to a domain). Prefix wildcards are supported for subdomains and
            suffix wildcards for top-level domains.

            Cannot be specified together with `url`.
          examples:
            - example.com
            - '*.subdomain.example.org'
    NewUser:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          examples:
            - me@example.com
        username:
          type: string
          description: Defaults to the value of `email`
          examples:
            - me@example.com
        password:
          type: string
          examples:
            - zF4H+K;5]qE~%9G=nbAk
        isSupport:
          type: boolean
          description: Defaults to `false`
          examples:
            - false
        enabled:
          type: boolean
          description: Defaults to `true`
          examples:
            - true
    User:
      type: object
      required:
        - id
        - username
        - enabled
        - authSource
      properties:
        id:
          type: string
          description: >-
            A system-generated identifier that can be used in API requests to
            manage this account
          examples:
            - '55555'
        username:
          type: string
          description: The identifier used to authenticate (log in) with this account
          examples:
            - me@example.com
        email:
          type: string
          description: >-
            The email address at which this user wishes to receive
            system-generated emails
          examples:
            - me@example.com
        enabled:
          type: boolean
          description: >-
            Whether authentication (login and API use) is currently permitted
            for this user account
        authSource:
          type: string
          description: >-
            How this user authenticates. `LOCAL` accounts exist only in the
            Forward Platform.
          examples:
            - SAML
          enum:
            - LOCAL
            - TACACS
            - SAML
            - LDAP
        externalGroups:
          type: array
          items:
            type: string
          description: >-
            The names of any LDAP or SSO (SAML) groups to which this account
            belongs. Updated each time this user

            authenticates.
          examples:
            - - netops
        isSupport:
          type: boolean
          description: >-
            Whether this account belongs to Forward support staff. `true`
            excludes the account from statistics shown

            on the Engagement page.
        lastActive:
          type: string
          description: >-
            The approximate time of the most recent authenticated request from
            this account
          examples:
            - '2024-12-31T23:59:59.789Z'
    UserPatch:
      type: object
      properties:
        email:
          type: string
          examples:
            - me@example.com
        username:
          type: string
          description: Changes the username of a user whose `authSource` is "LOCAL"
          examples:
            - me@example.com
        password:
          type: string
          description: >-
            Assigns a new temporary password to a user whose `authSource` is
            "LOCAL". The user will be prompted to

            choose a new password when they log in with this password.
          examples:
            - zF4H+K;5]qE~%9G=nbAk
        isSupport:
          type: boolean
          examples:
            - false
        enabled:
          type: boolean
          examples:
            - true
    Users:
      type: object
      properties:
        users:
          type: array
          items:
            $ref: '#/components/schemas/User'
    CveAnalyses:
      type: object
      required:
        - analyses
      properties:
        analyses:
          type: array
          items:
            $ref: '#/components/schemas/CveAnalysis'
          description: The custom vulnerability analyses defined for the CVE.
    CveAnalysis:
      allOf:
        - type: object
          required:
            - cveId
            - os
            - rules
          properties:
            cveId:
              type: string
              description: The ID of the CVE this analysis applies to.
              examples:
                - CVE-2021-1384
            os:
              $ref: '#/components/schemas/VulnerabilityVendorOs'
              description: The OS this analysis applies to.
              examples:
                - cisco_nxos
            rules:
              type: array
              items:
                $ref: '#/components/schemas/CveAnalysisRule'
              description: The analysis rules, applied first to last.
        - $ref: '#/components/schemas/Attribution'
      description: >-
        A custom vulnerability analysis for one CVE and OS: an ordered list of
        rules that override the automatically computed

        vulnerability status of the devices they match. For each device, the
        first rule that the device matches determines

        its status. `rules` is empty when no analysis has been defined for the
        CVE and OS.
    CveAnalysisDef:
      type: object
      required:
        - rules
      properties:
        rules:
          type: array
          items:
            $ref: '#/components/schemas/CveAnalysisRule'
          description: >-
            The analysis rules, applied first to last. Must contain between 1
            and 4 rules. For each device, the first rule

            that the device matches determines its custom vulnerability status.
    CveAnalysisRule:
      type: object
      required:
        - label
      properties:
        label:
          type: string
          description: >-
            A short label summarizing the effect of this rule, shown alongside
            the devices it matches.
          examples:
            - Mitigated by policy
        comment:
          type: string
          description: A longer explanation of why this rule was added.
          examples:
            - Confirmed patched by the network team on 2024-11-02.
        status:
          $ref: '#/components/schemas/CustomCveStatus'
          description: >-
            The status to assign to devices this rule matches. Omit to apply the
            label and comment without changing the

            matched device’s computed status.
          examples:
            - NOT_VULNERABLE
        deviceGlobs:
          type: array
          items:
            type: string
          description: >-
            Glob patterns matched against device names. A device matches this
            criterion if its name matches any of these

            patterns, ignoring case.
          examples:
            - - atl-*
              - core-rtr-1
        tags:
          type: array
          items:
            type: string
          description: A device matches this criterion if it carries any of these tags.
          examples:
            - - prod
              - edge
        locationIds:
          type: array
          items:
            type: string
          description: >-
            The `id`s of [Network
            Locations](https://docs.fwd.app/latest/api/network-locations/). A
            device matches this

            criterion if it is in any of these locations.
          examples:
            - - atl
              - sjc
        osVersions:
          type: array
          items:
            type: string
          description: A device matches this criterion if it runs any of these OS versions.
          examples:
            - - 9.3(5)
              - 9.3(6)
        models:
          type: array
          items:
            type: string
          description: A device matches this criterion if it is any of these models.
          examples:
            - - N9K-C93180YC-EX
      description: >-
        A single analysis rule: device criteria plus the attributes to apply to
        the devices they match. A device matches a

        rule only if it satisfies every criterion the rule specifies
        (`deviceGlobs`, `tags`, `locationIds`, `osVersions`,

        `models`); each criterion in turn matches a device that satisfies any
        one of its values. At least one criterion must

        be specified.
    OsVulnerabilityAnalysis:
      type: object
      required:
        - vulnerabilities
        - offset
        - total
        - indexCreatedAt
      properties:
        vulnerabilities:
          type: array
          items:
            $ref: '#/components/schemas/OsVulnerability'
        offset:
          type: integer
          format: int32
          description: >-
            The number of vulnerabilities dropped from the front of
            `vulnerabilities` due to paging.
          examples:
            - 200
        total:
          type: integer
          format: int32
          description: >-
            The total number of vulnerabilities available in the analysis. This
            number can be larger than `offset` plus

            the length of `vulnerabilities` if some have been dropped from the
            back of `vulnerabilities` due to paging.
          examples:
            - 1234
        indexCreatedAt:
          type: string
          description: >-
            When the CVE index used for analysis was created (epoch
            milliseconds)
          examples:
            - '2025-06-01T12:34:56.789Z'
        indexUploadedAt:
          type: string
          description: >-
            When the CVE index used for analysis was uploaded to the server
            (epoch milliseconds)
          examples:
            - '2025-06-03T04:05:06.007Z'
        indexUploadedBy:
          type: string
          description: The id of the `User` who uploaded the CVE index used for analysis
          examples:
            - '345'
    VulnerabilityAnalysis:
      type: object
      properties:
        vulnerabilities:
          type: array
          items:
            $ref: '#/components/schemas/Vulnerability'
          description: Information about the CVEs that might impact devices in the network.
        indexCreatedAt:
          type: string
          description: When the CVE index used for analysis was created.
          examples:
            - '2025-06-01T12:34:56.789Z'
        indexUploadedAt:
          type: string
          description: When the CVE index used for analysis was uploaded to the server.
          examples:
