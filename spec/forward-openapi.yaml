  /networks/{networkId}/paths:
    get:
      tags:
        - Path Search
      summary: Trace packets through the network
      description: >-
        See [Path Search](https://docs.fwd.app/latest/api/path-search/) for an
        introduction applicable to all the

        path search operations.
      operationId: getPaths
      parameters:
        - name: networkId
          in: path
          required: true
          schema:
            type: string
        - name: from
          in: query
          description: >-
            the device from which the traffic originates. If this is specified,
            then the srcIp will be considered as a

            packet header only, else, the srcIp will be resolved to specific
            location(s) and used as the source in the

            path search. Either the source device or srcIp must be specified.
          schema:
            type: string
        - name: srcIp
          in: query
          description: >-
            the source IP address or subnet of packets entering the network. For
            multicast (*, G) paths, set srcIp = G

            (multicast group address).
          schema:
            type: string
        - name: dstIp
          in: query
          description: >-
            the destination IP address or subnet of packets entering the
            network. For multicast (*, G) paths, set dstIp

            = G (multicast group address).
          required: true
          schema:
            type: string
        - name: intent
          in: query
          description: >-
            Specifies the intent for the search. Default PREFER_DELIVERED.

            *PREFER_VIOLATIONS*: Prefer paths that result in the traffic not
            getting delivered, e.g. drops, blackholes,

            loops. An example usage is while trying to evaluate if the specified
            traffic always gets delivered to the

            destination along all path choices.

            *PREFER_DELIVERED*: Prefer paths that result in the traffic getting
            delivered. An example usage is while

            trying to evaluate if traffic gets delivered to the destination
            along any path choice.

            *VIOLATIONS_ONLY*: Search for paths where traffic is not delivered
            to the destination.
          schema:
            $ref: '#/components/schemas/SearchIntent'
            default: PREFER_DELIVERED
        - name: ipProto
          in: query
          description: the IP protocol
          schema:
            type: integer
            format: int32
        - name: srcPort
          in: query
          description: the L4 source port, like "80" or a range "8080-8088"
          schema:
            type: string
        - name: dstPort
          in: query
          description: the L4 destination port, like "80" or a range "8080-8088"
          schema:
            type: string
        - name: icmpType
          in: query
          description: the ICMP type. Implies ipProto = 1.
          schema:
            type: integer
            format: int32
        - name: fin
          in: query
          description: the FIN (finish) bit (0 or 1). Implies ipProto = 6.
          schema:
            type: integer
            format: int32
        - name: syn
          in: query
          description: the SYN (synchronize) bit (0 or 1). Implies ipProto = 6.
          schema:
            type: integer
            format: int32
        - name: rst
          in: query
          description: the RST (reset) bit (0 or 1). Implies ipProto = 6.
          schema:
            type: integer
            format: int32
        - name: psh
          in: query
          description: the PSH (push) bit (0 or 1). Implies ipProto = 6.
          schema:
            type: integer
            format: int32
        - name: ack
          in: query
          description: the ACK (acknowledgment) bit (0 or 1). Implies ipProto = 6.
          schema:
            type: integer
            format: int32
        - name: urg
          in: query
          description: the URG (urgent) bit (0 or 1). Implies ipProto = 6.
          schema:
            type: integer
            format: int32
        - name: appId
          in: query
          description: >-
            the L7 app-id or "unidentified" to exclude paths that traverse
            firewall policies with app-id matches. If the

            system doesn't recognize the provided value, it handles the value
            the same as "unidentified" and includes

            the value in the `unrecognizedValues` response field. The
            applications that are recognized by the model can

            be obtained using GET /api/l7-applications.
          schema:
            type: string
        - name: userId
          in: query
          description: >-
            the L7 user-id or "unidentified" to exclude paths that traverse
            firewall policies with user-id matches. If

            the system doesn't recognize the provided value, it handles the
            value the same as "unidentified" and

            includes the value in the `unrecognizedValues` response field. See
            [Path Analysis with Layer 7

            User-Group](https://docs.fwd.app/latest/application/search/path-analysis/layer7-ugroup/)
            for more info.
          schema:
            type: string
        - name: userGroupId
          in: query
          description: >-
            the L7 user-group-id. If the system doesn't recognize the provided
            value, the search returns 0 results as

            there are no paths that traverse firewall policies with that
            user-group-id match, and the value is included

            in the `unrecognizedValues` response field. See [Path Analysis with
            Layer 7

            User-Group](https://docs.fwd.app/latest/application/search/path-analysis/layer7-ugroup/)
            for more info.
          schema:
            type: string
        - name: url
          in: query
          description: >-
            the L7 URL that traffic of interest is trying to access. Prefix
            wildcards are supported for subdomains.

            Suffix wildcards are supported for top-level domains and URL paths.
            See [Path Analysis with Layer 7

            URL](https://docs.fwd.app/latest/application/search/path-analysis/layer7-url/)
            for more policy patterns

            supported in the model.
          schema:
            type: string
        - name: domain
          in: query
          description: >-
            the L7 domain that traffic of interest is trying to reach. Unlike
            'url', which applies only to

            HTTP/HTTPS traffic (TCP/UDP), 'domain' can be used with any IP
            protocol. Prefix wildcards are

            supported for subdomains. Cannot be specified together with 'url'.
          schema:
            type: string
        - name: includeTags
          in: query
          description: If true, the response will include device tags for each hop.
          schema:
            type: boolean
            default: false
        - name: includeNetworkFunctions
          in: query
          description: >-
            If true, the response includes detailed forwarding info for each
            hop.

            Note: Setting this to true increases the API response time.
          schema:
            type: boolean
            default: false
        - name: maxCandidates
          in: query
          description: >-
            the limit on the number of search results computed, before applying
            any ranking criteria. Permitted range =

            1 to 10,000. Default 5,000.
          schema:
            type: integer
            format: int32
            default: 5000
        - name: maxResults
          in: query
          description: >-
            the limit on the number of search results returned by the API.
            First, the platform computes up to

            maxCandidates results that match the search criteria. Then they are
            sorted by various ranking criteria. A

            key ranking factor is path length, preferring longer paths (greatest
            reach) in the network over shorter

            ones. Finally, the API limits the number of returned search results
            to maxResults. Permitted range = 1 to

            maxCandidates. Default 1.
          schema:
            type: integer
            format: int32
            default: 1
        - name: maxReturnPathResults
          in: query
          description: >-
            the limit on the number of return path search results. Permitted
            range = 0 to 10,000. Default 0. Multicast

            (*, G) and (S, G) queries will always return 0 return path results
            regardless of this value.
          schema:
            type: integer
            format: int32
            default: 0
        - name: maxSeconds
          in: query
          description: the timeout duration. Permitted range = 1 to 300. Default 30.
          schema:
            type: integer
            format: int32
            default: 30
        - $ref: '#/components/parameters/SnapshotId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PathSearchResponse'
        '409':
          description: >-
            The system is currently processing this Snapshot.


            Note: GET /networks/{networkId}/snapshots/latestProcessed can be
            used to determine when processing of the

            latest Snapshot is done or to identify an alternate Snapshot that
            has already been processed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorInfo'
      security:
        - api_token: []
  /networks/{networkId}/paths-bulk:
    post:
      tags:
        - Path Search
      summary: Trace sets of packets through the network
      description: >-
        Efficiently performs multiple path searches through the network.


        See [Path Search](https://docs.fwd.app/latest/api/path-search/) for an
        introduction applicable to all the

        path search operations.


        If you wish to consume query results incrementally without loading all
        of them into memory at once, use the

        [streaming
        variant](https://docs.fwd.app/latest/api/path-search/get-paths-bulk-seq/)
        of this operation instead.
      operationId: getPathsBulk
      parameters:
        - name: networkId
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/SnapshotId'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PathSearchBulkRequest'
        required: true
      responses:
        '200':
          description: >-
            The response is an array containing a result (a `PathSearchResponse`
            or an error object) for each query in

            the request, in the same order. An error object has an `"error":
            true` property. Each query is evaluated

            independently.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PathSearchResponse'
        '400':
          description: >-
            The request failed input validation. For example, a request
            parameter is outside the permitted range or an

            input path search query had an invalid IP protocol and ICMP type
            combination.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorInfo'
        '409':
          description: >-
            The system is currently processing this Snapshot.


            Note: GET /networks/{networkId}/snapshots/latestProcessed can be
            used to determine when processing of the

            latest Snapshot is done or to identify an alternate Snapshot that
            has already been processed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorInfo'
      security:
        - api_token: []
  /networks/{networkId}/paths-bulk-seq:
    post:
      tags:
        - Path Search
      summary: Trace sets of packets through the network (streaming)
      description: >-
        Efficiently performs multiple path searches through the network and
        streams them back in the

        [record separator-delimited
        JSON](https://en.wikipedia.org/wiki/JSON_streaming#Record_separator-delimited_JSON)

        (`json-seq`) format.


        See [Path Search](https://docs.fwd.app/latest/api/path-search/) for an
        introduction applicable to all the

        path search operations.


        If you wish to consume bulk query results as a conventional JSON array
        instead, use

        [the non-streaming
        variant](https://docs.fwd.app/latest/api/path-search/get-paths-bulk/) of
        this operation

        instead.
      operationId: getPathsBulkSeq
      parameters:
        - name: networkId
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/SnapshotId'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PathSearchBulkRequest'
        required: true
      responses:
        '200':
          description: >-
            The response is a sequence of a result (a `PathSearchResponse` or an
            error object) for each query in the

            request, in the same order. Each result is prefixed by an ASCII
            Record Separator (0x1E), and ends with an

            ASCII Line Feed character (0x0A), as described in [RFC 7464: JSON
            Text

            Sequences](https://tools.ietf.org/html/rfc7464). An error object has
            an `"error": true` property. Each query

            is evaluated independently.
          content:
            application/json-seq:
              itemSchema:
                $ref: '#/components/schemas/PathSearchResponse'
        '400':
          description: >-
            The request failed input validation. For example, a request
            parameter is outside the permitted range or an

            input path search query had an invalid IP protocol and ICMP type
            combination.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorInfo'
        '409':
          description: >-
            The system is currently processing this Snapshot.


            Note: GET /networks/{networkId}/snapshots/latestProcessed can be
            used to determine when processing of the

            latest Snapshot is done or to identify an alternate Snapshot that
            has already been processed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorInfo'
      security:
        - api_token: []
  /cve-index:
    get:
      tags:
        - System Administration
      summary: Export the CVE index
      description: >-
        The CVE index is a gzipped binary (.bin.gz) file.


        To download the latest one from fwd.app:


        `curl -vu <user>:<pass> https://fwd.app/api/cve-index -o
        cve-index.bin.gz`


        The response includes a `Digest` header containing the file’s SHA-256
        digest.
      operationId: getCveIndex
      responses:
        '200':
          description: OK
          content:
            application/gzip:
              schema:
                type: string
                format: byte
      security:
        - api_token: []
    put:
      tags:
        - System Administration
      summary: Import a new CVE index
      description: >-
        Replaces the CVE index in use.


        To upload a CVE index gzipped binary (.bin.gz) file downloaded from
        fwd.app:


        `curl -vu <user>:<pass> https://<host>/api/cve-index?sha=<digest> -T
        cve-index.bin.gz`


        The `sha` parameter is optional but recommended. The `<digest>` value
        can be found in the `Digest` response

        header when a CVE index is downloaded from fwd.app.


        **Note:** This operation is for on-premises deployments only.
      operationId: putCveIndex
      parameters:
        - name: sha
          in: query
          description: >-
            Optional SHA-256 digest (consisting of 64 hex digits) to use to
            verify the integrity of the CVE

            index
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: string
              format: byte
        required: true
      responses:
        '200':
          description: OK
          content: {}
      security:
        - api_token: []
