  # ------------------------------------------------------- predict assists ---
  # Forward AI applied to a change. Gated on AI_ALLOWED and PREDICT_AI_ASSIST,
  # and the change-set ones on PREDICT_MODELING as well, so most organizations
  # are refused with a 403 whatever else they are licensed for.
  /networks/{networkId}/change-sets/{changeSetId}/devices/{deviceName}/cli-assists:
    post:
      operationId: assistChangeSetCommands
      summary: Ask Forward AI to draft CLI commands for a device from a prompt
      x-forward-stability: unpublished
      tags: [Predict Assist]
      parameters:
        - { name: networkId, in: path, required: true, schema: { type: string } }
        - { name: changeSetId, in: path, required: true, schema: { type: string } }
        - { name: deviceName, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CliAssistRequest" }
            example: { prompt: "shut down the uplink to the branch" }
      responses:
        "200":
          description: The drafted commands, as one string.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CliAssistResponse" }
              example: { commands: "interface Ethernet1\n shutdown" }

  /networks/{networkId}/change-sets/{changeSetId}/overview-assists:
    post:
      operationId: assistChangeSetOverview
      summary: Ask Forward AI to name and describe the change set from its contents
      x-forward-stability: unpublished
      tags: [Predict Assist]
      parameters:
        - { name: networkId, in: path, required: true, schema: { type: string } }
        - { name: changeSetId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: A suggested name, description and tags.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OverviewAssistResponse" }
              example: { name: "Shut branch uplink", description: "Disables Ethernet1 on dc-core", tags: [maintenance] }

  /diffs/{beforeSnapshotId}/{afterSnapshotId}/config-summary-assists:
    post:
      operationId: assistConfigDiffSummary
      summary: Ask Forward AI to summarize the configuration changes between two snapshots
      x-forward-stability: unpublished
      tags: [Predict Assist]
      parameters:
        - { name: beforeSnapshotId, in: path, required: true, schema: { type: string } }
        - { name: afterSnapshotId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The summary.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SummaryAssistResponse" }
              example: { summary: "One interface was shut down on dc-core." }

  /diffs/{beforeSnapshotId}/{afterSnapshotId}/impact-summary-assists:
    post:
      operationId: assistImpactDiffSummary
      summary: Ask Forward AI to summarize the impact of the changes between two snapshots
      x-forward-stability: unpublished
      tags: [Predict Assist]
      parameters:
        - { name: beforeSnapshotId, in: path, required: true, schema: { type: string } }
        - { name: afterSnapshotId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The summary.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SummaryAssistResponse" }
              example: { summary: "Seven locations lose connectivity to the data centre." }

  # ------------------------------------------------- BGP advertisements ---
  # Route announcements a change set injects or withdraws at a device, as a
  # Predict input. Actions select the operation; bulk variants take arrays.
  /networks/{networkId}/change-sets/{changeSetId}/draft/devices/{deviceName}/bgp-advertisements?action=add:
    post:
      operationId: addBgpAdvertisement
      summary: Inject one BGP advertisement at a device
      x-forward-stability: unpublished
      tags: [BGP Advertisements]
      parameters:
        - { name: networkId, in: path, required: true, schema: { type: string } }
        - { name: changeSetId, in: path, required: true, schema: { type: string } }
        - { name: deviceName, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BgpAdvertisement" }
            example: { externalPeer: "10.0.0.2", prefix: "192.0.2.0/24", vrf: default, nextHop: "10.0.0.1", origin: IGP, asPath: [65001] }
      responses:
        "200":
          description: The draft after the change.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChangeSetDraft" }
              example: { id: CHG-101, name: x, networkId: "115", snapshotId: "656", savedAt: 1757584800000 }
  /networks/{networkId}/change-sets/{changeSetId}/draft/devices/{deviceName}/bgp-advertisements?action=bulkAdd:
    post:
      operationId: addBgpAdvertisements
      summary: Inject several BGP advertisements
      x-forward-stability: unpublished
      tags: [BGP Advertisements]
      parameters:
        - { name: networkId, in: path, required: true, schema: { type: string } }
        - { name: changeSetId, in: path, required: true, schema: { type: string } }
        - { name: deviceName, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BgpAdvertisementList" }
            example: [ { externalPeer: "10.0.0.2", prefix: "192.0.2.0/24", vrf: default, nextHop: "10.0.0.1", origin: IGP, asPath: [65001] } ]
      responses:
        "200":
          description: The draft after the change.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChangeSetDraft" }
              example: { id: CHG-101, name: x, networkId: "115", snapshotId: "656", savedAt: 1757584800000 }
  /networks/{networkId}/change-sets/{changeSetId}/draft/devices/{deviceName}/bgp-advertisements?action=remove:
    post:
      operationId: withdrawBgpAdvertisement
      summary: Withdraw one BGP advertisement
      x-forward-stability: unpublished
      tags: [BGP Advertisements]
      parameters:
        - { name: networkId, in: path, required: true, schema: { type: string } }
        - { name: changeSetId, in: path, required: true, schema: { type: string } }
        - { name: deviceName, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BgpAdvertisementKey" }
            example: { externalPeer: "10.0.0.2", prefix: "192.0.2.0/24", vrf: default }
      responses:
        "200":
          description: The draft after the change.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChangeSetDraft" }
              example: { id: CHG-101, name: x, networkId: "115", snapshotId: "656", savedAt: 1757584800000 }
  /networks/{networkId}/change-sets/{changeSetId}/draft/devices/{deviceName}/bgp-advertisements?action=bulkRemove:
    post:
      operationId: withdrawBgpAdvertisements
      summary: Withdraw several BGP advertisements
      x-forward-stability: unpublished
      tags: [BGP Advertisements]
      parameters:
        - { name: networkId, in: path, required: true, schema: { type: string } }
        - { name: changeSetId, in: path, required: true, schema: { type: string } }
        - { name: deviceName, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BgpAdvertisementKeyList" }
            example: [ { externalPeer: "10.0.0.2", prefix: "192.0.2.0/24", vrf: default } ]
      responses:
        "200":
          description: The draft after the change.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChangeSetDraft" }
              example: { id: CHG-101, name: x, networkId: "115", snapshotId: "656", savedAt: 1757584800000 }
  /networks/{networkId}/change-sets/{changeSetId}/draft/devices/{deviceName}/bgp-advertisements?action=restore:
    post:
      operationId: restoreBgpAdvertisement
      summary: Undo the change set's change to one advertisement
      x-forward-stability: unpublished
      tags: [BGP Advertisements]
      parameters:
        - { name: networkId, in: path, required: true, schema: { type: string } }
        - { name: changeSetId, in: path, required: true, schema: { type: string } }
        - { name: deviceName, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BgpAdvertisementKey" }
            example: { externalPeer: "10.0.0.2", prefix: "192.0.2.0/24", vrf: default }
      responses:
        "204": { description: Restored. }
  /networks/{networkId}/change-sets/{changeSetId}/draft/devices/{deviceName}/bgp-advertisements?action=bulkRestore:
    post:
      operationId: restoreBgpAdvertisements
      summary: Undo the change set's changes to several advertisements
      x-forward-stability: unpublished
      tags: [BGP Advertisements]
      parameters:
        - { name: networkId, in: path, required: true, schema: { type: string } }
        - { name: changeSetId, in: path, required: true, schema: { type: string } }
        - { name: deviceName, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BgpAdvertisementKeyList" }
            example: [ { externalPeer: "10.0.0.2", prefix: "192.0.2.0/24", vrf: default } ]
      responses:
        "204": { description: Restored. }
  /networks/{networkId}/change-sets/{changeSetId}/draft/devices/{deviceName}/bgp-advertisements?view=diffs:
    get:
      operationId: getDraftBgpAdvertisementDiffs
      summary: How the draft changes a device's BGP advertisements
      x-forward-stability: unpublished
      tags: [BGP Advertisements]
      parameters:
        - { name: networkId, in: path, required: true, schema: { type: string } }
        - { name: changeSetId, in: path, required: true, schema: { type: string } }
        - { name: deviceName, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The result.
          content:
            application/json:
              schema: 
                type: array
                items: { $ref: "#/components/schemas/BgpAdvertisementDiff" }
              example: [ { change: INJECTED, updateAdded: { externalPeer: "10.0.0.2", prefix: "192.0.2.0/24", vrf: default, nextHop: "10.0.0.1", origin: IGP, type: EBGP, asPath: [65001] } } ]
  /networks/{networkId}/change-sets/{changeSetId}/commits/{commitId}/devices/{deviceName}/bgp-advertisements?view=diffs:
    get:
      operationId: getCommitBgpAdvertisementDiffs
      summary: How a commit changed a device's BGP advertisements
      x-forward-stability: unpublished
      tags: [BGP Advertisements]
      parameters:
        - { name: networkId, in: path, required: true, schema: { type: string } }
        - { name: changeSetId, in: path, required: true, schema: { type: string } }
        - { name: commitId, in: path, required: true, schema: { type: string } }
        - { name: deviceName, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The result.
          content:
            application/json:
              schema: 
                type: array
                items: { $ref: "#/components/schemas/BgpAdvertisementDiff" }
              example: [ { change: INJECTED, updateAdded: { externalPeer: "10.0.0.2", prefix: "192.0.2.0/24", vrf: default, nextHop: "10.0.0.1", origin: IGP, type: EBGP, asPath: [65001] } } ]
  # ------------------------------------------------ change-set directories ---
  # The folder tree change sets are organised in. A directory path contains
  # slashes and travels percent-encoded in the URL, which the SDK does for you.
  /networks/{networkId}/change-set-directories:
    get:
      operationId: listChangeSetDirectories
      summary: Every directory and the change sets in it
      description: >-
        An object keyed by directory path, each value the ids of the change
        sets directly inside it. Empty directories appear with an empty list;
        the root itself does not appear as a key.
      x-forward-stability: unpublished
      tags: [Change Set Directories]
      parameters:
        - { name: networkId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The tree.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChangeSetDirectories" }
              example: { "/team": [CHG-101, CHG-102], "/team/archive": [] }
  /networks/{networkId}/change-set-directories/{dirPath}?action=addDir:
    post:
      operationId: createChangeSetDirectory
      summary: Create a directory inside another
      x-forward-stability: unpublished
      tags: [Change Set Directories]
      parameters:
        - { name: networkId, in: path, required: true, schema: { type: string } }
        - { name: dirPath, in: path, required: true, schema: { type: string }, description: "The directory path, starting with a slash. Sent percent-encoded." }
        - { name: name, in: query, required: true, schema: { type: string }, description: "The new directory's name." }
      responses:
        "204": { description: Done. }
  /networks/{networkId}/change-set-directories/{dirPath}?action=rename:
    post:
      operationId: renameChangeSetDirectory
      summary: Rename a directory
      x-forward-stability: unpublished
      tags: [Change Set Directories]
      parameters:
        - { name: networkId, in: path, required: true, schema: { type: string } }
        - { name: dirPath, in: path, required: true, schema: { type: string }, description: "The directory path, starting with a slash. Sent percent-encoded." }
        - { name: name, in: query, required: true, schema: { type: string }, description: "The new name." }
      responses:
        "204": { description: Done. }
  /networks/{networkId}/change-set-directories/{dirPath}?action=move:
    post:
      operationId: moveChangeSetDirectory
      summary: Move a directory under another
      x-forward-stability: unpublished
      tags: [Change Set Directories]
      parameters:
        - { name: networkId, in: path, required: true, schema: { type: string } }
        - { name: dirPath, in: path, required: true, schema: { type: string }, description: "The directory path, starting with a slash. Sent percent-encoded." }
        - { name: to, in: query, required: true, schema: { type: string }, description: "The destination directory path." }
      responses:
        "204": { description: Done. }
  /networks/{networkId}/change-set-directories/{dirPath}?action=moveChangeSetTo:
    post:
      operationId: moveChangeSetToDirectory
      summary: Move one change set into a directory
      x-forward-stability: unpublished
      tags: [Change Set Directories]
      parameters:
        - { name: networkId, in: path, required: true, schema: { type: string } }
        - { name: dirPath, in: path, required: true, schema: { type: string }, description: "The directory path, starting with a slash. Sent percent-encoded." }
        - { name: changeSetId, in: query, required: true, schema: { type: string }, description: "The change set to move." }
      responses:
        "204": { description: Done. }
  /networks/{networkId}/change-set-directories/{dirPath}?action=moveChangeSetsTo:
    post:
      operationId: moveChangeSetsToDirectory
      summary: Move several change sets into a directory
      x-forward-stability: unpublished
      tags: [Change Set Directories]
      parameters:
        - { name: networkId, in: path, required: true, schema: { type: string } }
        - { name: dirPath, in: path, required: true, schema: { type: string }, description: "The directory path, starting with a slash. Sent percent-encoded." }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChangeSetIds" }
            example: { changeSetIds: [CHG-101] }
      responses:
        "204": { description: Done. }
  /networks/{networkId}/change-set-directories/{dirPath}:
    delete:
      operationId: deleteChangeSetDirectory
      summary: Delete a directory
      description: >-
        By default the change sets inside are kept. Passing retainChangeSets
        as false deletes them too; only the literal false does.
      x-forward-stability: unpublished
      tags: [Change Set Directories]
      parameters:
        - { name: networkId, in: path, required: true, schema: { type: string } }
        - { name: dirPath, in: path, required: true, schema: { type: string } }
        - { name: retainChangeSets, in: query, required: false, schema: { type: boolean } }
      responses:
        "204": { description: Deleted. }
  # ------------------------------------------------- snapshot diff details ---
  # Everything else the diff service serves: per-area statistics, per-device
  # entries, files, devices, checks and the connectivity views. Each entry is
  # a before value `a` and an after value `b` with a diffType.
  /diffs/{beforeSnapshotId}/{afterSnapshotId}/checks?counts:
    get:
      operationId: getCheckDiffCounts
      summary: How many checks changed, by check type
      x-forward-stability: unpublished
      tags: [Snapshot Diff Details]
      parameters:
        - { name: beforeSnapshotId, in: path, required: true, schema: { type: string } }
        - { name: afterSnapshotId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The result.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CheckDiffCounts" }
              example: { Predefined: { count: 2, complete: true }, NQE: { count: 1, complete: false } }
  /diffs/{beforeSnapshotId}/{afterSnapshotId}/checks:
    get:
      operationId: getCheckDiffs
      summary: Check results that changed, for the given check types
      x-forward-stability: unpublished
      tags: [Snapshot Diff Details]
      parameters:
        - { name: beforeSnapshotId, in: path, required: true, schema: { type: string } }
        - { name: afterSnapshotId, in: path, required: true, schema: { type: string } }
        - { name: type, in: query, required: true, schema: { type: array, items: { type: string, enum: [Isolation, Reachability, Existential, QueryStringBased, Predefined, NQE] } }, description: "One or more check types. Blocks until computed." }
      responses:
        "200":
          description: The result.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChecksDiff" }
              example: { checks: [ { diffType: MODIFIED, a: { id: c1, status: PASS }, b: { id: c1, status: FAIL } } ] }
  /diffs/{beforeSnapshotId}/{afterSnapshotId}/checks?type=NQE:
    get:
      operationId: getNqeCheckDiffs
      summary: NQE check results that changed, without blocking
      description: >-
        Entries still computing carry diffType PROCESSING.
      x-forward-stability: unpublished
      tags: [Snapshot Diff Details]
      parameters:
        - { name: beforeSnapshotId, in: path, required: true, schema: { type: string } }
        - { name: afterSnapshotId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The result.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChecksDiff" }
              example: { checks: [ { diffType: PROCESSING, a: { id: c1, status: PASS }, b: null } ] }
  /diffs/{beforeSnapshotId}/{afterSnapshotId}/checks/{checkId}:
    get:
      operationId: getCheckDiffDetails
      summary: How one predefined check's findings changed
      description: >-
        Predefined checks only; other types are refused.
      x-forward-stability: unpublished
      tags: [Snapshot Diff Details]
      parameters:
        - { name: beforeSnapshotId, in: path, required: true, schema: { type: string } }
        - { name: afterSnapshotId, in: path, required: true, schema: { type: string } }
        - { name: checkId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The result.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CheckDiffDetails" }
              example: { check: { id: c1 }, details: [] }
  /diffs/{beforeSnapshotId}/{afterSnapshotId}/checks?stats:
    get:
      operationId: getCheckDiffStats
      summary: Added, deleted, modified and unchanged findings per check
      x-forward-stability: unpublished
      tags: [Snapshot Diff Details]
      parameters:
        - { name: beforeSnapshotId, in: path, required: true, schema: { type: string } }
        - { name: afterSnapshotId, in: path, required: true, schema: { type: string } }
        - { name: type, in: query, required: true, schema: { type: string, enum: [Predefined] }, description: "Only Predefined is accepted here." }
      responses:
        "200":
          description: The result.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CheckDiffStats" }
              example: { c1: { ADDED: 1, DELETED: 0, MODIFIED: 0, UNCHANGED: 5 } }
  /diffs/{beforeSnapshotId}/{afterSnapshotId}/checks?stats&type=NQE:
    get:
      operationId: getNqeCheckDiffStats
      summary: Per-check statistics for NQE checks, with processing state
      x-forward-stability: unpublished
      tags: [Snapshot Diff Details]
      parameters:
        - { name: beforeSnapshotId, in: path, required: true, schema: { type: string } }
        - { name: afterSnapshotId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The result.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NqeCheckDiffStats" }
              example: { checks: [ { queryId: FQ_1, processing: false, outdated: false, stats: { ADDED: 1, DELETED: 0, MODIFIED: 0, UNCHANGED: 5 } } ] }
  /diffs/{beforeSnapshotId}/{afterSnapshotId}/checks?action=compute&type=NQE:
    post:
      operationId: computeNqeCheckDiffs
      summary: Start computing diffs for the given NQE checks
      description: Only active NQE checks are accepted. Returns nothing; read the statistics afterwards.
      x-forward-stability: unpublished
      tags: [Snapshot Diff Details]
      parameters:
        - { name: beforeSnapshotId, in: path, required: true, schema: { type: string } }
        - { name: afterSnapshotId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NqeCheckDefinitions" }
            example: { definitions: [ { checkType: NQE, queryId: FQ_1 } ] }
      responses:
        "200": { description: Accepted. }
  /diffs/{beforeSnapshotId}/{afterSnapshotId}/files?count:
    get:
      operationId: getFileDiffCount
      summary: How many devices have changed files, by file type
      x-forward-stability: unpublished
      tags: [Snapshot Diff Details]
      parameters:
        - { name: beforeSnapshotId, in: path, required: true, schema: { type: string } }
        - { name: afterSnapshotId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The result.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FileDiffCount" }
              example: { count: 3, complete: true, types: { CONFIG: 2, STATE: 1 } }
  /diffs/{beforeSnapshotId}/{afterSnapshotId}/files:
    get:
      operationId: getFileDiffs
      summary: Which collected files changed, per device
      x-forward-stability: unpublished
      tags: [Snapshot Diff Details]
      parameters:
        - { name: beforeSnapshotId, in: path, required: true, schema: { type: string } }
        - { name: afterSnapshotId, in: path, required: true, schema: { type: string } }
        - { name: type, in: query, required: false, schema: { type: string, enum: [CONFIG, STATE, CUSTOM] }, description: "Restrict to one file type; absent means all." }
      responses:
        "200":
          description: The result.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CollectedFilesDiff" }
              example: { deviceInfos: [ { name: dc-core, deviceName: dc-core, files: [ { name: "dc-core,configuration.txt" } ], hasConfigChange: true } ] }
  /diffs/{beforeSnapshotId}/{afterSnapshotId}/devices:
    get:
      operationId: getDeviceDiffs
      summary: Devices added or removed
      x-forward-stability: unpublished
      tags: [Snapshot Diff Details]
      parameters:
        - { name: beforeSnapshotId, in: path, required: true, schema: { type: string } }
        - { name: afterSnapshotId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The result.
          content:
            application/json:
              schema: 
                type: array
                items: { $ref: "#/components/schemas/DeviceDiffEntry" }
              example: [ { diffType: ADDED, a: null, b: { name: new-sw, vendor: ARISTA, deviceType: SWITCH } } ]
  /diffs/{beforeSnapshotId}/{afterSnapshotId}/cloud-objects?count:
    get:
      operationId: getCloudObjectDiffCount
      summary: How many cloud objects changed
      x-forward-stability: unpublished
      tags: [Snapshot Diff Details]
      parameters:
        - { name: beforeSnapshotId, in: path, required: true, schema: { type: string } }
        - { name: afterSnapshotId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The result.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DiffCount" }
              example: { count: 0, complete: true }
  /diffs/{beforeSnapshotId}/{afterSnapshotId}/cloud-objects:
    get:
      operationId: getCloudObjectDiffs
      summary: Cloud objects added, removed or modified
      x-forward-stability: unpublished
      tags: [Snapshot Diff Details]
      parameters:
        - { name: beforeSnapshotId, in: path, required: true, schema: { type: string } }
        - { name: afterSnapshotId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The result.
          content:
            application/json:
              schema: 
                type: array
                items: { $ref: "#/components/schemas/CloudObjectDiffEntry" }
              example: [ { diffType: MODIFIED, a: { id: vpc-1, cloudType: AWS }, b: { id: vpc-1, cloudType: AWS } } ]
  /diffs/{beforeSnapshotId}/{afterSnapshotId}/interfaces:
    get:
      operationId: getInterfaceDiffStats
      summary: Per-device interface change statistics
      x-forward-stability: unpublished
      tags: [Snapshot Diff Details]
      parameters:
        - { name: beforeSnapshotId, in: path, required: true, schema: { type: string } }
        - { name: afterSnapshotId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The result.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeviceDiffStats" }
              example: { deviceInfos: [ { name: dc-core, hasConfigChange: true, stats: { ADDED: 1, DELETED: 0, MODIFIED: 2, UNCHANGED: 40 } } ] }
  /diffs/{beforeSnapshotId}/{afterSnapshotId}/interfaces/devices/{deviceName}:
    get:
      operationId: getDeviceInterfaceDiffs
      summary: One device's interface changes
      x-forward-stability: unpublished
      tags: [Snapshot Diff Details]
      parameters:
        - { name: beforeSnapshotId, in: path, required: true, schema: { type: string } }
        - { name: afterSnapshotId, in: path, required: true, schema: { type: string } }
        - { name: deviceName, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The result.
          content:
            application/json:
