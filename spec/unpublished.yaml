                lastMonth: ONE_PER_DAY
                lastQuarter: ONE_PER_WEEK
                lastYear: ONE_PER_WEEK
                older: ONE_PER_WEEK
    put:
      operationId: setSnapshotRetentionPolicy
      summary: Replace the snapshot thinning policy
      description: 'Replaces the policy. It changes which snapshots the daily cleanup deletes, so a stricter policy is a later deletion; previewSnapshotRetention shows what would go. lastWeek must be ALL, and each later period may not be finer than the one before, with the per-period sets enforced by SnapshotRetentionPolicy''s constructor (source). Only on-prem deployments accept it: on cloud the controller throws NotFoundException (the Go SDK reports the message ''policy modification not allowed on cloud''; the Java source passes no message). Gated by EDIT_COLLECTION_SETTINGS and DELETE_SNAPSHOT. Source only: not called.'
