# operationIds that intentionally have no SDK method.
#
# Every other operationId in spec/forward-openapi.yaml must be implemented by
# exactly one method on both the sync and async clients; tests/spec/test_coverage.py
# enforces that. Entries here need a reason, and `pending` shrinks to empty as
# the phased delivery completes.
skip: {}

pending:
  reason: >-
    Every operation in the description has a request builder and a service
    method.
  operation_ids: []
