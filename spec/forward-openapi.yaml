            Ignored unless `baseUrl` uses the https scheme. Omit to leave this
            property alone.
          examples:
            - false
        credentialId:
          type: string
          description: >-
            The `id` of an HttpCredential to authenticate with. Null if the
            service accepts unauthenticated requests. Omit to

            leave this property alone.
          examples:
            - H-5
        proxyServerId:
          type: string
          description: >-
            The `id` of a proxy server to route requests through. Null if the
            Collector reaches the service directly. Omit to

            leave this property alone.
          examples:
            - P-1
        extraHeaders:
          type: object
          additionalProperties:
            type: string
          description: >-
            HTTP headers to send with every request to this service. These
            headers should not contain sensitive data; use

            `credentialId` to authenticate. Replaces every header previously
            configured. Omit to leave this property alone.
          examples:
            - accept: application/json
        endpoints:
          type: array
          items:
            $ref: '#/components/schemas/HttpEndpoint'
          description: >-
            The HTTP GET requests to issue on every collection, each one
            relative to `baseUrl`. Never empty. Replaces the

            whole list, so include every endpoint you want to keep. Omit to
            leave this property alone.
          examples:
            - - name: subnets
                path: /api/v2/subnets
              - name: addresses
                path: /api/v2/addresses
        collect:
          type: boolean
          description: >-
            Whether to collect from this data connector. Omit to leave this
            property alone.
          examples:
            - true
        collectorId:
          type: string
          description: >-
            The `id` of the Collector that should collect from this data
            connector. Null if Forward should pick an online

            Collector that supports it. Omit to leave this property alone.
