        - { name: filterId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SecurityMatrixFilterUpdate" }
            example: { timeoutMins: 10 }
      responses:
        "200":
          description: The updated filter.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SecurityMatrixFilter" }
              example: { id: "1", name: sdk-test, resourcePools: [{ type: DEVICE_ZONE, device: ash-dc-fw01, zone: api, name: "ash-dc-fw01 api" }], createdAt: 1789225615855, createdByUserId: "100", lastEditedAt: 1789225616009, lastEditedByUserId: "100", timeoutMins: 10 }
    delete:
      operationId: deleteSecurityMatrixFilter
      summary: Delete a saved security matrix filter
      x-forward-stability: unpublished
      tags: [Security Matrix Filters]
      parameters:
        - { name: networkId, in: path, required: true, schema: { type: string } }
        - { name: filterId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Deleted.
          content:
            application/json:
              schema: { type: object }
              example: {}

