  /networks/{networkId}/devices:
    get:
      tags:
        - Network Devices
      summary: Get all network devices
      description: >-
        All glob filter parameters ignore case and support [the common glob

        wildcards](https://en.wikipedia.org/wiki/Glob_(programming)#Syntax)
        (`*`, `?`, `[abc]`, `[a-z]`).
      operationId: getDevices
      parameters:
        - name: networkId
          in: path
          required: true
          schema:
            type: string
        - name: name
          in: query
          description: '`"name"` glob filter'
          schema:
            type: string
        - name: displayName
          in: query
          description: >-
            `"displayName"` glob filter. Use `?displayName=` to request devices
            that have no `"displayName"` property

            (because it’s the same as `"name"`).
          schema:
            type: string
        - name: sourceName
          in: query
          description: >-
            `"sourceName"` glob filter. Use `?sourceName=` to request devices
            that have no `"sourceName"` property

            (because it’s the same as `"name"`).
          schema:
            type: string
        - name: type
          in: query
          description: '`"type"` glob filter'
          schema:
            type: string
        - name: vendor
          in: query
          description: '`"vendor"` glob filter'
          schema:
            type: string
        - name: model
          in: query
          description: >-
            `"model"` glob filter. Use `?model=` to request devices with no
            `"model"` property.
          schema:
            type: string
        - name: platform
          in: query
          description: '`"platform"` glob filter'
          schema:
            type: string
        - name: osVersion
          in: query
          description: >-
            `"osVersion"` glob filter. Use `?osVersion=` to request devices with
            no `"osVersion"` property.
          schema:
            type: string
        - name: collectionError
          in: query
          description: >-
            `"collectionError"` glob filter. Use `?collectionError=` to request
            devices with no `"collectionError"`

            property (because collection succeeded). Use `?collectionError=*` to
            request devices that had a collection

            error of any kind.
          schema:
            type: string
        - name: processingError
          in: query
          description: >-
            `"processingError"` glob filter. Use `?processingError=` to request
            devices with no `"processingError"`

            property (because processing succeeded). Use `?processingError=*` to
            request devices that had a processing

            error of any kind.
          schema:
            type: string
        - name: skip
          in: query
          description: Number of devices to skip (for paging)
          schema:
            type: integer
            format: int32
            default: 0
        - name: limit
          in: query
          description: Maximum number of devices desired
          schema:
            type: integer
            format: int32
        - name: with
          in: query
          description: Optional device properties to include
          schema:
            type: array
            items:
              type: string
              enum:
                - tags
                - locationId
        - $ref: '#/components/parameters/SnapshotId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Device'
        '409':
          description: >-
            The system is currently processing this Snapshot.


            Note: GET /networks/{networkId}/snapshots/latestProcessed can be
            used to determine when processing of the

            latest Snapshot is done or to identify an alternate Snapshot that
            has already been processed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorInfo'
      security:
        - api_token: []
