  # --------------------------------------------------------------- webhooks ---
  /webhooks:
    get:
      operationId: listWebhooks
      summary: The org's webhooks and their last test results
      x-forward-stability: unpublished
      tags: [Webhooks]
      responses:
        "200":
          description: The webhooks.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebhooksAndTestResults" }
              example:
                webhooks:
                  - name: predict-pipeline
                    url: https://example.invalid/hook
                    disableSslValidation: false
                    eventParams: { type: SNAPSHOT_READY, networkIds: ["115"] }
                    enabled: true
                testResults:
                  predict-pipeline: { instant: 1757584800000 }
    post:
      operationId: createWebhook
      summary: Create a webhook
      description: >-
        For SNAPSHOT_READY, eventParams.networkIds must be present; an empty
        list means every network in the org, but omitting the key is refused
        with a 400 that carries no message. Predicted snapshots fire
        SNAPSHOT_READY too, which is what makes an event-driven Predict
        pipeline possible. Needs OUTBOUND_CONNECTIONS on the deployment.
      x-forward-stability: unpublished
      tags: [Webhooks]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Webhook" }
            example:
              name: predict-pipeline
              url: https://example.invalid/hook
              eventParams: { type: SNAPSHOT_READY, networkIds: ["115"] }
      responses:
        "201": { description: Created. }

  /webhooks?action=test:
    post:
      operationId: testWebhookDefinition
      summary: Send a test event to a webhook definition without saving it
      x-forward-stability: unpublished
      tags: [Webhooks]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Webhook" }
            example:
              name: predict-pipeline
              url: https://example.invalid/hook
              eventParams: { type: SNAPSHOT_READY, networkIds: [] }
      responses:
        "200":
          description: Whether the delivery succeeded.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebhookTestResult" }
              example: { instant: 1757584800000 }

  /webhooks/{webhookName}:
    patch:
      operationId: updateWebhook
      summary: Change a webhook
      description: >-
        Every field is optional and omitted means unchanged. Changing the url,
        SSL setting or credential re-tests the connection as part of the update.
      x-forward-stability: unpublished
      tags: [Webhooks]
      parameters:
        - { name: webhookName, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WebhookPatch" }
            example: { enabled: false }
      responses:
        "204": { description: Updated. }
    delete:
      operationId: deleteWebhook
      summary: Delete a webhook
      x-forward-stability: unpublished
      tags: [Webhooks]
      parameters:
        - { name: webhookName, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Deleted. }

  /webhooks/{webhookName}?action=test:
    post:
      operationId: testWebhook
      summary: Send a test event to a saved webhook
      x-forward-stability: unpublished
      tags: [Webhooks]
      parameters:
        - { name: webhookName, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Whether the delivery succeeded.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebhookTestResult" }
              example: { instant: 1757584800000, error: "connect timed out" }

  /webhook-types/{eventType}?view=default-templates:
    get:
      operationId: getWebhookDefaultTemplates
      summary: The default payload templates for an event type
      x-forward-stability: unpublished
      tags: [Webhooks]
      parameters:
        - { name: eventType, in: path, required: true, schema: { type: string, enum: [SNAPSHOT_READY, NQE_VERIFICATION_FAILURE, INTENT_VERIFICATION_FAILURE] } }
      responses:
        "200":
          description: The templates.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/WebhookTemplate" }
              example:
                - { payloadFormat: JSON, template: "{...}" }

