  /networks/{networkId}/change-sets/{changeSetId}/commits/{commitId}:
    patch:
      operationId: editChangeSetCommitNote
      summary: Replace a committed version's note
      description: >-
        note is a required query parameter and must not be blank. Requires the
        MANAGE_CHANGE_SETS network permission and the PREDICT_MODELING organization
        property. Source-only: the read-only account cannot list change sets (403 live).
      x-forward-stability: unpublished
      tags: [Change Sets]
      parameters:
        - { name: networkId, in: path, required: true, schema: { type: string } }
        - { name: changeSetId, in: path, required: true, schema: { type: string } }
        - { name: commitId, in: path, required: true, schema: { type: string } }
        - { name: note, in: query, required: true, description: The new note. Must not be blank., schema: { type: string } }
      responses:
        "200":
          description: The commit's metadata after the change.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChangeSetCommit" }
              # from source: ChangeSetCommit fields; placeholder values
              example: { commitId: "1", committedAt: "2026-01-01T00:00:00Z", committedBy: example, committedById: "1", note: "Reviewed" }

    delete:
      operationId: deleteChangeSetCommit
      summary: Delete a committed version and the predicted snapshots made from it
      description: >-
        Removes the version from the change set's history and deletes the predicted
        snapshots made from it, in one transaction. This cannot be undone. Requires
        the MANAGE_CHANGE_SETS network permission and the PREDICT_MODELING
        organization property. Source-only: not called live.
      x-forward-stability: unpublished
      tags: [Change Sets]
      parameters:
        - { name: networkId, in: path, required: true, schema: { type: string } }
        - { name: changeSetId, in: path, required: true, schema: { type: string } }
        - { name: commitId, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Deleted. }

  /networks/{networkId}/change-sets/{changeSetId}/commits/{commitId}?action=restore:
    post:
      operationId: restoreChangeSetCommit
      summary: Restore a committed version as the change set's draft
      description: >-
        Requires the MANAGE_CHANGE_SETS network permission and the PREDICT_MODELING
        organization property. Source-only: not called live.
      x-forward-stability: unpublished
      tags: [Change Sets]
      parameters:
        - { name: networkId, in: path, required: true, schema: { type: string } }
