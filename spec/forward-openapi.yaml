    VulnerabilityDetectionResult:
      type: object
      required:
        - device
        - vulnerable
      properties:
        device:
          type: string
          examples:
            - dev01
        vulnerable:
          type: boolean
          description: Absent if an error prevented analysis from completing
          examples:
            - false
        fileLines:
          type: object
          additionalProperties:
            type: array
            items:
              $ref: '#/components/schemas/LineRange'
          description: Relevant source file lines for the device and CVE
          examples:
            - dev01,configuration.txt:
                - start: 117
                  end: 119
    OsVulnerability:
      type: object
      required:
        - id
        - severity
        - vendor
        - os
        - osVersions
        - dependsOnConfig
        - detectionMethod
      properties:
        id:
          type: string
          description: >-
            The Common Vulnerabilities and Exposures
            ([CVE](https://www.cve.org)) ID assigned to this vulnerability in

            the National Vulnerability Database ([NVD](https://nvd.nist.gov))
          examples:
            - CVE-2019-0201
        description:
          type: string
          examples:
            - >-
              An issue is present in Apache ZooKeeper 1.0.0 to 3.4.13 and
              3.5.0-alpha to 3.5.4-beta. ZooKeeper’s getACL()

              command…
        severity:
          type: string
          examples:
            - MEDIUM
          enum:
            - NONE
            - LOW
            - MEDIUM
            - HIGH
            - CRITICAL
        url:
          type: string
          description: >-
            URL of this vulnerability’s vendor advisory, if available, or else
            the URL of the best source of information

            about the vulnerability that’s currently available
          examples:
            - >-
              https://www.a10networks.com/blog/cve-2016-0270-gcm-nonce-vulnerability
        publishedDate:
          type: string
          examples:
            - '2023-12-31'
        v2Score:
          type: number
          format: double
          description: >-
            Score assigned by the Common Vulnerability Scoring System
            ([CVSS](https://nvd.nist.gov/vuln-metrics/cvss))

            v2.0 standard
          examples:
            - 6.1
        v3Score:
          type: number
          format: double
          description: >-
            Score assigned by the Common Vulnerability Scoring System
            ([CVSS](https://nvd.nist.gov/vuln-metrics/cvss))

            v3.x standard
          examples:
            - 9.8
        v4Score:
          type: number
          format: double
          description: >-
            Score assigned by the Common Vulnerability Scoring System

            ([CVSS](https://www.first.org/cvss/v4.0/specification-document))
            v4.0 standard
          examples:
            - 8.4
        knownExploitSource:
          type: string
          description: >-
            `CISA` if the vulnerability is in the Cybersecurity and
            Infrastructure Security Agency’s Known Exploited

            Vulnerabilities
            ([KEV](https://www.cisa.gov/known-exploited-vulnerabilities-catalog))
            catalog. `VENDOR` if

            the vendor advisory (the page at `url`) indicates that the
            vulnerability has a known exploit. Absent

            otherwise.
          examples:
            - CISA
          enum:
            - CISA
            - VENDOR
        weaknesses:
          type: array
          items:
            type: string
          description: >-
            Common Weakness Enumeration
            ([CWE](https://cwe.mitre.org/about/new_to_cwe.html)) IDs associated
            with this

            CVE
          examples:
            - - CWE-123
        vendor:
          $ref: '#/components/schemas/VulnerabilityVendor'
          examples:
            - ARISTA
        os:
          $ref: '#/components/schemas/VulnerabilityVendorOs'
          examples:
            - arista_eos
        osVersions:
          type: array
          items:
            type: string
          examples:
            - - 4.15.0F
        dependsOnConfig:
          type: boolean
          description: >-
            Whether the CVE depends on configuration for this OS. Null if
            unknown.
          examples:
            - true
        detectionMethod:
          type: string
          description: >-
            How the set of possibly matching devices was constructed. `CONFIG`
            means that the analysis was more thorough

            than using just the OS version. The `CONFIG` method yields fewer
            false positives.
          examples:
            - OS_VERSION
          enum:
            - OS_VERSION
            - CONFIG
        devices:
          type: array
          items:
            type: string
          description: >-
            Possibly impacted devices. Present when `detectionMethod` is
            "OS_VERSION".
          examples:
            - - dev01
              - dev02
        deviceResults:
          type: array
          items:
            $ref: '#/components/schemas/VulnerabilityDetectionResult'
          description: >-
            Results of device configuration analysis for this vulnerability.
            Present when `detectionMethod`

            is "CONFIG".
    CveInfo:
      type: object
      properties:
        id:
          type: string
          description: >-
            The Common Vulnerabilities and Exposures
            ([CVE](https://www.cve.org)) ID assigned to this vulnerability in

            the National Vulnerability Database ([NVD](https://nvd.nist.gov)).
          examples:
            - CVE-2019-0201
        description:
          type: string
          description: This vulnerability’s description in the [NVD](https://nvd.nist.gov).
          examples:
            - >-
              An issue is present in Apache ZooKeeper 1.0.0 to 3.4.13 and
              3.5.0-alpha to 3.5.4-beta. ZooKeeper’s getACL()

              command…
        hasCisaKevEntry:
          type: boolean
          description: >-
            Whether CISA’s [KEV
            Catalog](https://www.cisa.gov/known-exploited-vulnerabilities-catalog)
            mentions a known

            exploit for this CVE.
        weaknesses:
          type: array
          items:
            type: string
          description: >-
            Common Weakness Enumeration
            ([CWE](https://cwe.mitre.org/about/new_to_cwe.html)) IDs associated
            with this

            CVE.
          examples:
            - - CWE-345
              - CWE-765
    CveOsInfo:
      type: object
      required:
        - vendor
        - os
        - severity
      properties:
        vendor:
          $ref: '#/components/schemas/VulnerabilityVendor'
        os:
          $ref: '#/components/schemas/VulnerabilityVendorOs'
        severity:
          type: string
          description: >-
            Severity based on one of this vulnerability’s CVSS scores according
            to the [Qualitative Severity

            Ratings](https://nvd.nist.gov/vuln-metrics/cvss#:~:text=Qualitative%20Severity%20Ratings)
            table. The priority

            order of scores is `v4Score`, then `v3Score`, then `v2Score`. "NONE"
            if no CVSS score is available for this

            vulnerability.
          enum:
            - NONE
            - LOW
            - MEDIUM
            - HIGH
            - CRITICAL
        v2Score:
          type: number
          format: double
          description: >-
            Score assigned by the Common Vulnerability Scoring System
            ([CVSS](https://nvd.nist.gov/vuln-metrics/cvss))

            v2.0 standard.
          examples:
            - 6.1
        v3Score:
          type: number
          format: double
          description: >-
            Score assigned by the Common Vulnerability Scoring System
            ([CVSS](https://nvd.nist.gov/vuln-metrics/cvss))

            v3.x standard.
          examples:
            - 9.8
        v4Score:
          type: number
          format: double
          description: >-
            Score assigned by the Common Vulnerability Scoring System

            ([CVSS](https://www.first.org/cvss/v4.0/specification-document))
            v4.0 standard.
          examples:
            - 8.4
        url:
          type: string
          description: >-
            URL of this vulnerability’s vendor advisory, if available, or else
            the URL of the best source of information

            about the vulnerability that’s currently available.
          examples:
            - >-
              https://www.a10networks.com/blog/cve-2016-0270-gcm-nonce-vulnerability
        publishDate:
          type: string
          description: Publication date of the information at `url` if known.
          examples:
            - '2023-12-31'
        advisoryMentionsExploit:
          type: boolean
          description: >-
            Whether the vendor advisory at `url` says there’s a known exploit.
            Included only if true.
        configDependent:
          type: boolean
          description: >-
            Whether this vulnerability depends on a device’s configuration for
            this OS. Absent if unknown.
        configAnalysis:
          type: string
          description: >-
            Present and can be any allowed value if `configDependent` is true.
            Absent if `configDependent` is false.

            Can be either "UNSUPPORTED" or absent if `configDependent` is absent
            (unknown).
          enum:
            - UNSUPPORTED
            - IN_PROGRESS
            - SUPPORTED
    DetectionResult:
      type: string
      enum:
        - VULNERABLE
        - OS_VULNERABLE
        - UNIMPLEMENTED
        - UNCONFIRMED
        - NOT_VULNERABLE
    DetectionResultDeviceCount:
      type: object
      properties:
        result:
          $ref: '#/components/schemas/DetectionResult'
          examples:
            - VULNERABLE
        deviceCount:
          type: integer
          format: int32
          examples:
            - 80
    CveOsInfoWithDeviceCounts:
      allOf:
        - $ref: '#/components/schemas/CveOsInfo'
        - type: object
          properties:
            osVersions:
              type: array
              items:
                type: string
              description: >-
                The OS versions of the devices in the network that are
                potentially affected by this CVE.
              examples:
                - - 4.15.0F
            deviceCount:
              type: integer
              format: int32
              description: >-
                Total number of devices in the network that are running an
                affected version of this OS and thus are

                potentially affected by this CVE.
              examples:
                - 200
            resultCounts:
              type: array
              items:
                $ref: '#/components/schemas/DetectionResultDeviceCount'
              description: >-
                The number of devices in the network that are potentially
                affected by this CVE broken down by detection

                result. These counts add up to `deviceCount`.
              examples:
                - - result: VULNERABLE
                    deviceCount: 80
                  - result: NOT_VULNERABLE
                    deviceCount: 120
            locationIds:
              type: array
              items:
                type: string
              description: >-
                The IDs of the locations of the devices in the network that are
                potentially affected by this CVE.
              examples:
                - - atl
                  - nyc-b
            tags:
              type: array
              items:
                type: string
              description: >-
                Tags associated with any devices in the network that are
                potentially affected by this CVE. Absent if the

                devices have no tags.
              examples:
                - - SEC
    Vulnerability:
      allOf:
        - $ref: '#/components/schemas/CveInfo'
        - type: object
          properties:
            osInfos:
              type: array
              items:
                $ref: '#/components/schemas/CveOsInfoWithDeviceCounts'
              description: >-
                OS-specific information about this CVE. Includes a summary of
                analysis results for devices with each affected

                operating system.
    VulnerabilityDevice:
      type: object
      properties:
        name:
          type: string
          description: >-
            The name that uniquely identifies the device in the network. For
            most devices, this is the user-assigned

            [classic device](https://docs.fwd.app/latest/api/classic-devices/)
            name. For a virtual context, this is the

            classic device name plus context name. For a cloud device, this is a
            globally unique identifier assigned by the

            cloud provider.
          examples:
            - nyc-dc01-fw02
        osVersion:
          type: string
          description: The device’s operating system version in the network Snapshot.
          examples:
            - 4.15.0F
        model:
          type: string
          description: The device’s model name.
          examples:
            - BIG-IP Virtual Edition
        managementIps:
          type: array
          items:
            type: string
          description: The device’s management IP addresses.
          examples:
            - - 10.10.10.10
        tags:
          type: array
          items:
            type: string
          description: Tags assigned to the device. Absent if the device has none.
          examples:
            - - SEC
        locationId:
          type: string
          description: >-
            The `id` of the device’s assigned
            [location](https://docs.fwd.app/latest/api/network-locations/).
          examples:
            - nyc
        internetAddressable:
          type: boolean
          description: Whether the device can receive internet traffic.
    VulnerabilityDeviceWithResult:
      allOf:
        - $ref: '#/components/schemas/VulnerabilityDevice'
        - type: object
          properties:
            status:
              type: string
              description: The device’s vulnerability status for the CVE.
              examples:
                - VULNERABLE
              enum:
                - VULNERABLE
                - POTENTIALLY_VULNERABLE
                - NOT_VULNERABLE
            result:
              $ref: '#/components/schemas/DetectionResult'
              description: >-
                The device’s [detection
                result](https://docs.fwd.app/latest/application/security/vulnerability/#detection-results)

                for the CVE.
              examples:
                - VULNERABLE
            fileRanges:
              type: object
              additionalProperties:
                type: array
                items:
                  $ref: '#/components/schemas/LineRange'
              description: >-
                Relevant line ranges in the device’s configuration. Property
                names in this object are filenames. Use

                [Get device data file
                content](https://docs.fwd.app/latest/api/network-devices/get-device-file-content/)
                to

                obtain a referenced file.
              examples:
                - nyc-dc01-fw02,configuration.txt:
                    - start: 286
                      end: 291
    CveOsInfoWithDevices:
      allOf:
        - $ref: '#/components/schemas/CveOsInfo'
        - type: object
          properties:
            description:
              type: string
              description: The CVE description published at `url`.
              examples:
                - >-
                  Back in February we were contacted by Hanno Böck who had
                  discovered an issue with how certain...
            devices:
              type: array
              items:
                $ref: '#/components/schemas/VulnerabilityDeviceWithResult'
              description: >-
                Devices in the network that are running an affected version of
                this OS and thus are potentially affected by

                this CVE. A detection result is included for each device.
                Relevant lines of device configuration are

                included for each device as well when possible.
    CustomCveStatus:
      type: string
      description: >-
        A vulnerability status a rule can assign to the devices it matches,
        overriding the automatically computed status:

        `VULNERABLE` marks the devices as affected by the CVE, and
        `NOT_VULNERABLE` marks them as unaffected.
      enum:
        - NOT_VULNERABLE
        - VULNERABLE
    WanCircuit:
      type: object
      required:
        - name
        - connection1
        - connection2
      properties:
        name:
          type: string
          examples:
            - wan-circuit-01
        connection1:
          $ref: '#/components/schemas/WanCircuitConnection'
        connection2:
          $ref: '#/components/schemas/WanCircuitConnection'
    WanCircuitList:
      type: object
      properties:
        wanCircuits:
          type: array
          items:
            $ref: '#/components/schemas/WanCircuit'
    WanCircuitPatch:
      type: object
      properties:
        name:
          type: string
          examples:
            - wan-circuit-01
        connection1:
          $ref: '#/components/schemas/WanCircuitConnection'
        connection2:
          $ref: '#/components/schemas/WanCircuitConnection'
    WanCircuitConnection:
      type: object
      required:
        - device
        - port
      properties:
        device:
          type: string
          description: A customer edge device name
        port:
          type: string
          description: The name of the connected port on `device`
        vlan:
          type: integer
          format: int32
          description: The VLAN of traffic from `port`, if tagged
          examples:
            - 100
        name:
          type: string
          description: >-
            An optional name for this connection, which will be used as the
            interface name created on the synthetic

            device that links to the edge device.
  parameters:
    SnapshotId:
      name: snapshotId
      in: query
      description: >-
        An optional Snapshot id. If omitted, the network’s latest processed
        Snapshot is used.
      schema:
        type: string
    SnapshotExportOnly:
      name: only
      in: query
      description: Use `?only=CONFIG` to include only device configuration files.
      schema:
        type: string
        const: CONFIG
