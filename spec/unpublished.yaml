      responses:
        "200":
          description: The updated filter.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SecurityMatrixFilter" }
              example: { id: "1", name: sdk-test, resourcePools: [{ type: DEVICE_ZONE, device: ash-dc-fw01, zone: api, name: "ash-dc-fw01 api" }], createdAt: 1789225615855, createdByUserId: "100", lastEditedAt: 1789225616009, lastEditedByUserId: "100", timeoutMins: 10 }
    delete:
