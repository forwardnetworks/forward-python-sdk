                serviceEndpoint: https://s3.example.com
                disableSslValidation: false
                writeOnly: false
                disableChecksumValidation: false
    patch:
      operationId: updateS3BackupStorage
      summary: Change the S3 storage settings for backups
      description: >-
        Requires the ADMINISTER_SYSTEM system permission. Omitted fields keep their stored values. For certificate,
        an explicit null clears the stored certificate; for the other fields, null keeps the stored value. Source-only.
      x-forward-stability: unpublished
      tags: [Backups]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SysS3StorageSettingsPatch'
      responses:
        "200":
          description: The settings after the change. The secret key is not returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SysS3StorageSettings'
              # # from source: backend/cbr/cbr-common/src/main/java/com/forwardnetworks/cbr/settings/s3/S3StorageSettings.java (secretKey is @JsonIgnore, so absent)
              example:
                accessKey: EXAMPLEACCESSKEY
                bucketName: example-backup-bucket
                serviceEndpoint: https://s3.example.com
                disableSslValidation: false
                writeOnly: false
                disableChecksumValidation: false
