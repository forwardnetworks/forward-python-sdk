  # -------------------------------------------------------- connectivity tests ---
  # Whether Forward can reach and authenticate to a classic device or network
  # endpoint, run on demand rather than waiting for the next scheduled
  # collection. Results are per source; there is no job handle to poll, so the
  # published SourceConnectivityResult is read again once it settles.
  /networks/{networkId}/connectivityTests/start:
    post:
      operationId: startConnectivityTests
      summary: Start a connectivity test for every classic device in the network
      x-forward-stability: unpublished
      tags: [Connectivity Tests]
      parameters:
        - { name: networkId, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Started. }

  /networks/{networkId}/connectivityTests/stop:
    post:
      operationId: stopConnectivityTests
      summary: Stop every running connectivity test in the network
      x-forward-stability: unpublished
      tags: [Connectivity Tests]
      parameters:
        - { name: networkId, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Stopped. }

  /networks/{networkId}/connectivityTests/bulkStart:
    post:
      operationId: bulkStartConnectivityTests
      summary: Start a connectivity test for the given classic devices
      x-forward-stability: unpublished
      tags: [Connectivity Tests]
      parameters:
        - { name: networkId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeviceSet" }
            example: { devices: [fw01, fw02] }
      responses:
        "204": { description: Started. }

  /networks/{networkId}/connectivityTests/bulkStart?type=endpoint:
    post:
      operationId: bulkStartNetworkEndpointConnectivityTests
      summary: Start a connectivity test for the given network endpoints
      x-forward-stability: unpublished
      tags: [Connectivity Tests]
      parameters:
        - { name: networkId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeviceSet" }
            example: { devices: [app01-endpoint] }
      responses:
        "204": { description: Started. }

  /networks/{networkId}/connectivityTests/bulkStop:
    post:
      operationId: bulkStopConnectivityTests
      summary: Stop the connectivity tests running for the given sources
      x-forward-stability: unpublished
      tags: [Connectivity Tests]
      parameters:
        - { name: networkId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeviceSet" }
            example: { devices: [fw01] }
      responses:
        "204": { description: Stopped. }

  /networks/{networkId}/connectivityTests/{deviceName}/start:
    post:
      operationId: startConnectivityTest
      summary: Start a connectivity test for one classic device
      x-forward-stability: unpublished
      tags: [Connectivity Tests]
      parameters:
        - { name: networkId, in: path, required: true, schema: { type: string } }
        - { name: deviceName, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Started. }

  /networks/{networkId}/connectivityTests/{deviceName}/start?type=endpoint:
    post:
      operationId: startNetworkEndpointConnectivityTest
      summary: Start a connectivity test for one network endpoint
      x-forward-stability: unpublished
      tags: [Connectivity Tests]
      parameters:
        - { name: networkId, in: path, required: true, schema: { type: string } }
        - { name: deviceName, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Started. }

  /networks/{networkId}/connectivityTests/{deviceName}/stop:
    post:
      operationId: stopConnectivityTest
      summary: Stop the connectivity test running for one source
      x-forward-stability: unpublished
      tags: [Connectivity Tests]
      parameters:
        - { name: networkId, in: path, required: true, schema: { type: string } }
        - { name: deviceName, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Stopped. }

  /networks/{networkId}/connectivityTests:
    get:
      operationId: getConnectivityTestResults
      summary: Every source's most recent connectivity test result
      x-forward-stability: unpublished
      tags: [Connectivity Tests]
      parameters:
        - { name: networkId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The results.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ConnectivityTestResult" }
              example:
                - deviceName: fw01
                  startTime: "2026-09-16T00:31:27.254Z"
                  endTime: "2026-09-16T00:31:58.160Z"
                  savedAt: "2026-09-16T00:31:58.161Z"

  /networks/{networkId}/connectivityTests/{deviceName}:
    get:
      operationId: getConnectivityTestResult
      summary: One source's most recent connectivity test result
      x-forward-stability: unpublished
      tags: [Connectivity Tests]
      parameters:
        - { name: networkId, in: path, required: true, schema: { type: string } }
        - { name: deviceName, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The result.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SourceConnectivityResult" }
              example: { startTime: "2026-09-16T00:31:27.254Z", endTime: "2026-09-16T00:31:58.160Z", savedAt: "2026-09-16T00:31:58.161Z" }

  /networks/{networkId}/connectivityTests/{deviceName}?view=phaseResults:
    get:
      operationId: getConnectivityTestPhaseResults
      summary: The same result, broken out by phase
      description: >-
        Six phases in order: connection, authentication, type discovery, setup,
        authorization, query. A phase absent from the list was never reached,
        typically because an earlier one failed.
      x-forward-stability: unpublished
      tags: [Connectivity Tests]
      parameters:
        - { name: networkId, in: path, required: true, schema: { type: string } }
        - { name: deviceName, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The phase results.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/DeviceTestPhaseResult" }
              example:
                - phase: CONNECTION
                  usedConservativeMode: false
                  availableProtocols: [SSH]
                - phase: AUTHENTICATION
                  discoveredCliCredentialId: L-3

  # ------------------------------------------------- raw snapshot artifacts ---
  # Every file Forward stored while collecting a snapshot, independent of any
  # modeled device -- what a device's own file list (published) cannot reach,
  # since a raw file need not belong to one, such as a cloud provider's
  # metadata for an object no device represents.
  /snapshots/{snapshotId}/files:
    get:
      operationId: getSnapshotFiles
      summary: Every raw file stored for a snapshot
      description: Exposed files only; Forward keeps some internal ones out of this list.
      x-forward-stability: unpublished
      tags: [Network Snapshots]
      parameters:
        - { name: snapshotId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The file names.
          content:
            application/json:
              schema: { type: array, items: { type: string } }
              example: ["rdu-br-rtr01,interface_details.txt", "ash-dc-fw01,acl_policy_addresses.txt"]

  /snapshots/{snapshotId}/files/{fileName}:
    get:
      operationId: getSnapshotFileContent
      summary: One raw file's content
      description: 404 when the snapshot has no such file.
      x-forward-stability: unpublished
      tags: [Network Snapshots]
      parameters:
        - { name: snapshotId, in: path, required: true, schema: { type: string } }
        - { name: fileName, in: path, required: true, schema: { type: string } }
        - { name: download, in: query, schema: { type: boolean }, description: Add a Content-Disposition header for direct download. }
      responses:
        "200":
          description: The content.
          content:
            text/plain: {}
            application/octet-stream: {}

  # Reprocessing rebuilds a snapshot's model in place: the id is kept and the
  # collected data is processed again under the org's current settings, which is
  # how a parser or modelling change reaches an existing snapshot. Forward
  # dispatches both on ?action= against the same path as exportSnapshotSubset.
  /snapshots/{snapshotId}?action=invalidate:
    post:
      operationId: invalidateSnapshot
      summary: Discard a snapshot's model so its collected data is processed again
      description: >-
        The snapshot keeps its id. With reprocess=true, processing is requested
        at once; otherwise it is rebuilt when next needed. A draft snapshot is
        promoted first. Needs the network's INVALIDATE_SNAPSHOTS permission, or
        a Forward administrator. Until processing finishes the snapshot cannot
        answer queries, so a network whose only processed snapshot this is has
        none in the meantime.
      x-forward-stability: unpublished
      tags: [Network Snapshots]
      parameters:
        - { name: snapshotId, in: path, required: true, schema: { type: string } }
        - { name: reprocess, in: query, schema: { type: boolean }, description: Request processing immediately. }
      responses:
        "200":
          description: The snapshot's state before and after.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SnapshotStateChange" }
              example: { previousState: PROCESSED, state: UNPROCESSED }

  /snapshots/{snapshotId}?action=reprocess:
    post:
      operationId: reprocessSnapshot
      summary: Request processing of a snapshot that was already invalidated
      description: >-
        Refused unless the snapshot is invalidated ("Snapshot ID must be
        invalidated before reprocessing"). Needs view access and the org's
        minimum role for reprocessing.
      x-forward-stability: unpublished
      tags: [Network Snapshots]
      parameters:
        - { name: snapshotId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The snapshot's state before and after.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SnapshotStateChange" }
              example: { previousState: UNPROCESSED, state: UNPROCESSED }

  # Exceptions Forward hit while processing a snapshot: per-device parsing and
  # modelling failures, and snapshot-wide generation, reachability and index
  # failures. The JSON view groups identical stack traces and counts them. Both
  # need the network's DEBUG_SNAPSHOTS permission.
  /snapshots/{snapshotId}/exceptions:
    get:
      operationId: getSnapshotExceptionsText
      summary: Every exception raised while processing a snapshot, as text
      description: >-
        One stack trace per device failure and per snapshot-generation failure,
        headed by the device name or an index. An empty body when there were
        none.
      x-forward-stability: unpublished
      tags: [Network Snapshots]
      parameters:
        - { name: snapshotId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The stack traces.
          content:
            text/plain: {}

  /snapshots/{snapshotId}/exceptions?view=json:
    get:
      operationId: getSnapshotExceptions
      summary: Every exception raised while processing a snapshot, grouped
      x-forward-stability: unpublished
      tags: [Network Snapshots]
      parameters:
        - { name: snapshotId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Identical stack traces grouped, with the devices that raised each.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SnapshotExceptions" }
              example:
                exceptions:
                  - stackTrace: "java.lang.IllegalStateException: unexpected token\n\tat ..."
                    occurrences: 2
                    exceptionType: PARSING
                    devices: [edge-01, edge-02]

  # -------------------------------------------------------- client software ---
  # The Forward client packages, including the headless collector. Served to a
  # signed-in user (any role) on fwd.app; an on-prem appserver answers only for
  # WINDOWS_X64, LINUX and UPDATES_XML (OnpremClientSoftwareService) and 400s
  # the rest ("Unsupported package type"). The file name in Content-Disposition
  # carries the server's release, e.g. fwd-unix-26.9.0-18.tar.gz.
  /software/client:
    get:
      operationId: getClientPackage
      summary: Download a Forward client package
      x-forward-stability: unpublished
      tags: [Client Software]
      parameters:
        - name: type
          in: query
          required: false
          schema:
            type: string
