openapi: 3.2.0
info:
  title: 'Forward: Complete API'
  summary: Model and verify networks
  contact:
    email: support@forwardnetworks.com
  license:
    name: MIT
    url: https://spdx.org/licenses/MIT
  version: unreleased
servers:
  - url: /api
tags:
  - name: Current Version
    description: Get current API version information
    summary: Current Version
  - name: Networks
    description: Manage networks and the Snapshots collected for them
    summary: Networks
  - name: Network Management
    description: Create, list, rename, or delete model networks
    parent: Networks
    summary: Network Management
  - name: Network Snapshots
    description: List or manage the network Snapshots collected from network devices
    parent: Networks
    summary: Network Snapshots
  - name: Network Collection
    description: Configure and run the collection of configuration and state from a network
    summary: Network Collection
  - name: Credentials
    description: Provide network device credentials needed for network collection
    parent: Network Collection
    summary: Credentials
  - name: Jump Servers
    description: Configure jump servers to assist in reaching network devices
    parent: Network Collection
    summary: Jump Servers
  - name: Endpoint Profiles
    description: Configure the profiles used to collect from network endpoints
    parent: Network Collection
    summary: Endpoint Profiles
  - name: Collector Tasks
    description: Submit and track collector tasks
    parent: Network Collection
    summary: Collector Tasks
  - name: Legacy Collection
    description: Configure configuration and state collection from network devices
    parent: Network Collection
    summary: Legacy Collection
  - name: Collection Schedules
    description: Schedule recurring network collections
    parent: Network Collection
    summary: Collection Schedules
  - name: Collection Sources
    description: Specify the devices, endpoints, and other sources to collect from
    summary: Collection Sources
  - name: Classic Devices
    description: Specify the network devices to collect from and model
    parent: Collection Sources
    summary: Classic Devices
  - name: Synthetic Devices
    description: >-
      Model a network’s internet connections, intranets, L2VPNs, L3VPNs, WAN
      circuits, and encryptors
    parent: Collection Sources
    summary: Synthetic Devices
  - name: Internet Node
    description: Model the public internet that the network uses to reach its other sites
    parent: Synthetic Devices
    summary: Internet Node
  - name: Intranet Nodes
    description: Model private inter-site networks that the network connects to
    parent: Synthetic Devices
    summary: Intranet Nodes
  - name: L2VPNs
    description: Model the provider L2VPNs extending a broadcast domain across a WAN
    parent: Synthetic Devices
    summary: L2VPNs
  - name: L3VPNs
    description: Model the provider L3VPNs connecting a network’s customer edge routers
    parent: Synthetic Devices
    summary: L3VPNs
  - name: WAN Circuits
    description: >-
      Model the point-to-point layer 2 links a provider carries between two
      sites
    parent: Synthetic Devices
    summary: WAN Circuits
  - name: Encryptors
    description: Model the devices encapsulating a network’s traffic in IPSEC tunnels
    parent: Synthetic Devices
    summary: Encryptors
  - name: Network Endpoints
    description: Specify the network endpoints to collect from
    parent: Collection Sources
    summary: Network Endpoints
  - name: Data Connectors
    description: Collect data for NQE from HTTP(S) services outside the network
    parent: Collection Sources
    summary: Data Connectors
  - name: Devices
    description: Inspect the modeled network devices and their tags
    summary: Devices
  - name: Network Devices
    description: List the modeled network devices
    parent: Devices
    summary: Network Devices
  - name: Device Tags
    description: List or manage tags associated with network devices and endpoints
    parent: Devices
    summary: Device Tags
  - name: Topology
    description: Inspect and refine the modeled network topology
    summary: Topology
  - name: Network Topology
    description: >-
      List the links inferred between network devices and override them if
      necessary
    parent: Topology
    summary: Network Topology
  - name: Network Locations
    description: Get, create, update, or delete a network's user-defined locations
    parent: Topology
    summary: Network Locations
  - name: Network Analysis
    description: >-
      Analyze the modeled network: search paths, run checks, query, and assess
      CVEs
    summary: Network Analysis
  - name: Path Search
    description: Trace packets through the network model
    parent: Network Analysis
    summary: Path Search
  - name: NQE
    description: >-
      Ask the Network Query Engine for structured, vendor-agnostic network
      information
    parent: Network Analysis
    summary: NQE
  - name: Checks
    description: Enable or define automated checks that verify network policy and behavior
    parent: Network Analysis
    summary: Checks
  - name: Vulnerability Analysis
    description: Identify network devices potentially impacted by CVEs
    parent: Network Analysis
    summary: Vulnerability Analysis
  - name: Aliases
    description: Define groups of network infrastructure elements or packet header values
    parent: Network Analysis
    summary: Aliases
  - name: Platform Management
    description: Administer users and the Forward platform
    summary: Platform Management
  - name: User Accounts
    description: Manage user accounts
    parent: Platform Management
    summary: User Accounts
  - name: System Administration
    description: Administer the system, including database backups
    parent: Platform Management
    summary: System Administration
paths:
  /snapshots/{snapshotId}/aliases:
    get:
      tags:
        - Aliases
      summary: Get all Aliases
      operationId: getAllAliases
      parameters:
        - name: snapshotId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Aliases'
        '409':
          description: >-
            The system is currently processing this Snapshot.


            Note: GET /networks/{networkId}/snapshots/latestProcessed can be
            used to determine when processing of the

            latest Snapshot is done or to identify an alternate Snapshot that
            has already been processed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorInfo'
      security:
        - api_token: []
    delete:
      tags:
        - Aliases
      summary: Delete Aliases
      description: >-
        Use the optional `name` parameter to delete only specific Aliases. It
        can be repeated as in

        `?name=foo&name=bar`. Omit the `name` parameter to delete all Aliases
        active in the Snapshot.
      operationId: deactivateAliases
      parameters:
        - name: snapshotId
          in: path
          required: true
          schema:
            type: string
        - name: name
          in: query
          schema:
            type: array
            items:
              type: string
      responses:
        '200':
          description: OK. The response contains the deleted Aliases.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Aliases'
        '409':
          description: >-
            The system is currently processing this Snapshot.


            Note: GET /networks/{networkId}/snapshots/latestProcessed can be
            used to determine when processing of the

            latest Snapshot is done or to identify an alternate Snapshot that
            has already been processed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorInfo'
      security:
        - api_token: []
  /snapshots/{snapshotId}/aliases/{name}:
    get:
      tags:
        - Aliases
      summary: Get an Alias
      operationId: getSingleAlias
      parameters:
        - name: snapshotId
          in: path
          required: true
          schema:
            type: string
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AliasAndValue'
        '409':
          description: >-
            The system is currently processing this Snapshot.


            Note: GET /networks/{networkId}/snapshots/latestProcessed can be
            used to determine when processing of the

            latest Snapshot is done or to identify an alternate Snapshot that
            has already been processed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorInfo'
      security:
        - api_token: []
    put:
      tags:
        - Aliases
      summary: Create an Alias
      operationId: createAlias
      parameters:
        - name: snapshotId
          in: path
          required: true
          schema:
            type: string
        - name: name
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AliasBuilder'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Alias'
        '409':
          description: >-
            The system is currently processing this Snapshot.


            Note: GET /networks/{networkId}/snapshots/latestProcessed can be
            used to determine when processing of the

            latest Snapshot is done or to identify an alternate Snapshot that
            has already been processed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorInfo'
      security:
        - api_token: []
    delete:
      tags:
        - Aliases
      summary: Delete an Alias
      operationId: deactivateAlias
      parameters:
        - name: snapshotId
          in: path
          required: true
          schema:
            type: string
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Alias'
      security:
        - api_token: []
  /predefinedChecks:
    get:
      tags:
        - Checks
      summary: Get available Predefined checks
      operationId: getAvailablePredefinedChecks
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AvailablePredefinedCheck'
      security:
        - api_token: []
  /snapshots/{snapshotId}/checks:
    get:
      tags:
        - Checks
      summary: Get checks (with status)
      operationId: getChecks
      parameters:
        - name: snapshotId
          in: path
          required: true
          schema:
            type: string
        - name: type
          in: query
          description: >-
            Can be repeated to request multiple types (as in
            `?type=NQE&type=Predefined`) or omitted to request all

            types.
          schema:
            type: array
            items:
              $ref: '#/components/schemas/CheckType'
        - name: priority
          in: query
          description: >-
            Can be repeated to request multiple priorities (as in
            `?priority=HIGH&priority=LOW`) or omitted to request

            all priorities.
          schema:
            type: array
            items:
              $ref: '#/components/schemas/CheckPriority'
        - name: status
          in: query
          description: >-
            Can be repeated to request multiple statuses (as in
            `?status=FAIL&status=ERROR`) or omitted to request all

            statuses.


            **Note:** The response will never contain results with `status` NONE
            or PROCESSING. The server will wait to

            respond, if necessary, until processing finishes or times out.
          schema:
            type: array
            items:
              $ref: '#/components/schemas/CheckStatus'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/NetworkCheckResult'
        '409':
          description: >-
            The system is currently processing this Snapshot.


            Note: GET /networks/{networkId}/snapshots/latestProcessed can be
            used to determine when processing of the

            latest Snapshot is done or to identify an alternate Snapshot that
            has already been processed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorInfo'
      security:
        - api_token: []
    post:
      tags:
        - Checks
      summary: Add a check
      description: >-
        Note that the returned NetworkCheckResult will never have status of type
        NONE or PROCESSING
      operationId: addCheck
      parameters:
        - name: snapshotId
          in: path
          required: true
          schema:
            type: string
        - name: persistent
          in: query
          description: >-
            Whether to associate check with any later snapshots (including
            future snapshots) too
          schema:
            type: boolean
            default: true
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewNetworkCheck'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NetworkCheckResult'
        '409':
          description: >-
            The system is currently processing this Snapshot.


            Note: GET /networks/{networkId}/snapshots/latestProcessed can be
            used to determine when processing of the

            latest Snapshot is done or to identify an alternate Snapshot that
            has already been processed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorInfo'
      security:
        - api_token: []
    delete:
      tags:
        - Checks
      summary: Deactivate all checks
      operationId: deactivateChecks
      parameters:
        - name: snapshotId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
      security:
        - api_token: []
  /snapshots/{snapshotId}/checks/{checkId}:
    get:
      tags:
        - Checks
      summary: Get a check (with status)
      description: >-
        Note that the returned NetworkCheckResults will never have status of
        type NONE or PROCESSING
      operationId: getCheck
      parameters:
        - name: snapshotId
          in: path
          required: true
          schema:
            type: string
        - name: checkId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NetworkCheckResultWithDiagnosis'
        '409':
          description: >-
            The system is currently processing this Snapshot.


            Note: GET /networks/{networkId}/snapshots/latestProcessed can be
            used to determine when processing of the

            latest Snapshot is done or to identify an alternate Snapshot that
            has already been processed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorInfo'
      security:
        - api_token: []
    delete:
      tags:
        - Checks
      summary: Deactivate a check
      operationId: deactivateCheck
      parameters:
        - name: snapshotId
          in: path
          required: true
          schema:
            type: string
        - name: checkId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
      security:
        - api_token: []
  /networks/{networkId}/classic-devices:
    get:
      tags:
        - Classic Devices
      summary: Get all classic devices
      operationId: getClassicDevices
      x-position: 1
      parameters:
        - name: networkId
          in: path
          required: true
          schema:
            type: string
        - name: with
          in: query
          schema:
            type: array
            items:
              type: string
              enum:
                - tags
                - locationId
                - testResult
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClassicDevices'
      security:
        - api_token: []
    post:
      tags:
        - Classic Devices
      summary: Add a new classic device
      operationId: addClassicDevice
      x-position: 3
      parameters:
        - name: networkId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewClassicDevice'
        required: true
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClassicDevice'
      security:
        - api_token: []
    patch:
      tags:
        - Classic Devices
      summary: Update specific classic devices
      description: >-
        All JSON properties in the `update` object are optional. Include only
        the properties you wish

        to change.
      operationId: patchClassicDevices
      x-position: 8
      parameters:
        - name: networkId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClassicDevicesPatch'
        required: true
      responses:
        '204':
          description: No Content
          content: {}
      security:
        - api_token: []
  /networks/{networkId}/classic-devices?action=addBatch:
    post:
      tags:
        - Classic Devices
      summary: Add new classic devices
      operationId: addClassicDevices
      x-position: 4
      parameters:
        - name: networkId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/NewClassicDevice'
        required: true
      responses:
        '204':
          description: No Content
          content: {}
      security:
        - api_token: []
  /networks/{networkId}/classic-devices?action=deleteAll:
    post:
      tags:
        - Classic Devices
      summary: Delete all of a network’s classic devices
      operationId: deleteAllClassicDevices
      x-position: 7
      parameters:
        - name: networkId
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: No Content
          content: {}
      security:
        - api_token: []
  /networks/{networkId}/classic-devices?action=deleteBatch:
    post:
      tags:
        - Classic Devices
      summary: Delete specific classic devices
      operationId: deleteClassicDevices
      x-position: 6
      parameters:
        - name: networkId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceCriteria'
        required: true
      responses:
        '204':
          description: No Content
          content: {}
      security:
        - api_token: []
  /networks/{networkId}/classic-devices?action=getBatch:
    post:
      tags:
        - Classic Devices
      summary: Get specific classic devices
      operationId: getSpecificClassicDevices
      x-position: 2
      parameters:
        - name: networkId
          in: path
          required: true
          schema:
            type: string
        - name: with
          in: query
          schema:
            type: array
            items:
              type: string
              enum:
                - tags
                - locationId
                - testResult
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceNames'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClassicDevices'
      security:
        - api_token: []
  /networks/{networkId}/classic-devices?action=putBatch:
    post:
      tags:
        - Classic Devices
      summary: Add or update classic devices
      operationId: putClassicDevices
      x-position: 5
      parameters:
        - name: networkId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/NewClassicDevice'
        required: true
      responses:
        '204':
          description: No Content
          content: {}
      security:
        - api_token: []
  /networks/{networkId}/classic-devices/{deviceName}:
    get:
      tags:
        - Classic Devices
      summary: Get a classic device
      operationId: getClassicDevice
      x-position: 9
      parameters:
        - name: networkId
          in: path
          required: true
          schema:
            type: string
        - name: deviceName
          in: path
          required: true
          schema:
            type: string
        - name: with
          in: query
          schema:
            type: array
            items:
              type: string
              enum:
                - tags
                - locationId
                - testResult
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClassicDevice'
      security:
        - api_token: []
    put:
      tags:
        - Classic Devices
      summary: Add or update a classic device
      operationId: putClassicDevice
      x-position: 10
      parameters:
        - name: networkId
          in: path
          required: true
          schema:
            type: string
        - name: deviceName
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewClassicDevice'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClassicDevice'
      security:
        - api_token: []
    patch:
      tags:
        - Classic Devices
      summary: Update a classic device
      description: >-
        All JSON properties in the request body are optional. Include only the
        properties you wish to

        change.
      operationId: patchClassicDevice
      x-position: 11
      parameters:
        - name: networkId
          in: path
          required: true
          schema:
            type: string
        - name: deviceName
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClassicDevicePatch'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClassicDevice'
      security:
        - api_token: []
    delete:
      tags:
        - Classic Devices
      summary: Delete a classic device
      operationId: deleteClassicDevice
      x-position: 12
      parameters:
        - name: networkId
          in: path
          required: true
          schema:
            type: string
        - name: deviceName
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: No Content
          content: {}
      security:
        - api_token: []
  /networks/{networkId}/collection-schedules:
    get:
      tags:
        - Collection Schedules
      summary: Get a network’s collection schedules
      operationId: getCollectionSchedules
      parameters:
        - name: networkId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionSchedules'
      security:
        - api_token: []
    post:
      tags:
        - Collection Schedules
      summary: Add a network collection schedule
      operationId: addCollectionSchedule
      parameters:
        - name: networkId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CollectionScheduleDefinition'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionSchedule'
      security:
        - api_token: []
  /networks/{networkId}/collection-schedules/{scheduleId}:
    get:
      tags:
        - Collection Schedules
      summary: Get a network collection schedule
      operationId: getCollectionSchedule
      parameters:
        - name: networkId
          in: path
          required: true
          schema:
            type: string
        - name: scheduleId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionSchedule'
      security:
        - api_token: []
    put:
      tags:
        - Collection Schedules
      summary: Replace a network collection schedule
      operationId: replaceCollectionSchedule
      parameters:
        - name: networkId
          in: path
          required: true
          schema:
            type: string
        - name: scheduleId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CollectionSchedule'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
      security:
        - api_token: []
    delete:
      tags:
        - Collection Schedules
      summary: Delete a network collection schedule
      operationId: deleteCollectionSchedule
      parameters:
        - name: networkId
          in: path
          required: true
          schema:
            type: string
        - name: scheduleId
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: No Content
          content: {}
      security:
        - api_token: []
  /collector-tasks:
    get:
      tags:
        - Collector Tasks
      summary: Get collector tasks
      description: >-
        Retrieves information about recent Collector tasks, optionally filtered
        by task status. Tasks are ordered by

        creation time, newest first.
      operationId: getCollectorTasks
      parameters:
        - name: status
          in: query
          description: >-
            Use a comma (as in `?status=QUEUED,RUNNING`) or repeat this
            parameter to request multiple statuses at once.

            Omit this parameter to request all statuses.
          schema:
            type: array
            items:
              type: string
              enum:
                - QUEUED
                - RUNNING
                - SUCCEEDED
                - FAILED
                - TIMED_OUT
                - CANCELED
        - name: limit
          in: query
          description: Maximum number of tasks desired
          schema:
            type: integer
            format: int32
            default: 100
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                  - tasks
                properties:
                  tasks:
                    type: array
                    items:
                      $ref: '#/components/schemas/CollectorTask'
      security:
        - api_token: []
    post:
      tags:
        - Collector Tasks
      summary: Add a collector task
      description: >-
        Signals the system to begin collecting a new network Snapshot as soon as
        a Collector is available. Use [Get a

        collector
        task](https://docs.fwd.app/latest/api/collector-tasks/get-collector-task/)
        to check a task’s

        status.


        A network can have only one network collection task running at a time.
