        - { name: offset, in: query, required: false, schema: { type: integer } }
        - { name: limit, in: query, required: false, schema: { type: integer } }
        - { name: prefixFilter, in: query, required: false, schema: { type: string }, description: "A CIDR to restrict to." }
      responses:
        "200":
          description: The result.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
              example: {}
  /diffs/{beforeSnapshotId}/{afterSnapshotId}/l3/prefixes/{prefix}:
    get:
      operationId: getRoutingDiffForPrefix
      summary: Routing changes for one prefix
      description: >-
        Forward serialises this itself; the shape is not declared and is passed through.
      x-forward-stability: unpublished
      tags: [Snapshot Diff Details]
      parameters:
        - { name: beforeSnapshotId, in: path, required: true, schema: { type: string } }
        - { name: afterSnapshotId, in: path, required: true, schema: { type: string } }
        - { name: prefix, in: path, required: true, schema: { type: string }, description: "A CIDR. Sent percent-encoded." }
      responses:
        "200":
          description: The result.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
              example: {}
  /diffs/{beforeSnapshotId}/{afterSnapshotId}/arp:
    get:
      operationId: getArpDiffStats
      summary: Per-device ARP change statistics
      x-forward-stability: unpublished
      tags: [Snapshot Diff Details]
      parameters:
        - { name: beforeSnapshotId, in: path, required: true, schema: { type: string } }
        - { name: afterSnapshotId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The result.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeviceDiffStats" }
              example: { deviceInfos: [ { name: dc-core, hasConfigChange: true, stats: { ADDED: 1, DELETED: 0, MODIFIED: 2, UNCHANGED: 40 } } ] }
  /diffs/{beforeSnapshotId}/{afterSnapshotId}/arp/devices/{deviceName}:
    get:
      operationId: getDeviceArpDiffs
      summary: One device's ARP table changes
      x-forward-stability: unpublished
      tags: [Snapshot Diff Details]
      parameters:
        - { name: beforeSnapshotId, in: path, required: true, schema: { type: string } }
        - { name: afterSnapshotId, in: path, required: true, schema: { type: string } }
        - { name: deviceName, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The result.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeviceArpDiff" }
              example: { diffs: [ { diffType: ADDED, a: null, b: { ipAddress: "10.0.0.9", vrfName: default, macAddress: "00:10:00:17:2c:d3" } } ], stats: { ADDED: 1, DELETED: 0, MODIFIED: 0, UNCHANGED: 30 } }
  /diffs/{beforeSnapshotId}/{afterSnapshotId}/mac:
    get:
      operationId: getMacDiffStats
      summary: Per-device MAC table change statistics
      x-forward-stability: unpublished
      tags: [Snapshot Diff Details]
      parameters:
        - { name: beforeSnapshotId, in: path, required: true, schema: { type: string } }
        - { name: afterSnapshotId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The result.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeviceDiffStats" }
              example: { deviceInfos: [ { name: dc-core, hasConfigChange: true, stats: { ADDED: 1, DELETED: 0, MODIFIED: 2, UNCHANGED: 40 } } ] }
  /diffs/{beforeSnapshotId}/{afterSnapshotId}/mac/devices/{deviceName}:
    get:
      operationId: getDeviceMacDiffs
      summary: One device's MAC table changes
      x-forward-stability: unpublished
      tags: [Snapshot Diff Details]
      parameters:
        - { name: beforeSnapshotId, in: path, required: true, schema: { type: string } }
        - { name: afterSnapshotId, in: path, required: true, schema: { type: string } }
        - { name: deviceName, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The result.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeviceMacDiff" }
              example: { diffs: [ { diffType: DELETED, a: { macAddress: "00:10:00:17:2c:d3", vlan: "100", ports: [Ethernet3] }, b: null } ], stats: { ADDED: 0, DELETED: 1, MODIFIED: 0, UNCHANGED: 200 } }
  /diffs/{beforeSnapshotId}/{afterSnapshotId}/subnet-connectivity?view=locationPairs:
    get:
      operationId: getConnectivityDiffLocationPairs
      summary: Changed subnet pairs counted per location pair
      description: >-
        Empty while the comparison is still partial.
      x-forward-stability: unpublished
      tags: [Snapshot Diff Details]
      parameters:
        - { name: beforeSnapshotId, in: path, required: true, schema: { type: string } }
        - { name: afterSnapshotId, in: path, required: true, schema: { type: string } }
        - { name: type, in: query, required: true, schema: { type: string, enum: [ADDED, DELETED, MODIFIED] }, description: "Which kind of change to count. UNCHANGED is refused." }
        - { name: loc, in: query, required: false, schema: { type: string }, description: "Restrict to one location." }
      responses:
        "200":
          description: The result.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LocationConnChangeCounts" }
              example: { counts: [ { src: "1", dst: "3", count: 4 } ] }
  /diffs/{beforeSnapshotId}/{afterSnapshotId}/subnet-connectivity?view=locations:
    get:
      operationId: getConnectivityDiffLocations
      summary: Incoming and outgoing connectivity changes per location
      description: >-
        Empty while the comparison is still partial.
      x-forward-stability: unpublished
      tags: [Snapshot Diff Details]
      parameters:
        - { name: beforeSnapshotId, in: path, required: true, schema: { type: string } }
        - { name: afterSnapshotId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The result.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LocationsConnDiffStats" }
              example: { stats: [ { locationId: "1", incoming: { newlyConnected: 0, newlyIsolated: 2, modified: 0 }, outgoing: { newlyConnected: 0, newlyIsolated: 1, modified: 0 } } ] }
  /diffs/{beforeSnapshotId}/{afterSnapshotId}/subnet-connectivity?view=locationPair:
    get:
      operationId: getConnectivityDiffLocationPair
      summary: Subnet pairs that changed between two locations
      x-forward-stability: unpublished
      tags: [Snapshot Diff Details]
      parameters:
        - { name: beforeSnapshotId, in: path, required: true, schema: { type: string } }
        - { name: afterSnapshotId, in: path, required: true, schema: { type: string } }
        - { name: loc1, in: query, required: true, schema: { type: string }, description: "Source location." }
        - { name: loc2, in: query, required: true, schema: { type: string }, description: "Destination location." }
      responses:
        "200":
          description: The result.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LocationPairConnDiffStats" }
              example: { stats: [ { src: "10.1.0.0/24", dst: "10.3.0.0/24", stats: { newlyConnected: 0, newlyIsolated: 1, modified: 0 } } ] }
  /diffs/{beforeSnapshotId}/{afterSnapshotId}/subnet-connectivity?view=subnetPair:
    get:
      operationId: getConnectivityDiffSubnetPair
      summary: How connectivity changed between two subnets
      x-forward-stability: unpublished
      tags: [Snapshot Diff Details]
      parameters:
        - { name: beforeSnapshotId, in: path, required: true, schema: { type: string } }
        - { name: afterSnapshotId, in: path, required: true, schema: { type: string } }
        - { name: loc1, in: query, required: true, schema: { type: string } }
        - { name: loc2, in: query, required: true, schema: { type: string } }
        - { name: src, in: query, required: true, schema: { type: string }, description: "Source subnet, CIDR." }
        - { name: dst, in: query, required: true, schema: { type: string }, description: "Destination subnet, CIDR." }
      responses:
        "200":
          description: The result.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SubnetConnDiffDetails" }
              example: { diffs: [ { diffType: DELETED, value: {} } ] }

  # ------------------------------------------------------ SNMP credentials ---
  # The CLI and HTTP credential operations are published; SNMP ones are not.
  # Classic devices reference an SNMP credential by id, so listing is how a
  # name resolves to the id a device needs.
  /networks/{networkId}/snmpCredentials:
    get:
      operationId: listSnmpCredentials
      summary: A network's SNMP credentials
      description: >-
        Secrets are never returned. communityString, and the V3 passwords, come
        back as the numeric id of the stored secret rather than the value.
      x-forward-stability: unpublished
      tags: [SNMP Credentials]
      parameters:
        - { name: networkId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The credentials.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SnmpCredential" }
              example:
                - { id: "S-3", name: lab-ro, version: V2C, communityString: "4711", autoAssociate: true, createdAt: "2026-09-11T10:00:00Z" }
    post:
      operationId: createSnmpCredential
      summary: Create an SNMP credential
      x-forward-stability: unpublished
      tags: [SNMP Credentials]
      parameters:
        - { name: networkId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NewSnmpCredential" }
            example: { name: lab-ro, version: V2C, communityString: public, autoAssociate: true }
      responses:
        "200":
          description: The credential.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SnmpCredential" }
              example: { id: "S-3", name: lab-ro, version: V2C, communityString: "4711", autoAssociate: true }

  /networks/{networkId}/snmpCredentials/{credentialId}:
    patch:
      operationId: updateSnmpCredential
      summary: Change an SNMP credential
      description: Every field is optional and omitted means unchanged.
      x-forward-stability: unpublished
      tags: [SNMP Credentials]
      parameters:
        - { name: networkId, in: path, required: true, schema: { type: string } }
        - { name: credentialId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SnmpCredentialPatch" }
            example: { communityString: newstring }
      responses:
        "204": { description: Updated. }
    delete:
      operationId: deleteSnmpCredential
      summary: Delete an SNMP credential
      x-forward-stability: unpublished
      tags: [SNMP Credentials]
      parameters:
        - { name: networkId, in: path, required: true, schema: { type: string } }
        - { name: credentialId, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Deleted. }

  # ------------------------------------------------------ collector binding ---
  # Which collector serves a network, and how it is doing. The published
  # /collector/status is the deprecated busy flag; this is the one a pre-flight
  # wants: connected, healthy, which version.
  /networks/{networkId}/collector:
    get:
      operationId: getNetworkCollector
      summary: The collector bound to a network, with its connection and health
      description: An empty object when no collector is bound.
      x-forward-stability: unpublished
      tags: [Collector Binding]
      parameters:
        - { name: networkId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The collector, or an empty object.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CollectorWithStatus" }
              example:
                id: "12"
                name: lab-collector
                username: collector-lab
                connectionStatus: CONNECTED
                health: { status: HEALTHY, issues: [] }
                updateStatus: UP_TO_DATE
                version: 26.8.4-03
                networkIds: ["115"]
                createdAt: 1788949865425
                createdBy: "100"
    put:
      operationId: setNetworkCollector
      summary: Bind a network to a collector, by the collector's username
      x-forward-stability: unpublished
      tags: [Collector Binding]
      parameters:
        - { name: networkId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CollectorBinding" }
            example: { username: collector-lab }
      responses:
        "200": { description: Bound. No body. }
    delete:
      operationId: unbindNetworkCollector
      summary: Unbind the network from its collector
      x-forward-stability: unpublished
      tags: [Collector Binding]
      parameters:
        - { name: networkId, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Unbound. No body. }

  # ---------------------------------------------------------- cloud accounts ---
  # Cloud collection sources. Every request body is selected by its type:
  # AWS, AZURE, GCP, IBM_CLOUD or ALKIRA, with per-type fields beside the
  # common ones. Secrets are accepted on input and never returned.
  /networks/{networkId}/cloudAccounts:
    get:
      operationId: listCloudAccounts
      summary: A network's cloud accounts, with their test results
      x-forward-stability: unpublished
      tags: [Cloud Accounts]
      parameters:
        - { name: networkId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The accounts.
          content:
            application/json:
              schema: 
                type: array
                items: { $ref: "#/components/schemas/CloudAccountWithMeta" }
              example: [ { type: AWS, name: prod-aws, collect: true, regions: { us-east-1: { testInstant: 1757584800000, error: NONE } }, numVirtualizedDevices: 12 } ]
    post:
      operationId: createCloudAccount
      summary: Add a cloud account
      description: Needs both MANAGE_COLLECTION_SOURCES and EDIT_DEVICE_CREDENTIALS.
      x-forward-stability: unpublished
      tags: [Cloud Accounts]
      parameters:
        - { name: networkId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NewCloudAccount" }
            example: { type: AWS, name: prod-aws, collect: true, roleArn: "arn:aws:iam::123456789012:role/forward", regions: { us-east-1: "2026-09-11T10:00:00Z" } }
      responses:
        "200":
          description: The account.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CloudAccount" }
              example: { type: AWS, name: prod-aws, collect: true, regions: { us-east-1: null } }

  /networks/{networkId}/cloudAccounts?view=newlyDiscovered:
    get:
      operationId: listNewlyDiscoveredCloudAccounts
      summary: Sub-accounts discovery found that are not yet configured, per account
      x-forward-stability: unpublished
      tags: [Cloud Accounts]
      parameters:
        - { name: networkId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The result.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DiscoveredAccountsByAccount" }
              example: { prod-aws: [ { id: "210987654321", name: staging } ] }

  /networks/{networkId}/cloudAccounts/{accountName}:
    patch:
      operationId: updateCloudAccount
      summary: Change a cloud account's settings
      description: Every field optional and omitted means unchanged. Credentials cannot be changed here; use the credential operation.
      x-forward-stability: unpublished
      tags: [Cloud Accounts]
      parameters:
        - { name: networkId, in: path, required: true, schema: { type: string } }
        - { name: accountName, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CloudAccountPatch" }
            example: { type: AWS, collect: false }
      responses:
        "200":
          description: The account.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CloudAccount" }
              example: { type: AWS, name: prod-aws, collect: false }
    delete:
      operationId: deleteCloudAccount
      summary: Remove a cloud account
      x-forward-stability: unpublished
      tags: [Cloud Accounts]
      parameters:
        - { name: networkId, in: path, required: true, schema: { type: string } }
        - { name: accountName, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Removed. Empty object. }

  /networks/{networkId}/cloudAccounts/{accountName}/credential:
    get:
      operationId: getCloudAccountCredential
      summary: The non-secret part of an account's credential
      description: >-
        What comes back depends on the type: a role ARN for AWS, a client id and
        tenant for Azure, a username for others, and 404 for GCP or when there
        is none. Secrets are never included.
      x-forward-stability: unpublished
      tags: [Cloud Accounts]
      parameters:
        - { name: networkId, in: path, required: true, schema: { type: string } }
        - { name: accountName, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The result.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
              example: { roleArn: "arn:aws:iam::123456789012:role/forward" }
    post:
      operationId: setCloudAccountCredential
      summary: Replace an account's credential
      x-forward-stability: unpublished
      tags: [Cloud Accounts]
      parameters:
        - { name: networkId, in: path, required: true, schema: { type: string } }
        - { name: accountName, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CloudAccountCredential" }
            example: { type: AWS, roleArn: "arn:aws:iam::123456789012:role/forward" }
      responses:
        "200":
          description: The account.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CloudAccount" }
              example: { type: AWS, name: prod-aws, collect: true }

  /networks/{networkId}/cloudAccounts/{accountName}/discovery:
    post:
      operationId: discoverCloudSubAccounts
      summary: Discover the sub-accounts, projects or subscriptions reachable from an existing account
      description: Long-polls until discovery finishes.
      x-forward-stability: unpublished
      tags: [Cloud Accounts]
      parameters:
        - { name: networkId, in: path, required: true, schema: { type: string } }
        - { name: accountName, in: path, required: true, schema: { type: string } }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CloudExistingAccountDiscovery" }
            example: { type: GCP, projectIds: [my-project] }
      responses:
        "200":
          description: The result.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CloudAccountDiscoveryResult" }
              example: { error: NONE, discoveredEntities: [ { id: "210987654321", name: staging } ] }

  /networks/{networkId}/cloudAccountDiscovery:
    post:
      operationId: discoverCloudAccounts
      summary: Discover accounts reachable with a credential, before creating one
      description: Long-polls until discovery finishes.
      x-forward-stability: unpublished
      tags: [Cloud Accounts]
      parameters:
        - { name: networkId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CloudAccountDiscovery" }
            example: { type: AZURE, clientId: app-id, password: secret, tenant: tenant-id, environment: AZURE }
      responses:
        "200":
          description: The result.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CloudAccountDiscoveryResult" }
              example: { error: NONE, discoveredEntities: [ { id: sub-1, name: Production } ] }

  /networks/{networkId}/cloudAccounts/test:
    post:
      operationId: testCloudConnectivity
      summary: Test connectivity with a credential, before creating an account
      description: Returns nothing; the result arrives on the user event stream as CLOUD_CONNECTIVITY_TEST_RESULT.
      x-forward-stability: unpublished
      tags: [Cloud Accounts]
      parameters:
        - { name: networkId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CloudConnectivityTest" }
            example: { type: AWS, id: my-test, roleArn: "arn:aws:iam::123456789012:role/forward", regions: [us-east-1] }
      responses:
        "200": { description: Started. Empty object. }

  /networks/{networkId}/cloudAccounts/{accountName}/test:
    post:
      operationId: testCloudAccountConnectivity
      summary: Test an existing account's connectivity
      description: Returns nothing; the result arrives on the user event stream as CLOUD_CONNECTIVITY_TEST_RESULT.
      x-forward-stability: unpublished
      tags: [Cloud Accounts]
      parameters:
        - { name: networkId, in: path, required: true, schema: { type: string } }
        - { name: accountName, in: path, required: true, schema: { type: string } }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CloudAccountConnectivityTest" }
            example: { type: AWS, regions: [us-east-1] }
      responses:
        "200": { description: Started. Empty object. }

  /networks/{networkId}/cloudAccounts/aws/assumeRole/externalId:
    get:
      operationId: getAwsAssumeRoleExternalId
      summary: The external id to put in an AWS assume-role trust policy
      x-forward-stability: unpublished
      tags: [Cloud Accounts]
      parameters:
        - { name: networkId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The result.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AwsExternalId" }
              example: { externalId: "fwd-4c1f9a" }

  /cloud/aws-regions:
    get:
      operationId: listAwsRegions
      summary: AWS region ids and display names
      x-forward-stability: unpublished
      tags: [Cloud Accounts]
      responses:
        "200":
          description: The result.
          content:
            application/json:
              schema: { type: object, additionalProperties: { type: string } }
              example: { us-east-1: "US East (N. Virginia)" }

  /cloud/gcp-regions:
    get:
      operationId: listGcpRegions
      summary: GCP region ids and display names
      x-forward-stability: unpublished
      tags: [Cloud Accounts]
      responses:
        "200":
          description: The result.
          content:
            application/json:
              schema: { type: object, additionalProperties: { type: string } }
              example: { us-central1: "Iowa" }

  /cloud/ibm-regions:
    get:
      operationId: listIbmRegions
      summary: IBM Cloud region ids and display names
      x-forward-stability: unpublished
      tags: [Cloud Accounts]
      responses:
        "200":
          description: The result.
          content:
            application/json:
              schema: { type: object, additionalProperties: { type: string } }
              example: { us-south: "Dallas" }

  /cloud/azure-environments:
    get:
      operationId: listAzureEnvironments
      summary: Azure environment ids and display names
      x-forward-stability: unpublished
      tags: [Cloud Accounts]
      responses:
        "200":
          description: The result.
          content:
            application/json:
              schema: { type: object, additionalProperties: { type: string } }
              example: { AZURE: "Azure", AZURE_US_GOVERNMENT: "Azure US Government" }

  # ------------------------------------------------------- user event stream ---
  /users/current/events:
    get:
      operationId: streamUserEvents
      summary: Live events for the calling user, as Server-Sent Events
      description: >-
        A never-ending stream. Each message is an event name and a JSON data
        line; a comment line ":ping" arrives every few seconds as a keepalive.
        Carries per-device collection progress, snapshot processing stages,
        change-set updates and more. See the events service.
      x-forward-stability: unpublished
      x-streaming: true
      tags: [User Events]
      responses:
        "200":
          description: The event stream.
          content:
            text/event-stream:
              schema: { type: string }

  # ------------------------------------------------ deployment configuration ---
  # The third scope beside org and global. Deployment properties such as
  # OUTBOUND_CONNECTIONS or PROBE_LLM_AVAILABILITY are not org properties and
  # are unreachable through the other configuration routes. Keys come back in
  # upper case here, unlike the org routes; config_value() reads either.
  /deployment-config:
    get:
      operationId: getDeploymentConfig
      summary: Every deployment property and its effective value
      x-forward-stability: unpublished
      tags: [Configuration]
      responses:
        "200":
          description: Property name to value.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConfigValues" }
              example: { OUTBOUND_CONNECTIONS: true, CONCURRENT_BACKGROUND_SNAPSHOT_REPROCESS: 1 }

  /deployment-config/{property}:
    get:
      operationId: getDeploymentConfigValue
      summary: A deployment property's effective value
      x-forward-stability: unpublished
      tags: [Configuration]
      parameters:
        - { name: property, in: path, required: true, schema: { type: string }, description: "A DeploymentProperty name, upper snake case." }
      responses:
        "200":
          description: The property and its value.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConfigValue" }
              example: { OUTBOUND_CONNECTIONS: true }
    put:
      operationId: setDeploymentConfigValue
      summary: Set a deployment property
      description: >-
        Forward administrators, or an org administrator on a self-hosted
        deployment for properties marked configurable there. Others refuse with
        "Permission denied for PROPERTY". A value Forward cannot parse for the
        property is a 400 with its reason.
      x-forward-stability: unpublished
      tags: [Configuration]
      parameters:
        - { name: property, in: path, required: true, schema: { type: string } }
        - { name: value, in: query, required: true, schema: { type: string } }
      responses:
        "200":
          description: The property and its new value.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConfigValue" }
              example: { PROBE_LLM_AVAILABILITY: true }
    delete:
      operationId: clearDeploymentConfigValue
      summary: Remove a deployment property's override, reverting to its default
      x-forward-stability: unpublished
      tags: [Configuration]
      parameters:
        - { name: property, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Cleared. No body. }

  # ------------------------------------------------------------- NQE panels ---
  # Saved NQE queries with a presentation, embedded in dashboards. A panel
  # references a committed library query by id; query text is not accepted.
  # Creating and editing need the NQE_DASHBOARD_PANELS org property; metric
  # values need NQE_DASHBOARD_METRIC_PANELS as well.
  /nqe-panels:
    get:
      operationId: listNqePanels
      summary: The org's NQE panels, each with where it is used
      x-forward-stability: unpublished
      tags: [NQE Panels]
      responses:
        "200":
          description: The panels.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NqePanels" }
              example: { panels: [ { usageCount: 1, usages: [ { networkId: "115", id: "3", name: Operations } ], id: "7", name: bgp-sessions, displayName: "BGP sessions", queryId: Q_0123456789abcdef0123456789abcdef01234567, config: { type: TABULAR, columnOrder: [device, peer, state], visibleColumns: [ { name: device, width: 200 }, { name: state, width: 100 } ] } } ] }
    post:
      operationId: createNqePanel
      summary: Create an NQE panel
      description: >-
        The query must exist at the head of the org library; otherwise 400
        "NQE panel references a query that does not exist". Names are unique,
        case-insensitively.
      x-forward-stability: unpublished
      tags: [NQE Panels]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NqePanelDef" }
            example: { name: bgp-sessions, queryId: Q_0123456789abcdef0123456789abcdef01234567, config: { type: TABULAR, columnOrder: [device, peer, state], visibleColumns: [ { name: device, width: 200 } ] } }
      responses:
        "201":
          description: The panel.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NqePanel" }
              example: { id: "7", name: bgp-sessions, displayName: "BGP sessions", queryId: Q_0123456789abcdef0123456789abcdef01234567, config: { type: TABULAR, columnOrder: [device, peer, state], visibleColumns: [ { name: device, width: 200 }, { name: state, width: 100 } ] } }

  /nqe-panels?action=delete:
    post:
      operationId: deleteNqePanels
      summary: Delete several panels
      description: All or nothing; refused with 409 if any is embedded in a dashboard.
      x-forward-stability: unpublished
      tags: [NQE Panels]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NqePanelIds" }
            example: { panelIds: ["7", "8"] }
      responses:
        "204": { description: Deleted. }

  /nqe-panels/{panelId}:
    patch:
      operationId: updateNqePanel
      summary: Change a panel's name, presentation or configuration
      description: >-
        Flat: configuration fields sit beside name and description rather
        than under config. A field for the other kind of panel is refused. The
        query and the kind cannot be changed.
      x-forward-stability: unpublished
      tags: [NQE Panels]
      parameters:
        - { name: panelId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NqePanelPatch" }
            example: { displayName: "BGP sessions by site", frozenColumns: [device] }
      responses:
        "200":
          description: The updated panel.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NqePanel" }
              example: { id: "7", name: bgp-sessions, displayName: "BGP sessions", queryId: Q_0123456789abcdef0123456789abcdef01234567, config: { type: TABULAR, columnOrder: [device, peer, state], visibleColumns: [ { name: device, width: 200 }, { name: state, width: 100 } ] } }
    delete:
      operationId: deleteNqePanel
      summary: Delete a panel
      description: Refused with 409 while any dashboard embeds it.
      x-forward-stability: unpublished
      tags: [NQE Panels]
      parameters:
        - { name: panelId, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Deleted. }

  # Dispatched by the presence of resultKey, which is a required parameter here.
  /networks/{networkId}/nqe-panels:
    post:
      operationId: getNqePanelMetrics
      summary: Metric panels' values over one query execution's result
      description: >-
        resultKey is the execution's result key, R_ followed by twenty hex
        characters, from a completed execution of the panel's query. Only
        metric panels; a tabular one is refused.
      x-forward-stability: unpublished
      tags: [NQE Panels]
      parameters:
        - { name: networkId, in: path, required: true, schema: { type: string } }
        - { name: resultKey, in: query, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NqePanelIds" }
            example: { panelIds: ["9"] }
      responses:
        "200":
          description: The result.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NqePanelMetrics" }
              example: { results: [ { panelId: "9", value: 42 } ] }

  /networks/{networkId}/nqe-panels?action=preview:
    post:
      operationId: previewNqeMetric
      summary: Compute a metric over a result without saving a panel
      x-forward-stability: unpublished
      tags: [NQE Panels]
      parameters:
        - { name: networkId, in: path, required: true, schema: { type: string } }
        - { name: resultKey, in: query, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NqeMetricPreview" }
            example: { columnName: sessions, aggregation: SUM }
      responses:
        "200":
          description: The value, or an empty object when it is undefined.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NqeMetricPreviewResult" }
              example: { value: 42 }

  # ------------------------------------------------------------- dashboards ---
  # A dashboard is a layout of widgets over panels. Forward also ships fixed
  # default dashboards with negative ids, which cannot be edited or deleted.
  /networks/{networkId}/dashboards:
    get:
      operationId: listDashboards
      summary: A network's composed dashboards
      x-forward-stability: unpublished
      tags: [Dashboards]
      parameters:
        - { name: networkId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The dashboards.
          content:
            application/json:
              schema: 
                type: array
                items: { $ref: "#/components/schemas/Dashboard" }
              example: [ { id: "3", name: Operations, type: COMPOSED, layout: [ { type: PANEL, x: 0, y: 0, w: 6, h: 4, panelId: NQE_PANEL_7, id: 1 } ] } ]
    post:
      operationId: createDashboard
      summary: Create an empty dashboard
      description: Returns the new dashboard's id as a bare JSON string. Names are unique, case-insensitively.
      x-forward-stability: unpublished
      tags: [Dashboards]
      parameters:
        - { name: networkId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DashboardDefinition" }
            example: { name: Operations, description: "Site health at a glance" }
      responses:
        "200":
          description: The new dashboard's id.
          content:
            application/json:
              schema: { type: string }
              example: "3"

  /networks/{networkId}/dashboards?type=DEFAULT:
    get:
      operationId: listDefaultDashboards
      summary: The dashboards Forward ships, which cannot be changed
      x-forward-stability: unpublished
      tags: [Dashboards]
      parameters:
        - { name: networkId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The default dashboards.
          content:
            application/json:
              schema: 
                type: array
                items: { $ref: "#/components/schemas/Dashboard" }
              example: [ { id: "-1", name: Insights, type: DEFAULT } ]

  /networks/{networkId}/dashboards?action=removePanels:
    post:
      operationId: removePanelsFromDashboards
      summary: Remove every embedding of the given panels from every dashboard in the network
      x-forward-stability: unpublished
      tags: [Dashboards]
      parameters:
        - { name: networkId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NqePanelIds" }
            example: { panelIds: ["7"] }
      responses:
        "204": { description: Removed. }

  /networks/{networkId}/dashboards/{dashboardId}:
    get:
      operationId: getDashboard
      summary: One dashboard with its layout
      x-forward-stability: unpublished
      tags: [Dashboards]
      parameters:
        - { name: networkId, in: path, required: true, schema: { type: string } }
        - { name: dashboardId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The dashboard.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Dashboard" }
              example: { id: "3", name: Operations, type: COMPOSED, layout: [] }
    patch:
      operationId: updateDashboard
      summary: Rename a dashboard, change its description, or replace its layout
      description: >-
        A layout, when present, replaces the whole layout; an explicit null
        clears it. Each NQE panel widget carries a server-assigned id after
        the first save; echo it to keep that embedding's identity, or omit it
        to create a new one. Default dashboards refuse with 400.
      x-forward-stability: unpublished
      tags: [Dashboards]
      parameters:
        - { name: networkId, in: path, required: true, schema: { type: string } }
        - { name: dashboardId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DashboardPatch" }
            example: { layout: [ { type: ROW, x: 0, y: 0, w: 12, h: 1, title: Core }, { type: PANEL, x: 0, y: 1, w: 6, h: 4, panelId: NQE_PANEL_7 } ] }
      responses:
        "200": { description: Updated. No body. }
    delete:
      operationId: deleteDashboard
      summary: Delete a dashboard and its display settings
      x-forward-stability: unpublished
      tags: [Dashboards]
      parameters:
        - { name: networkId, in: path, required: true, schema: { type: string } }
        - { name: dashboardId, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Deleted. No body. }

  /networks/{networkId}/dashboards/{dashboardId}/display-settings:
    get:
      operationId: getDashboardDisplaySettings
      summary: A dashboard's full-screen auto-scroll settings
      x-forward-stability: unpublished
      tags: [Dashboards]
      parameters:
        - { name: networkId, in: path, required: true, schema: { type: string } }
        - { name: dashboardId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The settings, or an empty object when never set.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DashboardDisplaySettings" }
              example: { autoScrollEnabled: true, autoScrollMode: PAGE_BY_PAGE, autoScrollSpeed: MEDIUM }
    patch:
      operationId: updateDashboardDisplaySettings
      summary: Change a dashboard's full-screen auto-scroll settings
      x-forward-stability: unpublished
      tags: [Dashboards]
      parameters:
        - { name: networkId, in: path, required: true, schema: { type: string } }
        - { name: dashboardId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DashboardDisplaySettings" }
            example: { autoScrollEnabled: true, autoScrollIntervalSec: 30 }
      responses:
        "204": { description: Updated. }

  # ------------------------------------------------- synthetic devices, more ---
  # Beyond the published CRUD for each synthetic device family: applying staged
  # changes to an existing snapshot, previewing NQE-derived connections, batch
  # adds, connection suggestions, and two families with no published surface
  # at all (adjacent networks and T-API optical containers).

  /networks/{networkId}/internet-node?op=backdate:
    post:
      operationId: backdateInternetNode
      summary: Apply recent internet node changes to an existing snapshot
      description: >-
        Applies any internet node changes made since the network's most recent
        snapshot to the given snapshot and every newer one. Invalidates those
        snapshots, which then need reprocessing. Requires both the collection
        source and snapshot invalidation permissions.
      x-forward-stability: unpublished
      tags: [Internet Node]
      parameters:
        - { name: networkId, in: path, required: true, schema: { type: string } }
        - { name: snapshotId, in: query, required: true, schema: { type: string }, description: "The earliest snapshot the staged changes should apply to." }
      responses:
        "204": { description: Applied. }

  /networks/{networkId}/internet-node?action=computeNqeBasedConnections:
    post:
      operationId: computeInternetNodeConnections
      summary: Preview the connections an NQE query would produce
      description: >-
        Runs the query on the network's latest processed snapshot and returns
        the connections its rows describe, without saving anything. The same
        computation happens when a device carries a queryId; this previews it.
        A failure is reported in the body's error, not as an HTTP error.
      x-forward-stability: unpublished
      tags: [Internet Node]
      parameters:
        - { name: networkId, in: path, required: true, schema: { type: string } }
        - { name: queryId, in: query, required: true, schema: { type: string }, description: "A committed library query id, Q_ or FQ_ followed by 40 hex characters." }
      responses:
        "200":
          description: The connections, or why they could not be computed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/L3DynamicConnectionsComputeResult" }
              example: { connections: [ { name: dc1-edge, uplinkPort: { device: dc1-edge-01, port: GigabitEthernet0/0 }, vlan: 100, subnetAutoDiscovery: NONE, subnets: ["10.20.0.0/16"] } ] }

  /networks/{networkId}/internet-node/connection-suggestions:
    get:
      operationId: getInternetConnectionSuggestions
      summary: Interfaces that look like internet uplinks in the latest processed snapshot
      description: >-
        Computed from the latest processed snapshot; 400 when the network has
        none. An empty object when nothing looks like an uplink.
      x-forward-stability: unpublished
      tags: [Internet Node]
      parameters:
        - { name: networkId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The suggestions.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InternetConnectionSuggestions" }
              example: { suggestions: [ { uplinkInterface: "dc1-edge-01:GigabitEthernet0/0", uplinkInterfaceDescription: "ISP A", gatewayInterface: "isp-a-pe:ge-0/0/1" } ] }

  /networks/{networkId}/intranet-nodes?op=backdate:
