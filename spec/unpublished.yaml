          nqeName:
            type: string
          description:
            type: string
          type:
            $ref: '#/components/schemas/DataFileType'
          networkIds:
            type: array
            items:
              type: string
            description: Networks the file is attached to. Omitted when none.
          isEmpty:
            type: boolean
            description: true for a placeholder imported from a snapshot, which cannot be downloaded. Omitted when false.
          isIncludedInAllNetworks:
            type: boolean
            description: true only for the STIG policy file. Omitted otherwise.
          contentMd5Hex:
            type: string
