  /backups:
    get:
      operationId: listClusterBackups
      summary: List the stored application backups
      description: >-
        Requires the ADMINISTER_SYSTEM system permission (@Requires(system = ADMINISTER_SYSTEM)). Served only on
        on-premises Kubernetes deployments (ClusterBackupRestoreController, @ProfileCriteria ON_PREM and K8S, not
        SHARED_K8S); a hosted deployment answers 404 "No endpoint".
      x-forward-stability: unpublished
      tags: [Backups]
      responses:
        "200":
          description: Every backup Forward holds, in every storage.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SysAppBackup'
              # # from source: app/src/main/java/com/forwardnetworks/cv/cbr/AppBackup.java
              example:
                - id: 1
                  backupTimeMillis: 1700000000000
                  storageType: INTERNAL
                  triggerType: MANUAL
                  appVersion: 26.9.0
                  snapshotsIncluded: false
                  size: 1048576
                  note: example backup
    post:
      operationId: runClusterBackup
      summary: Take an application backup now
      description: >-
        Requires the ADMINISTER_SYSTEM system permission. Source-only: the request is a manual backup
        (BackupTriggerType MANUAL). Returns the backup operation that was started.
      x-forward-stability: unpublished
      tags: [Backups]
      parameters:
        - name: name
          in: query
          required: false
          description: A note stored with the backup. Blank is the same as omitted.
          schema: { type: string }
        - name: includeSnapshots
          in: query
          required: false
          description: Whether snapshots are included in the backup. Defaults to false.
          schema: { type: boolean, default: false }
        - name: storageType
          in: query
          required: false
          description: Where the backup is written. Omitted means INTERNAL.
          schema: { type: string, enum: [INTERNAL, S3] }
      responses:
        "200":
          description: The backup operation that was started.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SysClusterOperation'
              # # from source: app/src/main/java/com/forwardnetworks/cv/cbr/ClusterOperation.java (returned by ClusterBackupRestoreController.runBackup)
              example:
                id: '1700000001'
                type: BACKUP
                appStatus: NOT_STARTED
                snapshotToStatus: {}
