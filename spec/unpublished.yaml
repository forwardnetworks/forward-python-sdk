    post:
      operationId: previewSnapshotRetention
      summary: Preview which snapshots the retention policy would delete
      description: 'Lists the snapshots the policy would delete if the cleanup ran now, and deletes nothing. Only dryRun=true is modelled here. Without dryRun the same route deletes the snapshots synchronously (Java default dryRun=false); the Go SDK does not expose that, and a wrapper must never omit the parameter. Forward always keeps the 10 newest processed snapshots, favourites, and forks with their ancestors (Go note on the policy; not re-verified). Gated by DELETE_SNAPSHOT. Source only: not called.'
      x-forward-stability: unpublished
      tags: [Network Snapshots]
      parameters:
