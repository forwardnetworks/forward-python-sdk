    DeviceSet:
      type: object
      properties:
        devices:
          type: array
          items:
            type: string
          examples:
            - - atl-edge-fw01
              - ny-edge-fw2
    DeviceTag:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          description: The device tag’s name. Case-insensitive. May include spaces.
          examples:
            - SEC
        color:
          type: string
          description: >-
            The device tag’s color in RGB hex format. Used in network topology
            diagrams if specified.
          examples:
            - '#0064a0'
    DeviceTagPatch:
      type: object
      properties:
        name:
          type: string
          description: The device tag’s name. Case-insensitive. May include spaces.
          examples:
            - SEC
        color:
          type: string
          description: >-
            The device tag’s color in RGB hex format. Used in network topology
            diagrams if specified.
          examples:
            - '#0064a0'
    DeviceTagWithDevices:
      allOf:
        - $ref: '#/components/schemas/DeviceTag'
        - type: object
          properties:
            devices:
              type: array
              items:
                type: string
              description: >-
                The names of network devices and/or endpoints associated with
                this tag.
              examples:
                - - atl-edge-fw01
                  - ny-edge-fw2
    DeviceTags:
      type: object
      properties:
        tags:
          type: array
          items:
            $ref: '#/components/schemas/DeviceTag'
    DeviceTagsWithDevices:
      type: object
      properties:
        tags:
          type: array
          items:
            $ref: '#/components/schemas/DeviceTagWithDevices'
    DevicesAndTags:
      type: object
      properties:
        devices:
          type: array
          items:
            type: string
          examples:
            - - atl-edge-fw01
              - ny-edge-fw2
        tags:
          type: array
          items:
            type: string
          examples:
            - - SEC
    Encryptor:
      type: object
      required:
        - name
        - siteConnection
        - tunnels
      properties:
        name:
          type: string
          examples:
            - encryptor
        siteConnection:
          $ref: '#/components/schemas/EncryptorConnection'
          description: A connection to a high site
        underlayConnection:
          $ref: '#/components/schemas/EncryptorConnection'
          description: A connection to the underlay network (a low site)
        tunnels:
          type: array
          items:
            $ref: '#/components/schemas/EncryptorTunnel'
          description: >-
            Tunnels to other encryptor devices. A tunnel source address is
            modeled as residing on this device and the

            destination addresses on another encryptor device. A source address
            may be reused on an encryptor. Each

            destination address must match the source address of the tunnel on
            another encryptor, and vice-versa
        subnets:
          type: array
          items:
            type: string
          description: >-
            Subnets to route to the high site, in addition to the source
            addresses of tunnels on the `siteConnection`

            gateway device
    EncryptorList:
      type: object
      required:
        - encryptors
      properties:
        encryptors:
          type: array
          items:
            $ref: '#/components/schemas/Encryptor'
    EncryptorPatch:
      type: object
      properties:
        name:
          type: string
        siteConnection:
          $ref: '#/components/schemas/EncryptorConnection'
        underlayConnection:
          $ref: '#/components/schemas/EncryptorConnection'
        tunnels:
          type: array
          items:
            $ref: '#/components/schemas/EncryptorTunnel'
          description: >-
            If specified, this list will **replace** all existing tunnels on the
            encryptor.
        subnets:
          type: array
          items:
            type: string
          description: >-
            If specified, this set will **replace** all existing subnets on the
            encryptor.
    DevicePort:
      type: object
      properties:
        device:
          type: string
        port:
          type: string
    EncryptorConnection:
      type: object
      required:
        - uplinkPort
      properties:
        uplinkPort:
          $ref: '#/components/schemas/DevicePort'
          description: The physical uplink port on the edge device.
          examples:
            - device: nyc-rtr-01
              port: eth1/1
        gatewayPort:
          $ref: '#/components/schemas/DevicePort'
          description: The virtual gateway port, if different than `uplinkPort`.
          examples:
            - device: nyc-rtr-01
              port: vlan100
        vlan:
          type: integer
          format: int32
          description: The VLAN of traffic from `uplinkPort`, if tagged.
          examples:
            - 100
        name:
          type: string
          description: >-
            An optional name for this connection, which will be used as the
            interface name created on the synthetic

            device that links to the physical edge port.
    EncryptorTunnel:
      type: object
      required:
        - source
        - destination
      properties:
        source:
          type: string
          description: Source IP address of an encryptor tunnel
          examples:
            - 1.1.1.1
        destination:
          type: string
          description: Destination IP address of an encryptor tunnel
          examples:
            - 2.2.2.2
    CliEndpointProfileDef:
      type: object
      required:
        - type
        - name
      properties:
        type:
          type: string
          const: CLI
        name:
          type: string
          description: Name of this profile ("HpPrinter", "SamsungTV", etc.).
          examples:
            - sentry_pdu_ssh
        detectorCommand:
          type: string
          description: >-
            CLI command to run to detect a network endpoint of this type. If
            absent, the profile can be manually

            assigned to a network endpoint, but not auto-detected.
          examples:
            - version
        detectorPatterns:
          type: array
          items:
            type: string
          description: >-
            Patterns matching on output of `detectorCommand` to determine
            whether the device is of this type. Absent if

            `detectorCommand` is absent. Never empty.
          examples:
            - - Sentry Switched PDU
        detectorErrorPatterns:
          type: array
          items:
            type: string
          description: >-
            Patterns matching an error message if a device doesn’t recognize
            `detectorCommand`.
          examples:
            - - Invalid command
              - 'Switched PDU commands:'
        nameDetectorCommand:
          type: string
          description: >-
            Command to use to detect the name of a network endpoint of this
            type. If absent, the name cannot be

            detected.
          examples:
            - show network
        nameDetectorPatterns:
          type: array
          items:
            type: string
          description: >-
            Glob patterns used to extract the device name from the output of
            `nameDetectorCommand`. The word immediately

            after a matched glob pattern is the desired name. If no glob
            patterns are specified, the first word/token in

            the `nameDetectorCommand` output will be used.
          examples:
            - - FQDN:*enabled
        prompt:
          type: string
          description: >-
            A case-insensitive glob pattern used to identify an interactive
            console menu prompt. When this pattern

            matches the end of the prompt, ignoring any trailing whitespace, the
            Collector will enter the configured

            `promptResponse`.
          examples:
            - y/n
        promptResponse:
          type: string
          description: >-
            What the Collector should enter in response to an interactive
            console menu prompt matching `prompt` in order

            to proceed. Required if `prompt` is set.
          examples:
            - 'y'
        pagePrompt:
          type: string
          description: >-
            Case-insensitive glob pattern used to identify a new page banner.
            Works like `prompt`. If the device doesn’t

            generate paginated command output or if paging is like the “more”
            command, omit this property.
          examples:
            - continue\?
        pagePromptResponse:
          type: string
          description: >-
            What the Collector should enter in response to an interactive
            pagination prompt detected via `pagePrompt` in

            order to proceed. Required if `pagePrompt` is set.
          examples:
            - c
        ptyType:
          type: string
          description: Device’s terminal type ("xterm-256color", "vt100", etc.).
          examples:
            - vt100
        ptyColumnSize:
          type: integer
          format: int32
          description: Column size of the output. Defaults to 500.
          examples:
            - 240
        clearPrompt:
          type: string
          description: >-
            Command to clear the prompt. Can be specified like "ctrl-[a-z]" or
            "ctrl+[a-z]". Defaults to

            "ctrl+c".
          examples:
            - ctrl+z
        responseTimeoutSec:
          type: integer
          format: int32
          description: >-
            Timeout in seconds applied to this profile’s CLI commands run during
            discovery and collection.
          examples:
            - 15
        commandSets:
          type: array
          items:
            $ref: '#/components/schemas/CommandSet'
          description: >-
            Predefined command sets to run on network endpoints with this
            profile. The "UNIX" set includes the commands

            "ifconfig", "netstat -ln", "hostname", and "uname -a".
          examples:
            - - UNIX
        customCommands:
          type: array
          items:
            type: string
          description: >-
            Additional commands to run on network endpoints with this profile.
            Commands should be

            read-only.
          examples:
            - - uptime
              - iptables -L
    CliEndpointProfilePatch:
      type: object
      properties:
        name:
          type: string
          description: >-
            Name of this profile ("HpPrinter", "SamsungTV", etc.). Omit to leave
            this property alone.
          examples:
            - sentry_pdu_ssh
        detectorCommand:
          type: string
          description: >-
            CLI command to run to detect a network endpoint of this type. If
            absent, the profile can be manually

            assigned to a network endpoint, but not auto-detected. Use `null` to
            clear. Omit to leave this property

            alone.
          examples:
            - version
        detectorPatterns:
          type: array
          items:
            type: string
          description: >-
            Patterns matching on output of `detectorCommand` to determine
            whether the device is of this type. Absent if

            `detectorCommand` is absent. Never empty. Use `null` to clear. Omit
            to leave this property alone.
          examples:
            - - Sentry Switched PDU
        detectorErrorPatterns:
          type: array
          items:
            type: string
          description: >-
            Patterns matching an error message if a device doesn’t recognize
            `detectorCommand`. Use `null` to clear.

            Omit to leave this property alone.
          examples:
            - - Invalid command
              - 'Switched PDU commands:'
        nameDetectorCommand:
          type: string
          description: >-
            Command to use to detect the name of a network endpoint of this
            type. If absent, the name cannot be

            detected. Use `null` to clear. Omit to leave this property alone.
          examples:
            - show network
        nameDetectorPatterns:
          type: array
          items:
            type: string
          description: >-
            Glob patterns used to extract the device name from the output of
            `nameDetectorCommand`. The word immediately

            after a matched glob pattern is the desired name. If no glob
            patterns are specified, the first word/token in

            the `nameDetectorCommand` output will be used. Use `null` to clear.
            Omit to leave this property alone.
          examples:
            - - FQDN:*enabled
        prompt:
          type: string
          description: >-
            A case-insensitive glob pattern used to identify an interactive
            console menu prompt. When this pattern

            matches the end of the prompt, ignoring any trailing whitespace, the
            Collector will enter the configured

            `promptResponse`. Use `null` to clear. Omit to leave this property
            alone.
          examples:
            - y/n
        promptResponse:
          type: string
          description: >-
            What the Collector should enter in response to an interactive
            console menu prompt matching `prompt` in order

            to proceed. Required if `prompt` is set. Use `null` to clear. Omit
            to leave this property alone.
          examples:
            - 'y'
        pagePrompt:
          type: string
          description: >-
            Case-insensitive glob pattern used to identify a new page banner.
            Works like `prompt`. If the device doesn’t

            generate paginated command output or if paging is like the “more”
            command, omit this property. Use `null` to

            clear. Omit to leave this property alone.
          examples:
            - continue\?
        pagePromptResponse:
          type: string
          description: >-
            What the Collector should enter in response to an interactive
            pagination prompt detected via `pagePrompt` in

            order to proceed. Required if `pagePrompt` is set. Use `null` to
            clear. Omit to leave this property alone.
          examples:
            - c
        ptyType:
          type: string
          description: >-
            Device’s terminal type ("xterm-256color", "vt100", etc.). Use `null`
            to clear. Omit to leave this property

            alone.
          examples:
            - vt100
        ptyColumnSize:
          type: integer
          format: int32
          description: >-
            Column size of the output. Defaults to 500. Use `null` to clear.
            Omit to leave this property

            alone.
          examples:
            - 240
        clearPrompt:
          type: string
          description: >-
            Command to clear the prompt. Can be specified like "ctrl-[a-z]" or
            "ctrl+[a-z]". Defaults to "ctrl+c". Use

            `null` to clear. Omit to leave this property alone.
          examples:
            - ctrl+z
        responseTimeoutSec:
          type: integer
          format: int32
          description: >-
            Timeout in seconds applied to this profile’s CLI commands run during
            discovery and collection. Use `null` to

            clear. Omit to leave this property alone.
          examples:
            - 15
        commandSets:
          type: array
          items:
            $ref: '#/components/schemas/CommandSet'
          description: >-
            Predefined command sets to run on network endpoints with this
            profile. The "UNIX" set includes the commands

            "ifconfig", "netstat -ln", "hostname", and "uname -a". Use `null` to
            clear. Omit to leave this property

            alone.
          examples:
            - - UNIX
        customCommands:
          type: array
          items:
            type: string
          description: >-
            Additional commands to run on network endpoints with this profile.
            Commands should be read-only. Use `null`

            to clear. Omit to leave this property alone.
          examples:
            - - uptime
              - iptables -L
    EndpointProfile:
      allOf:
        - type: object
          oneOf:
            - $ref: '#/components/schemas/CliEndpointProfile'
            - $ref: '#/components/schemas/SnmpEndpointProfile'
            - $ref: '#/components/schemas/HttpEndpointProfile'
          discriminator:
            propertyName: type
            mapping:
              CLI: '#/components/schemas/CliEndpointProfile'
              SNMP: '#/components/schemas/SnmpEndpointProfile'
              HTTP: '#/components/schemas/HttpEndpointProfile'
        - $ref: '#/components/schemas/Attribution'
    EndpointProfiles:
      type: object
      required:
        - profiles
      properties:
        profiles:
          type: array
          items:
            $ref: '#/components/schemas/EndpointProfile'
    HttpEndpointProfileDef:
      type: object
      required:
        - type
        - name
        - https
        - authType
        - endpoints
      properties:
        type:
          type: string
          const: HTTP
        name:
          type: string
          description: Name of this profile ("HpPrinter", "SamsungTV", etc.)
          examples:
            - nsxt_https
        https:
          type: boolean
          description: Whether to use HTTPS to connect rather than HTTP.
          examples:
            - true
        authType:
          $ref: '#/components/schemas/HttpAuthStrategy'
          description: >-
            The type of HTTP authentication that devices of this type require
            for API requests.
          examples:
            - BASIC_AUTH
        headers:
          type: object
          additionalProperties:
            type: string
          description: >-
            HTTP headers to send in API requests to devices of this type. These
            headers should not contain sensitive

            data. Authentication should be handled separately if required using
            credentials assigned or discovered on a

            per-device basis. Use `authType` to specify what type of HTTP
            authentication this device type requires.
          examples:
            - accept: application/json
        detectorUri:
          type: string
          description: >-
            HTTP GET URI (path and optional query string) used to detect whether
            a device of unknown type is this kind

            of network endpoint. If absent, the profile can be manually assigned
            to a network endpoint, but not

            auto-detected.
          examples:
            - /login.jsp
        detectorPatterns:
          type: array
          items:
            type: string
          description: >-
            Case-insensitive glob patterns used on the response of a request to
            `detectorUri` to determine whether a

            device of unknown type is of this type. Absent if `detectorUri` is
            absent. Never empty.
          examples:
            - - VMware NSX
        endpoints:
          type: array
          items:
            $ref: '#/components/schemas/HttpEndpoint'
          description: >-
            HTTP GET endpoints to collect from network endpoints with this
            profile. Never empty.
          examples:
            - - name: compute_managers
                path: /api/v1/fabric/compute-managers
              - name: logical_router_ports
                path: /api/v1/logical-router-ports
                paginationModel:
                  type: OFFSET
                  itemsArrayField:
                    - ports
                  parameterName: page
                  offsetIncrementExpression:
                    operator: PLUS_ONE
    HttpEndpointProfilePatch:
      type: object
      properties:
        authType:
          $ref: '#/components/schemas/HttpAuthStrategy'
          description: >-
            The type of HTTP authentication that devices of this type require
            for API requests. Omit to leave this

            property alone.
          examples:
            - BASIC_AUTH
        detectorPatterns:
          type: array
          items:
            type: string
          description: >-
            Case-insensitive glob patterns used on the response of a request to
            `detectorUri` to determine whether a

            device of unknown type is of this type. Absent if `detectorUri` is
            absent. Never empty. Use `null` to clear.

            Omit to leave this property alone.
          examples:
            - - VMware NSX
        detectorUri:
          type: string
          description: >-
            HTTP GET URI (path and optional query string) used to detect whether
            a device of unknown type is this kind

            of network endpoint. If absent, the profile can be manually assigned
            to a network endpoint, but not

            auto-detected. Use `null` to clear. Omit to leave this property
            alone.
          examples:
            - /login.jsp
        endpoints:
          type: array
          items:
            $ref: '#/components/schemas/HttpEndpoint'
          description: >-
            HTTP GET endpoints to collect from network endpoints with this
            profile. Never empty. Omit to leave this

            property alone.
          examples:
            - - name: compute_managers
                path: /api/v1/fabric/compute-managers
              - name: logical_router_ports
                path: /api/v1/logical-router-ports
                paginationModel:
                  type: OFFSET
                  itemsArrayField:
                    - ports
                  parameterName: page
                  offsetIncrementExpression:
                    operator: PLUS_ONE
        headers:
          type: object
          additionalProperties:
            type: string
          description: >-
            HTTP headers to send in API requests to devices of this type. These
            headers should not contain sensitive

            data. Authentication should be handled separately if required using
            credentials assigned or discovered on a

            per-device basis. Use `authType` to specify what type of HTTP
            authentication this device type requires. Use

            `null` to clear. Omit to leave this property alone.
          examples:
            - accept: application/json
        https:
          type: boolean
          description: >-
            Whether to use HTTPS to connect rather than HTTP. Omit to leave this
            property alone.
          examples:
            - true
        name:
          type: string
          description: >-
            Name of this profile ("HpPrinter", "SamsungTV", etc.) Omit to leave
            this property alone.
          examples:
            - nsxt_https
    SnmpEndpointProfileDef:
      type: object
      required:
        - type
        - name
      properties:
        type:
          type: string
          const: SNMP
        name:
          type: string
          description: Name of this profile ("HpPrinter", "SamsungTV", etc.).
          examples:
            - esxi_snmp
        detectorOid:
          type: string
          description: >-
            OID to collect to detect a network endpoint of this type. If absent,
            the profile can be manually assigned to

            a network endpoint, but not auto-detected.
          examples:
            - 1.3.6.1.2.1.1.1.0
        detectorPatterns:
          type: array
          items:
            type: string
          description: >-
            Patterns matching on output of `detectorOid` to determine whether
            the device is of this type. Absent if

            `detectorOid` is absent. Never empty.
          examples:
            - - ESXi
        nameDetectorOid:
          type: string
          description: >-
            OID to collect to detect the name of a network endpoint of this
            type. If absent, the name cannot be

            detected.
          examples:
            - 1.3.6.1.2.1.1.5
        nameDetectorPatterns:
          type: array
          items:
            type: string
          description: >-
            Glob patterns used to extract the device name from the collected
            value for `nameDetectorOid`. The word

            immediately after a matched glob pattern is the desired name. If no
            glob patterns are specified, the first

            word/token in the `nameDetectorOid` value will be used.
          examples:
            - - FQDN:*enabled
        responseTimeoutSec:
          type: integer
          format: int32
          description: >-
            Timeout in seconds for retrieving the value of one of this profile’s
            OIDs during discovery or collection.

            Defaults to 5.
          examples:
            - 10
        oidSets:
          type: array
          items:
            $ref: '#/components/schemas/OidSet'
          description: >-
            Predefined OID sets to collect from network endpoints with this
            profile. The "STANDARD" set includes OIDs

            for system name, system description, TCP info, UDP info, host
            address, and interface info.
          examples:
            - - STANDARD
        customOids:
          type: array
          items:
            $ref: '#/components/schemas/CustomOid'
          description: >-
            Additional OIDs to collect from network endpoints with this profile.
            The output of each OID is saved to a

            file with the associated name.
          examples:
            - - name: system_desc
                oid: 1.3.6.1.2.1.1.1
              - name: hostname
                oid: 1.3.6.1.2.1.1.5
    SnmpEndpointProfilePatch:
      type: object
      properties:
        name:
          type: string
          description: >-
            Name of this profile ("HpPrinter", "SamsungTV", etc.). Omit to leave
            this property alone.
          examples:
