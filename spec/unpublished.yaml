    post:
      operationId: createCustomCommandGroup
      summary: Create a custom command group
      description: Creates a group and returns 201 with no body. Gated by EDIT_CUSTOM_COLLECTION_GROUPS. Commands are checked per device type against Forward's allowed and banned patterns; a refused command is 400. A ':::' sequence needs a collector that supports it (400 otherwise). A group whose commands match the organization's disabledCommands is silently skipped at collection (Go SDK, source-only).
      x-forward-stability: unpublished
      tags:
      - Custom Command Groups
      parameters:
      - name: networkId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SrcNewCustomCommandGroup'
            # from source: web/src/main/java/com/forwardnetworks/cv/web/controller/CustomCommandGroupController.java (NewCustomCommandGroup); example constructed, values are placeholders
            example:
              name: example-group
              deviceConnTypes:
              - cisco_ios_xe_ssh
              commands:
              - show clock
      responses:
        '201':
          description: Created. No body.
  /networks/{networkId}/custom-command-groups/{groupName}:
    patch:
      operationId: updateCustomCommandGroup
      summary: Change a custom command group
      description: 'Partial update: absent or null fields are unchanged. Commands or oids must match the group''s kind. Gated by EDIT_CUSTOM_COLLECTION_GROUPS. Returns 204. Live: not exercised.'
      x-forward-stability: unpublished
      tags:
      - Custom Command Groups
      parameters:
      - name: networkId
        in: path
        required: true
        schema:
          type: string
      - name: groupName
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SrcCustomCommandGroupUpdate'
            # from source: web/src/main/java/com/forwardnetworks/cv/web/controller/CustomCommandGroupController.java (CustomCommandGroupUpdate); example constructed
            example:
              disabled: true
      responses:
        '204':
          description: Updated. No body.
    delete:
      operationId: deleteCustomCommandGroup
      summary: Delete a custom command group
      description: Deletes the named group (exact name). Gated by EDIT_CUSTOM_COLLECTION_GROUPS. Returns 204. Go SDK note, commands stop being collected from the next collection.
      x-forward-stability: unpublished
      tags:
      - Custom Command Groups
      parameters:
      - name: networkId
        in: path
        required: true
        schema:
          type: string
      - name: groupName
        in: path
        required: true
        schema:
          type: string
      responses:
        '204':
          description: Deleted.
  /networks/{networkId}/custom-command-groups?action=validate:
    post:
      operationId: validateCustomCommands
      summary: Check commands against device types
      description: 'Asks which of the commands the device types do not allow, without writing anything. An empty result (the unsupported key absent) means every command is accepted. Gated by EDIT_CUSTOM_COLLECTION_GROUPS. Declared static in Java: the check is type-level only.'
      x-forward-stability: unpublished
      tags:
      - Custom Command Groups
      parameters:
      - name: networkId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SrcCustomCommandsValidationRequest'
            # from source: web/src/main/java/com/forwardnetworks/cv/web/controller/CustomCommandGroupController.java (CustomCommandsValidationRequest); example constructed
            example:
              deviceConnTypes:
              - cisco_ios_xe_ssh
              commands:
              - show clock
      responses:
        '200':
          description: Unsupported commands.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SrcCustomCommandsValidationResponse'
              # from source: constructed from CustomCommandsValidationResponse.java; the command is a placeholder
              example:
                unsupported:
                - command: show clock | redirect
                  unsupportedConnTypes:
                  - cisco_ios_xe_ssh
