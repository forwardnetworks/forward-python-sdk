        createdBy:
          type: string
          description: >-
            The username of the user who created this entity, if known. Absent
            if the user account has been

            deleted.
          examples:
            - me@example.com
        updatedById:
          type: string
          description: >-
            The ID of the user who most recently updated this entity, if known.
            *Note*: The referenced user account

            might no longer exist since an administrator can delete accounts.
          examples:
            - '789'
        updatedAt:
          type: string
          description: When this entity was most recently updated, if known.
          examples:
            - '2024-10-27T21:44:51.345Z'
        updatedBy:
          type: string
          description: >-
            The username of the user who most recently updated this entity, if
            known. Absent if the user account has

            been deleted.
          examples:
            - you@example.com
