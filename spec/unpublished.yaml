                  name: "<collector-name>"
                  username: "<collector-username>"
                  createdAt: 1725891706091
                  createdBy: "<user-id>"
                  isDefault: false
                  connectionStatus: CONNECTED
                  health:
                    status: HEALTHY
                    issues: []
                  version: "26.9.0-18"
                  features:
                    latest: 35
                    updatable: true
                  updateStatus: UP_TO_DATE
                  collectorUpdating: false
                  externalIp: "192.0.2.10"
                  internalIps: ["192.0.2.20"]
                  networkIds: ["<network-id>"]
  /collectors/{collectorName}/metrics:
    get:
      operationId: getCollectorMetrics
      summary: A collector's own resource metrics over a time window
      description: >-
        Requires the DEBUG_COLLECTORS organization permission (@Requires(org = DEBUG_COLLECTORS)), which most logins
        lack. The collector is named by its name, not its id. An unknown name is a 400.
      x-forward-stability: unpublished
      tags: [Collector Binding]
      parameters:
        - name: collectorName
          in: path
          required: true
          schema: { type: string }
        - name: startTime
          in: query
          required: true
          description: The start of the window, as an ISO-8601 instant.
          schema: { type: string, format: date-time }
        - name: endTime
          in: query
          required: true
          description: The end of the window, as an ISO-8601 instant.
          schema: { type: string, format: date-time }
        - name: samplesPerSeries
          in: query
          required: false
          description: >-
            How many samples each series keeps when the window holds more. Must be greater than 1. Forward caps it at
            5000 and defaults it to 500. Forward downsamples by keeping each series' peaks and troughs, so the result can
            hold more than this number.
          schema: { type: integer, minimum: 2, maximum: 5000, default: 500 }
      responses:
        "200":
          description: The samples, oldest first. Empty when the collector uploaded nothing in the window.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SysCollectorMetricsResponse'
              example:
