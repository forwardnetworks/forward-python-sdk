              example:
                commitId: "0a0a0a0a0a0a0a0a0a0a0a0a0a0a0a0a0a0a0a0a"
                note: Change testing
                committedById: "-1"
                committedAt: "1970-01-02T10:17:36.789Z"

  /networks/{networkId}/change-sets/{changeSetId}/commits/{commitId}?action=restoreAsNew:
    post:
      operationId: restoreChangeSetCommitAsNew
      summary: Copy a committed version into a new change set
      description: >-
        targetName and targetBaseSnapshotId are optional. The base snapshot must
