        - { name: changeSetId, in: path, required: true, schema: { type: string } }
        - { name: commitId, in: path, required: true, schema: { type: string } }
        - { name: deviceName, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The device's configuration as UTF-8 text.
          content:
            text/plain:
              schema: { type: string }

  /networks/{networkId}/change-sets/{changeSetId}/draft/devices/{deviceName}/config:
    get:
      operationId: getChangeSetDraftDeviceConfig
      summary: Read one device's configuration as the draft would leave it
      description: >-
        Returns the configuration as plain text. Requires the MANAGE_CHANGE_SETS
        network permission and the PREDICT_MODELING organization property, and
        device access for the caller. Source-only: not called live. The Go SDK says
        Forward answers 404 with no draft or no change for the device; the
        source was not traced to confirm that.
      x-forward-stability: unpublished
      tags: [Change Sets]
      parameters:
        - { name: networkId, in: path, required: true, schema: { type: string } }
        - { name: changeSetId, in: path, required: true, schema: { type: string } }
        - { name: deviceName, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The device's configuration as UTF-8 text.
          content:
            text/plain:
              schema: { type: string }

    put:
      operationId: saveChangeSetDraftDeviceConfig
      summary: Replace a device's whole configuration in the draft
      description: >-
        The body is the complete running configuration, as text/plain. It replaces
        any staged commands for that device, since a device has either commands or a
        configuration file. The limit is 2 MB of UTF-8 bytes; a larger body is refused
        with 400. Requires the MANAGE_CHANGE_SETS network permission and the
        PREDICT_MODELING organization property, and device access for the caller.
        Source-only: not called live.
      x-forward-stability: unpublished
      tags: [Change Sets]
      parameters:
        - { name: networkId, in: path, required: true, schema: { type: string } }
        - { name: changeSetId, in: path, required: true, schema: { type: string } }
        - { name: deviceName, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          text/plain:
            schema: { type: string }
      responses:
        "204": { description: Saved. }

  /networks/{networkId}/change-sets/{changeSetId}/devices/{deviceName}/config?action=preview:
    post:
      operationId: previewChangeSetDeviceConfig
      summary: Preview a device's configuration with CLI commands applied
      description: >-
