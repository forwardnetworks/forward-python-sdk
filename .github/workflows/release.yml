name: Release

# Publishes to PyPI with Trusted Publishing (OIDC): no API token is stored in
# this repository.
#
# One-time setup before the first tag:
#   1. On PyPI, add a GitHub Trusted Publisher for project forward-sdk:
#      owner=forwardnetworks, repo=forward-python-sdk, workflow=release.yml,
#      environment=pypi. For a project that does not exist yet, use PyPI's
#      "pending publisher" form.
#   2. In this repository, create an environment named "pypi", optionally with
#      required reviewers to gate publishes.

"on":
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Check the tag matches the package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(uv run python -c 'import forward_sdk; print(forward_sdk.__version__)')"
          if [ "$tag" != "$version" ]; then
            echo "tag $tag does not match __version__ $version" >&2
            exit 1
          fi

      - name: Run the test suite
        run: |
          uv sync --all-groups
          uv run pytest -q

      - run: uv build
      - run: uvx twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/forward-sdk/
    permissions:
      id-token: write  # OIDC token for Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          attestations: true
