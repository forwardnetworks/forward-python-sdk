        name:
          type: string
    JumpServer:
      type: object
      required:
        - host
        - username
      properties:
        id:
          type: string
          examples:
            - 8c4a168e-c6ca-4978-bcc9-c0ec7f64a164
        host:
          type: string
          examples:
            - 10.121.7.14
        port:
          type: integer
          format: int32
          description: defaults to 22
          examples:
            - 23
        username:
          type: string
          examples:
            - admin
        password:
          type: string
          description: >-
            Either this or `sshKey` must be provided in requests. A
            system-generated identifier is substituted for the

            actual password in responses.
          examples:
            - my-s3cr3t-p4s$w0rd
        sshKey:
          type: string
          description: >-
            SSH private key for authentication. Either this or `password` must
            be provided in requests. Requires

            `supportsPortForwarding` to be true. A system-generated identifier
            is substituted for the actual key in

            responses.
          examples:
            - |-
              -----BEGIN RSA PRIVATE KEY-----
              MIIPIQIBAzCCDtoGCSqGSIb3DQEHAa...
        sshCert:
          type: string
          description: >-
            SSH user certificate for authentication. Applicable only for
            certificate based authentication and requires

            `sshKey` to be provided.
          examples:
            - >-
              ssh-rsa-cert-v01@openssh.com
              AAAAHHNzaC1yc2EtY2VydC12MDFAb3BlbnNzaC5jb20AAA...
        supportsPortForwarding:
          type: boolean
          description: defaults to true
          examples:
            - false
        commandFormat:
          $ref: '#/components/schemas/JumpServerCommandFormat'
          description: applicable when supportsPortForwarding is false, defaults to UNIX
          examples:
            - CISCO_IOS
        vrf:
          type: string
          description: >-
            VRF that this jump server should use to connect to devices. Can be
            set only if `commandFormat`

            is CISCO_IOS.
          examples:
            - Management-vrf
        authenticationTimeoutSeconds:
          type: integer
          format: int32
          description: >-
            seconds to wait for the jump server authentication response.
            Defaults to 20.
          examples:
            - 20
        maxSessions:
          type: integer
          format: int32
          description: >-
            Maximum number of devices per jump server from which to collect
            concurrently. Must be in [1, 1024]

            if specified. Defaults to collector concurrency.
          examples:
            - 100
        maxStartups:
          type: integer
          format: int32
          description: >-
            Maximum number of concurrent unauthenticated connections to the jump
            server's SSH daemon. Must be in [1, 1024]

            if specified. Defaults to 8.
          examples:
            - 10
    JumpServerUpdate:
      type: object
