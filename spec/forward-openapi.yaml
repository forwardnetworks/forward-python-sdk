    SourceConnectivityResult:
      type: object
      required:
        - startTime
        - endTime
        - savedAt
      properties:
        startTime:
          type: string
          description: >-
            When this connectivity test began, according to the Collector’s
            system clock.
          examples:
            - '2025-05-28T12:33:00.000Z'
        endTime:
          type: string
          description: >-
            When this connectivity test ended, according to the Collector’s
            system clock.
          examples:
            - '2025-05-28T12:33:33.333Z'
        savedAt:
          type: string
          description: >-
            When this connectivity test result was saved to the database,
            according to the server’s system

            clock.
          examples:
            - '2025-05-28T12:34:56.789Z'
        error:
          $ref: '#/components/schemas/ConnectivityTestError'
          description: >-
            The error encountered during the test. Present if the test failed.
            Absent if the test passed.
          examples:
            - PING_FAILED
        errorPhase:
          type: string
          description: >-
            The test phase during which `error` was encountered. Present if
            `error` is present.
          examples:
            - CONNECTION
          enum:
            - CONNECTION
            - AUTHENTICATION
            - TYPE_DISCOVERY
            - SETUP
            - AUTHORIZATION
            - QUERY
        discoveredType:
          $ref: '#/components/schemas/ClassicDeviceType'
          description: The device type auto-discovered during the connectivity test.
          examples:
            - arista_eos_ssh
        discoveredCliCredentialId:
          type: string
          description: >-
            The `id` of the working CliCredential of type `LOGIN`
            auto-discovered during the connectivity test. Can only

            be present for device types collected via SSH.
          examples:
            - L-3
        discoveredCliCredential2Id:
          type: string
          description: >-
            The `id` of the working CliCredential of type `PRIVILEGED_MODE` (for
            Cisco-like and Checkpoint devices) or

            `SHELL` (for Avi controllers) auto-discovered during the
            connectivity test. Can only be present for device

            types collected via SSH or Telnet.
          examples:
            - PM-2
        discoveredCliCredential3Id:
          type: string
          description: >-
            The `id` of the working CliCredential of type `EXPERT_MODE` (for
            Checkpoint devices) auto-discovered during

            the connectivity test. Can only be present for device types
            collected via SSH.
          examples:
            - EM-3
        discoveredHttpCredentialId:
          type: string
          description: >-
            The `id` of the working HttpCredential of type `LOGIN` or `API_KEY`
            auto-discovered during the connectivity

            test. Can only be present for device types collected via HTTPS.
          examples:
            - H-5
        discoveredSnmpCredentialId:
          type: string
          description: >-
            The `id` of the working SnmpCredential auto-discovered during the
            connectivity test.
          examples:
            - S-1
        hostIps:
          type: array
          items:
            type: string
          description: >-
            The IP addresses to which `host` resolves if it’s a hostname.
            Contains just `host` itself if it’s an IP

            address.
          examples:
            - - 10.121.7.13
        unauthorizedCommands:
          type: array
          items:
            type: string
          description: >-
            Commands that failed with an authorization (permission) error during
            the connectivity test.
          examples:
            - - show config
              - show interfaces status
    Attribution:
      type: object
      properties:
        createdById:
          type: string
          description: >-
            The ID of the user who created this entity, if known. *Note*: The
