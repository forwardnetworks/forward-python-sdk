        - { name: snapshotId, in: query, schema: { type: string }, description: "Uses the network's latest processed snapshot when omitted." }
      responses:
        "200":
          description: Device names mapped to the zones they belong to.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SecurityZones" }
              example: { ash-dc-fw01: [api, app, database, dmz, inside, services, untrust] }

  /networks/{networkId}/devices/{deviceName}/security-zones/{zoneName}:
    get:
      operationId: getSecurityZone
      summary: One device zone's VRFs, interfaces, subnets and covered topology
      x-forward-stability: unpublished
      tags: [Security Zones]
      parameters:
        - { name: networkId, in: path, required: true, schema: { type: string } }
        - { name: deviceName, in: path, required: true, schema: { type: string } }
        - { name: zoneName, in: path, required: true, schema: { type: string } }
        - { name: snapshotId, in: query, schema: { type: string }, description: "Uses the network's latest processed snapshot when omitted." }
      responses:
        "200":
          description: The zone's details.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SecurityZoneDetails" }
              example:
                vrfs: [default]
                interfaces: [ethernet1/5]
                subnets: ["172.16.20.0/24"]
                coveredTopo: { nodes: [{ id: ash-dc-fw01 }], links: [], hosts: [] }

  # -------------------------------------------------------- security matrix filters ---
  # Saved resource-pool selections a user can re-run against the security matrix
