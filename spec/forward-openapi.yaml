    CreateWorkspaceNetworkRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          examples:
            - My Network - Workspace A
        note:
          type: string
          examples:
            - For change window 2021-10-30-ABC
        devices:
          type: array
          items:
            type: string
          description: >-
            Names of the [classic
            devices](https://docs.fwd.app/latest/api/classic-devices/) to
            include. Can be omitted or

            empty if `cloudAccounts` or `vcenters` is nonempty.
          examples:
            - - nyc-dc01-tor01
              - nyc-dc01-rtr01
        cloudAccounts:
          type: array
          items:
            type: string
          description: >-
            Names of the cloud accounts

            [AWS](https://docs.fwd.app/latest/application/sources/configure-collection/cloud/aws-setup/),

            [GCP](https://docs.fwd.app/latest/application/sources/configure-collection/cloud/gcp-setup/),
            or

            [Azure](https://docs.fwd.app/latest/application/sources/configure-collection/cloud/azure-setup/)
            to

            include. Can be omitted or empty if `devices` or `vcenters` is
            nonempty.
          examples:
            - - my-aws-account
              - my-gcp-account
              - my-azure-account
        vcenters:
          type: array
          items:
            type: string
          description: >-
            Names of the

            [vCenters](https://docs.fwd.app/latest/application/sources/configure-collection/vmware-account/#adding-a-vcenter-source)

            to include. Can be omitted or empty if `devices` or `cloudAccounts`
            is nonempty.
          examples:
            - - vcenter-01
        omissions:
          type: array
          items:
            type: string
            enum:
              - CUSTOM_COMMANDS
              - NQE_CHECKS
              - PREDEFINED_CHECKS
              - INTENT_CHECKS
          description: What to omit (not copy) from the parent network
          examples:
            - - CUSTOM_COMMANDS
              - NQE_CHECKS
        retentionDays:
          type: integer
          format: int32
          minimum: 1
          maximum: 365
          description: >-
            Number of days of inactivity after which the Workspace network will
            be deleted. If omitted, the value

            defaults to 7. If specified as null, this network will be considered
            permanent.
    Network:
      type: object
      required:
        - id
        - name
        - orgId
      properties:
        id:
          type: string
        parentId:
          type: string
          description: >-
            The network from which this Workspace network was created. Absent if
            this network is not a

            Workspace.
        name:
          type: string
          examples:
            - My Network
        orgId:
          type: string
        creator:
          type: string
          description: >-
            The username of the user who created the network, or null if the
            account was deleted
          examples:
            - mary
        creatorId:
          type: string
          description: >-
            The id of the user who created the network, or null if the account
            was deleted
          examples:
            - '123'
        createdAt:
          type: string
          examples:
            - '2022-04-06T20:34:45.118Z'
        note:
          type: string
          description: An optional network description.
        retentionDays:
          type: integer
          format: int32
          minimum: 1
          maximum: 365
          description: >-
            The number of days without any use of this network after which it
            will be automatically deleted. Absent for

            parent networks and permanent Workspace networks.
        secondsToExpiry:
          type: integer
          format: int64
          description: >-
            Number of seconds without use before the network expires. Present
            for temporary Workspace

            networks only.
    NetworkUpdate:
      type: object
      properties:
        name:
          type: string
        note:
          type: string
        retentionDays:
          type: integer
          format: int32
