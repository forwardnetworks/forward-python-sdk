    patch:
      operationId: updateCommonBackupSettings
      summary: Change the backup schedule or retention for one storage
      description: >-
        Requires the ADMINISTER_SYSTEM system permission. Omitted fields keep their stored values. An explicit null is
        not a clear: Forward treats null as "keep" for every field here. Source-only.
      x-forward-stability: unpublished
      tags: [Backups]
      parameters:
        - name: storageType
          in: query
          required: true
          schema: { type: string, enum: [INTERNAL, S3] }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SysCommonBackupSettingsPatch'
      responses:
        "200":
          description: The settings after the change.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SysCommonBackupSettings'
              # # from source: backend/cbr/cbr-common/src/main/java/com/forwardnetworks/cbr/settings/CommonBackupSettings.java
              example:
                enabled: true
                backupTime: 03:30
                numDaysToRetain: 14
                includeSnapshots: true
  /backup-settings/storage?storageType=S3:
    get:
      operationId: getS3BackupStorage
