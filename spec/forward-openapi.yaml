              $ref: '#/components/schemas/NqeExecutionRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NqeExecutionResponse'
        '400':
          description: >-
            The query could not be executed. If there's a problem with the NQE
            query itself, such as a parse error,

            `errors` will include diagnostic information with line numbers.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NqeErrorInfo'
      security:
        - api_token: []
  /networks/{networkId}/nqe-executions/{executionKey}:
    get:
      tags:
        - NQE
      summary: Get NQE query execution status
      description: >-
        Returns the current status of an NQE query execution. When it completes
        normally, the `outcome` will be `OK` and

        the result can then be retrieved using [Get NQE query execution

        result](https://docs.fwd.app/latest/api/nqe/get-nqe-execution-result/).
        When the query has completed with an

        `outcome` of `USER_ERROR`, the response includes an `error` that
        contains the diagnostic output.


        Poll this endpoint until the execution is complete. We recommend polling
        no more than once every 5 seconds. If

        you need lower latency than polling allows, consider using the
        synchronous

        [Run an NQE query](https://docs.fwd.app/latest/api/nqe/run-nqe-query/)
        to obtain its result in a single request

        instead.


        An `executionKey` remains valid until the next major release of Forward
        Enterprise; afterwards,

        this endpoint returns a 404 error for that key.
      operationId: getNqeExecutionStatus
      x-position: 3
      parameters:
        - name: networkId
          in: path
          description: The ID of the Network the execution belongs to.
          required: true
          schema:
            type: string
        - name: executionKey
          in: path
          description: The `executionKey` returned when the query execution was requested.
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NqeExecutionStatus'
        '404':
          description: >-
            No execution was found for the given `networkId` and `executionKey`.
            This happens if the network has been

            deleted, if the key is unknown, or if it has expired following a
            major release of Forward Enterprise.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorInfo'
      security:
        - api_token: []
  /networks/{networkId}/nqe-executions/{executionKey}/result:
    get:
      tags:
        - NQE
      summary: Get NQE query execution result
      description: >-
        Returns the result of an NQE query execution whose `status` is
        `COMPLETED` and `outcome` is `OK`. The response

        contains the rows produced by the query in the `items` property; use the
        `offset` and `limit` query parameters

        to page through large result sets.


        An `executionKey` remains valid until the next major release of Forward
        Enterprise; afterwards,

        this endpoint returns a 404 error for that key.
      operationId: getNqeExecutionResult
      x-position: 4
      parameters:
        - name: networkId
          in: path
          description: The ID of the Network the result belongs to.
          required: true
          schema:
            type: string
        - name: executionKey
          in: path
          description: The `executionKey` returned when the query execution was requested.
          required: true
          schema:
            type: string
        - name: offset
          in: query
          description: >-
            Zero-based index of the first row to return. Use together with
            `limit` to page through large result

            sets.
          schema:
            type: integer
            format: int32
            default: 0
        - name: limit
          in: query
          description: >-
            Maximum number of rows to return in this response. When omitted, no
            limit is applied and all

            remaining rows from `offset` onward are returned.
          schema:
            type: integer
            format: int32
      responses:
        '200':
          description: >-
            The JSON response contains the query result rows in the `items`
            property.


            If you wish to consume rows incrementally, without loading the
            entire result set into memory at once, send

            the `Accept: application/jsonl` header to get the result in the JSON
            Lines (newline-delimited JSON) format.

            The response will contain one query result row per line.


            Alternatively, send the `Accept: text/csv` header to download the
            result as a CSV file. The first line is a

            header row of column names, followed by one query result row per
            line.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NqeRunResult'
            application/jsonl:
              itemSchema:
                $ref: '#/components/schemas/NqeRecord'
            application/x-ndjson:
              itemSchema:
                $ref: '#/components/schemas/NqeRecord'
            text/csv:
              schema:
                type: string
        '400':
          description: >-
            No result is available because the execution's `outcome` is not
            `OK`. For example, the query

            encountered a runtime error (`USER_ERROR`), exceeded its time limit
            (`TIMED_OUT`), or failed

            due to an unexpected internal error (`SYSTEM_ERROR`).

            [Retrieve the execution
            status](https://docs.fwd.app/latest/api/nqe/get-nqe-execution-status/)
            to see the

            `outcome` and, for a `USER_ERROR`, the associated error details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorInfo'
        '404':
          description: >-
            No execution was found for the given `networkId` and `executionKey`.
            This happens if the network has been

            deleted, if the key is unknown, or if it has expired following a
            major release of Forward Enterprise.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorInfo'
        '409':
          description: >-
            The query execution is still in progress and has no `outcome` yet,
            so no result is available.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorInfo'
      security:
        - api_token: []
  /nqe:
    post:
      tags:
        - NQE
      summary: Run an NQE query
      operationId: runNqeQuery
      x-position: 1
      parameters:
        - name: networkId
          in: query
          description: >-
            The ID of the Network to query. Required unless the `snapshotId`
            parameter is provided.
          schema:
            type: string
        - $ref: '#/components/parameters/SnapshotId'
      requestBody:
        description: >-
          In the example request body, up to 100 rows are requested, starting
          from row 20, from the results consisting

          of all the rows, sorted by the `Name` column in ascending order, and
          limiting to those rows whose `Name`

          property contains `MyDeviceName`. Note that the sample JSON object
          contains both the `query` and `queryId`

          properties and therefore is NOT a valid request. If you use this
          example for testing, then make sure to remove

          one of them. The example `parameters` object is only there as an
          example. It is not needed for either of the

          referenced queries. The referenced query must define parameters
          `mtuThreshold` of type `Integer` and

          `ntpServers` of type `List<IpAddress>` for these values to be valid.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NqeQueryRunRequest'
        required: true
      responses:
        '200':
          description: >-
            The response contains the query's results in the `items` property.
            The `totalNumItems` could be different

            than the length of `items` if a filter is used or if the total size
            of the rows would exceed the maximum

            page size of 400MB.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NqeRunResult'
        '400':
          description: >-
            The query did not complete successfully. For example, the query
            could not be parsed, the column filters

            were invalid, or the query timed out or was cancelled during
            execution. The response will contain

            `completionType`, `errors`, and `snapshotId` properties that provide
            detailed information on the errors. See

            model for more information. Note that a response with a 400 code can
            happen for other errors, such as a lack

            of permission to execute the query, or a request that specified a
            Query ID for a deleted query without also

            specifying a Commit ID. In such cases, the `completionType`,
            `errors`, and `snapshotId` properties will be

            omitted from the response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NqeErrorInfo'
      security:
        - api_token: []
  /nqe-diffs/{before}/{after}:
    post:
      tags:
        - NQE
      summary: Compare NQE query results
      description: >-
        Identifies differences in the results of an NQE query for two Snapshots
        of a network.
      operationId: getNqeQueryDiff
      x-position: 6
      parameters:
        - name: before
          in: path
          description: The ID for the Snapshot to base the diff on.
          required: true
          schema:
            type: string
        - name: after
          in: path
          description: The ID for the Snapshot to diff against the base Snapshot.
          required: true
          schema:
            type: string
      requestBody:
        description: >-
          The `queryId` property contains a Query ID of a query in NQE Library
          (this can be found in the information

          callout of a query listed in the Queries pane). The `commitId`
          property contains a Commit ID of the query

          identified by `queryId` (this can also be found in either the
          information callout in the Queries pane, or in

          the callout in the Versions view dropdown). Use `commitId` to run a
          specific version of the query. The

          `options` property is optional and can be used to refine the results
          and/or specify the JSON format. In the

          sample object below, `options` requests up to 100 rows, starting from
          row 20, from the results consisting of

          all the rows, sorted by `Name` column in ascending order and limited
          to those rows whose `Name` property

          contains `ATL`, rendered with JSON arrays and objects instead of
          strings. The `options` property also allows

          for sorting and filtering on the diff change type column. To do this,
          set the `columnName` value on either the

          `sortBy` or `columnFilters` property to `ChangeType`. It has three
          possible values: `MODIFIED`, `ADDED`, or

          `DELETED`. The `parameters` property can be omitted if the query has
          no declared parameters. If the query

          declares parameters, the `parameters` property should contain a JSON
          object providing the values for the

          parameters to use while executing the query for this request. The
          provided parameter values must match the

          parameter types declared in the NQE query.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NqeDiffRequest'
        required: true
      responses:
        '200':
          description: >-
            The response contains the query's diff results in the `rows`
            property.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NqeDiffResult'
        '400':
          description: >-
            The diff request did not complete successfully. For example, the
            query indicated by `queryId` could be

            invalid, the `options` for the query were invalid, the query and/or
            diff timed out or was cancelled during

            execution, or the user does not have permission to execute the
            query.
          content: {}
      security:
        - api_token: []
