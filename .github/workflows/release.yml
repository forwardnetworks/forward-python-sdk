name: Release

# Publishes to PyPI with Trusted Publishing (OIDC): no API token is stored in
# this repository.
#
# 0.1.0 was published manually with an API token, which claimed the project
# name. Every release after it should come from here instead, which needs one
# piece of setup that can only be done on pypi.org.
#
# On https://pypi.org/manage/project/forward-sdk/settings/publishing/ add a
# GitHub publisher with exactly these values, which are the claims this workflow
# presents:
#
#   Owner:              forwardnetworks
#   Repository:         forward-python-sdk
#   Workflow name:      release.yml
#   Environment name:   pypi
#
# Then, in this repository, create an environment named "pypi" under
# Settings -> Environments, optionally with required reviewers so a publish
# needs a human approval.
#
# Until that exists, this workflow fails at the publish step with
# `invalid-publisher`. The build job still runs, so a tag is still verified.

"on":
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Check the tag matches the package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(uv run python -c 'import forward_sdk; print(forward_sdk.__version__)')"
          if [ "$tag" != "$version" ]; then
            echo "tag $tag does not match __version__ $version" >&2
            exit 1
          fi

      - name: Run the test suite
        run: |
          uv sync --all-groups
          uv run pytest -q

      - run: uv build
      - run: uvx twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/forward-sdk/
    permissions:
      id-token: write  # OIDC token for Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          attestations: true
