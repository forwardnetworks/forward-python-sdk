    DataConnector:
      allOf:
        - type: object
          required:
            - name
            - baseUrl
            - endpoints
          properties:
            name:
              type: string
              description: >-
                A name that’s unique (ignoring case) among all of the network’s
                collection source names. It identifies

                this connector in the NQE data model. May consist of letters,
                digits, dots, hyphens, and underscores.
              examples:
                - ipam
            baseUrl:
              type: string
              description: >-
                The scheme, host, and optional port of the service to fetch
                from, with no trailing slash. Each endpoint’s

                `path` is appended to it.
              examples:
                - https://ipam.example.com
            disableSslValidation:
              type: boolean
              description: >-
                Whether to skip TLS validation. Absent unless `baseUrl` uses the
                https scheme and validation is

                disabled.
              examples:
                - false
            credentialId:
              type: string
              description: >-
                The `id` of an HttpCredential to authenticate with. Absent if
                the service accepts unauthenticated

                requests.
              examples:
                - H-5
            proxyServerId:
              type: string
              description: >-
                The `id` of a proxy server to route requests through. Absent if
                the Collector reaches the service

                directly.
              examples:
                - P-1
            extraHeaders:
              type: object
              additionalProperties:
                type: string
              description: >-
                HTTP headers sent with every request to this service. Absent if
                no extra headers are

                configured.
              examples:
                - accept: application/json
            endpoints:
              type: array
              items:
                $ref: '#/components/schemas/HttpEndpoint'
              description: >-
                The HTTP GET requests issued on every collection, each one
                relative to `baseUrl`. Never empty. Each

                endpoint’s response is stored under its own name in the
                Snapshot. An endpoint whose dataset arrives in pages

                has a `paginationModel`.
              examples:
                - - name: subnets
                    path: /api/v2/subnets
                  - name: addresses
                    path: /api/v2/addresses
            collect:
              type: boolean
              description: >-
                Whether to collect from this data connector. Absent if it has
                never been set, which means true.
              examples:
                - true
              default: 'true'
            collectorId:
              type: string
              description: >-
                The `id` of the Collector that collects from this data
                connector. Absent if Forward picks an online Collector

                that supports it.
              examples:
                - C3
            testResult:
              $ref: '#/components/schemas/DataConnectorTestResult'
              description: >-
                The outcome of the most recent connectivity test of this
                connector. Absent if it has never been tested, or if

                the connector changed in a way that invalidated the result. When
                listing or getting connectors, also absent

                unless `?with=testResult` is used.
            status:
              type: object
              properties:
                error:
                  $ref: '#/components/schemas/DeviceCollectionError'
                  description: >-
                    What went wrong collecting from this connector. Absent if
                    collection succeeded. "NONE" never

                    occurs.
              description: >-
                How the most recent collection from this connector went. Absent
                unless `?with=status` is used, and absent then

                too if the network has no processed Snapshot or that Snapshot
                didn’t collect this connector.
        - $ref: '#/components/schemas/Attribution'
    DataConnectorTestResult:
      type: object
      required:
        - startedAt
        - endedAt
      properties:
        startedAt:
          type: string
          description: When the Collector began the test.
          examples:
            - '2024-10-27T21:44:51.345Z'
        endedAt:
          type: string
          description: When Forward received the test result, or stopped waiting for one.
          examples:
            - '2024-10-27T21:44:53.892Z'
        error:
          $ref: '#/components/schemas/DeviceCollectionError'
          description: >-
            What went wrong during the test. Absent if every endpoint responded
            successfully. "NONE" never

            occurs.
        errorDesc:
          type: string
          description: >-
            A human-readable explanation of `error`. Absent if the test
            succeeded.
          examples:
            - HTTP 401 Unauthorized from /api/v2/subnets
