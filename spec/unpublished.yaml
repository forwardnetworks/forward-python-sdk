# Endpoints the SDK supports that are NOT in Forward's published API description.
#
# These are stable and safe to depend on -- the Forward NetBox and Nautobot
# plugins both use them -- but they are absent from the description Forward
# generates from its server, so their shapes are written out here instead. That
# lets the coverage test hold them to the same standard as published operations,
# and means a change to one is caught by this SDK's tests rather than by a spec
# diff, which would not see it.
#
# Everything here is reached through client.nqe.repo or client.snapshots.unstable.
#
# Each response carries a real schema and an example of what Forward actually
# sends, recorded from live traffic by the integrations that use these
# endpoints. Both earn their place:
#
#   * The schemas are merged into the generated description, so models are
#     generated for these responses exactly as they are for published ones.
#     That replaces hand-written key-reading, which is what produced the bug
#     below, with validation against a declared shape.
#   * The examples are run through the SDK's own parsers by
#     tests/spec/test_unpublished_shapes.py, so a parser and a hand-written
#     fixture cannot quietly agree with each other while both disagree with
#     Forward.
#
# That is how a commit id nested under lastCommit came to be read from a flat
# key Forward never sends, losing the pin on every query resolved by path.
openapi: 3.2.0
info:
  title: "Forward: Unpublished endpoints used by this SDK"
  version: unpublished
servers:
  - url: /api
tags:
  - name: NQE Repository
    description: Reading and writing the NQE query library.
  - name: Snapshot Reachability
    description: Advanced reachability computation as a pollable job.
  - name: Data Files
    description: Files collected alongside a snapshot.
  - name: Forward AI
    description: >-
      A snapshot-grounded assistant that answers questions about a network by
      calling Forward's own tools. Requires the AI_ALLOWED organization
      property, so an organization without it answers 403 to every operation
      here.
paths:
  /nqe/repos/{repository}/commits/{commitId}/queries:
    get:
      operationId: getRepositoryQueries
      summary: List queries in a repository at a commit
      x-forward-stability: unpublished
      tags: [NQE Repository]
      parameters:
        - name: repository
          in: path
          required: true
          schema: { type: string, enum: [org, fwd] }
        - name: commitId
          in: path
          required: true
          description: A full commit hash, or "head" for the latest.
          schema: { type: string }
        - name: path
          in: query
          description: Restrict to one query path.
          schema: { type: string }
        - name: with
          in: query
          description: Set to "sourceCode" to include each query's source.
          schema: { type: string }
      responses:
        "200":
          description: The queries.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RepositoryQueryPage" }
              example:
                queries:
                  - queryId: FQ_ac651cb2901b067fe7dbfb511613ab44776d8029
                    path: /NetBox/Devices
                    intent: List devices
                    # Forward nests the commit. There is no flat lastCommitId.
                    lastCommit:
                      id: 84f84b0c0a0a1805ddff0ca5451c2c55c58605e5

  /nqe/repos/org/commits/head:
    get:
      operationId: getOrgHeadCommit
      summary: Get the organization repository's current commit
      x-forward-stability: unpublished
      tags: [NQE Repository]
      responses:
        "200":
          description: The head commit.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RepositoryCommit" }
              example:
                id: 84f84b0c0a0a1805ddff0ca5451c2c55c58605e5

  /nqe/queries/{queryId}/history:
    get:
      operationId: getQueryHistory
      summary: List the commits that touched a query
      x-forward-stability: unpublished
      tags: [NQE Repository]
      parameters:
        - name: queryId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The commit history.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RepositoryCommitHistory" }
              example:
                commits:
                  - id: 84f84b0c0a0a1805ddff0ca5451c2c55c58605e5
                    message: Update device query

  /users/current/nqe/changes:
    get:
      operationId: getDraftChanges
      summary: List the current user's uncommitted query changes
      x-forward-stability: unpublished
      tags: [NQE Repository]
      responses:
        "200":
          description: The pending changes.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DraftChangePage" }
              example:
                changes:
                  - path: /NetBox/Devices
                    action: editQuery
    post:
      operationId: addDraftChange
      summary: Stage a query addition, edit, or new directory
      x-forward-stability: unpublished
      tags: [NQE Repository]
      parameters:
        - name: action
          in: query
          required: true
          schema: { type: string, enum: [addQuery, editQuery, addDir] }
        - name: path
          in: query
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                sourceCode: { type: string }
                basis:
                  type: object
                  description: The query and commit an edit is based on.
                  properties:
                    queryId: { type: string }
                    commitId: { type: string }
      responses:
        "200": { description: The change was staged. }
    delete:
      operationId: discardDraftChange
      summary: Discard one staged change
      x-forward-stability: unpublished
      tags: [NQE Repository]
      parameters:
        - name: path
          in: query
          required: true
          schema: { type: string }
      responses:
        "200": { description: The change was discarded. }

  /nqe/repos/org/commits:
    post:
      operationId: commitDraftChanges
      summary: Commit staged query changes
      x-forward-stability: unpublished
      tags: [NQE Repository]
      parameters:
        - name: dryRun
          in: query
          description: Validate without committing.
          schema: { type: boolean }
        - name: snapshotId
          in: query
          description: Snapshot to validate the queries against during a dry run.
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                paths:
                  type: array
                  items: { type: string }
                accessSettings:
                  type: array
                  items: { type: object }
                message:
                  type: object
                  properties:
                    title: { type: string }
                    body: { type: string }
      responses:
        "200":
          description: The commit result, or the dry-run report.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommitResult" }
              example:
                newErrors: []
                uses: []
                unauthorizedQueryChanges: []
                unauthorizedAccessSettingChanges: []

  /users/current:
    get:
      operationId: getCurrentUser
      summary: Get the authenticated user
      description: >-
        Returns the calling user, including the roles it holds. `roles.org`
        applies across the organization; `roles.network` maps a network id to
        the role held on that network. Integrations use these to decide whether
        a login may write to the shared NQE query library before attempting it.
      x-forward-stability: unpublished
      tags: [User Accounts]
      responses:
        "200":
          description: The authenticated user.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CurrentUser" }
              example:
                user:
                  id: "1234"
                  username: mary
                  email: mary@example.com
                  authSource: LOCAL
                  enabled: true
                  lastActive: "2026-09-07T09:00:00.000Z"
                roles:
                  # Applies across the organization.
                  org: [ADMIN]
                  # Keyed by network id, for roles held on one network.
                  network:
                    "101": OPERATOR
                passwordSetAt: "2026-01-01T00:00:00.000Z"

  /networks/{networkId}/data-files:
    get:
      operationId: getDataFiles
      summary: List the data files collected for a network
      x-forward-stability: unpublished
      tags: [Data Files]
      parameters:
        - name: networkId
          in: path
          required: true
          schema: { type: string }
        - name: view
          in: query
          description: Set to "snapshot" to list the files of one snapshot.
          schema: { type: string }
        - name: snapshotId
          in: query
          schema: { type: string }
      responses:
        "200":
          description: >-
            The data files. Observed both as a bare list and wrapped under
            dataFiles, items or results, with names and hashes under several
            key spellings, so consumers normalize this themselves.
          content:
            application/json:
              example:
                # Observed as a bare list on 26.8; also reported wrapped under
                # dataFiles, items or results. Consumers normalize this.
                - dataFileName: netbox_device_type_aliases.json
                  contentMd5Hex: 9f86d081884c7d659a2feaa0c55ad015

  /ai-chats:
    get:
      operationId: getAiChats
      summary: List the calling user's chats
      x-forward-stability: unpublished
      tags: [Forward AI]
      responses:
        "200":
          description: The chats.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AiChatPage" }
              example:
                chats:
                  - id: "42"
                    networkId: "101"
                    snapshotId: "12345"
                    name: Why can nyc-fw01 not reach the database subnet?
                    status: DONE
                    createdAt: "2026-09-07T09:00:00.000Z"
                    updatedAt: "2026-09-07T09:00:31.000Z"
    post:
      operationId: startAiChat
      summary: Start a chat
      description: >-
        Creates a chat and asks its first question. The answer is produced
        asynchronously: the chat comes back with status PROCESSING and the
        message appears once it is DONE.
      x-forward-stability: unpublished
      tags: [Forward AI]
      parameters:
        - name: networkId
          in: query
          required: true
          schema: { type: string }
        - name: snapshotId
          in: query
          description: Defaults to the network's latest processed snapshot.
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NewAiMessage" }
      responses:
        "201":
          description: The new chat. The Location header names it too.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AiChat" }
              example:
                id: "42"
                networkId: "101"
                snapshotId: "12345"
                status: PROCESSING
                createdAt: "2026-09-07T09:00:00.000Z"
                updatedAt: "2026-09-07T09:00:00.000Z"

  /ai-chats/{chatId}:
    get:
      operationId: getAiChat
      summary: Get one chat
      x-forward-stability: unpublished
      tags: [Forward AI]
      parameters:
        - name: chatId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The chat.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AiChat" }
              example:
                id: "42"
                networkId: "101"
                snapshotId: "12345"
                name: Why can nyc-fw01 not reach the database subnet?
                status: DONE
                createdAt: "2026-09-07T09:00:00.000Z"
                updatedAt: "2026-09-07T09:00:31.000Z"
    patch:
      operationId: updateAiChat
      summary: Rename a chat
      x-forward-stability: unpublished
      tags: [Forward AI]
      parameters:
        - name: chatId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
      responses:
        "200":
          description: The updated chat.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AiChat" }
              example:
                id: "42"
                networkId: "101"
                snapshotId: "12345"
                name: Renamed
                status: DONE
                createdAt: "2026-09-07T09:00:00.000Z"
                updatedAt: "2026-09-07T09:05:00.000Z"
    delete:
      operationId: deleteAiChat
      summary: Delete a chat
      x-forward-stability: unpublished
      tags: [Forward AI]
      parameters:
        - name: chatId
          in: path
          required: true
          schema: { type: string }
      responses:
        "204": { description: Deleted. }

  /ai-chats/{chatId}/messages:
    get:
      operationId: getAiChatMessages
      summary: List a chat's messages
      x-forward-stability: unpublished
      tags: [Forward AI]
      parameters:
        - name: chatId
          in: path
          required: true
          schema: { type: string }
        - name: since
          in: query
          description: Only messages updated after this instant.
          schema: { type: string }
      responses:
        "200":
          description: The messages.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AiMessagePage" }
              example:
                messages:
                  - id: "7"
                    prompt: Why can nyc-fw01 not reach the database subnet?
                    toolCalls:
                      - type: GET_PATHS
                    answer:
                      summary: >-
                        Traffic is dropped by ACL inbound-filter on nyc-fw01.
                      keyInsights:
                        - The ACL denies 10.2.0.0/16 on ingress.
                    createdAt: "2026-09-07T09:00:00.000Z"
                    updatedAt: "2026-09-07T09:00:31.000Z"
    post:
      operationId: addAiChatMessage
      summary: Ask a follow-up question in an existing chat
      description: >-
        Accepted immediately and answered asynchronously; poll the chat's status
        or its messages for the answer.
      x-forward-stability: unpublished
      tags: [Forward AI]
      parameters:
        - name: chatId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NewAiMessage" }
      responses:
        "202": { description: The question was accepted. }

  /ai-chats/{chatId}/transcript:
    get:
      operationId: getAiChatTranscript
      summary: Export a chat as a transcript
      x-forward-stability: unpublished
      tags: [Forward AI]
      parameters:
        - name: chatId
          in: path
          required: true
          schema: { type: string }
        - name: format
          in: query
          schema:
            type: string
            enum: [MARKDOWN, HTML, JSON]
            default: MARKDOWN
      responses:
        "200":
          description: The rendered transcript.
          content:
            text/markdown:
              schema: { type: string }

  /networks/{networkId}/snapshots/{snapshotId}/reachability:
    post:
      operationId: startReachabilityJob
      summary: Start computing advanced reachability
      x-forward-stability: unpublished
      tags: [Snapshot Reachability]
      parameters:
        - name: networkId
          in: path
          required: true
          schema: { type: string }
        - name: snapshotId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The job identifier and its initial status.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReachabilityJob" }
              example:
                jobKey: job-8f2c
                status: RUNNING

  /networks/{networkId}/snapshots/{snapshotId}/reachability/{jobKey}:
    get:
      operationId: getReachabilityJob
      summary: Poll a reachability computation
      x-forward-stability: unpublished
      tags: [Snapshot Reachability]
      parameters:
        - name: networkId
          in: path
          required: true
          schema: { type: string }
        - name: snapshotId
          in: path
          required: true
          schema: { type: string }
        - name: jobKey
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The job's status.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReachabilityJob" }
              example:
                status: COMPLETED

  # ---------------------------------------------------------------- diffs ---
  # Comparisons between two snapshots. These state blast radius without being
  # asked a question, which is what makes them worth having for a change
  # rehearsal: the caller does not have to know which question to ask.
  /diffs/{beforeSnapshotId}/{afterSnapshotId}/subnet-connectivity:
    get:
      operationId: getSubnetConnectivityDiff
      summary: How site-to-site connectivity changed between two snapshots
      x-forward-stability: unpublished
      tags: [Snapshot Diffs]
      parameters:
        - { name: beforeSnapshotId, in: path, required: true, schema: { type: string } }
        - { name: afterSnapshotId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The connectivity comparison.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SubnetConnectivityDiff" }
              example:
                newlyConnectedSubnetPairs: 0
                newlyConnectedImpactedLocations: 0
                newlyConnectedDestinationSubnets: 0
                newlyIsolatedSubnetPairs: 14
                newlyIsolatedImpactedLocations: 7
                newlyIsolatedDestinationSubnets: 1
                modifiedSubnetPairs: 0
                modifiedImpactedLocations: 0
                evaluatedSubnetPairs: 39
                totalSubnetPairs: 39
                totalImpactedLocations: 7
                isPartialResult: false

  /diffs/{beforeSnapshotId}/{afterSnapshotId}/vulnerabilities/counts:
    get:
      operationId: getVulnerabilityDiffCounts
      summary: How vulnerability exposure changed between two snapshots
      x-forward-stability: unpublished
      tags: [Snapshot Diffs]
      parameters:
        - { name: beforeSnapshotId, in: path, required: true, schema: { type: string } }
        - { name: afterSnapshotId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The vulnerability comparison.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VulnerabilityDiffCounts" }
              example:
                newCveCount: 0

  /diffs/{beforeSnapshotId}/{afterSnapshotId}/routing-loop/count:
    get:
      operationId: getRoutingLoopDiffCount
      summary: How many routing loops the change introduces
      x-forward-stability: unpublished
      tags: [Snapshot Diffs]
      parameters:
        - { name: beforeSnapshotId, in: path, required: true, schema: { type: string } }
        - { name: afterSnapshotId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The routing-loop comparison.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RoutingLoopDiffCount" }
              example: { count: 0, complete: true }

  # --------------------------------------------------------- configuration ---
  # Org and global property settings. Three scopes exist, and the routes are not
  # interchangeable: the global route reads and writes the fixed default only,
  # never an org's override, so after setting a value for an org the global
  # route still reports the default. Read from the scope you wrote to.
  #
  # The response is {property: value} with the property name as the key. Forward
  # lower-cases it on the wire, so the key for FIREWALL_PREDICT is
  # firewall_predict. Values are typed per property: boolean, integer, string
  # or an enum name.
  /config/{property}:
    get:
      operationId: getOrgConfigValue
      summary: An org property's effective value for the calling user's org
      description: >-
        The org's override if one is set, otherwise the global default. This is
        the value that governs behaviour, so it is the route to read when the
        question is "is this on for me".
      x-forward-stability: unpublished
      tags: [Configuration]
      parameters:
        - { name: property, in: path, required: true, schema: { type: string }, description: "An OrgProperty name, upper snake case." }
      responses:
        "200":
          description: The property and its effective value.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConfigValue" }
              example: { firewall_predict: true }
    put:
      operationId: setOrgConfigValue
      summary: Set an org property for the calling user's org
      description: >-
        Needs the MANAGE_ORG_SETTINGS permission, and only works for properties
        an org administrator may configure. Others refuse with "Permission
        denied for PROPERTY"; a Forward support account can set those through
        the org-scoped route instead.
      x-forward-stability: unpublished
      tags: [Configuration]
      parameters:
        - { name: property, in: path, required: true, schema: { type: string } }
        - { name: value, in: query, required: true, schema: { type: string }, description: "The new value, as a string; Forward parses it per property." }
      responses:
        "200":
          description: The property and its new value.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConfigValue" }
              example: { session_timeout: 30 }
    delete:
      operationId: clearOrgConfigValue
      summary: Remove the calling user's org override, reverting to the default
      x-forward-stability: unpublished
      tags: [Configuration]
      parameters:
        - { name: property, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Cleared. }

  /global-config/{property}:
    get:
      operationId: getGlobalConfigValue
      summary: An org property's global default
      description: >-
        The fixed default only. This never reflects an org's override, so it
        keeps reporting the default after an org value has been set. That is
        correct behaviour and easily mistaken for a failed write.
      x-forward-stability: unpublished
      tags: [Configuration]
      parameters:
        - { name: property, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The property and its global default.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConfigValue" }
              example: { firewall_predict: false }
    put:
      operationId: setGlobalConfigValue
      summary: Change an org property's global default
      description: >-
        Forward administrators only. Properties declared org-scoped have an
        immutable default and refuse with "Permission denied. Global default
        value cannot be changed for PROPERTY"; set those per org instead.
      x-forward-stability: unpublished
      tags: [Configuration]
      parameters:
        - { name: property, in: path, required: true, schema: { type: string } }
        - { name: value, in: query, required: true, schema: { type: string } }
      responses:
        "200":
          description: The property and its new default.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConfigValue" }
              example: { session_timeout: 60 }

  /orgs/{orgId}/config/{property}:
    get:
      operationId: getOrgScopedConfigValue
      summary: An org property's effective value for a named org
      description: The org's override if set, otherwise the global default. Forward support accounts.
      x-forward-stability: unpublished
      tags: [Configuration]
      parameters:
        - { name: orgId, in: path, required: true, schema: { type: string } }
        - { name: property, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The property and its effective value for that org.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConfigValue" }
              example: { firewall_predict: true }
    put:
      operationId: setOrgScopedConfigValue
      summary: Set an org property for a named org
      description: >-
        Forward support accounts. The route to use for properties whose global
        default cannot be changed and which an org administrator may not set,
        such as FIREWALL_PREDICT. Read the value back from this route, not the
        global one.
      x-forward-stability: unpublished
      tags: [Configuration]
      parameters:
        - { name: orgId, in: path, required: true, schema: { type: string } }
        - { name: property, in: path, required: true, schema: { type: string } }
        - { name: value, in: query, required: true, schema: { type: string } }
      responses:
        "200":
          description: The property and its new value.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConfigValue" }
              example: { firewall_predict: true }
    delete:
      operationId: clearOrgScopedConfigValue
      summary: Remove a named org's override, reverting to the default
      x-forward-stability: unpublished
      tags: [Configuration]
      parameters:
        - { name: orgId, in: path, required: true, schema: { type: string } }
        - { name: property, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Cleared. }

  # ------------------------------------------------------------ change sets ---
  # Forward Predict. A change set holds proposed device changes against a base
  # snapshot; predicting it produces a new snapshot that shows the network as
  # it would be, which the diff endpoints then compare against the base.
  #
  # Two conventions differ from the published API. Query-string actions select
  # the operation, so ?action=predict and ?action=delete are distinct
  # operations on one path. And Forward rejects unknown body properties with
  # 400, so a body must carry exactly the documented keys: in particular the
  # create body takes no networkId, which comes from the path.
  /networks/{networkId}/change-sets:
    post:
      operationId: createChangeSet
      summary: Create a change set against a base snapshot
      x-forward-stability: unpublished
      tags: [Change Sets]
      parameters:
        - { name: networkId, in: path, required: true, schema: { type: string } }
        - { name: dirPath, in: query, required: false, schema: { type: string }, description: Directory in the change-set tree to create it in. }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NewChangeSet" }
            example: { name: "Core uplink change", description: "Rehearsal", snapshotId: "656", tags: [rehearsal] }
      responses:
        "200":
          description: The new change set.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChangeSet" }
              example: { id: CHG-101, name: "Core uplink change", networkId: "115", snapshotId: "656", tags: [rehearsal], createdAt: "2026-09-11T10:00:00Z" }
    get:
      operationId: listChangeSets
      summary: List a network's change sets
      x-forward-stability: unpublished
      tags: [Change Sets]
      parameters:
        - { name: networkId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The change sets, with predicted snapshots newest first.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ChangeSetInfo" }
              example:
                - id: CHG-101
                  name: "Core uplink change"
                  networkId: "115"
                  snapshotId: "656"
                  tags: []
                  modifiedDeviceCount: 2
                  predictedSnapshots:
                    - { id: "702", creationInstant: "2026-09-11T10:05:00Z", networkId: "115" }
                  createdAt: "2026-09-11T10:00:00Z"
    patch:
      operationId: updateChangeSetTags
      summary: Add or remove tags on several change sets at once
      x-forward-stability: unpublished
      tags: [Change Sets]
      parameters:
        - { name: networkId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChangeSetsTagUpdate" }
            example: { changeSetIds: [CHG-101], update: { tags: { action: ADD, names: [approved] } } }
      responses:
        "204": { description: Updated. }

  /networks/{networkId}/change-sets?action=delete:
    post:
      operationId: deleteChangeSets
      summary: Delete several change sets
      description: >-
        The body key is changeSetIds. Forward rejects any other key, including
        ids, with "Non-empty 'changeSetIds' is required".
      x-forward-stability: unpublished
      tags: [Change Sets]
      parameters:
        - { name: networkId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChangeSetIds" }
            example: { changeSetIds: [CHG-101, CHG-102] }
      responses:
        "204": { description: Deleted. }

  /networks/{networkId}/change-sets/{changeSetId}:
    delete:
      operationId: deleteChangeSet
      summary: Delete one change set
      x-forward-stability: unpublished
      tags: [Change Sets]
      parameters:
        - { name: networkId, in: path, required: true, schema: { type: string } }
        - { name: changeSetId, in: path, required: true, schema: { type: string }, description: 'CHG-<n>, or the bare number.' }
      responses:
        "204": { description: Deleted. }
    patch:
      operationId: updateChangeSet
      summary: Change a change set's name, description, base snapshot or tags
      x-forward-stability: unpublished
      tags: [Change Sets]
      parameters:
        - { name: networkId, in: path, required: true, schema: { type: string } }
        - { name: changeSetId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChangeSetPatch" }
            example: { description: "Approved by NOC" }
      responses:
        "200":
          description: The updated change set.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChangeSet" }
              example: { id: CHG-101, name: "Core uplink change", description: "Approved by NOC", networkId: "115", snapshotId: "656" }

  /networks/{networkId}/change-sets/{changeSetId}?view=summary:
    get:
      operationId: getChangeSetSummary
      summary: A change set's name, base snapshot and tags
      description: There is no plain GET on a change set; this view is the only read of one by id.
      x-forward-stability: unpublished
      tags: [Change Sets]
      parameters:
        - { name: networkId, in: path, required: true, schema: { type: string } }
        - { name: changeSetId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The summary.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChangeSetSummary" }
              example: { name: "Core uplink change", networkId: "115", snapshotId: "656", tags: [] }

  /networks/{networkId}/change-sets/{changeSetId}?action=predict:
    post:
      operationId: predictChangeSet
      summary: Run Predict, producing a snapshot of the network with the change applied
      description: >-
        note is a required query parameter. Omitting it returns 400 "Required
        request parameter 'note' ... is not present". The returned snapshot is
        created, not yet processed; wait for it with the snapshots service.
      x-forward-stability: unpublished
      tags: [Change Sets]
      parameters:
        - { name: networkId, in: path, required: true, schema: { type: string } }
        - { name: changeSetId, in: path, required: true, schema: { type: string } }
        - { name: note, in: query, required: true, schema: { type: string }, description: A note recorded on the predicted snapshot. Required. }
      responses:
        "200":
          description: The predicted snapshot, newly created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PredictedSnapshotMeta" }
              example: { id: "702", note: "rehearsal 1", createdAt: "2026-09-11T10:05:00Z", processingTrigger: PREDICT }

  /networks/{networkId}/change-sets/{changeSetId}/predicted-snapshots:
    get:
      operationId: listPredictedSnapshots
      summary: The snapshots Predict has produced for a change set
      x-forward-stability: unpublished
      tags: [Change Sets]
      parameters:
        - { name: networkId, in: path, required: true, schema: { type: string } }
        - { name: changeSetId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The predicted snapshots, with processing state.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SnapshotInfo" }
              example:
                - { id: "702", state: PROCESSED, processingTrigger: PREDICT, createdAt: "2026-09-11T10:05:00Z" }

  /networks/{networkId}/change-sets/{changeSetId}/draft:
    get:
      operationId: getChangeSetDraft
      summary: The uncommitted changes on a change set
      x-forward-stability: unpublished
      tags: [Change Sets]
      parameters:
        - { name: networkId, in: path, required: true, schema: { type: string } }
        - { name: changeSetId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The draft, or a null draft when nothing is staged.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChangeSetDraftResponse" }
              example:
                draft:
                  id: CHG-101
                  name: "Core uplink change"
                  networkId: "115"
                  snapshotId: "656"
                  deviceToChanges:
                    dc-core: { commands: "interface Ethernet1\n shutdown", hasConfig: false, hasSecurityRuleChanges: false }
                  savedAt: 1757584800000

  /networks/{networkId}/change-sets/{changeSetId}/draft/devices/{deviceName}/commands:
    put:
      operationId: setChangeSetDeviceCommands
      summary: Stage CLI commands for one device
      description: >-
        The body is the command text itself, sent as text/plain, not JSON. For
        PAN-OS devices this route does not work: predicting it fails with
        "Device <name> OS pan_os not supported". Firewall changes go through the
        security-rule operations instead.
      x-forward-stability: unpublished
      tags: [Change Sets]
      parameters:
        - { name: networkId, in: path, required: true, schema: { type: string } }
        - { name: changeSetId, in: path, required: true, schema: { type: string } }
        - { name: deviceName, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          text/plain:
            schema: { type: string }
            example: "interface Ethernet1\n shutdown"
      responses:
        "204": { description: Staged. }

  /networks/{networkId}/change-sets/{changeSetId}/draft/devices/{deviceName}:
    delete:
      operationId: discardChangeSetDeviceDraft
      summary: Discard one device's uncommitted changes
      x-forward-stability: unpublished
      tags: [Change Sets]
      parameters:
        - { name: networkId, in: path, required: true, schema: { type: string } }
        - { name: changeSetId, in: path, required: true, schema: { type: string } }
        - { name: deviceName, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Discarded. }

  /networks/{networkId}/change-sets/{changeSetId}/devices/{deviceName}/commands?action=validate:
    post:
      operationId: validateChangeSetDeviceCommands
      summary: Check CLI commands for a device without staging them
      x-forward-stability: unpublished
      tags: [Change Sets]
      parameters:
        - { name: networkId, in: path, required: true, schema: { type: string } }
        - { name: changeSetId, in: path, required: true, schema: { type: string } }
        - { name: deviceName, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CommandValidationRequest" }
            example: { commands: "interface Ethernet1\n shutdown", cursorLineNum: 1, cursorColumnNum: 1 }
      responses:
        "200":
          description: Errors, suggestions and marks for the text.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommandValidationResponse" }
              example: { commandErrors: [], suggestions: [], textMarks: [] }

  /networks/{networkId}/change-sets/{changeSetId}/commits:
    post:
      operationId: commitChangeSet
      summary: Commit the staged changes
      description: note is a required query parameter and must not be blank.
      x-forward-stability: unpublished
      tags: [Change Sets]
      parameters:
        - { name: networkId, in: path, required: true, schema: { type: string } }
        - { name: changeSetId, in: path, required: true, schema: { type: string } }
        - { name: note, in: query, required: true, schema: { type: string } }
      responses:
        "200":
          description: The commit.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChangeSetCommit" }
              example: { commitId: 9d2e1c0c8b3a4f5e6d7c8b9a0f1e2d3c4b5a6978, note: "staged for review", committedAt: "2026-09-11T10:02:00Z" }
    get:
      operationId: listChangeSetCommits
      summary: The commit history, each with its device changes
      x-forward-stability: unpublished
      tags: [Change Sets]
      parameters:
        - { name: networkId, in: path, required: true, schema: { type: string } }
        - { name: changeSetId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The commits, newest first.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CommittedChangeSet" }
              example:
                - id: CHG-101
                  name: "Core uplink change"
                  networkId: "115"
                  snapshotId: "656"
                  commitId: 9d2e1c0c8b3a4f5e6d7c8b9a0f1e2d3c4b5a6978
                  note: "staged for review"
                  committedAt: "2026-09-11T10:02:00Z"
                  deviceToChanges:
                    dc-core: { commands: "interface Ethernet1\n shutdown", hasConfig: false, hasSecurityRuleChanges: false }

  /networks/{networkId}/change-sets/{changeSetId}/commits/head:
    get:
      operationId: getChangeSetHeadCommit
      summary: The most recent commit, with its device changes
      x-forward-stability: unpublished
      tags: [Change Sets]
      parameters:
        - { name: networkId, in: path, required: true, schema: { type: string } }
        - { name: changeSetId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The head commit.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommittedChangeSet" }
              example: { id: CHG-101, name: "Core uplink change", networkId: "115", snapshotId: "656", commitId: 9d2e1c0c8b3a4f5e6d7c8b9a0f1e2d3c4b5a6978, note: "staged for review" }
        "404":
          description: No commit yet.

  /networks/{networkId}/change-sets/{changeSetId}/checks:
    post:
      operationId: addChangeSetCheck
      summary: Attach an intent check to a change set
      description: >-
        Supported check types are ISOLATION, REACHABILITY, EXISTS and NQE.
        A name may be given for the first three and must be omitted for NQE.
      x-forward-stability: unpublished
      tags: [Change Sets]
      parameters:
        - { name: networkId, in: path, required: true, schema: { type: string } }
        - { name: changeSetId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NewChangeSetCheck" }
            example: { name: "DC to branch", definition: { checkType: REACHABILITY } }
      responses:
        "200":
          description: The check, with its result against the base snapshot.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChangeSetCheckResult" }
              example: { id: CSC-7, name: "DC to branch", definition: { checkType: REACHABILITY }, status: PASS }
    get:
      operationId: listChangeSetChecks
      summary: The change set's checks and their results against a snapshot
      description: >-
        snapshotId defaults to the base snapshot. It must be the base or one of
        the change set's predicted snapshots; anything else is refused.
      x-forward-stability: unpublished
      tags: [Change Sets]
      parameters:
        - { name: networkId, in: path, required: true, schema: { type: string } }
        - { name: changeSetId, in: path, required: true, schema: { type: string } }
        - { name: snapshotId, in: query, required: false, schema: { type: string } }
      responses:
        "200":
          description: The checks.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChangeSetCheckResults" }
              example: { checks: [ { id: CSC-7, name: "DC to branch", definition: { checkType: REACHABILITY }, status: PASS } ] }

  /networks/{networkId}/change-sets/{changeSetId}/checks/{checkId}:
    delete:
      operationId: deleteChangeSetCheck
      summary: Remove a check from a change set
      x-forward-stability: unpublished
      tags: [Change Sets]
      parameters:
        - { name: networkId, in: path, required: true, schema: { type: string } }
        - { name: changeSetId, in: path, required: true, schema: { type: string } }
        - { name: checkId, in: path, required: true, schema: { type: string }, description: 'CSC-<n>, or the bare number.' }
      responses:
        "204": { description: Removed. }

  # ------------------------------------------------------- firewall predict ---
  # Structured rule edits for PAN-OS devices, which CLI-driven Predict cannot
  # model. Gated on the FIREWALL_PREDICT org property. Only scope LOCAL with
  # rulebase PRIMARY is editable; everything else Forward returns is read-only.
  /networks/{networkId}/change-sets/{changeSetId}/devices/{deviceName}/security-rules-diff:
    get:
      operationId: getSecurityRulesDiff
      summary: A firewall's rulebases and how the change set alters its rules
      description: >-
        The definition objects under entries[].a and entries[].b are the shape
        the write operations take, so a rule can be read here and posted back.
      x-forward-stability: unpublished
      tags: [Firewall Predict]
      parameters:
        - { name: networkId, in: path, required: true, schema: { type: string } }
        - { name: changeSetId, in: path, required: true, schema: { type: string } }
        - { name: deviceName, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The rulebases and rule differences. Empty lists are omitted.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SecurityRulesDiff" }
              example:
                rulebases:
                  - { scopeId: LOCAL, rulebaseId: PRIMARY, editable: true, displayName: Local }
                entries:
                  - diffType: ADDED
                    b:
                      scopeId: LOCAL
                      rulebaseId: PRIMARY
                      rank: 1
                      definition: { name: allow-dns, id: "", description: "", enabled: true, action: PERMIT }

  /networks/{networkId}/change-sets/{changeSetId}/devices/{deviceName}/scopes/{scopeId}/rulebases/{rulebaseId}/security-rules:
    post:
      operationId: addSecurityRule
      summary: Add a security rule to a firewall's rulebase
      description: >-
        predecessor is the id of the rule to insert after; omit it to insert at
        the top. Only scope LOCAL and rulebase PRIMARY accept writes; others
        refuse with "Rulebase 'X' in scope 'Y' is not editable".
      x-forward-stability: unpublished
      tags: [Firewall Predict]
      parameters:
        - { name: networkId, in: path, required: true, schema: { type: string } }
        - { name: changeSetId, in: path, required: true, schema: { type: string } }
        - { name: deviceName, in: path, required: true, schema: { type: string } }
        - { name: scopeId, in: path, required: true, schema: { type: string }, description: 'LOCAL is the only editable scope.' }
        - { name: rulebaseId, in: path, required: true, schema: { type: string }, description: 'PRIMARY is the only editable rulebase.' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NewSecurityRule" }
            example: { definition: { name: allow-dns, enabled: true, action: PERMIT, sourceZones: [trust], destinationZones: [untrust] } }
      responses:
        "204": { description: Added. }

  /networks/{networkId}/change-sets/{changeSetId}/devices/{deviceName}/scopes/{scopeId}/rulebases/{rulebaseId}/security-rules/{ruleId}:
    patch:
      operationId: updateSecurityRule
      summary: Replace a rule's definition, or move it
      description: >-
        Exactly one of definition or predecessor. A predecessor of null moves
        the rule to the top. Both or neither is refused.
      x-forward-stability: unpublished
      tags: [Firewall Predict]
      parameters:
        - { name: networkId, in: path, required: true, schema: { type: string } }
        - { name: changeSetId, in: path, required: true, schema: { type: string } }
        - { name: deviceName, in: path, required: true, schema: { type: string } }
        - { name: scopeId, in: path, required: true, schema: { type: string } }
        - { name: rulebaseId, in: path, required: true, schema: { type: string } }
        - { name: ruleId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SecurityRulePatch" }
            example: { definition: { name: allow-dns, enabled: false, action: PERMIT } }
      responses:
        "204": { description: Updated. }
    delete:
      operationId: deleteSecurityRule
      summary: Delete a security rule
      x-forward-stability: unpublished
      tags: [Firewall Predict]
      parameters:
        - { name: networkId, in: path, required: true, schema: { type: string } }
        - { name: changeSetId, in: path, required: true, schema: { type: string } }
        - { name: deviceName, in: path, required: true, schema: { type: string } }
        - { name: scopeId, in: path, required: true, schema: { type: string } }
        - { name: rulebaseId, in: path, required: true, schema: { type: string } }
        - { name: ruleId, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Deleted. }

  /networks/{networkId}/change-sets/{changeSetId}/devices/{deviceName}/scopes/{scopeId}/rulebases/{rulebaseId}/security-rules/{ruleId}?action=discardChanges:
    post:
      operationId: discardSecurityRuleChanges
      summary: Discard the change set's pending change to one rule
      x-forward-stability: unpublished
      tags: [Firewall Predict]
      parameters:
        - { name: networkId, in: path, required: true, schema: { type: string } }
        - { name: changeSetId, in: path, required: true, schema: { type: string } }
        - { name: deviceName, in: path, required: true, schema: { type: string } }
        - { name: scopeId, in: path, required: true, schema: { type: string } }
        - { name: rulebaseId, in: path, required: true, schema: { type: string } }
        - { name: ruleId, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Discarded. }

