    ClassicDevices:
      type: object
      properties:
        devices:
          type: array
          items:
            $ref: '#/components/schemas/ClassicDevice'
    ClassicDevicesPatch:
      type: object
      properties:
        names:
          type: array
          items:
            type: string
        update:
          $ref: '#/components/schemas/ClassicDevicePatch'
    DeviceCriteria:
      type: object
      required:
        - names
      properties:
        names:
          type: array
          items:
            type: string
          examples:
            - - router_01
              - router_02
    DeviceNames:
      type: object
      properties:
        names:
          type: array
          items:
            type: string
    NewClassicDevice:
      type: object
      required:
        - name
        - host
      properties:
        name:
          type: string
          description: >-
            A name that’s unique (ignoring case) among all of the network’s
            collection source names. May consist of

            letters, digits, dots, hyphens, and underscores.
          examples:
            - my-router
        type:
          $ref: '#/components/schemas/ClassicDeviceType'
          description: Auto-detected during connectivity testing if unspecified.
          examples:
            - checkpoint_ssh
        host:
          type: string
          description: IP address or hostname used to connect to the device.
          examples:
            - 10.121.7.13
        port:
          type: integer
          format: int32
          minimum: 1
          maximum: 65535
          description: >-
            Port used to connect to the device. The default value depends on the
            collection protocol: 22 for SSH, 443

            for HTTPS, etc.
          examples:
            - 22
        cliCredentialId:
          type: string
          description: >-
            The `id` of a CliCredential of type `LOGIN`. Relevant for devices
            collected via SSH or Telnet. Credential

            auto-association will be attempted using credentials configured to
            allow it if this property is unspecified

            and collecting from this device requires this kind of credential.
          examples:
            - L-3
        cliCredential2Id:
          type: string
          description: >-
            The `id` of a CliCredential of type `PRIVILEGED_MODE` (for
            Cisco-like or Checkpoint devices) or `SHELL` (for

            Avi controllers). On Checkpoint, this credential is used for TACACS
            privilege escalation. Credential

            auto-association will be attempted using credentials configured to
            allow it if this property is unspecified

            and collecting from this device requires this kind of credential.
          examples:
            - PM-2
        cliCredential3Id:
          type: string
          description: >-
            The `id` of a CliCredential of type `EXPERT_MODE` (for Checkpoint
            devices). Can be set with or without a

            `PRIVILEGED_MODE` credential for `cliCredential2Id`. Credential
            auto-association will be attempted using

            credentials configured to allow it if this property is unspecified
            and collecting from this device requires

            this kind of credential.
          examples:
            - EM-6
        httpCredentialId:
          type: string
          description: >-
            The `id` of an HttpCredential of type `LOGIN` or `API_KEY`. Relevant
            for devices collected via HTTPS or

            HTTP. Credential auto-association will be attempted using
            credentials configured to allow it if this

            property is unspecified and collecting from this device requires
            this kind of credential.
          examples:
            - H-5
        snmpCredentialId:
          type: string
          description: >-
            The `id` of an SnmpCredential. Used to collect performance data
            (counters) if `enableSnmpCollection` is

            true. Credential auto-association will be attempted using
            credentials configured to allow it if this

            property is unspecified and collecting from this device requires
            this kind of credential.
          examples:
            - S-4
        jumpServerId:
          type: string
          description: >-
            The `id` of the JumpServer that should be used to collect from this
            device.
          examples:
            - J-0
        disableIpv6Collection:
          type: boolean
          description: >-
            Disables collection of any IPv6 forwarding state on the device.
            Defaults to false.
          examples:
            - false
        fullCollectionLog:
          type: boolean
          description: Enables more detailed logging during collection. Defaults to false.
          examples:
            - false
        paginationMode:
          $ref: '#/components/schemas/PaginationMode'
          description: >-
            The pagination mode to use during collection. Relevant for devices
            collected via SSH or Telnet. Defaults to

            `DISABLE_PAGINATION`. Per-command pagination (such as appending `|
            more`) may be used if set to

            `ENABLE_PAGINATION` for a device that doesn’t have a per-session
            pagination mode setting.
          examples:
            - KEEP_UNCHANGED
        terminalWidth:
          type: integer
          format: int32
          minimum: 80
          maximum: 500
          description: >-
            Width of pseudo-terminal in characters. A high value can prevent
            long lines from wrapping. Defaults to 500.

            Relevant for devices collected via SSH or Telnet.
          examples:
            - 500
        largeRtt:
          type: boolean
          description: >-
            Whether the device has a large round-trip time (requires a longer
            response timeout).
          examples:
            - false
        minBytesReadPerSec:
          type: integer
          format: int64
          description: >-
            The minimum read rate in bytes/sec required to prevent collection
            from failing with a

            `SLOW_READ_RATE_DETECTED` error. Defaults to 500.
          examples:
            - 1000
        maxConnectionsPerMin:
          type: integer
          format: int32
          description: >-
            The maximum number of connections to this device that should be
            attempted per minute. Setting this property

            can prevent spurious connectivity test failures if the device’s SSH
            server is configured with a connection

            rate limit.
          examples:
            - 10
        useFileTransferForLargeOutput:
          type: boolean
          description: >-
            Whether to use file transfer instead of printing large command
            output directly to the shell. This is

            currently only supported for Juniper devices when executing routing
            table commands. The primary purpose is

            to avoid printing large outputs directly to the shell, which on
            Juniper devices can interfere with packet

            forwarding performance. Instead, the command output is written to a
            temporary file on the device and then

            transferred over a separate connection. After the transfer is
            complete, the temporary file is deleted to

            prevent unnecessary disk usage on the device.
          examples:
            - false
        bmpStationHost:
          type: string
          description: >-
            IP address or hostname of the BMP station from which BMP collection
            should be peformed for this device. If

            set, a jump server won’t be used for BMP collection.
          examples:
            - 10.121.7.33
        bgpAndBmpFailureHandling:
          type: string
          description: >-
            How to handle BGP or BMP collection failure. Defaults to
            `FAIL_DEVICE`.
          examples:
            - SWITCH_TO_CLI
          enum:
            - FAIL_DEVICE
            - SWITCH_TO_CLI
            - ALWAYS_USE_CLI
            - ALWAYS_USE_BMP
            - CONTINUE_WITHOUT_BGP_DATA
        collectBgpAdvertisements:
          type: boolean
          description: >-
            Whether BGP advertisements should be collected. Defaults to `false`
            unless advertisement collection is

            required to model a [synthetic
            device](https://docs.fwd.app/latest/api/synthetic-devices/)
            connected to this

            device.
          examples:
            - false
        bgpTableType:
          type: string
          description: >-
            The BGP route types to collect. Honored only if
            `collectedBgpAdvertisements` is true. Defaults

            to `BOTH`.
          examples:
            - BOTH
          enum:
            - BOTH
            - ADJ_RIB_IN
            - ADJ_RIB_OUT
        bgpPeerType:
          type: string
          description: >-
            The BGP peer types from which to collect routes. Honored only if
            `collectedBgpAdvertisements` is true.

            Defaults to `BOTH`.
          examples:
            - BOTH
          enum:
            - BOTH
            - EBGP
            - IBGP
        bgpSubnetsToCollect:
          type: array
          items:
            type: string
          description: >-
            Restricts collection of BGP advertisements to specific subnets if
            the device supports it. Honored only if

            `collectBgpAdvertisements` is `true`.
          examples:
            - - 123.223.47.0/24
        prompt:
          type: string
          description: >-
            A case-insensitive glob pattern used to identify an interactive
            prompt. When this pattern matches the end of

            the prompt, ignoring any trailing whitespace, the Collector will
            enter the configured `promptResponse`.

            Relevant for devices collected via SSH or Telnet.
          examples:
            - y/n
        promptResponse:
          type: string
          description: >-
            What the Collector should enter in response to a device prompt
            matching `prompt` in order to proceed.

            Relevant for devices collected via SSH or Telnet. Required if
            `prompt` is set.
          examples:
            - 'y'
        collect:
          type: boolean
          description: Whether to collect from the device. Defaults to true.
          examples:
            - false
        note:
          type: string
          description: An optional description or note about the device.
        enableSnmpCollection:
          type: boolean
          description: >-
            Whether to collect performance data (counters) via SNMP. Defaults to
            false.
          examples:
            - false
        highCpuUsage:
          type: number
          format: float
          minimum: 0.75
          maximum: 1
          description: >-
            Threshold at or above which CPU usage is considered high. Defaults
            to 0.8 (80.0%).
          examples:
            - 0.85
        highMemoryUsage:
          type: number
          format: float
          minimum: 0.75
          maximum: 1
          description: >-
            Threshold at or above which memory usage is considered high.
            Defaults to 0.9 (90.0%).
          examples:
            - 0.92
        highInputUtilization:
          type: number
          format: float
          minimum: 0.75
          maximum: 1
          description: >-
            Threshold at or above which input interface utilization is
            considered high. Defaults to 0.9

            (90.0%).
          examples:
            - 0.8
        highOutputUtilization:
          type: number
          format: float
          minimum: 0.75
          maximum: 1
          description: >-
            Threshold at or above which output interface utilization is
            considered high. Defaults to 0.9

            (90.0%).
          examples:
            - 0.88
        mediumCpuUsage:
          type: number
          format: float
          minimum: 0.5
          maximum: 1
          description: >-
            Threshold at or above which CPU usage is considered medium high. Has
            no default value.
          examples:
            - 0.7
        mediumMemoryUsage:
          type: number
          format: float
          minimum: 0.5
          maximum: 1
          description: >-
            Threshold at or above which memory usage is considered medium high.
            Has no default value.
          examples:
            - 0.71
        mediumInputUtilization:
          type: number
          format: float
          minimum: 0.5
          maximum: 1
          description: >-
            Threshold at or above which input interface utilization is
            considered medium high. Has no

            default value.
          examples:
            - 0.72
        mediumOutputUtilization:
          type: number
          format: float
          minimum: 0.5
          maximum: 1
          description: >-
            Threshold at or above which output interface utilization is
            considered medium high. Has no

            default value.
          examples:
            - 0.73
        cloudLocationId:
          type: string
          description: >-
            ID of the cloud location at which this device was discovered.
            Present for cloud-based virtualized devices

            only.
          examples:
            - AWS.us-east-1
        cloudSetupId:
          type: string
          description: >-
            Name of the cloud setup associated with this device’s discovery.
            Present for cloud-based virtualized devices

            only.
          examples:
            - my-aws-setup
        cloudDiscoverySource:
          type: string
          description: >-
            Account name (AWS), Project ID (GCP), or Subscription ID (Azure)
            associated with this device’s discovery.

            Present for cloud-based virtualized devices only.
          examples:
            - main
