        - { name: commitId, in: path, required: true, schema: { type: string } }
        - { name: targetName, in: query, required: false, description: Name for the new change set. Forward chooses one when omitted., schema: { type: string } }
        - { name: targetBaseSnapshotId, in: query, required: false, description: Snapshot the new change set is based on. Forward chooses one when omitted., schema: { type: string } }
      responses:
        "200":
          description: The new change set's committed version.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommittedChangeSet" }
              # from source: CommittedChangeSet fields; placeholder values
              example: { id: "2", networkId: "1", name: "Restored change set", commitId: "1", committedAt: "2026-01-01T00:00:00Z", committedBy: example, deviceToChanges: {} }

