  /networks/{networkId}/snapshots:
    get:
      tags:
        - Network Snapshots
      summary: List network Snapshots
      operationId: listNetworkSnapshots
      parameters:
        - name: networkId
          in: path
          required: true
          schema:
            type: string
        - name: state
          in: query
          description: List only Snapshots in this state.
          schema:
            $ref: '#/components/schemas/SnapshotState'
        - name: advancedReachabilityState
          in: query
          description: >-
            List only Snapshots with this advanced reachability computation
            state.
          schema:
            $ref: '#/components/schemas/AdvancedReachabilityState'
        - name: minSuccessfulDevices
          in: query
          description: >-
            List only Snapshots with at least this many successfully modeled
            devices.
          schema:
            type: integer
            format: int32
        - name: minSuccessfulDevicePct
          in: query
          description: >-
            List only Snapshots with at least this percentage of devices
            successfully modeled.
          schema:
            type: number
            format: double
        - name: maxCollectionFailureDevices
          in: query
          description: >-
            List only Snapshots with no more than this many devices from which
            collection has failed.
          schema:
            type: integer
            format: int32
        - name: maxCollectionFailureDevicePct
          in: query
          description: >-
            List only Snapshots with no more than this percentage of devices
            from which collection has

            failed.
          schema:
            type: number
            format: double
        - name: maxParsingFailureDevices
          in: query
          description: >-
            List only Snapshots with no more than this many devices for which
            parsing of collected data has

            failed.
          schema:
            type: integer
            format: int32
        - name: maxParsingFailureDevicePct
          in: query
          description: >-
            List only Snapshots with no more than this percentage of devices for
            which parsing of collected data has

            failed.
          schema:
            type: number
            format: double
        - name: limit
          in: query
          description: Maximum number of Snapshots desired
          schema:
            type: integer
            format: int32
        - name: includeArchived
          in: query
          description: Also include archived snapshots. Defaults to false if not provided.
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NetworkSnapshots'
      security:
        - api_token: []
    post:
      tags:
        - Network Snapshots
      summary: Import a Snapshot
      description: >-
        Imports a network Snapshot that was previously exported as a .zip file.
        If multiple Snapshot .zip files are

        uploaded in a single request, they will be merged. They must not have
        any devices in common.
      operationId: createSnapshot
      parameters:
        - name: networkId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: array
                  items:
                    type: string
                    format: binary
                note:
                  type: string
                  description: >-
                    A brief note or description of the Snapshot. Can
                    alternatively be sent in the query

                    string.
                process:
                  type: boolean
                  description: >-
                    Whether to process the Snapshot (build the network model and
                    compute Check results) after importing

                    it. If false, Snapshot processing can be triggered later, in
                    the Forward application, when desired.

                    This parameter can alternatively be sent in the query
                    string.
                  default: true
                async:
                  type: boolean
                  description: >-
                    Whether to respond immediately with `202 Accepted` rather
                    than waiting for the import (and,

                    if `process` is true, processing) to finish. Can
                    alternatively be sent in the query string.
                  default: false
        required: true
      responses:
        '200':
          description: >-
            OK. Returned when `async` is false or omitted, after the import (and
            processing, if `process` is true) has

            finished. The body describes the resulting Snapshot.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SnapshotInfo'
        '202':
          description: >-
            Accepted. Returned when `async` is true. The Snapshot is being
            unpacked. The `Location` header identifies

            the new Snapshot, and the body reports its initial state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SnapshotInfo'
      security:
        - api_token: []
  /networks/{networkId}/snapshots/latestProcessed:
