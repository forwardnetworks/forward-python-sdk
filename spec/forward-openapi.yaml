            type: string
        - $ref: '#/components/parameters/SnapshotId'
        - name: offset
          in: query
          description: >-
            An optional number of vulnerabilities to skip. Useful for paging.
            Defaults to 0.
          schema:
            type: integer
            format: int32
        - name: limit
          in: query
          description: >-
            An optional maximum number of vulnerabilities desired. Useful for
            paging. Defaults to 1000.
          schema:
            type: integer
            format: int32
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OsVulnerabilityAnalysis'
        '409':
          description: >-
            The system is currently processing this Snapshot.


            Note: GET /networks/{networkId}/snapshots/latestProcessed can be
            used to determine when processing of the

            latest Snapshot is done or to identify an alternate Snapshot that
            has already been processed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorInfo'
      security:
        - api_token: []
