          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SysProxyServerConfig'
              # # from source: client-structs/src/main/java/com/forwardnetworks/client/model/ProxyServerConfig.java (password is a secret id, omitted here)
              example:
                id: P-1
                name: example-proxy
                host: proxy.example.com
                port: 8443
                protocol: https
                disableCertChecking: true
  /global-config/{property}:
    delete:
      operationId: clearGlobalConfigValue
      summary: Remove a global default override for an org property
      description: >-
        Requires the Forward administrator role (@RequiresForwardAdmin). Source-only: removes the stored global value,
        so the fixed default applies again.
      x-forward-stability: unpublished
      tags: [Configuration]
      parameters:
        - name: property
          in: path
          required: true
          schema: { type: string }
      responses:
        "204":
          description: The global value was removed. No body.
  /snapshots/{snapshotId}?action=restore:
    post:
      operationId: restoreSnapshotFromBackup
      summary: Restore one snapshot from a backup
      description: >-
        Requires the RESTORE_SNAPSHOT network permission (@Requires(network = RESTORE_SNAPSHOT)) and a snapshot that has
        been backed up (@RequiresSnapshot(backedUp = true)). Adds the snapshot back and changes no existing one. Forward
        answers 409 when the snapshot is already on disk and 400 when the backup was written by a newer version. Source-only.
      x-forward-stability: unpublished
      tags: [Backups]
      parameters:
        - name: snapshotId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The restore's initial status. Follow it with getSnapshotRestoreStatus.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SysRestoreStatus'
              # # from source: app/src/main/java/com/forwardnetworks/cv/cbr/RestoreStatus.java (RestoreStatus.initial)
              example:
                status: NOT_STARTED
                startMillis: 1700000000000
  /snapshots/{snapshotId}?view=restoreStatus:
    get:
      operationId: getSnapshotRestoreStatus
      summary: How a snapshot restore is going
      description: >-
        Requires the VIEW_NETWORK_AND_SNAPSHOTS network permission and a backed-up snapshot
        (@Requires(network = VIEW_NETWORK_AND_SNAPSHOTS), @RequiresSnapshot(backedUp = true)). Answers 204 with no body when
        no restore has been started. Source-only.
      x-forward-stability: unpublished
      tags: [Backups]
      parameters:
        - name: snapshotId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The restore's status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SysRestoreStatus'
              # # from source: app/src/main/java/com/forwardnetworks/cv/cbr/RestoreStatus.java
              example:
                status: IN_PROGRESS
                startMillis: 1700000000000
                stage: DOWNLOADING
                maxProgress: 1048576
                currentProgress: 524288
        "204":
          description: No restore has been started for this snapshot. No body.
  /cve-index:
    delete:
      operationId: deleteCveIndex
      summary: Revert to the CVE index bundled with this Forward build
      description: >-
        Requires the Forward administrator role (@RequiresForwardAdmin). Deletes an uploaded CVE index so the bundled one
        is used again (CveIndexCloudController.deleteCveIndex). The hosted account was not tested, because this changes
        the index in use.
      x-forward-stability: unpublished
      tags: [Vulnerability Analysis]
      responses:
        "204":
          description: The uploaded index was removed. No body.

components:
  schemas:
    SnapshotStateChange:
      type: object
      description: A snapshot's processing state before and after a request.
      properties:
        previousState: { $ref: "#/components/schemas/SnapshotState" }
        state: { $ref: "#/components/schemas/SnapshotState" }
    RepositoryCommit:
      type: object
      description: A commit in the NQE query library.
      properties:
        id:
          type: string
          description: The full 40-character hash.
        message:
          type: string
        author:
          type: string
        createdAt:
          type: string

    RepositoryCommitHistory:
      type: object
      properties:
        commits:
          type: array
          items: { $ref: "#/components/schemas/RepositoryCommit" }

    RepositoryQuery:
      type: object
      description: >-
        A query in the library. The commit arrives under one of two names
        depending on what was asked for, and both are real: listing at `head`
        returns a flat `lastCommitId`, while asking for a specific commit
        returns a nested `lastCommit` object. Reading only one of them loses the
        pin, and a query resolved by path then runs against whatever is at head
        without anything failing. `path` and `with=sourceCode` are honoured only
        against a specific commit; at `head` Forward ignores both.
      properties:
        queryId:
          type: string
          examples: ["FQ_ac651cb2901b067fe7dbfb511613ab44776d8029"]
        path:
          type: string
          examples: ["/NetBox/Devices"]
        intent:
          type: string
        repository:
          type: string
          enum: [org, fwd, ORG, FWD]
        lastCommit:
          $ref: "#/components/schemas/RepositoryCommit"
        lastCommitId:
          type: string
          description: The flat form, returned when listing at `head`.
        sourceCodeSha:
          type: string
        intent:
          type: string
        sourceCode:
          type: string
          description: Present only when the query was fetched with `with=sourceCode`.

    RepositoryQueryPage:
      type: object
      properties:
        queries:
          type: array
          items: { $ref: "#/components/schemas/RepositoryQuery" }

    DraftChange:
      type: object
      description: One staged, uncommitted change to the library.
      properties:
        path:
          type: string
        action:
          type: string
          enum: [addQuery, editQuery, addDir]

    DraftChangePage:
      type: object
      properties:
        changes:
          type: array
          items: { $ref: "#/components/schemas/DraftChange" }

    CommitResult:
      type: object
      description: The outcome of a commit, or the report from a dry run.
      properties:
        newErrors:
          type: array
          description: Errors the change would introduce. Non-empty means do not commit.
          items: { type: object, additionalProperties: true }
        uses:
          type: array
          description: Existing queries that depend on the ones being changed.
          items: { type: object, additionalProperties: true }
        unauthorizedQueryChanges:
          type: array
          items: { type: object, additionalProperties: true }
        unauthorizedAccessSettingChanges:
          type: array
          items: { type: object, additionalProperties: true }

    ReachabilityJob:
      type: object
      description: >-
        A reachability computation. The identifier has been observed under
        three names, so all three are declared.
      properties:
        jobKey:
          type: string
        executionKey:
          type: string
        id:
          type: string
        status:
          type: string
          examples: ["COMPLETED"]

    CurrentUserRoles:
      type: object
      description: >-
        The roles the calling user holds. `org` applies across the
        organization; `network` maps a network id to the role held on it.
        Integrations read both to decide whether a login may write to the
        shared query library.
      properties:
        org:
          description: >-
            Usually a list, but observed as a bare string, so consumers coerce.
          oneOf:
            - type: array
              items: { type: string }
            - type: string
        network:
          type: object
          additionalProperties: { type: string }

    NewAiMessage:
      type: object
      required: [prompt]
      properties:
        prompt:
          type: string
          description: The question to ask.

    AiChat:
      type: object
      description: One conversation, grounded in a single snapshot.
      properties:
        id: { type: string }
        networkId: { type: string }
        snapshotId: { type: string }
        name:
          type: string
          description: Absent until Forward has titled the chat.
        status:
          type: string
          enum: [PROCESSING, DONE]
        createdAt: { type: string }
        updatedAt: { type: string }

    AiChatPage:
      type: object
      properties:
        chats:
          type: array
          items: { $ref: "#/components/schemas/AiChat" }

    AiToolCall:
      type: object
      description: A tool Forward used while answering, such as an NQE query.
      properties:
        type: { type: string }

    AiMessageAnswer:
      type: object
      description: >-
        The answer to one question. Absent while the chat is PROCESSING.
      properties:
        summary: { type: string }
        outOfScope:
          type: boolean
          description: The question was outside what Forward AI can answer.
        keyInsights:
          type: array
          items: { type: string }

    AiMessage:
      type: object
      properties:
        id: { type: string }
        prompt: { type: string }
        toolCalls:
          type: array
          items: { $ref: "#/components/schemas/AiToolCall" }
        tasks:
          type: array
          items: { type: object, additionalProperties: true }
        finalAnswer:
          allOf: [{ $ref: "#/components/schemas/AiMessageAnswer" }]
          description: >-
            The answer, as sent on the wire. Verified against 26.8: this is an
            object, not a string, and it is the field Forward populates. Null
            while the chat is still PROCESSING.
        answer:
          allOf: [{ $ref: "#/components/schemas/AiMessageAnswer" }]
          description: >-
            An alternative spelling of the same thing. Read both through
            `forward_sdk.answer_of`, which returns whichever is present.
        outOfScopeReason:
          type: string
          description: Older form of an out-of-scope answer, as a bare string.
        createdAt: { type: string }
        updatedAt: { type: string }

    AiMessagePage:
      type: object
      properties:
        messages:
          type: array
          items: { $ref: "#/components/schemas/AiMessage" }

    CurrentUserAccount:
      type: object
      description: The account itself, nested under `user`.
      properties:
        id: { type: string }
        username: { type: string }
        email: { type: string }
        authSource: { type: string }
        enabled: { type: boolean }
        lastActive: { type: string }

    CurrentUser:
      type: object
      description: >-
        The calling user. Note the account is nested under `user`; the roles sit
        beside it rather than inside it.
      properties:
        user:
          $ref: "#/components/schemas/CurrentUserAccount"
        roles:
          $ref: "#/components/schemas/CurrentUserRoles"
        passwordSetAt: { type: string }

    SubnetConnectivityDiff:
      type: object
      description: >-
        How connectivity between subnets changed. Computed asynchronously, so an
        early request can return counts of zero with `isPartialResult` true;
        those zeros mean "not finished", not "nothing changed".
      properties:
        newlyConnectedSubnetPairs: { type: integer }
        newlyConnectedImpactedLocations: { type: integer }
        newlyConnectedDestinationSubnets: { type: integer }
        newlyIsolatedSubnetPairs: { type: integer }
        newlyIsolatedImpactedLocations: { type: integer }
        newlyIsolatedDestinationSubnets: { type: integer }
        modifiedSubnetPairs: { type: integer }
        modifiedImpactedLocations: { type: integer }
        evaluatedSubnetPairs:
          type: integer
          description: >-
            How many pairs have been compared so far. Zero alongside a non-zero
            `totalSubnetPairs` means the computation has not started.
        totalSubnetPairs: { type: integer }
        totalImpactedLocations: { type: integer }
        isPartialResult:
          type: boolean
          description: True while the comparison is still being computed.

    VulnerabilityDiffCounts:
      type: object
      description: >-
        Vulnerability exposure introduced by the change. Fields beyond
        `newCveCount` appear only on deployments licensed for vulnerability
        analysis, so the model keeps them optional.
      properties:
        newCveCount: { type: integer }
        newExposedVulnerableDevicesCount: { type: integer }

    RoutingLoopDiffCount:
      type: object
      properties:
        count: { type: integer }
        complete:
          type: boolean
          description: >-
            False when the search stopped early, so `count` is a lower bound
            rather than a total.

    ConfigValue:
      type: object
      description: >-
        A single property and its value, keyed by the property name in lower
        case. Read it with `forward_sdk.config_value`, which returns the value
        whatever the key.
      additionalProperties: true

    NewChangeSet:
      type: object
      description: >-
        The create body. No networkId: it comes from the path, and Forward
        rejects unknown properties, so sending one fails with 400.
      required: [name, snapshotId]
      properties:
        name: { type: string }
        description: { type: string }
        snapshotId: { type: string, description: The base snapshot. }
        tags:
          type: array
          items: { type: string }

    ChangeSetPatch:
      type: object
      description: Fields to change. Omit a field to leave it alone.
      properties:
        name: { type: string }
        description: { type: string }
        snapshotId: { type: string }
        tags:
          type: array
          items: { type: string }

    ChangeSetIds:
      type: object
      required: [changeSetIds]
      properties:
        changeSetIds:
          type: array
          items: { type: string }

    ChangeSetsTagUpdate:
      type: object
      required: [changeSetIds, update]
      properties:
        changeSetIds:
          type: array
          items: { type: string }
        update:
          type: object
          properties:
            tags:
              type: object
              properties:
                action: { type: string, enum: [ADD, REMOVE, REMOVE_ALL] }
                names:
                  type: array
                  items: { type: string }

    ChangeSetSummary:
      type: object
      properties:
        name: { type: string }
        description: { type: string }
        networkId: { type: string }
        snapshotId: { type: string }
        tags:
          type: array
          items: { type: string }

    DeviceChanges:
      type: object
      description: What a change set does to one device.
      properties:
        commands: { type: string, description: "Staged CLI text, when the change is CLI." }
        hasConfig: { type: boolean }
        hasSecurityRuleChanges: { type: boolean }

    ChangeSet:
      type: object
      description: >-
        A change set with its device changes. Attribution fields sit flat on
        the object rather than nested.
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        networkId: { type: string }
        snapshotId: { type: string }
        tags:
          type: array
          items: { type: string }
        deviceToChanges:
          type: object
          additionalProperties: { $ref: "#/components/schemas/DeviceChanges" }
        createdById: { type: string }
        createdBy: { type: string }
        createdAt: { type: string }
        updatedById: { type: string }
        updatedBy: { type: string }
        updatedAt: { type: string }

    PredictedSnapshotRef:
      type: object
      properties:
        id: { type: string }
        creationInstant: { type: string }
        networkId: { type: string }

    ChangeSetInfo:
      type: object
      description: A change set as listed, with its predicted snapshots newest first.
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        networkId: { type: string }
        snapshotId: { type: string }
        tags:
          type: array
          items: { type: string }
        modifiedDeviceCount: { type: integer }
        predictedSnapshots:
          type: array
          items: { $ref: "#/components/schemas/PredictedSnapshotRef" }
        createdById: { type: string }
        createdBy: { type: string }
        createdAt: { type: string }
        updatedById: { type: string }
        updatedBy: { type: string }
        updatedAt: { type: string }

    PredictedSnapshotMeta:
      type: object
      description: The snapshot Predict created. Created, not yet processed.
      properties:
        id: { type: string }
        note: { type: string }
        createdAt: { type: string }
        processedAt: { type: string }
        processingTrigger: { type: string }

    ChangeSetDraft:
      type: object
      description: The staged changes. savedAt is epoch milliseconds, unlike every other timestamp.
      properties:
        id: { type: string }
        name: { type: string }
        networkId: { type: string }
        snapshotId: { type: string }
        deviceToChanges:
          type: object
          additionalProperties: { $ref: "#/components/schemas/DeviceChanges" }
        savedAt: { type: integer }
        hiddenDevices:
          type: array
          items: { type: string }

    ChangeSetDraftResponse:
      type: object
      properties:
        draft:
          allOf: [ { $ref: "#/components/schemas/ChangeSetDraft" } ]
          description: Null when nothing is staged.

    CommandValidationRequest:
      type: object
      required: [commands, cursorLineNum, cursorColumnNum]
      properties:
        commands: { type: string, description: "The command text, one command per line." }
        cursorLineNum: { type: integer, description: 1-based. }
        cursorColumnNum: { type: integer, description: 1-based. }

    CommandValidationResponse:
      type: object
      properties:
        commandErrors:
          type: array
          items: { type: object, additionalProperties: true }
        suggestions:
          type: array
          items: { type: object, additionalProperties: true }
        textMarks:
          type: array
          items: { type: object, additionalProperties: true }

    ChangeSetCommit:
      type: object
      properties:
        commitId: { type: string }
        note: { type: string }
        committedById: { type: string }
        committedBy: { type: string }
        committedAt: { type: string }

    CommittedChangeSet:
      type: object
      description: A commit with the change set's device changes as of that commit, flattened together.
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        networkId: { type: string }
        snapshotId: { type: string }
        tags:
          type: array
          items: { type: string }
        deviceToChanges:
          type: object
          additionalProperties: { $ref: "#/components/schemas/DeviceChanges" }
        commitId: { type: string }
        note: { type: string }
        committedById: { type: string }
        committedBy: { type: string }
        committedAt: { type: string }
        hiddenDevices:
          type: array
          items: { type: string }
        createdById: { type: string }
        createdAt: { type: string }
        updatedById: { type: string }
        updatedAt: { type: string }

    NewChangeSetCheck:
      type: object
      required: [definition]
      properties:
        name: { type: string }
        definition:
          type: object
          description: A check definition; checkType selects the kind.
          additionalProperties: true

    ChangeSetCheckResult:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        definition: { type: object, additionalProperties: true }
        definedAt: { type: string }
        status: { type: string }
        executedAt: { type: string }
        executionDurationMillis: { type: integer }
        numViolations: { type: integer }
        createdById: { type: string }
        createdAt: { type: string }

    ChangeSetCheckResults:
      type: object
      properties:
        checks:
          type: array
          items: { $ref: "#/components/schemas/ChangeSetCheckResult" }

    DiffCount:
      type: object
      description: A count, and whether the computation that produced it finished.
      properties:
        count: { type: integer }
        complete:
          type: boolean
          description: False means count is a lower bound so far.

    BidirectionalDiffCount:
      type: object
      properties:
        warnings: { $ref: "#/components/schemas/DiffCount" }
        improvements: { $ref: "#/components/schemas/DiffCount" }

    VulnerabilityDiffCount:
      type: object
      properties:
        cveCount: { type: integer }
        exposedVulnerableDevicesCount: { type: integer }

    BidirectionalVulnerabilityDiff:
      type: object
      properties:
        warnings: { $ref: "#/components/schemas/VulnerabilityDiffCount" }
        improvements: { $ref: "#/components/schemas/VulnerabilityDiffCount" }

    FileDiffSummary:
      type: object
      properties:
        directChanges:
          type: object
          properties:
            deviceCount: { type: integer }
            locationIds:
              type: array
              items: { type: string }
            linesAdded: { type: integer }
            linesDeleted: { type: integer }
        indirectChanges:
          type: object
          properties:
            deviceCount: { type: integer }
            locationIds:
              type: array
              items: { type: string }

    RulebaseDescriptor:
      type: object
      properties:
        scopeId: { type: string }
        rulebaseId: { type: string }
        editable: { type: boolean }
        displayName: { type: string }

    SecurityRuleDefinition:
      type: object
      description: >-
        A firewall rule as Forward models it. name is required and must not be
        blank. The specification fields sit flat beside name, id and
        description rather than nested. Read one from the diff and mirror it;
        the full field list is address, user, application and service
        specifications plus zones, an action and a schedule.
      required: [name]
      properties:
        name: { type: string }
        id: { type: string }
        description: { type: string }
        enabled: { type: boolean }
        action: { type: string, enum: [DENY, DROP, PERMIT, RESET_CLIENT, RESET_CLIENT_AND_SERVER, RESET_SERVER] }
        sourceZones:
          type: array
          items: { type: string }
        destinationZones:
          type: array
          items: { type: string }
      additionalProperties: true

    ScopedSecurityRule:
      type: object
      properties:
        scopeId: { type: string }
        rulebaseId: { type: string }
        rank: { type: integer }
        definition: { $ref: "#/components/schemas/SecurityRuleDefinition" }
        createdAt: { type: string }
        lastModified: { type: string }
        lastUsed: { type: string }
        hitCount: { type: integer }

    SecurityRuleDiffEntry:
      type: object
      properties:
        diffType: { type: string, enum: [ADDED, DELETED, MODIFIED, UNCHANGED] }
        a:
          allOf: [ { $ref: "#/components/schemas/ScopedSecurityRule" } ]
          description: The rule before. Absent when ADDED.
        b:
          allOf: [ { $ref: "#/components/schemas/ScopedSecurityRule" } ]
          description: The rule after. Absent when DELETED.

    SecurityRulesDiff:
      type: object
      properties:
        rulebases:
          type: array
          items: { $ref: "#/components/schemas/RulebaseDescriptor" }
        entries:
          type: array
          items: { $ref: "#/components/schemas/SecurityRuleDiffEntry" }

    NewSecurityRule:
      type: object
      required: [definition]
      properties:
        predecessor:
          type: string
          description: Insert after this rule id. Omit to insert at the top.
        definition: { $ref: "#/components/schemas/SecurityRuleDefinition" }

    SecurityRulePatch:
      type: object
      description: Exactly one of definition or predecessor.
      properties:
        definition: { $ref: "#/components/schemas/SecurityRuleDefinition" }
        predecessor:
          type: string
          description: Move after this rule id; null moves to the top.

    WebhookTemplate:
      type: object
      properties:
        payloadFormat: { type: string, enum: [JSON, TEXT] }
        template: { type: string }

    WebhookEventParams:
      type: object
      description: >-
        Selected by type. For SNAPSHOT_READY, networkIds is required; empty
        means every network. The verification-failure types take maps of
        network id to check directories instead.
      required: [type]
      properties:
        type: { type: string, enum: [SNAPSHOT_READY, NQE_VERIFICATION_FAILURE, INTENT_VERIFICATION_FAILURE] }
        networkIds:
          type: array
          items: { type: string }
      additionalProperties: true

    WebhookCredential:
      type: object
      description: password is accepted on input and never returned.
      properties:
        type: { type: string, enum: [BASIC_AUTH] }
        username: { type: string }
        password: { type: string }

    Webhook:
      type: object
      required: [name, url, eventParams]
      properties:
        name: { type: string }
        description: { type: string }
        url: { type: string }
        disableSslValidation: { type: boolean }
        eventParams: { $ref: "#/components/schemas/WebhookEventParams" }
        credential: { $ref: "#/components/schemas/WebhookCredential" }
        enabled: { type: boolean }
        template: { $ref: "#/components/schemas/WebhookTemplate" }

    WebhookPatch:
      type: object
      description: Every field optional; omitted means unchanged.
      properties:
        name: { type: string }
        description: { type: string }
        url: { type: string }
        disableSslValidation: { type: boolean }
        eventParams: { $ref: "#/components/schemas/WebhookEventParams" }
        credential: { $ref: "#/components/schemas/WebhookCredential" }
        enabled: { type: boolean }
        template: { $ref: "#/components/schemas/WebhookTemplate" }

    WebhookTestResult:
      type: object
      properties:
        instant: { type: integer, description: Epoch milliseconds. }
        error: { type: string, description: Absent when the test passed. }

    WebhooksAndTestResults:
      type: object
      properties:
        webhooks:
          type: array
          items: { $ref: "#/components/schemas/Webhook" }
        testResults:
          type: object
          additionalProperties: { $ref: "#/components/schemas/WebhookTestResult" }

    SecurityObjectId:
      type: object
      properties:
        scopeId: { type: string }
        name: { type: string }

    IpRange:
      type: object
      properties:
        start: { type: string }
        end: { type: string }

    PortRange:
      type: object
      properties:
        start: { type: integer }
        end: { type: integer }

    ServiceDefinition:
      type: object
      properties:
        protocolName: { type: string }
        sourcePorts:
          type: array
          items: { $ref: "#/components/schemas/PortRange" }
        destinationPorts:
          type: array
          items: { $ref: "#/components/schemas/PortRange" }

    ScopedAddressObject:
      type: object
      properties:
        scopeId: { type: string }
        name: { type: string }
        description: { type: string }
        tags: { type: array, items: { type: string } }
        subnets: { type: array, items: { type: string } }
        ipRanges: { type: array, items: { $ref: "#/components/schemas/IpRange" } }
        domains: { type: array, items: { type: string } }

    ScopedAddressGroup:
      type: object
      description: description repeats name on the wire; Forward populates it from the name.
      properties:
        scopeId: { type: string }
        name: { type: string }
        description: { type: string }
        tags: { type: array, items: { type: string } }
        memberObjects: { type: array, items: { $ref: "#/components/schemas/SecurityObjectId" } }
        memberGroups: { type: array, items: { $ref: "#/components/schemas/SecurityObjectId" } }

    ScopedApplicationObject:
      type: object
      properties:
        scopeId: { type: string }
        name: { type: string }
        description: { type: string }
        defaultServiceDefinitions: { type: array, items: { $ref: "#/components/schemas/ServiceDefinition" } }

    ScopedApplicationGroup:
      type: object
      properties:
        scopeId: { type: string }
        name: { type: string }
        memberObjects: { type: array, items: { $ref: "#/components/schemas/SecurityObjectId" } }
        memberDynamicGroups: { type: array, items: { $ref: "#/components/schemas/SecurityObjectId" } }
        memberGroups: { type: array, items: { $ref: "#/components/schemas/SecurityObjectId" } }

    ScopedUrlObject:
      type: object
      properties:
        scopeId: { type: string }
        name: { type: string }
        description: { type: string }
        members: { type: array, items: { type: string } }

    ScopedServiceObject:
      type: object
      properties:
        scopeId: { type: string }
        name: { type: string }
        description: { type: string }
        definitions: { type: array, items: { $ref: "#/components/schemas/ServiceDefinition" } }

    ScopedServiceGroup:
      type: object
      properties:
        scopeId: { type: string }
        name: { type: string }
        memberObjects: { type: array, items: { $ref: "#/components/schemas/SecurityObjectId" } }
        memberGroups: { type: array, items: { $ref: "#/components/schemas/SecurityObjectId" } }

    ScopedUserObject:
      type: object
      properties:
        scopeId: { type: string }
        name: { type: string }

    SecurityZone:
      type: object
      properties:
        name: { type: string }
        interfaces: { type: array, items: { type: string } }

    AddressObjectCollection:
      type: object
      properties:
        addressObjects:
          type: array
          items: { $ref: "#/components/schemas/ScopedAddressObject" }

    AddressGroupCollection:
      type: object
      properties:
        addressGroups:
          type: array
          items: { $ref: "#/components/schemas/ScopedAddressGroup" }

    ApplicationObjectCollection:
      type: object
      properties:
        applicationObjects:
          type: array
          items: { $ref: "#/components/schemas/ScopedApplicationObject" }

    ApplicationGroupCollection:
      type: object
      properties:
        applicationGroups:
          type: array
          items: { $ref: "#/components/schemas/ScopedApplicationGroup" }

    UrlObjectCollection:
      type: object
      properties:
        urlObjects:
          type: array
          items: { $ref: "#/components/schemas/ScopedUrlObject" }

    ServiceObjectCollection:
      type: object
      properties:
        serviceObjects:
          type: array
          items: { $ref: "#/components/schemas/ScopedServiceObject" }

    ServiceGroupCollection:
      type: object
      properties:
        serviceGroups:
          type: array
          items: { $ref: "#/components/schemas/ScopedServiceGroup" }

    UserObjectCollection:
      type: object
      properties:
        userObjects:
          type: array
          items: { $ref: "#/components/schemas/ScopedUserObject" }

    SecurityZoneCollection:
      type: object
      properties:
        zones:
          type: array
          items: { $ref: "#/components/schemas/SecurityZone" }

    CliAssistRequest:
      type: object
      required: [prompt]
      properties:
        prompt: { type: string, description: Must not be blank. }

    CliAssistResponse:
      type: object
      description: commands is one string despite the plural name.
      properties:
        commands: { type: string }

    OverviewAssistResponse:
      type: object
      properties:
        name: { type: string }
        description: { type: string }
        tags: { type: array, items: { type: string } }

    SummaryAssistResponse:
      type: object
      properties:
        summary: { type: string }

    BgpAdvertisementKey:
      type: object
      required: [externalPeer, prefix, vrf]
      properties:
        externalPeer: { type: string, description: The peer's IP address. }
        prefix: { type: string, description: CIDR. }
        vrf: { type: string }

    BgpAdvertisement:
      type: object
      description: The key fields sit flat beside the attributes. asPath must be non-empty for EBGP.
      required: [externalPeer, prefix, vrf, nextHop, origin]
      properties:
        externalPeer: { type: string }
        prefix: { type: string }
        vrf: { type: string }
        type: { type: string, enum: [EBGP, IBGP], description: Defaults to EBGP. }
        nextHop: { type: string }
        origin: { type: string, enum: [EGP, IGP, INCOMPLETE, DEFAULT_ORIGINATE] }
        localPref: { type: integer }
        asPath: { type: array, items: { type: integer } }
        med: { type: integer }
        communities: { type: array, items: { type: string } }

    BgpAdvertisementList:
      type: array
      items: { $ref: "#/components/schemas/BgpAdvertisement" }

    BgpAdvertisementKeyList:
      type: array
      items: { $ref: "#/components/schemas/BgpAdvertisementKey" }

    BgpAdvertisementDiff:
      type: object
      properties:
        change: { type: string, enum: [INJECTED, MODIFIED, DUPLICATED, WITHDRAWN, ABSENT] }
        original: { $ref: "#/components/schemas/BgpAdvertisement" }
        updateAdded: { $ref: "#/components/schemas/BgpAdvertisement" }
        updateRemoved: { $ref: "#/components/schemas/BgpAdvertisementKey" }

    ChangeSetDirectories:
      type: object
      description: Directory path to the ids of the change sets directly inside it.
      additionalProperties:
        type: array
        items: { type: string }

    DiffStats:
      type: object
      description: Counts by kind of change. All four keys are always present.
      properties:
        ADDED: { type: integer }
        DELETED: { type: integer }
        MODIFIED: { type: integer }
        UNCHANGED: { type: integer }

    CheckDiffCounts:
      type: object
      description: Check type to its count. NQE appears only when non-zero or incomplete.
      additionalProperties: { $ref: "#/components/schemas/DiffCount" }

    CheckDiffStats:
      type: object
      description: Check id to its statistics.
      additionalProperties: { $ref: "#/components/schemas/DiffStats" }

    NqeCheckDiffStat:
      type: object
      properties:
        queryId: { type: string }
        params: { type: object, additionalProperties: true }
        stats: { $ref: "#/components/schemas/DiffStats" }
        diffResultKeyHash: { type: string }
        processing: { type: boolean }
        outdated: { type: boolean }

    NqeCheckDiffStats:
      type: object
      properties:
        checks:
          type: array
          items: { $ref: "#/components/schemas/NqeCheckDiffStat" }

    NqeCheckDefinitions:
      type: object
      required: [definitions]
      properties:
        definitions:
          type: array
          items: { type: object, additionalProperties: true }

    CheckResultDiffEntry:
      type: object
      properties:
        diffType: { type: string, enum: [ADDED, DELETED, MODIFIED, UNCHANGED, PROCESSING] }
        a: { $ref: "#/components/schemas/NetworkCheckResult" }
        b: { $ref: "#/components/schemas/NetworkCheckResult" }

    ChecksDiff:
      type: object
      properties:
        checks:
          type: array
          items: { $ref: "#/components/schemas/CheckResultDiffEntry" }

    CheckDiffDetails:
      type: object
      properties:
        check: { type: object, additionalProperties: true }
        details:
          type: array
          items: { type: object, additionalProperties: true }

    FileDiffCount:
      type: object
      properties:
        count: { type: integer }
        complete: { type: boolean }
        types:
          type: object
          additionalProperties: { type: integer }

    StoredFileInfo:
      type: object
      properties:
        name: { type: string }
        nameA: { type: string, description: Present only when the file's name differs in the before snapshot. }
        command: { type: string, description: Present only for custom CLI files. }

    DeviceFilesDiff:
      type: object
      description: The device's inventory fields sit flat beside files.
      properties:
        name: { type: string }
        deviceName: { type: string }
        vendor: { type: string }
        os: { type: string }
        osVersion: { type: string }
        model: { type: string }
        deviceType: { type: string }
        tags: { type: array, items: { type: string } }
        managementIps: { type: array, items: { type: string } }
        files:
          type: array
          items: { $ref: "#/components/schemas/StoredFileInfo" }
        hasConfigChange: { type: boolean }
      additionalProperties: true

    CollectedFilesDiff:
      type: object
      properties:
        deviceInfos:
          type: array
          items: { $ref: "#/components/schemas/DeviceFilesDiff" }

    InventoryDeviceInfo:
      type: object
      properties:
        name: { type: string }
        displayName: { type: string }
        requestedName: { type: string }
        vendor: { type: string }
        os: { type: string }
        osVersion: { type: string }
        model: { type: string }
        deviceType: { type: string }
        tags: { type: array, items: { type: string } }
        managementIps: { type: array, items: { type: string } }
        configFile: { type: string }
        collectedAt: { type: string }
        processingError: { type: string }
        collectionError: { type: string }
        predictAffected: { type: boolean }
      additionalProperties: true

    DeviceDiffEntry:
      type: object
      properties:
        diffType: { type: string, enum: [ADDED, DELETED, MODIFIED, UNCHANGED] }
        a: { $ref: "#/components/schemas/InventoryDeviceInfo" }
        b: { $ref: "#/components/schemas/InventoryDeviceInfo" }

    CloudObjectMetadata:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        accountName: { type: string }
        type: { type: string }
        cloudType: { type: string, enum: [AWS, GCP, AZURE, IBM_CLOUD, ALKIRA] }
        locationIds: { type: array, items: { type: string } }
        vpcs: { type: array, items: { type: string } }
        processingError: { type: string }
        collectionError: { type: string }
      additionalProperties: true

    CloudObjectDiffEntry:
      type: object
      properties:
        diffType: { type: string, enum: [ADDED, DELETED, MODIFIED, UNCHANGED] }
        a: { $ref: "#/components/schemas/CloudObjectMetadata" }
        b: { $ref: "#/components/schemas/CloudObjectMetadata" }

    DeviceDiffStat:
      type: object
      description: A device's inventory fields sit flat beside its statistics.
      properties:
        name: { type: string }
        deviceName: { type: string }
        vendor: { type: string }
        os: { type: string }
        model: { type: string }
        deviceType: { type: string }
        hasConfigChange: { type: boolean }
        stats: { $ref: "#/components/schemas/DiffStats" }
      additionalProperties: true

    DeviceDiffStats:
      type: object
      properties:
        deviceInfos:
          type: array
          items: { $ref: "#/components/schemas/DeviceDiffStat" }

    FileLines:
      type: object
      description: Stored file name to the line ranges the entry came from.
      additionalProperties:
        type: array
        items: { $ref: "#/components/schemas/LineRange" }

    FieldAndValues:
      type: object
      properties:
        field: { type: string }
        index: { type: integer }
        values: { type: array, items: {} }
        negated: { type: boolean }

    InterfaceInfo:
      type: object
      description: Empty and null fields are omitted; booleans are always present.
      properties:
        type: { type: string }
        name: { type: string }
        description: { type: string }
        mtu: { type: integer }
        speedMbps: { type: integer }
        fullDuplex: { type: boolean }
        isDown: { type: boolean }
        aliases: { type: array, items: { type: string } }
        macAddress: { type: string }
        ipAddresses: { type: array, items: { type: string } }
        fhrpIpAddresses: { type: array, items: { type: string } }
        vrfName: { type: string }
        defaultVlan: { type: string }
        accessVlan: { type: string }
        voiceVlan: { type: string }
        nativeVlan: { type: string }
        vlan: { type: string }
        innerVlan: { type: string }
        trunkVlans: { type: array, items: { type: string } }
        parentIface: { type: string }
        memberPorts: { type: array, items: { type: string } }
        configuredMemberPorts: { type: array, items: { type: string } }
        inAclNames: { type: array, items: { type: string } }
        outAclNames: { type: array, items: { type: string } }
        srcAddresses: { type: array, items: { type: string } }
        dstAddresses: { type: array, items: { type: string } }
        securityZone: { type: string }
        fileLines: { $ref: "#/components/schemas/FileLines" }
      additionalProperties: true

    InterfaceDiffEntry:
      type: object
      properties:
        diffType: { type: string, enum: [ADDED, DELETED, MODIFIED, UNCHANGED] }
        a: { $ref: "#/components/schemas/InterfaceInfo" }
        b: { $ref: "#/components/schemas/InterfaceInfo" }

    DeviceInterfaceDiff:
      type: object
      properties:
        diffs:
          type: array
          items: { $ref: "#/components/schemas/InterfaceDiffEntry" }
        stats: { $ref: "#/components/schemas/DiffStats" }

    AclDiffEntryInfo:
      type: object
      properties:
        name: { type: string }
        action: { type: string }
        aclContext: { type: string }
        inputInterfaces: { type: array, items: { type: string } }
        outputInterfaces: { type: array, items: { type: string } }
        matches: { type: array, items: { $ref: "#/components/schemas/FieldAndValues" } }
        negatedMatches: { type: array, items: { $ref: "#/components/schemas/FieldAndValues" } }
        fileLines: { $ref: "#/components/schemas/FileLines" }

    AclDiffEntry:
      type: object
      properties:
        diffType: { type: string, enum: [ADDED, DELETED, MODIFIED, UNCHANGED] }
        a: { $ref: "#/components/schemas/AclDiffEntryInfo" }
        b: { $ref: "#/components/schemas/AclDiffEntryInfo" }

    DeviceAclDiff:
      type: object
      properties:
        diffs:
          type: array
          items: { $ref: "#/components/schemas/AclDiffEntry" }
        stats: { $ref: "#/components/schemas/DiffStats" }

    NatTransformation:
      type: object
      properties:
        values: { type: array, items: { $ref: "#/components/schemas/FieldAndValues" } }
        autoMap: { type: boolean }

    NatEntryInfo:
      type: object
      properties:
        natType: { type: string, enum: [SOURCE_NAT, PRE_FWD_SOURCE_NAT, DESTINATION_NAT, POST_FWD_DESTINATION_NAT, VSERVER, PROXY] }
        match: { type: array, items: { $ref: "#/components/schemas/FieldAndValues" } }
        action: { type: string }
        outputTransformations: { type: array, items: { $ref: "#/components/schemas/NatTransformation" } }
        fileLines: { $ref: "#/components/schemas/FileLines" }

    NatDiffEntry:
      type: object
      properties:
        diffType: { type: string, enum: [ADDED, DELETED, MODIFIED, UNCHANGED] }
        a: { $ref: "#/components/schemas/NatEntryInfo" }
        b: { $ref: "#/components/schemas/NatEntryInfo" }

    DeviceNatDiff:
      type: object
      properties:
        diffs:
          type: array
          items: { $ref: "#/components/schemas/NatDiffEntry" }
        stats: { $ref: "#/components/schemas/DiffStats" }

    ArpEntryInfo:
      type: object
      properties:
        ipAddress: { type: string }
        vrfName: { type: string }
        macAddress: { type: string }
        port: { type: string }
        fileLines: { $ref: "#/components/schemas/FileLines" }

    ArpDiffEntry:
      type: object
      properties:
        diffType: { type: string, enum: [ADDED, DELETED, MODIFIED, UNCHANGED] }
        a: { $ref: "#/components/schemas/ArpEntryInfo" }
        b: { $ref: "#/components/schemas/ArpEntryInfo" }

    DeviceArpDiff:
      type: object
      properties:
        diffs:
          type: array
          items: { $ref: "#/components/schemas/ArpDiffEntry" }
        stats: { $ref: "#/components/schemas/DiffStats" }

    MacEntryInfo:
      type: object
      properties:
        macAddress: { type: string }
        vlan: { type: string }
        ports: { type: array, items: { type: string } }
        fileLines: { $ref: "#/components/schemas/FileLines" }

    MacDiffEntry:
      type: object
      properties:
        diffType: { type: string, enum: [ADDED, DELETED, MODIFIED, UNCHANGED] }
        a: { $ref: "#/components/schemas/MacEntryInfo" }
        b: { $ref: "#/components/schemas/MacEntryInfo" }

    DeviceMacDiff:
      type: object
      properties:
        diffs:
          type: array
          items: { $ref: "#/components/schemas/MacDiffEntry" }
        stats: { $ref: "#/components/schemas/DiffStats" }

    RoutingDiffDetails:
      type: object
      description: Route entries as Forward serialises them; the entry shape is not declared.
      properties:
        diffs:
          type: array
          items: { type: object, additionalProperties: true }
        stats: { $ref: "#/components/schemas/DiffStats" }

    TopologyDiff:
      type: object
      description: Only the kinds of change present appear as keys.
      properties:
        ADDED: { type: array, items: { $ref: "#/components/schemas/TopologyLink" } }
        DELETED: { type: array, items: { $ref: "#/components/schemas/TopologyLink" } }

    VlanInterfaceStatus:
      type: object
      properties:
        intfName: { type: string }
        forwardingStatus: { type: string, enum: [UP_FORWARDING, UP_NON_FORWARDING, DOWN] }

    VlanL3Interface:
      type: object
      properties:
        intfName: { type: string }
        ipAddresses: { type: array, items: { type: string } }

    DeviceVlanInfo:
      type: object
      properties:
        device: { type: string }
        interfaces: { type: array, items: { $ref: "#/components/schemas/VlanInterfaceStatus" } }
        l3Interfaces: { type: array, items: { $ref: "#/components/schemas/VlanL3Interface" } }

    VlanDiffEntry:
      type: object
      properties:
        diffType: { type: string, enum: [ADDED, DELETED, MODIFIED, UNCHANGED] }
        a: { $ref: "#/components/schemas/DeviceVlanInfo" }
        b: { $ref: "#/components/schemas/DeviceVlanInfo" }

    L2Diff:
      type: object
      properties:
        vlanToDiffs:
          type: object
          additionalProperties:
            type: array
            items: { $ref: "#/components/schemas/VlanDiffEntry" }

    CloudObjectDiffStat:
      type: object
      properties:
        objectId: { type: string }
        type: { type: string }
        cloudType: { type: string }
        fileStats:
          type: object
          additionalProperties: { $ref: "#/components/schemas/DiffStats" }

    CloudObjectDiffStats:
      type: object
      properties:
        cloudObjects:
          type: array
          items: { $ref: "#/components/schemas/CloudObjectDiffStat" }

    ConnChangeStats:
      type: object
      properties:
        newlyConnected: { type: integer }
        newlyIsolated: { type: integer }
        modified: { type: integer }

    LocationConnChangeCount:
      type: object
      properties:
        src: { type: string }
        dst: { type: string }
        count: { type: integer }

    LocationConnChangeCounts:
      type: object
      properties:
        counts:
          type: array
          items: { $ref: "#/components/schemas/LocationConnChangeCount" }

    LocationConnDiffStat:
      type: object
      properties:
        locationId: { type: string }
        incoming: { $ref: "#/components/schemas/ConnChangeStats" }
        outgoing: { $ref: "#/components/schemas/ConnChangeStats" }

    LocationsConnDiffStats:
      type: object
      properties:
        stats:
          type: array
          items: { $ref: "#/components/schemas/LocationConnDiffStat" }

    SubnetPairConnDiffStat:
      type: object
      properties:
        src: { type: string }
        dst: { type: string }
        stats: { $ref: "#/components/schemas/ConnChangeStats" }

    LocationPairConnDiffStats:
      type: object
      properties:
        stats:
          type: array
          items: { $ref: "#/components/schemas/SubnetPairConnDiffStat" }

    SubnetConnDiffDetail:
      type: object
      properties:
        diffType: { type: string, enum: [ADDED, DELETED, MODIFIED, UNCHANGED] }
        value: { type: object, additionalProperties: true }

    SubnetConnDiffDetails:
      type: object
      properties:
        diffs:
          type: array
          items: { $ref: "#/components/schemas/SubnetConnDiffDetail" }

    SnmpAuthSettings:
      type: object
      description: >-
        SNMPv3 settings. The security level is implied by what is present:
        username alone, plus authType and password, plus privacyProtocol and
        privacyPassword. Passwords must be at least 8 bytes, are accepted on
        input, and come back as the numeric id of the stored secret.
      properties:
        username: { type: string }
        password: { type: string }
        authType: { type: string, enum: [MD5, SHA, SHA_256, SHA_384, SHA_512] }
        privacyProtocol: { type: string, enum: [DES, AES_128, AES_192, AES_256, TDES, AES_192_TDES, AES_256_TDES] }
        privacyPassword: { type: string }

    NewSnmpCredential:
      type: object
      description: communityString applies to V2C, authSettings to V3.
      properties:
        name: { type: string }
        version: { type: string, enum: [V2C, V3] }
        port: { type: integer }
        timeoutSec: { type: integer }
        communityString: { type: string }
        authSettings: { $ref: "#/components/schemas/SnmpAuthSettings" }
        autoAssociate: { type: boolean, description: Attach to new devices automatically. }

    SnmpCredentialPatch:
      type: object
      description: Every field optional; omitted means unchanged.
      properties:
        name: { type: string }
        version: { type: string, enum: [V2C, V3] }
        port: { type: integer }
        timeoutSec: { type: integer }
        communityString: { type: string }
        authSettings: { $ref: "#/components/schemas/SnmpAuthSettings" }
        autoAssociate: { type: boolean }

    SnmpCredential:
      type: object
      description: >-
        A stored credential with attribution flat beside it. communityString
        and the V3 passwords hold the numeric id of the stored secret, never
        the value.
      properties:
        id: { type: string }
        name: { type: string }
        version: { type: string, enum: [V2C, V3] }
        port: { type: integer }
        timeoutSec: { type: integer }
        communityString: { type: string, description: The stored secret's id, not the value. }
        authSettings: { $ref: "#/components/schemas/SnmpAuthSettings" }
        autoAssociate: { type: boolean }
        createdById: { type: string }
        createdBy: { type: string }
        createdAt: { type: string }
        updatedById: { type: string }
        updatedBy: { type: string }
        updatedAt: { type: string }

    CollectorHealthIssue:
      type: object
      properties:
        type: { type: string, enum: [HIGH_CPU, LOW_MEMORY, LOW_DISK] }
        startTime: { type: string }
        endTime: { type: string, description: Absent while the issue is ongoing. }

    CollectorHealthSummary:
      type: object
      properties:
        status: { type: string, enum: [HEALTHY, UNHEALTHY, UNKNOWN] }
        issues:
          type: array
          items: { $ref: "#/components/schemas/CollectorHealthIssue" }

    CollectorWithStatus:
      type: object
      description: >-
        The collector's own fields sit flat beside its status. Empty when no
        collector is bound to the network.
      properties:
        id: { type: string }
        name: { type: string }
        username: { type: string }
        orgId: { type: string }
        networkIds: { type: array, items: { type: string } }
        isDefault: { type: boolean }
        externalIp: { type: string }
        internalIps: { type: array, items: { type: string } }
        features: { type: object, additionalProperties: true }
        connectionStatus: { type: string, enum: [NEVER_CONNECTED, CONNECTED, DISCONNECTED] }
        disconnectedAt: { type: string }
        health: { $ref: "#/components/schemas/CollectorHealthSummary" }
        version: { type: string }
        updateStatus: { type: string, enum: [UP_TO_DATE, OUTDATED, NOT_SUPPORTED, END_OF_LIFE] }
        collectorUpdating: { type: boolean }
        createdAt: { type: integer, description: Epoch milliseconds, unlike most timestamps. }
        createdBy: { type: string, description: A user id, not a name. }
      additionalProperties: true

    CollectorBinding:
      type: object
      required: [username]
      properties:
        username: { type: string, description: The collector account's username. }

    CollectorWithAuthKey:
      type: object
      description: >-
        A newly created collector account, plus the one-time key its installer
        needs. The key is returned only from creation -- it cannot be fetched
        again afterwards.
      properties:
        id: { type: string }
        orgId: { type: string }
        name: { type: string }
        username: { type: string }
        createdAt: { type: integer, description: Epoch milliseconds. }
        createdBy: { type: string, description: A user id, not a name. }
        authorizationKey:
          type: string
          description: >-
            Opaque install key for the collector's fwd.properties/installer.
            V2 format is literally `username:password`; V3 is a base64-encoded
            protobuf that also carries the app server URL.
      additionalProperties: true

    CloudTestResult:
      type: object
      properties:
        testInstant: { type: integer, description: Epoch milliseconds. }
        error: { type: string, description: A collection error name; NONE on success. }

    CloudAccount:
      type: object
      description: >-
        Common fields, with per-type fields beside them: AWS regions and
        assume-role settings, Azure tenant and subscriptions, GCP projects and
        regions, IBM accounts and regions, Alkira URL. Secrets and credential
        ids are never included.
      required: [type, name]
      properties:
        type: { type: string, enum: [AWS, AZURE, GCP, IBM_CLOUD, ALKIRA] }
        name: { type: string }
        collect: { type: boolean }
        proxyServerId: { type: string }
        collectorId: { type: string }
        concurrency: { type: integer }
        connectionTimeoutSeconds: { type: integer }
        requestTimeoutSeconds: { type: integer }
      additionalProperties: true

    CloudAccountWithMeta:
      allOf:
        - { $ref: "#/components/schemas/CloudAccount" }
        - type: object
          properties:
            numVirtualizedDevices: { type: integer }

    NewCloudAccount:
      type: object
      description: >-
        Selected by type. Common: name, collect, collectorId, proxyServerId,
        concurrency and timeouts. AWS: regions as a map of region to test
        instant, plus username and password, or roleArn, or assumeRoleInfos.
        AZURE: clientId, password, tenant, environment, testInstants per
        subscription. GCP: clientId, clientEmail, privateKeyId, privateKey,
        regions, projectIds or discoveredProjectIds. IBM_CLOUD: apiKey,
        regions, optional accountIds. ALKIRA: cloudUrl, apiKeyId, testInstant.
      required: [type, name]
      properties:
        type: { type: string, enum: [AWS, AZURE, GCP, IBM_CLOUD, ALKIRA] }
        name: { type: string }
        collect: { type: boolean }
        collectorId: { type: string }
        proxyServerId: { type: string }
        concurrency: { type: integer }
        connectionTimeoutSeconds: { type: integer }
        requestTimeoutSeconds: { type: integer }
      additionalProperties: true

    CloudAccountPatch:
      type: object
      description: Selected by type. Every field optional; omitted means unchanged. Credentials cannot be changed here.
      required: [type]
      properties:
        type: { type: string, enum: [AWS, AZURE, GCP, IBM_CLOUD, ALKIRA] }
        name: { type: string }
        collect: { type: boolean }
        collectorId: { type: string }
        proxyServerId: { type: string }
        concurrency: { type: integer }
        connectionTimeoutSeconds: { type: integer }
        requestTimeoutSeconds: { type: integer }
      additionalProperties: true

    CloudAccountCredential:
      type: object
      description: >-
        Selected by type; no ALKIRA. AWS: username and password, or roleArn.
        AZURE: clientId, password, tenant. GCP: clientId, clientEmail,
        privateKeyId, privateKey. IBM_CLOUD: apiKey.
      required: [type]
      properties:
        type: { type: string, enum: [AWS, AZURE, GCP, IBM_CLOUD] }
      additionalProperties: true

    CloudAccountDiscovery:
      type: object
      description: >-
        A credential to discover accounts with, selected by type; no ALKIRA.
        The same secret fields as the credential body, plus optional
        collectorId, proxyServerId, concurrency and timeouts.
      required: [type]
      properties:
        type: { type: string, enum: [AWS, AZURE, GCP, IBM_CLOUD] }
      additionalProperties: true

    CloudExistingAccountDiscovery:
      type: object
      description: Only GCP takes a field, projectIds.
      properties:
        type: { type: string, enum: [AWS, AZURE, GCP] }
        projectIds: { type: array, items: { type: string } }
      additionalProperties: true

    DiscoveredEntity:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        agency: { type: string }
        mission: { type: string }
        roles: { type: array, items: { type: string } }
        errorMsg: { type: string }

    CloudAccountDiscoveryResult:
      type: object
      properties:
        error: { type: string, description: A collection error name; NONE on success. }
        discoveredEntities:
          type: array
          items: { $ref: "#/components/schemas/DiscoveredEntity" }

    DiscoveredAccountsByAccount:
      type: object
      description: Configured account name to the sub-accounts found beneath it.
      additionalProperties:
        type: array
        items:
          type: object
          properties:
            id: { type: string }
            name: { type: string }

    CloudConnectivityTest:
      type: object
      description: >-
        Selected by type. id is a name you choose for the test; the result
        arrives on the event stream under it. The per-type fields match the
        create body, with regions as a list rather than a map.
      required: [type, id]
      properties:
        type: { type: string, enum: [AWS, AZURE, GCP, IBM_CLOUD, ALKIRA] }
        id: { type: string }
      additionalProperties: true

    CloudAccountConnectivityTest:
      type: object
      description: Selected by type. Regions to test as a list, and optional overrides for collector, proxy and timeouts.
      properties:
        type: { type: string, enum: [AWS, AZURE, GCP, IBM_CLOUD] }
        regions: { type: array, items: { type: string } }
      additionalProperties: true

    AwsExternalId:
      type: object
      properties:
        externalId: { type: string }

    ConfigValues:
      type: object
      description: Property name to value, one entry per property.
      additionalProperties: true

    ColumnInfo:
      type: object
      required: [name, width]
      properties:
        name: { type: string }
        width: { type: integer, description: Positive. }

    ThresholdRule:
      type: object
      properties:
        value: { type: number, description: Null marks the default rule. }
        status: { type: string, enum: [NEUTRAL, OK, WARNING, ISSUE] }

    PanelConfig:
      type: object
      description: >-
        Selected by type. TABULAR takes columnOrder and visibleColumns, both
        non-empty, and optional frozenColumns; the latter two are subsets of
        columnOrder. METRIC takes
        columnName, aggregation, and optional unit, decimalPrecision and
        thresholds.
      required: [type]
      properties:
        type: { type: string, enum: [TABULAR, METRIC] }
        columnOrder: { type: array, items: { type: string } }
        visibleColumns: { type: array, items: { $ref: "#/components/schemas/ColumnInfo" } }
        frozenColumns: { type: array, items: { type: string } }
        columnName: { type: string }
        aggregation: { type: string, enum: [COUNT, COUNT_DISTINCT, SUM, MIN, MAX, AVERAGE, MEDIAN, COUNT_TRUE, COUNT_FALSE, COUNT_NULL] }
        unit: { type: string }
        decimalPrecision: { type: integer }
        thresholds: { type: array, items: { $ref: "#/components/schemas/ThresholdRule" } }

    NqePanelDef:
      type: object
      required: [name, queryId, config]
      properties:
        name: { type: string }
        displayName: { type: string }
        description: { type: string }
        queryId: { type: string, description: "A committed library query id, Q_ or FQ_ followed by 40 hex characters. Query text is not accepted." }
        queryParams: { type: object, additionalProperties: true }
        config: { $ref: "#/components/schemas/PanelConfig" }

    NqePanelPatch:
      type: object
      description: >-
        Every field optional; omitted means unchanged. Flat: configuration
        fields sit beside name and description. Tabular panels take
        columnOrder, visibleColumns and frozenColumns; metric panels take
        columnName, aggregation, unit, decimalPrecision and thresholds.
      properties:
        name: { type: string }
        displayName: { type: string }
        description: { type: string }
        queryParams: { type: object, additionalProperties: true }
        columnOrder: { type: array, items: { type: string } }
        visibleColumns: { type: array, items: { $ref: "#/components/schemas/ColumnInfo" } }
        frozenColumns: { type: array, items: { type: string } }
        columnName: { type: string }
        aggregation: { type: string }
        unit: { type: string }
        decimalPrecision: { type: integer }
        thresholds: { type: array, items: { $ref: "#/components/schemas/ThresholdRule" } }

    NqePanel:
      type: object
      description: A panel with its attribution flat beside it. The kind is config.type.
      properties:
        id: { type: string }
        name: { type: string }
        displayName: { type: string }
        description: { type: string }
        queryId: { type: string }
        queryParams: { type: object, additionalProperties: true }
        config: { $ref: "#/components/schemas/PanelConfig" }
        usageCount: { type: integer, description: Present on the listing only. }
        usages:
          type: array
          description: Present on the listing only; dashboards the caller may see.
          items:
            type: object
            properties:
              networkId: { type: string }
              id: { type: string }
              name: { type: string }
        createdById: { type: string }
        createdBy: { type: string }
        createdAt: { type: string }
        updatedById: { type: string }
        updatedBy: { type: string }
        updatedAt: { type: string }

    NqePanels:
      type: object
      properties:
        panels:
          type: array
          items: { $ref: "#/components/schemas/NqePanel" }

    NqePanelIds:
      type: object
      required: [panelIds]
      properties:
        panelIds: { type: array, items: { type: string } }

    NqePanelMetrics:
      type: object
      properties:
        results:
          type: array
          items:
            type: object
            properties:
              panelId: { type: string }
              value: { type: number, description: Null when undefined. }

    NqeMetricPreview:
      type: object
      required: [columnName, aggregation]
      properties:
        columnName: { type: string }
        aggregation: { type: string, enum: [COUNT, COUNT_DISTINCT, SUM, MIN, MAX, AVERAGE, MEDIAN, COUNT_TRUE, COUNT_FALSE, COUNT_NULL] }

    NqeMetricPreviewResult:
      type: object
      properties:
        value: { type: number, description: Absent when undefined. }

    DashboardWidget:
      type: object
      description: >-
        Selected by type. A ROW has a title and children, which must not be
        rows. A PANEL has a panelId such as NQE_PANEL_7, DEFINED_3 or
        CUSTOM_SCORECARD_2; an NQE panel may also carry an override and a
        server-assigned id that identifies the embedding across saves.
      required: [type, x, y, w, h]
      properties:
        type: { type: string, enum: [ROW, PANEL] }
        x: { type: integer }
        y: { type: integer }
        w: { type: integer }
        h: { type: integer }
        title: { type: string }
        children:
          type: array
          items: { type: object, additionalProperties: true }
        panelId: { type: string }
        id: { type: integer, description: Server-assigned per embedding; echo it to keep the embedding, omit it to create a new one. }
        override:
          type: object
          description: displayName, queryParams, or a config override; at least one.
          additionalProperties: true
        createdById: { type: string }
        createdBy: { type: string }
        createdAt: { type: string }
        updatedById: { type: string }
        updatedBy: { type: string }
        updatedAt: { type: string }

    Dashboard:
      type: object
      description: type DEFAULT for the fixed dashboards Forward ships, COMPOSED for yours.
      properties:
        id: { type: string }
        name: { type: string }
        type: { type: string, enum: [DEFAULT, COMPOSED] }
        description: { type: string }
        layout:
          type: array
          items: { $ref: "#/components/schemas/DashboardWidget" }
        createdById: { type: string }
        createdBy: { type: string }
        createdAt: { type: string }
        updatedById: { type: string }
        updatedBy: { type: string }
        updatedAt: { type: string }

    DashboardDefinition:
      type: object
      required: [name]
      properties:
        name: { type: string }
        description: { type: string }

    DashboardPatch:
      type: object
      description: Omitted means unchanged. A present layout replaces the whole layout.
      properties:
        name: { type: string }
        description: { type: string }
        layout:
          type: array
          items: { $ref: "#/components/schemas/DashboardWidget" }

    DashboardDisplaySettings:
      type: object
      description: Every field optional; a never-customised dashboard reads as an empty object.
      properties:
        autoScrollEnabled: { type: boolean }
        autoScrollMode: { type: string, enum: [PAGE_BY_PAGE, CONTINUOUS] }
        autoScrollSpeed: { type: string, enum: [SLOW, MEDIUM, FAST] }
        autoScrollIntervalSec: { type: integer }
        attribution: { type: object, additionalProperties: true }

    DynamicConnectionsComputeError:
      type: object
      required: [errorMsg, status]
      properties:
        errorMsg: { type: string }
        status:
          type: string
          enum: [NO_LATEST_SNAPSHOT, QUERY_MISSING, QUERY_RUN_ERROR, MISSING_REQUIRED_COLUMNS, COLUMN_DATATYPE_MISMATCH, INVALID_IDENTIFIER]

    L3DynamicConnectionsComputeResult:
      type: object
      description: connections is absent when empty; error is present only on failure.
      properties:
        connections:
          type: array
          items: { $ref: "#/components/schemas/L3SyntheticWanConnection" }
        error: { $ref: "#/components/schemas/DynamicConnectionsComputeError" }

    L2VpnDynamicConnectionsComputeResult:
      type: object
      description: connections is absent when empty; error is present only on failure.
      properties:
        connections:
          type: array
          items: { $ref: "#/components/schemas/L2VpnConnection" }
        error: { $ref: "#/components/schemas/DynamicConnectionsComputeError" }

    InternetConnectionSuggestion:
      type: object
      required: [uplinkInterface]
      properties:
        uplinkInterface: { type: string, description: "device:interface" }
        uplinkInterfaceDescription: { type: string }
        vlan: { type: integer }
        gatewayInterface: { type: string, description: "device:interface" }
        gatewayInterfaceDescription: { type: string }

    InternetConnectionSuggestions:
      type: object
      description: An empty object when there are none.
      properties:
        suggestions:
          type: array
          items: { $ref: "#/components/schemas/InternetConnectionSuggestion" }

    AdjacentNetwork:
      type: object
      description: >-
        A network Forward does not collect, reached over L3 WAN connections.
        queryId, when set, names a committed library query whose rows define
        the connections dynamically; queryResult holds the last computation.
      required: [name, connections]
      properties:
        name: { type: string }
        connections:
          type: array
          items: { $ref: "#/components/schemas/L3SyntheticWanConnection" }
        ownedSubnets:
          type: array
          items: { type: string }
        queryId: { type: string }
        queryResult: { $ref: "#/components/schemas/L3DynamicConnectionsComputeResult" }

    AdjacentNetworkList:
      type: object
      required: [adjacentNetworks]
      properties:
        adjacentNetworks:
          type: array
          items: { $ref: "#/components/schemas/AdjacentNetwork" }

    AdjacentNetworkPatch:
      type: object
      description: Omitted means unchanged; an explicit null queryId clears it.
      properties:
        name: { type: string }
        connections:
          type: array
          items: { $ref: "#/components/schemas/L3SyntheticWanConnection" }
        ownedSubnets:
          type: array
          items: { type: string }
        queryId: { type: string }

    TapiNetworkContainer:
      type: object
      required: [name, model]
      properties:
        name: { type: string }
        model:
          type: object
          description: The merged T-API model as Forward parsed it.
          additionalProperties: true

    TapiNetworkContainerList:
      type: object
      required: [containers]
      properties:
        containers:
          type: array
          items: { $ref: "#/components/schemas/TapiNetworkContainer" }

    NqeExecutionStatusWithResultKey:
      type: object
      description: NqeExecutionStatus plus the result key. Fields beyond these follow the published status.
      properties:
        status: { type: string }
        outcome: { type: string }
        resultKey: { type: string, description: "R_ followed by twenty hex characters; present once the outcome is OK or USER_ERROR." }
        millisExecuting: { type: integer }
        timeoutMinutes: { type: integer }
        rowsProduced: { type: integer }

    SecurityZones:
      type: object
      description: Device name to the sorted list of zone names it belongs to.
      additionalProperties:
        type: array
        items: { type: string }

    CoveredTopologyNode:
      type: object
      required: [id]
      properties:
        id: { type: string, description: A device name. }

    CoveredTopologyHostGroup:
      type: object
      required: [deviceName, type]
      properties:
        deviceName: { type: string }
        name: { type: string, description: Absent for an inferred host. }
        cloudHostId: { type: string }
        type: { type: string, enum: [UNKNOWN, INFERRED_HOST, EDGE_NODE, CLOUD_HOST] }

    CoveredTopology:
      type: object
      description: A minimal topology sketch scoped to one zone's devices.
      properties:
        nodes:
          type: array
          items: { $ref: "#/components/schemas/CoveredTopologyNode" }
        links:
          type: array
          items: { $ref: "#/components/schemas/TopologyLink" }
        hosts:
          type: array
          items: { $ref: "#/components/schemas/CoveredTopologyHostGroup" }

    SecurityZoneDetails:
      type: object
      properties:
        vrfs:
          type: array
          items: { type: string }
        interfaces:
          type: array
          items: { type: string }
        subnets:
          type: array
          items: { type: string }
        coveredTopo: { $ref: "#/components/schemas/CoveredTopology" }

    DeviceZoneResourcePool:
      type: object
      description: A device's security zone, as a resource pool.
      required: [type, device, zone]
      properties:
        type: { const: DEVICE_ZONE }
        device: { type: string }
        zone: { type: string }
        name: { type: string, description: Computed by Forward as "device zone"; ignored on write. }

    OnPremResourcePool:
      type: object
      required: [type, name, devices, vrfs, subnets]
      properties:
        type: { const: ON_PREM }
        name: { type: string }
        devices:
          type: array
          items: { type: string }
        vrfs:
          type: array
          items: { type: string }
        subnets:
          type: array
          items: { type: string }
          description: "Non-empty; \"0.0.0.0/0\" is refused."

    CloudResourcePool:
      type: object
      required: [type, name, subnets, securityGroups]
      properties:
        type: { const: CLOUD }
        name: { type: string }
        subnets:
          type: array
          items: { type: string }
        securityGroups:
          type: array
          items: { type: string }

    ResourcePool:
      description: A named group of endpoints, for the security matrix and blast radius.
      discriminator:
        propertyName: type
        mapping:
          DEVICE_ZONE: "#/components/schemas/DeviceZoneResourcePool"
          ON_PREM: "#/components/schemas/OnPremResourcePool"
          CLOUD: "#/components/schemas/CloudResourcePool"
      oneOf:
        - { $ref: "#/components/schemas/DeviceZoneResourcePool" }
        - { $ref: "#/components/schemas/OnPremResourcePool" }
        - { $ref: "#/components/schemas/CloudResourcePool" }
      properties:
        type: { type: string, enum: [DEVICE_ZONE, ON_PREM, CLOUD] }
      required: [type]
      type: object

    NewSecurityMatrixFilter:
      type: object
      required: [name, resourcePools]
      properties:
        name: { type: string }
        resourcePools:
          type: array
          items: { $ref: "#/components/schemas/ResourcePool" }
          description: Non-empty.
        protocolExclusions:
          type: array
          items: { type: integer }
          description: IANA protocol numbers to exclude.
        timeoutMins: { type: integer, description: "1 to 60; default 5." }

    SecurityMatrixFilterUpdate:
      type: object
      description: Every field optional; at least one is required. Omitted means unchanged.
      properties:
        name: { type: string }
        resourcePools:
          type: array
          items: { $ref: "#/components/schemas/ResourcePool" }
        protocolExclusions:
          type: array
          items: { type: integer }
        timeoutMins: { type: integer }

    SecurityMatrixFilter:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        resourcePools:
          type: array
          items: { $ref: "#/components/schemas/ResourcePool" }
        createdAt: { type: integer, format: int64, description: Epoch milliseconds. }
        createdByUserId: { type: string }
        lastEditedAt: { type: integer, format: int64, description: Epoch milliseconds. }
        lastEditedByUserId: { type: string }
        timeoutMins: { type: integer }

    SecurityMatrixFilterWithUsers:
      description: A SecurityMatrixFilter plus the usernames behind its user ids, as the listing sends it.
      allOf:
        - { $ref: "#/components/schemas/SecurityMatrixFilter" }
        - type: object
          properties:
            createdBy: { type: string }
            lastEditedBy: { type: string }

    SecurityMatrixFiltersList:
      type: object
      properties:
        filters:
          type: array
          items: { $ref: "#/components/schemas/SecurityMatrixFilterWithUsers" }

    SecurityMatrixConnectivity:
      type: object
      description: >-
        sampleQuery is present unless connectivityLevel is PARTIAL or MISSING,
        where no single sample represents the cell.
      required: [connectivityLevel]
      properties:
        sampleQuery: { $ref: "#/components/schemas/SampleQuery" }
        connectivityLevel:
          type: string
          enum: [NO_ROUTE, ACL_BLOCKED, PARTIAL, OPEN, MISSING, TIMED_OUT]

    SecurityMatrixResult:
      type: object
      description: matrix[i][j] is the connectivity from srcResourcePools[i] to dstResourcePools[j].
      properties:
        srcResourcePools:
          type: array
          items: { $ref: "#/components/schemas/ResourcePool" }
        dstResourcePools:
          type: array
          items: { $ref: "#/components/schemas/ResourcePool" }
        matrix:
          type: array
          items:
            type: array
            items: { $ref: "#/components/schemas/SecurityMatrixConnectivity" }

    SampleQuery:
      type: object
      required: [from, to]
      properties:
        from: { $ref: "#/components/schemas/EndpointFilter" }
        to: { $ref: "#/components/schemas/EndpointFilter" }

    AnalyzedResourcePool:
      type: object
      description: resourcePools is absent when empty, meaning no valid combination was found.
      properties:
        resourcePools:
          type: array
          items: { $ref: "#/components/schemas/ResourcePool" }
        timedOut: { type: boolean }

    ConnectivityDetailsRequest:
      type: object
      required: [srcResourcePool, dstResourcePool]
      properties:
        srcResourcePool: { $ref: "#/components/schemas/ResourcePool" }
        dstResourcePool: { $ref: "#/components/schemas/ResourcePool" }
        protocolExclusions:
          type: array
          items: { type: integer }

    ConnectivityDetailsValue:
      type: object
      description: >-
        headers describes one packet-header region that has this connectivity;
        several values together cover every case. sampleQuery is a concrete
        example packet from that region, when one applies.
      required: [headers]
      properties:
        headers:
          type: object
          additionalProperties: { type: string }
        sampleQuery: { $ref: "#/components/schemas/SampleQuery" }

    ConnectivityDetails:
      type: object
      properties:
        details:
          type: array
          items: { $ref: "#/components/schemas/ConnectivityDetailsValue" }
        timedOut: { type: boolean }
        invalidSource:
          type: boolean
          description: True when the source no longer resolves to anything in the snapshot.

    BlastRadiusRequest:
      type: object
      required: [source, dstSubnets]
      properties:
        source: { $ref: "#/components/schemas/LocationFilter" }
        dstSubnets:
          type: array
          items: { type: string }
          description: Non-empty; IPv4 only.
        protocolExclusions:
          type: array
          items: { type: integer }
        timeoutSecs: { type: integer, description: "1 to 3600." }
        pagingOptions: { $ref: "#/components/schemas/BlastRadiusPagingOptions" }

    BlastRadiusPagingOptions:
      type: object
      properties:
        offset: { type: integer, description: "Non-negative; default 0." }
        limit: { type: integer, description: "1 to 10000; default 1000." }
        sortBy: { $ref: "#/components/schemas/SortOrder" }
        columnFilters:
          type: array
          items: { $ref: "#/components/schemas/ColumnFilter" }

    HostConnectivityInfo:
      type: object
      properties:
        hostIps:
          type: array
          items: { type: string }
        hostName: { type: string }
        zones:
          type: array
          items: { type: string }
        headers:
          type: object
          additionalProperties: { type: string }
        sampleQuery: { $ref: "#/components/schemas/SampleQuery" }
        vulnerableServices:
          type: array
          items: { type: string }
        moderateVulnerabilitiesCount: { type: integer }
        severeVulnerabilitiesCount: { type: integer }
        criticalVulnerabilitiesCount: { type: integer }

    HostConnectivityDetails:
      type: object
      properties:
        details:
          type: array
          items: { $ref: "#/components/schemas/HostConnectivityInfo" }
        numComputed: { type: integer }
        allComputed: { type: boolean }
        invalidSource: { type: boolean }

    InternetExposure:
      type: object
      description: error is present only when trafficReceivingInterfaces could not be computed.
      properties:
        trafficReceivingInterfaces:
          type: array
          items: { type: string, description: "device:interface" }
        error:
          type: string
          enum: [INTERNET_NODE_NOT_DEFINED, REACHABILITY_COMPUTATION_DISABLED, PENDING_ADVANCED_REACHABILITY]

    Rapid7Info:
      type: object
      required: [sourceId, assetId, riskScore, serviceNames, severityToVulnerabilityCount, lastScannedInstant]
      properties:
        sourceId: { type: integer }
        assetId: { type: string }
        riskScore: { type: number }
        serviceNames:
          type: array
          items: { type: string }
        severityToVulnerabilityCount:
          type: object
          additionalProperties: { type: integer }
        lastScannedInstant: { type: integer, format: int64, description: Epoch milliseconds. }

    TenableInfo:
      type: object
      required: [sourceId, assetId, riskScore, severityToVulnerabilityCount, lastScannedInstant]
      properties:
        sourceId: { type: integer }
        assetId: { type: string }
        riskScore: { type: number }
        severityToVulnerabilityCount:
          type: object
          additionalProperties: { type: integer }
        lastScannedInstant: { type: integer, format: int64, description: Epoch milliseconds. }

    ExposedHost:
      type: object
      required: [ips, zones, id]
      properties:
        id: { type: string, description: "deviceId-hostIndex, opaque." }
        name: { type: string }
        ips:
          type: array
          items: { type: string }
        zones:
          type: array
          items: { type: string }
        rapid7Info: { $ref: "#/components/schemas/Rapid7Info" }
        tenableInfo: { $ref: "#/components/schemas/TenableInfo" }

    HostsExposureResponse:
      type: object
      properties:
        hosts:
          type: array
          items: { $ref: "#/components/schemas/ExposedHost" }
        timedOut: { type: boolean }
        scannerUrls:
          type: array
          items: { type: string }
          description: Empty when no scanner is configured.
        hostCounts:
          type: array
          items: { type: integer }
          description: "Length 3, non-increasing: [vulnerable per scanner, also found by Forward, also exposed here]."
        scanType: { type: string, description: Absent when no scanner is configured. }

    ConnectivityTestResult:
      description: A SourceConnectivityResult plus which source it is for.
      allOf:
        - type: object
          required: [deviceName]
          properties:
            deviceName: { type: string }
        - { $ref: "#/components/schemas/SourceConnectivityResult" }

    NameAndIpAddress:
      type: object
      description: At least one of name or ipAddress is present.
      properties:
        name: { type: string }
        ipAddress: { type: string }

    DeviceNeighbor:
      type: object
      required: [neighborType, discoverySources]
      properties:
        neighborName: { type: string }
        neighborType: { type: string, description: A DeviceConnType name, e.g. CISCO_IOS_SSH. }
        vendor: { $ref: "#/components/schemas/Vendor" }
        neighborAddress: { type: string }
        discoverySources:
          type: array
          items: { type: string }
          description: Devices that reported this neighbor.
        neighborCount: { type: integer, description: "len(discoverySources)." }
        vendorSpecificDeviceNeighbor:
          type: object
          description: Present only for vendors with extra neighbor protocol data; shape varies by vendor.
          additionalProperties: true

    CloudDiscoveryResult:
      type: object
      required: [id]
      properties:
        id: { type: string }
        name: { type: string }
        agency: { type: string }
        mission: { type: string }
        roles:
          type: array
          items: { type: string }
        errorMsg: { type: string, description: Present when this account could not be discovered. }

    ConnectionPhaseResult:
      type: object
      required: [phase]
      properties:
        phase: { const: CONNECTION }
        error: { $ref: "#/components/schemas/ConnectivityTestError" }
        serverFingerprint: { type: string }
        usedConservativeMode: { type: boolean }
        availableProtocols:
          type: array
          items: { $ref: "#/components/schemas/Protocol" }
        hostIps:
          type: array
          items: { type: string }

    AuthenticationPhaseResult:
      type: object
      required: [phase]
      properties:
        phase: { const: AUTHENTICATION }
        error: { $ref: "#/components/schemas/ConnectivityTestError" }
        discoveredCliCredentialId: { type: string }
        discoveredHttpCredentialId: { type: string }
        discoveredSnmpCredentialId: { type: string }
        failedCredentialIds:
          type: array
          items: { type: string }
        discoveredType: { type: string, description: A device connection type or endpoint profile id. }

    TypeDiscoveryPhaseResult:
      type: object
      required: [phase]
      properties:
        phase: { const: TYPE_DISCOVERY }
        error: { $ref: "#/components/schemas/ConnectivityTestError" }
        discoveredType: { type: string, description: A device connection type or endpoint profile id. }

    SetupPhaseResult:
      type: object
      required: [phase]
      properties:
        phase: { const: SETUP }
        error: { $ref: "#/components/schemas/ConnectivityTestError" }
        dependentsFromMaster:
          type: array
          items: { type: string }
        dependentNameAndAliases:
          type: array
          items: { type: string }
        deviceSubCategory: { type: string, enum: [NONE, MASTER, DEPENDENT] }
        discoveredCliCredential2Id: { type: string }
        discoveredCliCredential3Id: { type: string }
        discoveredEntities:
          type: array
          items: { $ref: "#/components/schemas/CloudDiscoveryResult" }

    AuthorizationPhaseResult:
      type: object
      required: [phase]
      properties:
        phase: { const: AUTHORIZATION }
        error: { $ref: "#/components/schemas/ConnectivityTestError" }
        unauthorizedCommands:
          type: array
          items: { type: string }
        unauthorizedProjectIds:
          type: array
          items: { type: string }
        remedyToken: { type: string }

    QueryPhaseResult:
      type: object
      required: [phase]
      properties:
        phase: { const: QUERY }
        error: { $ref: "#/components/schemas/ConnectivityTestError" }
        neighbors:
          type: array
          items: { $ref: "#/components/schemas/DeviceNeighbor" }
        nameAliases:
          type: array
          items: { type: string }
        controllerInfos:
          type: array
          items: { $ref: "#/components/schemas/NameAndIpAddress" }
        managedDevices:
          type: array
          items: { $ref: "#/components/schemas/NameAndIpAddress" }
        peerControllers:
          type: array
          items: { $ref: "#/components/schemas/NameAndIpAddress" }

    DeviceTestPhaseResult:
      description: >-
        One phase of a connectivity test. error is absent when the phase
        passed; the fields beyond phase and error vary by phase, since each
        phase discovers something different.
      discriminator:
        propertyName: phase
        mapping:
          CONNECTION: "#/components/schemas/ConnectionPhaseResult"
          AUTHENTICATION: "#/components/schemas/AuthenticationPhaseResult"
          TYPE_DISCOVERY: "#/components/schemas/TypeDiscoveryPhaseResult"
          SETUP: "#/components/schemas/SetupPhaseResult"
          AUTHORIZATION: "#/components/schemas/AuthorizationPhaseResult"
          QUERY: "#/components/schemas/QueryPhaseResult"
      oneOf:
        - { $ref: "#/components/schemas/ConnectionPhaseResult" }
        - { $ref: "#/components/schemas/AuthenticationPhaseResult" }
        - { $ref: "#/components/schemas/TypeDiscoveryPhaseResult" }
        - { $ref: "#/components/schemas/SetupPhaseResult" }
        - { $ref: "#/components/schemas/AuthorizationPhaseResult" }
        - { $ref: "#/components/schemas/QueryPhaseResult" }
      properties:
        phase:
          type: string
          enum: [CONNECTION, AUTHENTICATION, TYPE_DISCOVERY, SETUP, AUTHORIZATION, QUERY]
      required: [phase]
      type: object

    SnapshotException:
      type: object
      required: [stackTrace, occurrences, exceptionType, devices]
      properties:
        stackTrace: { type: string }
        occurrences: { type: integer, description: How many times this exact trace was raised. }
        exceptionType: { $ref: "#/components/schemas/SnapshotExceptionType" }
        devices:
          type: array
          items: { type: string }
          description: The devices that raised it; empty for a snapshot-wide exception.

    SnapshotExceptions:
      type: object
      required: [exceptions]
      properties:
        exceptions:
          type: array
          items: { $ref: "#/components/schemas/SnapshotException" }

    SnapshotExceptionType:
      type: string
      enum: [PARSING, MODELING, SNAPSHOT_GENERATION, REACHABILITY, SHERLOCK_INDEX]
      description: PARSING and MODELING are per device; the rest are snapshot-wide.

    AccessControlGroup:
      description: A stored access control group. An org-admin group has networkRoles and deviceAccessLabelIds null, not empty; that null is the org-admin signal.
      allOf:
        - { $ref: "#/components/schemas/Attribution" }
        - type: object
          required: [id, name, externalGroupNames]
          properties:
            id: { type: string, description: The group's ID. }
            name: { type: string, description: Unique (ignoring case) within the org. }
            externalGroupNames:
              type: array
              items: { type: string }
              description: LDAP or SSO group names that activate this group.
            networkRoles:
              type: object
              additionalProperties: { type: string, enum: [LIMITED_READ_ONLY, READ_ONLY, OPERATOR, WORKSPACE_OPERATOR, ADMIN] }
              description: Network ID to role. Absent when the group grants org admin; present, possibly empty, otherwise.
            deviceAccessLabelIds:
              type: array
              nullable: true
              items: { type: string }
              description: Labels that narrow the group's device set. Absent for an org-admin group.
    AccessControlGroupRequest:
      type: object
      required: [name]
      description: The body for create and replace. Setting networkRoles to null requests org admin; the source then rejects any deviceAccessLabelIds.
      properties:
        name: { type: string, description: Trimmed; must not be blank and at most 255 characters. }
        externalGroupNames:
          type: array
          items: { type: string }
          description: Omitted or empty means no external group activates the group.
        networkRoles:
          type: object
          nullable: true
          additionalProperties: { type: string, enum: [LIMITED_READ_ONLY, READ_ONLY, OPERATOR, WORKSPACE_OPERATOR, ADMIN] }
          description: Null means org admin. An empty object means a network-scoped group with no roles yet.
        deviceAccessLabelIds:
          type: array
          nullable: true
          items: { type: string }
          description: Labels to activate. Must be omitted or empty when networkRoles is null.
    AccessControlGroupBulkEdit:
      type: object
      required: [groupIds, labelIds]
      description: Attaches or detaches labels across several groups.
      properties:
        groupIds: { type: array, minItems: 1, items: { type: string } }
        labelIds: { type: array, minItems: 1, items: { type: string } }
    AccessControlGroupNames:
      type: object
      description: Access control group ID to name.
      additionalProperties: { type: string }
    DeviceAccessLabel:
      description: A set of devices, by exact name or glob, that an access control group can be narrowed to.
      allOf:
        - { $ref: "#/components/schemas/Attribution" }
        - type: object
          required: [id, name]
          properties:
            id: { type: string }
            name: { type: string, description: Unique (ignoring case) within the org. }
            deviceNames:
              type: array
              items: { type: string }
              description: Lowercased device names. Omitted when empty.
            deviceGlobs:
              type: array
              items: { type: string }
              description: Device-name patterns (wildcards and character classes). Omitted when empty.
    DeviceAccessLabelInfo:
      description: A device access label with the counts the list route adds.
      allOf:
        - { $ref: "#/components/schemas/DeviceAccessLabel" }
        - type: object
          required: [devicesCount, groupsCount]
          properties:
            devicesCount: { type: integer, description: Devices in the org the label matches. }
            groupsCount: { type: integer, description: Groups that activate the label. }
    DeviceAccessLabelRequest:
      type: object
      required: [name]
      description: The body for create. At least one of deviceNames and deviceGlobs must be non-empty.
      properties:
        name: { type: string }
        deviceNames: { type: array, items: { type: string } }
        deviceGlobs: { type: array, items: { type: string } }
    DeviceAccessLabelPatch:
      type: object
      description: "Partial update with presence semantics (source: DeviceAccessLabelPatch.java). An absent field is unchanged. A present field replaces the stored value; a present null clears it. groupIds, when present, replaces the groups that activate the label."
      properties:
        name: { type: string, description: Replaces the name when present. }
        deviceNames:
          type: array
          nullable: true
          items: { type: string }
          description: Replaces the device names when present. Null or empty clears them.
        deviceGlobs:
          type: array
          nullable: true
          items: { type: string }
          description: Replaces the device globs when present. Null or empty clears them.
        groupIds:
          type: array
          nullable: true
          items: { type: string }
          description: Replaces the groups that activate the label when present.
    DeviceAccessLabelNames:
      type: object
      description: Device access label ID to name.
      additionalProperties: { type: string }
    Organization:
      type: object
      required: [id, name]
      description: A Forward org. disabled is omitted unless true; sfdcAccountId and sfdcContactId are omitted when unset.
      properties:
        id: { type: string }
        name: { type: string }
        disabled: { type: boolean, description: Present only when true. }
        sfdcAccountId: { type: string, description: Present only when set. }
        sfdcContactId: { type: string, description: Present only when set. }
    OrganizationWithAdditionalInfo:
      description: An org with run-time fields. softwareCentral is omitted when false.
      allOf:
        - { $ref: "#/components/schemas/Organization" }
        - type: object
          properties:
            softwareCentral: { type: boolean }
            lastActiveAt:
              type: string
              format: date-time
              description: The latest user login or impersonation in the org. Absent when there is no record.
    OrganizationUpdate:
      type: object
      required: [name]
      properties:
        name: { type: string, description: Must not be empty. }
    SamlSettings:
      type: object
      description: The SAML settings as Forward reads and writes them. customName is the registration ID that the IdP posts back to.
      properties:
        customName: { type: string, description: "Unique registration ID for the org. Required on write; absent when not yet configured (source: CustomNameAndSamlAuthSettings)." }
        samlAuthSettings: { $ref: "#/components/schemas/SamlAuthSettings" }
    SamlAuthSettings:
      type: object
      required: [entityId, ssoRedirectUrl, verificationCert]
      description: The IdP's settings. entityId, ssoRedirectUrl and verificationCert are required even when enabled is false (source). The customSpCertKey field is accepted on write; its output shape was not verified live.
      properties:
        enabled: { type: boolean, description: Defaults to true on write. }
        name: { type: string, description: A display label. Omitted when unset. }
        entityId: { type: string, description: The IdP's entity or issuer ID. }
        ssoRedirectUrl: { type: string, description: The IdP's SSO URL. }
        verificationCert: { type: string, description: The IdP's signing certificate, PEM. }
        disableAuthNRequestSigning: { type: boolean, description: "false keeps Forward signing its AuthnRequests." }
        customSpCertKey:
          type: object
          description: Forward's own signing certificate and key. Write-only as far as the source shows (input keys pubCert and privKey).
          properties:
            pubCert: { type: string }
            privKey: { type: string, description: Write-only. Omit to keep the stored key. }
    AuditLogRecord:
      type: object
      description: One audited request. impersonatorId and impersonatorUsername are shown only to Forward's own users.
      required: [remoteIp, impersonated, httpMethod, targetUri, httpResponseCode, timestamp]
      properties:
        remoteIp: { type: string }
        userId: { type: string, description: Absent for unauthenticated requests. }
        impersonatorId: { type: string, description: Present only for a support user, and only when impersonating. }
        impersonatorUsername: { type: string, description: Present only with impersonatorId. }
        impersonated: { type: boolean }
        httpMethod: { type: string, enum: [POST, PUT, PATCH, DELETE, GET] }
        targetUri: { type: string, description: The path after /api, with the query string. }
        httpResponseCode: { type: integer }
        timestamp: { type: string, format: date-time }
    AuditLogPaging:
      type: object
      required: [offset, limit, total]
      properties:
        offset: { type: integer }
        limit: { type: integer }
        total: { type: integer, format: int64, description: Every record that matches the filters, not just this page. }
    AuditLogPage:
      type: object
      required: [records, paging]
      properties:
        records: { type: array, items: { $ref: "#/components/schemas/AuditLogRecord" } }
        paging: { $ref: "#/components/schemas/AuditLogPaging" }
    TrustedCertificate:
      description: A stored org trusted certificate.
      allOf:
        - { $ref: "#/components/schemas/Attribution" }
        - type: object
          required: [name, certificate]
          properties:
            name: { type: string, description: Unique (ignoring case) within the org. }
            certificate: { type: string, description: The X.509 certificate, PEM. }
            expiresAt: { type: string, format: date-time, description: The certificate's not-after time. }
    TrustedCertificateRequest:
      type: object
      required: [name, certificate]
      properties:
        name: { type: string }
        certificate: { type: string, description: A valid, unexpired X.509 certificate, PEM. }
    CollectorTaskId:
      type: string
      description: A collector task ID. E followed by a number for an ephemeral task, P for a persistent one.
      pattern: "^[EP][0-9]+$"
    UserAccountRoles:
      type: object
      required: [org, network]
      description: "A user's roles. system and supportedOrgIds are omitted when empty. Forward sends each network's role as one string, never a list (source: UserRoles.java; live)."
      properties:
        system:
          type: array
          items: { type: string, enum: [ADMIN, ARTIFACT_UPLOADER, SUPPORT_ADMIN, FREE_TRIAL_PROVISIONER] }
          description: Forward-internal roles. Omitted for an ordinary user.
        org:
          type: array
          items: { type: string, enum: [READ_ONLY, ADMIN] }
          description: Org-level roles. READ_ONLY is not assignable; only ADMIN is granted.
        network:
          type: object
          additionalProperties: { type: string, enum: [LIMITED_READ_ONLY, READ_ONLY, OPERATOR, WORKSPACE_OPERATOR, ADMIN] }
          description: Network ID to the one role held on it.
        supportedOrgIds:
          type: array
          items: { type: string }
          description: The orgs a support user can enter, whose grants have not expired. Omitted when empty. Always empty for a Forward admin, who needs no grants.
    UserAccountApiToken:
      type: object
      required: [name, createdAt]
      description: An API token. The secret is never returned after creation. accessKey is the Basic-auth user name.
      properties:
        name: { type: string }
        accessKey: { type: string, nullable: true, description: The formatted access key. Null for a legacy token. }
        createdAt: { type: string, format: date-time }
        lastUsedAt: { type: string, format: date-time, nullable: true, description: Null if never used. }
        expiresAt: { type: string, format: date-time, nullable: true, description: Null when no expiry policy applies. }
    UserAccountApiTokenView:
      description: An API token with its status.
      allOf:
        - { $ref: "#/components/schemas/UserAccountApiToken" }
        - type: object
          properties:
            status: { type: string, enum: [ACTIVE, EXPIRED] }
    UserAccountApiTokenList:
      type: object
      required: [tokens]
      properties:
        tokens: { type: array, items: { $ref: "#/components/schemas/UserAccountApiTokenView" } }
    UserAccountApiTokenAndSecret:
      type: object
      required: [token, secret]
      properties:
        token: { $ref: "#/components/schemas/UserAccountApiToken" }
        secret: { type: string, description: The token's secret. Returned once. }
    UserAccountBulkEdit:
      type: object
      required: [userIds, enabled]
      properties:
        userIds: { type: array, minItems: 1, items: { type: string } }
        enabled: { type: boolean }
    AdminNetwork:
      description: A network across orgs, as the admin route reports it.
      allOf:
        - { $ref: "#/components/schemas/Network" }
        - type: object
          properties:
            orgName: { type: string }
            creator: { type: string, nullable: true, description: The creator's username, or null if the account was deleted. }
            secondsToExpiry: { type: integer, format: int64, description: Present only for a network that expires. }
    AdminUserWithOrgId:
      description: A user with the ID of the org it belongs to.
      allOf:
        - { $ref: "#/components/schemas/User" }
        - type: object
          required: [orgId]
          properties:
            orgId: { type: string }

    SrcAttribution:
      type: object
      properties:
        createdById:
          type: string
        createdAt:
          type: string
          format: date-time
        createdBy:
          type: string
        updatedById:
          type: string
        updatedAt:
          type: string
          format: date-time
        updatedBy:
          type: string
      description: Who created and last changed the record. Flattened into the parent object on the wire (Java @JsonUnwrapped Attribution). Email values are user identities.
    SrcControllerInfo:
      type: object
      properties:
        name:
          type: string
        ipAddress:
          type: string
      description: A device name and address a controller or guest reported during a test.
    SrcSetupTestResult:
      type: object
      properties:
        savedAt:
          type: string
          format: date-time
        startTime:
          type: string
          format: date-time
        endTime:
          type: string
          format: date-time
        error:
          type: string
        errorPhase:
          type: string
        discoveredType:
          type: string
        controllerInfos:
          type: array
          items:
            $ref: '#/components/schemas/SrcControllerInfo'
        managedDevices:
          type: array
          items:
            $ref: '#/components/schemas/SrcControllerInfo'
        nameAliases:
          type: array
          items:
            type: string
        dependentNameAndAliases:
          type: array
          items:
            type: string
        hostIps:
          type: array
          items:
            type: string
        unauthorizedCommands:
          type: array
          items:
            type: string
        discoveredCliCredentialId:
          type: string
        discoveredHttpCredentialId:
          type: string
        discoveredSnmpCredentialId:
          type: string
      description: 'Last connectivity test result for a controller or guest (returned only with with=testResult). Live-verified keys: savedAt, startTime, endTime, controllerInfos, managedDevices, nameAliases, hostIps. error, errorPhase, discoveredType and the unauthorizedCommands and discovered*CredentialId keys are source-only (the live sample had no failing test). An empty result is not a pass unless endTime is set.'
    SrcSetupDevice:
      type: object
      properties:
        name:
          type: string
          description: Device name. Controller and guest names share one namespace with classic devices.
        type:
          type: string
          description: Connection type of the device itself (for a guest, its own type, not the controller's).
        host:
          type: string
        cliCredentialId:
          type: string
        httpCredentialId:
          type: string
        snmpCredentialId:
          type: string
        jumpServerId:
          type: string
        collect:
          type: boolean
          description: Absent or null means collect (Java isCollectionEnabled treats null as enabled).
        tags:
          type: array
          items:
            type: object
          description: Active device tags; present only with with=tags. Element shape not modeled.
        locationId:
          type: string
          description: Atlas location; present only with with=locationId.
        testResult:
          $ref: '#/components/schemas/SrcSetupTestResult'
        attribution:
          $ref: '#/components/schemas/SrcAttribution'
      required:
      - name
      description: 'A controller or guest device in a controller-managed setup. Live sample keys: name, type, host, httpCredentialId, cliCredentialId, collect, attribution fields, testResult. Java DeviceSetup has more optional fields (port, credential2/3, terminalWidth, bgpAdvertisementCollectionOptions, snmpCollectionConfig...) that are not modeled here.'
    SrcControllerManagedSetup:
      type: object
      properties:
        name:
          type: string
        type:
          type: string
          enum:
          - CISCO_ACI
          - SD_WAN
        controllers:
          type: array
          items:
            $ref: '#/components/schemas/SrcSetupDevice'
        managedDevices:
          type: array
          items:
            $ref: '#/components/schemas/SrcSetupDevice'
          description: Guests collected through the controllers. Absent (not an empty list) when the setup has never had guests declared.
        collectorId:
          type: string
          description: Collector pin for the whole setup (for example C4). Absent means the network default collector.
        attribution:
          $ref: '#/components/schemas/SrcAttribution'
      required:
      - name
      - type
      - controllers
      description: A controller-managed setup. type is derived from the controllers' device types (Java ControllerManagedSetupType). Names are stored lowercase.
    SrcNewControllerManagedSetup:
      type: object
      properties:
        name:
          type: string
          description: Lowercased by Forward on the way in.
        controllers:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/SrcSetupDevice'
        managedDevices:
          type: array
          items:
            $ref: '#/components/schemas/SrcSetupDevice'
        collectorId:
          type: string
          description: Pins the setup to one collector. Omitted means the network default.
      required:
      - name
      - controllers
      description: Body for creating a controller-managed setup (Java NewControllerManagedSetup).
    SrcControllerManagedSetupPatch:
      type: object
      properties:
        name:
          type: string
          description: Rename. Present but null is rejected by Java ('name' cannot be null).
        controllers:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/SrcSetupDevice'
          description: Replaces the whole controller list when present. Present but null or empty is rejected.
        managedDevices:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/SrcSetupDevice'
          description: 'PATCH presence semantics: absent leaves the guests unchanged; an explicit null clears the guest list; an array replaces it.'
        collectorId:
          type:
          - string
          - 'null'
          description: 'PATCH presence semantics: absent leaves the collector unchanged; an explicit null unpins the setup so the network default applies.'
      description: Partial update of a controller-managed setup (Java ControllerManagedSetupPatch, JsonProp fields). Absent and explicit null are different; see each field. A no-op patch is not written (Java compares before updating).
    SrcControllerAndManagedDeviceSelection:
      type: object
      properties:
        names:
          type: array
          items:
            type: string
        setupNames:
          type: array
          items:
            type: string
      description: Selects devices for a test or bulk delete. Exactly one of names or setupNames must be non-empty (Java Requests.validate, 400 otherwise).
    SrcCloudManagedSetup:
      type: object
      properties:
        name:
          type: string
        type:
          type: string
          enum:
          - MERAKI
          - VELO_CLOUD
          - MIST
        collect:
          type: boolean
        collectorId:
          type: string
        apiKeyId:
          type: string
          description: HTTP credential id (MIST) or the credential the setup uses.
        region:
          type: string
        concurrency:
          type: integer
        hosts:
          type: array
          items: {}
          description: 'MIST: Java MistSetup.hosts is a set of device names (strings). A Go SDK comment reports object elements after discovery; not verified.'
        testResult:
          type: object
          description: 'Last discovery outcome; shape per type (MIST: savedAt, error, discoveredHosts).'
      required:
      - name
      - type
      description: One cloud-managed setup of any type. GET returns a bare array of every cloud setup in the network; the type query parameter is not read by Forward (see notes).
    SrcNewMistSetup:
      type: object
      properties:
        name:
          type: string
        region:
          type: string
          enum:
          - GLOBAL_01
          - GLOBAL_02
          - GLOBAL_03
          - GLOBAL_04
          - GLOBAL_05
          - EMEA_01
          - EMEA_02
          - EMEA_03
          - EMEA_04
          - APAC_01
          - APAC_02
          - APAC_03
        apiKeyId:
          type: string
          description: Id of the HTTP credential holding the Mist API token. Required.
        collect:
          type: boolean
          description: 'Absent means true (Java: collect = !FALSE.equals(collect)).'
        collectorId:
          type: string
          description: Collector id (numeric, as Java parses it as a Long). Empty means the network default.
        hosts:
          type: array
          items:
            type: string
          description: Optional AP MAC collect filter. Discovery resets it; leave empty to collect every AP.
        concurrency:
          type: integer
          minimum: 1
          description: Optional; Java bounds it by CollectorCollectionSettings.MAX_CONCURRENCY (value not read).
      required:
      - name
      - region
      - apiKeyId
      description: 'Body of POST cloud-managed-setups?type=MIST (Java CreateMistSetup). Required per Java Preconditions: name, region, apiKeyId.'
    SrcMistDiscoveredHost:
      type: object
      properties:
        name:
          type: string
          description: The AP MAC, lowercased.
        model:
          type: string
        displayName:
          type: string
          description: Defaults to name when empty.
      required:
      - name
      - model
      description: 'One access point the collector enumerated (Java DiscoveredMistHost, confirmed from source; not observed live: the account has no Mist setups).'
    SrcMistDiscovery:
      type: object
      properties:
        hosts:
          type: array
          items:
            $ref: '#/components/schemas/SrcMistDiscoveredHost'
      required:
      - hosts
      description: Result of discovering a Mist setup's access points. Response shape from the Go SDK draft; not observed live.
    SrcSubnetScanParams:
      type: object
      properties:
        type:
          type: string
          enum:
          - SUBNET_SCAN
        subnets:
          type: array
          items:
            type: string
        hosts:
          type: array
          items:
            type: string
        subnetsToSkip:
          type: array
          items:
            type: string
        hostnamesToSkip:
          type: array
          items:
            type: string
        jumpServerIds:
          type: array
          items:
            type: string
        tryDirectConnection:
          type: boolean
        protocols:
          type: array
          items:
            type: string
          description: Any of HTTP, HTTPS, SSH, TELNET, SNMP (Go draft); empty means Forward's default set.
        connectionScanPorts:
          type: array
          items:
            type: integer
            minimum: 1
            maximum: 65535
      required:
      - type
      description: Subnet scan parameters. Java requires subnets or hosts per the Go SDK's validate(); not confirmed in the Java source read.
    SrcSeededDiscoveryParams:
      type: object
      properties:
        type:
          type: string
          enum:
          - SEEDED
        seedDevices:
          type: array
          items:
            type: string
          minItems: 1
          description: IP addresses of seed devices (Java seedDevices, InetAddress).
        snmpCredentialId:
          type: string
        jumpServerId:
          type: string
        recursive:
          type: boolean
        allowedSubnets:
          type: array
          items:
            type: string
        subnetsToSkip:
          type: array
          items:
            type: string
        hostsToSkip:
          type: array
          items:
            type: string
      required:
      - type
      - seedDevices
      description: 'Seeded discovery: follow seed devices'' neighbours. Field names from Java SeededDeviceDiscoveryParams.'
    SrcDirectDiscoveryParams:
      type: object
      properties:
        type:
          type: string
          enum:
          - DIRECT
      required:
      - type
      description: CDP and LLDP neighbours of the network's own classic devices. Carries no other fields; Forward builds the list.
    SrcCloudDiscoveryParams:
      type: object
      properties:
        type:
          type: string
          enum:
          - CLOUD
        setupIds:
          type: array
          items:
            type: string
          minItems: 1
      required:
      - type
      - setupIds
      description: Discovery from existing cloud setups. Start only; Forward does not schedule it.
    SrcDiscoveryParams:
      oneOf:
      - $ref: '#/components/schemas/SrcSubnetScanParams'
      - $ref: '#/components/schemas/SrcSeededDiscoveryParams'
      - $ref: '#/components/schemas/SrcDirectDiscoveryParams'
      - $ref: '#/components/schemas/SrcCloudDiscoveryParams'
      discriminator:
        propertyName: type
        mapping:
          SUBNET_SCAN: '#/components/schemas/SrcSubnetScanParams'
          SEEDED: '#/components/schemas/SrcSeededDiscoveryParams'
          DIRECT: '#/components/schemas/SrcDirectDiscoveryParams'
          CLOUD: '#/components/schemas/SrcCloudDiscoveryParams'
      description: Discovery parameters, dispatched on type (Java DeviceDiscoveryParams, JsonTypeInfo NAME on property type).
    SrcScheduledDiscoveryParams:
      oneOf:
      - $ref: '#/components/schemas/SrcSubnetScanParams'
      - $ref: '#/components/schemas/SrcSeededDiscoveryParams'
      - $ref: '#/components/schemas/SrcDirectDiscoveryParams'
      discriminator:
        propertyName: type
        mapping:
          SUBNET_SCAN: '#/components/schemas/SrcSubnetScanParams'
          SEEDED: '#/components/schemas/SrcSeededDiscoveryParams'
          DIRECT: '#/components/schemas/SrcDirectDiscoveryParams'
      description: Scheduled discovery accepts only SUBNET_SCAN, SEEDED and DIRECT (Java ScheduledDiscoveryDefinition SUPPORTED_DISCOVERY_TYPES).
    SrcWeeklySchedule:
      type: object
      properties:
        timeZone:
          type: string
        daysOfTheWeek:
          type: array
          items:
            type: integer
            minimum: 0
            maximum: 6
          description: Sun (0) to Sat (6).
        times:
          type: array
          items:
            type: string
            pattern: ^([01]\d|2[0-3]):[0-5]\d$
      required:
      - daysOfTheWeek
      - times
      description: Weekly form. Java WeeklySchedule takes daysOfTheWeek and times; timeZone optional.
    SrcMonthlySchedule:
      type: object
      properties:
        timeZone:
          type: string
        dayOfTheWeek:
          type: integer
          minimum: 0
          maximum: 6
        weekOfTheMonth:
          type: integer
          minimum: 1
          maximum: 4
        time:
          type: string
          pattern: ^([01]\d|2[0-3]):[0-5]\d$
      required:
      - dayOfTheWeek
      - weekOfTheMonth
      - time
      description: Monthly form. Java MonthlySchedule.
    SrcScheduledDiscoveryDefinition:
      type: object
      properties:
        enabled:
          type: boolean
          description: Java primitive boolean; omitted is read as false. An enabled schedule scans the customer network on its own.
        name:
          type: string
          minLength: 1
          description: Unique ignoring case (Forward returns 400 on a duplicate).
        params:
          $ref: '#/components/schemas/SrcScheduledDiscoveryParams'
        schedule:
          oneOf:
          - $ref: '#/components/schemas/SrcWeeklySchedule'
          - $ref: '#/components/schemas/SrcMonthlySchedule'
          - type: 'null'
          description: Omitted or null means the discovery runs after every collection.
      required:
      - name
      - params
      description: Body of POST scheduled-discoveries (Java ScheduledDiscoveryDefinition).
    SrcScheduledDiscovery:
      type: object
      properties:
        id:
          type: string
        enabled:
          type: boolean
        name:
          type: string
        params:
          $ref: '#/components/schemas/SrcScheduledDiscoveryParams'
        schedule:
          oneOf:
          - $ref: '#/components/schemas/SrcWeeklySchedule'
          - $ref: '#/components/schemas/SrcMonthlySchedule'
          - type: 'null'
      required:
      - id
      - enabled
      - name
      description: A stored scheduled discovery. Forward does not return hostsToSkip or subnetsToSkip.
    SrcDiscoveryJob:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
          enum:
          - SUBNET_SCAN
          - SEEDED
          - DIRECT
          - CLOUD
        collectorId:
          type: string
        scheduledDiscoveryId:
          type: string
        startedBy:
          type: string
        startedAt:
          type: integer
          description: Epoch milliseconds (live).
        endedAt:
          type: integer
          description: Epoch milliseconds; absent while the job runs.
        initialQueueSize:
          type: integer
        error:
          type: string
        counts:
          type: object
          properties:
            queued:
              type: integer
            discovered:
              type: integer
            inaccessible:
              type: integer
          description: 'Live keys: queued, discovered, inaccessible.'
      required:
      - id
      - type
      - counts
      description: 'One discovery run (live keys: collectorId, counts, endedAt, error, id, initialQueueSize, scheduledDiscoveryId, startedAt, startedBy, type). error is NONE unless the whole job failed (Go draft).'
    SrcDiscoveredDevice:
      type: object
      properties:
        name:
          type: string
        type:
          type: string
        host:
          type: string
        vendor:
          type: string
        neighbors:
          type: array
          items:
            type: string
        jobId:
          type: string
        discoveredAt:
          type: integer
          description: Epoch milliseconds (live).
        port:
          type: integer
        cliCredentialId:
          type: string
        httpCredentialId:
          type: string
        snmpCredentialId:
          type: string
        jumpServerId:
          type: string
        isReachable:
          type: boolean
        discoveredIps:
          type: array
          items:
            type: string
        cloudLocationId:
          type: string
        cloudSetupId:
          type: string
        cloudDiscoverySource:
          type: string
      required:
      - name
