          minimum: 0.75
          maximum: 1
          description: >-
            Threshold at or above which memory usage is considered high.
            Defaults to 0.9 (90.0%). Use `null` to clear.

            Omit to leave the property alone.
          examples:
            - 0.92
        highInputUtilization:
          type: number
          format: float
          minimum: 0.75
          maximum: 1
          description: >-
            Threshold at or above which input interface utilization is
            considered high. Defaults to 0.9 (90.0%). Use

            `null` to clear. Omit to leave the property alone.
          examples:
            - 0.8
        highOutputUtilization:
          type: number
          format: float
          minimum: 0.75
          maximum: 1
          description: >-
            Threshold at or above which output interface utilization is
            considered high. Defaults to 0.9 (90.0%). Use

            `null` to clear. Omit to leave the property alone.
          examples:
            - 0.88
        mediumCpuUsage:
          type: number
          format: float
          minimum: 0.5
          maximum: 1
          description: >-
            Threshold at or above which CPU usage is considered medium high. Has
