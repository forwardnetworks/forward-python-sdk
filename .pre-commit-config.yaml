repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.6
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
        exclude: ^spec/
      - id: trailing-whitespace
        exclude: ^spec/
      - id: check-yaml
        exclude: ^spec/
      - id: check-merge-conflict

  - repo: local
    hooks:
      - id: unasync
        name: sync client is up to date
        entry: python scripts/unasync.py
        language: system
        pass_filenames: false
        files: ^(src/forward_sdk/_async/|tests/_async/)
