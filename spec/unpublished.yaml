# Endpoints the SDK supports that are NOT in Forward's published API description.
#
# These are stable and safe to depend on -- the Forward NetBox and Nautobot
# plugins both use them -- but they are absent from the description Forward
# generates from its server, so their shapes are written out here instead. That
# lets the coverage test hold them to the same standard as published operations,
# and means a change to one is caught by this SDK's tests rather than by a spec
# diff, which would not see it.
#
# Everything here is reached through client.nqe.repo or client.snapshots.unstable.
#
# Each response carries a real schema and an example of what Forward actually
# sends, recorded from live traffic by the integrations that use these
# endpoints. Both earn their place:
#
#   * The schemas are merged into the generated description, so models are
#     generated for these responses exactly as they are for published ones.
#     That replaces hand-written key-reading, which is what produced the bug
#     below, with validation against a declared shape.
#   * The examples are run through the SDK's own parsers by
#     tests/spec/test_unpublished_shapes.py, so a parser and a hand-written
#     fixture cannot quietly agree with each other while both disagree with
#     Forward.
#
# That is how a commit id nested under lastCommit came to be read from a flat
# key Forward never sends, losing the pin on every query resolved by path.
openapi: 3.2.0
info:
  title: "Forward: Unpublished endpoints used by this SDK"
  version: unpublished
servers:
  - url: /api
tags:
  - name: NQE Repository
    description: Reading and writing the NQE query library.
  - name: Snapshot Reachability
    description: Advanced reachability computation as a pollable job.
  - name: Data Files
    description: Files collected alongside a snapshot.
  - name: Forward AI
    description: >-
      A snapshot-grounded assistant that answers questions about a network by
      calling Forward's own tools. Requires the AI_ALLOWED organization
      property, so an organization without it answers 403 to every operation
      here.
  - name: Adjacent Networks
    parent: Synthetic Devices
    description: Model networks Forward does not collect, reached over L3 WAN links.
  - name: TAPI Network Containers
    parent: Synthetic Devices
    description: Model optical networks from T-API topology documents.
  - name: Connectivity Tests
    parent: Collection Sources
    description: Probe whether Forward can reach and authenticate to a classic device or network endpoint.
  - name: Security Zones
    parent: Network Analysis
    description: The security zones a snapshot's devices belong to.
  - name: Security Matrix Filters
    parent: Network Analysis
    description: Saved resource-pool selections for the security matrix.
  - name: Security Matrix
    parent: Network Analysis
    description: Pairwise reachability between resource pools.
  - name: Resource Pools
    parent: Network Analysis
    description: Ad hoc resource-pool analysis, without saving a filter.
  - name: Blast Radius
    parent: Network Analysis
    description: What one location can reach, by subnet or by host.
  - name: Internet Exposure
    parent: Network Analysis
    description: What the network exposes to the internet, and to whom.
  - name: Access Control
    parent: Platform Management
    description: Device access labels and access control groups, which narrow what each group's members can see.
  - name: Organizations
    parent: Platform Management
    description: The signed-in org, and the Forward-admin view of every org.
  - name: SAML
    parent: Platform Management
    description: The org's SAML single sign-on settings.
  - name: Audit Logs
    parent: Platform Management
    description: Which signed-in user called which mutating route, from where, and when.
  - name: Trusted Certificates
    parent: Platform Management
    description: Org-wide CA certificates that Forward imports into each collector's truststore.

  - name: Device Discovery
    description: Finding devices by scanning subnets, following neighbours or reading cloud setups, and scheduling those scans.
  - name: Custom Command Groups
    description: Extra CLI commands and SNMP OIDs that collection runs on chosen device types.
  - name: Integrations
    description: Connections to Infoblox, ServiceNow (incidents and CMDB) and end-host scanners such as Rapid7.

  - name: Performance Metrics
    description: Device and interface utilization and health, from the performance data collected for a snapshot.
  - name: Scorecards
    description: Scorecards and the KPI categories they are scored from.
  - name: Cloud Objects
    description: Cloud resources (VPCs, subnets, instances and so on) collected into a snapshot.

  - name: Backups
    description: Cluster backups and restores of the Forward application (on-premises Kubernetes deployments only).
  - name: Banners
    description: Organization banners, the critical-state flags behind the top banner, and the system announcement.
  - name: Jobs
    description: Running and finished top-level backend jobs, and cancelling them.
  - name: Licensing
    description: License keys for the organization, the license tier and status, and the instance fingerprint.
  - name: Collection Settings
    description: Organization-wide and per-collector collection tuning, and per-network performance collection.

