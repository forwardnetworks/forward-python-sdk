          application/json:
            schema: { $ref: "#/components/schemas/AdjacentNetworkList" }
            example: { adjacentNetworks: [ { name: partner-net, connections: [ { name: partner-link, uplinkPort: { device: dc1-edge-01, port: GigabitEthernet0/1 }, subnetAutoDiscovery: NONE, subnets: ["192.0.2.0/24"] } ], ownedSubnets: ["192.0.2.0/24"] } ] }
      responses:
        "204": { description: Replaced. }

  /networks/{networkId}/adjacent-networks?op=backdate:
    post:
      operationId: backdateAdjacentNetworks
      summary: Apply recent adjacent network changes to an existing snapshot
      description: >-
        Applies any adjacent network changes made since the network's most recent
        snapshot to the given snapshot and every newer one. Invalidates those
        snapshots, which then need reprocessing. Requires both the collection
        source and snapshot invalidation permissions.
      x-forward-stability: unpublished
      tags: [Adjacent Networks]
      parameters:
        - { name: networkId, in: path, required: true, schema: { type: string } }
        - { name: snapshotId, in: query, required: true, schema: { type: string }, description: "The earliest snapshot the staged changes should apply to." }
      responses:
        "204": { description: Applied. }

  /networks/{networkId}/adjacent-networks?action=computeNqeBasedConnections:
    post:
      operationId: computeAdjacentNetworkConnections
      summary: Preview the connections an NQE query would produce
      description: >-
        Runs the query on the network's latest processed snapshot and returns
        the connections its rows describe, without saving anything. The same
        computation happens when a device carries a queryId; this previews it.
        A failure is reported in the body's error, not as an HTTP error.
      x-forward-stability: unpublished
      tags: [Adjacent Networks]
      parameters:
        - { name: networkId, in: path, required: true, schema: { type: string } }
        - { name: queryId, in: query, required: true, schema: { type: string }, description: "A committed library query id, Q_ or FQ_ followed by 40 hex characters." }
      responses:
        "200":
          description: The connections, or why they could not be computed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/L3DynamicConnectionsComputeResult" }
              example: { connections: [ { name: dc1-edge, uplinkPort: { device: dc1-edge-01, port: GigabitEthernet0/0 }, vlan: 100, subnetAutoDiscovery: NONE, subnets: ["10.20.0.0/16"] } ] }

  /networks/{networkId}/adjacent-networks/{deviceName}:
    get:
      operationId: getAdjacentNetwork
      summary: One adjacent network
      x-forward-stability: unpublished
      tags: [Adjacent Networks]
      parameters:
        - { name: networkId, in: path, required: true, schema: { type: string } }
        - { name: deviceName, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The adjacent network.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdjacentNetwork" }
              example: { name: partner-net, connections: [ { name: partner-link, uplinkPort: { device: dc1-edge-01, port: GigabitEthernet0/1 }, subnetAutoDiscovery: NONE, subnets: ["192.0.2.0/24"] } ], ownedSubnets: ["192.0.2.0/24"] }
    put:
      operationId: putAdjacentNetwork
      summary: Create or replace an adjacent network
      description: The body's name must equal the one in the path.
      x-forward-stability: unpublished
      tags: [Adjacent Networks]
      parameters:
        - { name: networkId, in: path, required: true, schema: { type: string } }
        - { name: deviceName, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdjacentNetwork" }
            example: { name: partner-net, connections: [ { name: partner-link, uplinkPort: { device: dc1-edge-01, port: GigabitEthernet0/1 }, subnetAutoDiscovery: NONE, subnets: ["192.0.2.0/24"] } ], ownedSubnets: ["192.0.2.0/24"] }
      responses:
        "204": { description: Saved. }
    patch:
      operationId: patchAdjacentNetwork
      summary: Change an adjacent network
      description: >-
        Omitted fields are unchanged. Renaming rewrites the device name inside
        its connections too.
      x-forward-stability: unpublished
      tags: [Adjacent Networks]
      parameters:
        - { name: networkId, in: path, required: true, schema: { type: string } }
        - { name: deviceName, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdjacentNetworkPatch" }
            example: { ownedSubnets: ["192.0.2.0/24", "198.51.100.0/24"] }
      responses:
        "200":
          description: The adjacent network after the change.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdjacentNetwork" }
              example: { name: partner-net, connections: [ { name: partner-link, uplinkPort: { device: dc1-edge-01, port: GigabitEthernet0/1 }, subnetAutoDiscovery: NONE, subnets: ["192.0.2.0/24"] } ], ownedSubnets: ["192.0.2.0/24"] }
    delete:
      operationId: deleteAdjacentNetwork
      summary: Delete an adjacent network
      x-forward-stability: unpublished
      tags: [Adjacent Networks]
      parameters:
        - { name: networkId, in: path, required: true, schema: { type: string } }
        - { name: deviceName, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Deleted. }

  /networks/{networkId}/adjacent-networks/{deviceName}/connections:
    get:
      operationId: getAdjacentNetworkConnections
      summary: An adjacent network's connections, optionally filtered
      description: Each filter is a glob; vlan is a range such as 100-200.
      x-forward-stability: unpublished
      tags: [Adjacent Networks]
      parameters:
        - { name: networkId, in: path, required: true, schema: { type: string } }
        - { name: deviceName, in: path, required: true, schema: { type: string } }
        - { name: uplinkDevice, in: query, schema: { type: string } }
        - { name: uplinkPort, in: query, schema: { type: string } }
        - { name: gatewayDevice, in: query, schema: { type: string } }
        - { name: gatewayPort, in: query, schema: { type: string } }
        - { name: vlan, in: query, schema: { type: string } }
      responses:
        "200":
          description: The matching connections.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/L3SyntheticWanConnections" }
              example: { connections: [ { name: dc1-edge, uplinkPort: { device: dc1-edge-01, port: GigabitEthernet0/0 }, vlan: 100, subnetAutoDiscovery: NONE, subnets: ["10.20.0.0/16"] } ] }
    post:
      operationId: addAdjacentNetworkConnection
      summary: Add one connection to an adjacent network
      x-forward-stability: unpublished
      tags: [Adjacent Networks]
      parameters:
        - { name: networkId, in: path, required: true, schema: { type: string } }
        - { name: deviceName, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/L3SyntheticWanConnection" }
            example: { name: partner-link-2, uplinkPort: { device: dc1-edge-02, port: GigabitEthernet0/1 }, subnetAutoDiscovery: NONE, subnets: ["198.51.100.0/24"] }
      responses:
        "204": { description: Added. }
    delete:
      operationId: deleteAdjacentNetworkConnections
      summary: Remove the connections matching every given filter
      description: With no filter, removes them all. Returns what was removed.
      x-forward-stability: unpublished
      tags: [Adjacent Networks]
      parameters:
        - { name: networkId, in: path, required: true, schema: { type: string } }
        - { name: deviceName, in: path, required: true, schema: { type: string } }
        - { name: uplinkDevice, in: query, schema: { type: string } }
        - { name: uplinkPort, in: query, schema: { type: string } }
        - { name: gatewayDevice, in: query, schema: { type: string } }
        - { name: gatewayPort, in: query, schema: { type: string } }
        - { name: vlan, in: query, schema: { type: string } }
      responses:
        "200":
          description: The removed connections.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/L3SyntheticWanConnections" }
              example: { connections: [ { name: dc1-edge, uplinkPort: { device: dc1-edge-01, port: GigabitEthernet0/0 }, vlan: 100, subnetAutoDiscovery: NONE, subnets: ["10.20.0.0/16"] } ] }

  /networks/{networkId}/tapi-network-containers:
