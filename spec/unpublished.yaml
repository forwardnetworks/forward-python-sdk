      responses:
        "200":
          description: The count, and whether it is final.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DiffCount" }
              example: { count: 3, complete: true }

  /diffs/{beforeSnapshotId}/{afterSnapshotId}/nat?count:
    get:
      operationId: getNatDiffCount
      summary: How many devices have NAT changes
      x-forward-stability: unpublished
      tags: [Snapshot Diffs]
      parameters:
        - { name: beforeSnapshotId, in: path, required: true, schema: { type: string } }
        - { name: afterSnapshotId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The count, and whether it is final.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DiffCount" }
              example: { count: 3, complete: true }

  /diffs/{beforeSnapshotId}/{afterSnapshotId}/arp?count:
    get:
      operationId: getArpDiffCount
      summary: How many devices have ARP changes
      x-forward-stability: unpublished
      tags: [Snapshot Diffs]
      parameters:
